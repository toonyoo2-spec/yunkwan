function openCardBalanceModal(ym, payment){
  const [yy,mm] = ym.split('-').map(Number);
  const name = payment.replace(/\[.*?\]/, '');
  const all = DB.list();
  const thisMonthStart = ym + '-01';
  const nextMonthStart = shiftYm(ym,1) + '-01';
  const monthLowerBound = CARD_BALANCE_ANCHOR > thisMonthStart ? CARD_BALANCE_ANCHOR : thisMonthStart;

  const netChange = txs => txs.reduce((s,t)=>{
    if(t.type==='지출') return s - Number(t.amount||0);
    if(t.type==='수입') return s + Number(t.amount||0);
    return s;
  }, 0);

  const beforeTx = all.filter(t=>t.payment===payment && t.date >= CARD_BALANCE_ANCHOR && t.date < monthLowerBound);
  const beforeBillTotal = creditCardBillEvents(payment, CARD_BALANCE_ANCHOR, monthLowerBound).reduce((s,e)=>s+e.amount, 0);
  const prevBalance = (CARD_STARTING_BALANCE[payment]||0) + netChange(beforeTx) - beforeBillTotal;

  const monthItems = all
    .filter(t=>t.payment===payment && t.date >= monthLowerBound && t.date < nextMonthStart)
    .sort((a,b)=> {
      const scopeOrder = { "공동": 0, "보라": 1, "관": 2 };
      const scopeA = scopeOrder[a.scope] ?? 999;
      const scopeB = scopeOrder[b.scope] ?? 999;
      if(scopeA !== scopeB) return scopeA - scopeB;
      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
      return b.id - a.id;
    });
  const monthBillEvents = creditCardBillEvents(payment, monthLowerBound, nextMonthStart);
  const monthBillTotal = monthBillEvents.reduce((s,e)=>s+e.amount, 0);
  const nowBalance = prevBalance + netChange(monthItems) - monthBillTotal;

  const entries = [
    ...monthItems.map(t=>{
      const signed = t.type==='지출' ? -Number(t.amount||0) : Number(t.amount||0);
      return { date:t.date, node: `
        <li>
          <span class="badge ${TYPE_KEY[t.type]}">${t.date.slice(5)}</span>
          <span class="n">${t.category||''}${t.note?` · ${t.note}`:''}</span>
          <span class="a amt ${TYPE_KEY[t.type]}">${signed>=0?'+':''}${signed.toLocaleString('ko-KR')}원</span>
        </li>
      `};
    }),
    ...monthBillEvents.map(e => ({ date:e.date, node: `
      <li>
        <span class="badge fixed-badge">${e.date.slice(5)}</span>
        <span class="n">${e.label}</span>
        <span class="a amt expense">-${e.amount.toLocaleString('ko-KR')}원</span>
      </li>
    `})),
  ].sort((a,b)=> a.date < b.date ? 1 : -1);

  const listHtml = entries.length ? `<ul class="modal-tx-list">${entries.map(en=>en.node).join('')}</ul>` : `<div style="color:var(--muted);font-size:13px;">이번 달 반영된 거래가 없어요.</div>`;

  openModal(`
    <h3 class="display">${name} 통장 잔고</h3>
    <div class="modal-sub">${mm}월 시작 잔고 ${won(prevBalance)}</div>
    ${listHtml}
    <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;">
      <span style="font-weight:700;">현재 잔고</span>
      <span class="mono" style="font-weight:700;font-size:16px;color:${nowBalance>=0?'var(--income)':'var(--expense)'};">${won(nowBalance)}</span>
    </div>
  `);
}

/* ---- 거래 내역 테이블 (행 클릭 → 인라인 수정) ---- */
function renderTxTable(ym){
  // 아직 그 날짜가 지나지 않은 정기 자동이체는 "예정"으로 미리 함께 보여줌(현대카드 결제 예정과 같은 개념) —
  // 지출 집계·거래 개수에는 포함되지 않고, 눌러서 이번 달 예정 금액만 조정할 수 있음.
  let tx = monthTx(DB.list(), ym).concat(computePendingRecurringForMonth(ym));
  // 먼저 날짜순으로 정렬 (최신순)
  tx.sort((a,b)=> a.date<b.date?1:-1);
  if(state.scopeFilter==='미지정') tx = tx.filter(t=>!t.scope);
  else if(state.scopeFilter!=='전체') tx = tx.filter(t=>t.scope===state.scopeFilter);
  if(state.monthTxFilter!=='전체') tx = tx.filter(t=>t.type===state.monthTxFilter);
  if(state.mainFilter!=='전체') tx = tx.filter(t=>t.main===state.mainFilter);
  if(state.catFilter!=='전체') tx = tx.filter(t=>t.category===state.catFilter);
  if(state.noteFilter && state.noteFilter.trim()){
    const q = state.noteFilter.trim().toLowerCase();
    tx = tx.filter(t=> (t.note||'').toLowerCase().includes(q));
  }

  const body = document.getElementById('txBody');
  if(!tx.length){
    body.innerHTML = `<tr class="empty-row"><td colspan="8">해당 조건의 거래 내역이 없습니다.</td></tr>`;
    return;
  }

  // 날짜별로 묶어서 그 날 지출 합계를 헤더 줄에 보여줌(하루 단위로 한눈에 훑어볼 수 있게).
  const groups = [];
  let cur = null;
  tx.forEach(t=>{
    if(!cur || cur.date !== t.date){ cur = { date: t.date, items: [] }; groups.push(cur); }
    cur.items.push(t);
  });

  // 각 날짜 그룹 내에서 구분(공동 → 보라 → 관) 순서로 정렬
  groups.forEach(g => {
    g.items.sort((a,b)=> {
      const scopeOrder = { "공동": 0, "보라": 1, "관": 2 };
      const scopeA = scopeOrder[a.scope] ?? 999;
      const scopeB = scopeOrder[b.scope] ?? 999;
      if(scopeA !== scopeB) return scopeA - scopeB;
      // 같은 구분 내에서는 ID 최신순
      return b.id - a.id;
    });
  });
  const todayD = todayStr();
  body.innerHTML = groups.map(g=>{
    const dayExpense = g.items.filter(t=>t.type==='지출' && !t.pending).reduce((s,t)=>s+Number(t.amount),0);
    const [, mmStr, ddStr] = g.date.split('-');
    const mm = Number(mmStr), dd = Number(ddStr);
    const dow = DOW[new Date(g.date+'T00:00:00').getDay()];
    const dateLabel = g.date===todayD ? `${dd}일 오늘` : `${mm}/${dd} ${dow}요일`;
    const headerRow = `<tr class="tx-date-header"><td colspan="8"><span>${dateLabel}</span><span class="tx-date-total">${dayExpense ? '-'+won(dayExpense) : ''}</span></td></tr>`;
    const rowsHtml = g.items.map(t => {
      if(t.pending) return pendingRowHtml(t, ym);
      return t.id===state.editingTxId ? (displayRowHtml(t) + editRowHtml(t)) : displayRowHtml(t);
    }).join('');
    return headerRow + rowsHtml;
  }).join('');
}

function pendingRowHtml(t, ym){
  const amountStr = Number(t.amount).toLocaleString('ko-KR');
  const scopeDotColor = t.scope ? (SCOPE_COLOR[t.scope] || 'var(--muted)') : 'var(--muted)';
  const titleText = escapeHtml(t.note) || escapeHtml(t.category) || '내용 없음';
  const clickAttr = `onclick="openPendingAmountEdit('${escapeJsAttr(t.recurringKey)}','${ym}',${Number(t.amount)})"`;

  const desktopRow = `<tr class="tx-row tx-row-desktop tx-row-pending" ${clickAttr} title="아직 활성화되지 않았어요 · 눌러서 이번 달 예정 금액을 수정할 수 있어요">
    <td data-label="구분">${t.scope ? escapeHtml(t.scope) : '-'}<span class="pending-badge">예정</span></td>
    <td class="mono" data-label="날짜" title="${t.date}">${t.date.slice(5)}</td>
    <td data-label="대분류"><span class="badge expense" style="opacity:.55;">지출</span></td>
    <td data-label="중분류" title="${escapeHtml(t.main)}">${escapeHtml(t.main)}</td>
    <td data-label="소분류" title="${escapeHtml(t.category)}">${escapeHtml(t.category)}</td>
    <td data-label="내용" title="${escapeHtml(t.note)}">${escapeHtml(t.note)}</td>
    <td class="amt expense" data-label="금액">${amountStr}</td>
    <td data-label="결제수단" style="font-size:11.5px;">${escapeHtml(t.payment||'')}</td>
  </tr>`;

  const mobileRow = `<tr class="tx-row tx-row-mobile tx-row-pending" ${clickAttr}>
    <td colspan="8">
      <div class="tx-card-line1">
        <span class="tx-card-icon" style="box-shadow:0 0 0 2px ${scopeDotColor} inset;">${categoryIcon(t)}</span>
        <span class="tx-card-body">
          <span class="tx-card-title">${titleText}<span class="pending-badge">예정</span></span>
          <span class="tx-card-sub">${escapeHtml(t.main)} · ${escapeHtml(t.category)} · ${escapeHtml(t.payment||'')}</span>
        </span>
        <span class="tx-card-amt amt expense">${amountStr}원</span>
      </div>
    </td>
  </tr>`;

  return desktopRow + mobileRow;
}

function displayRowHtml(t){
  const fixedTag = t.recurringKey ? `<span class="fixed-tag">(고정)</span>` : '';
  const scopeDotColor = t.scope ? (SCOPE_COLOR[t.scope] || 'var(--muted)') : 'var(--expense)';
  const scopeBadge = t.scope
    ? `<span class="tx-scope-badge">
         <span class="tx-scope-icon" style="box-shadow:0 0 0 2px ${scopeDotColor} inset;" title="${escapeHtml(t.scope)}">${categoryIcon(t)}</span>
         <span class="filter-link" onclick="event.stopPropagation();setScopeFilter('${escapeJsAttr(t.scope)}')">${escapeHtml(t.scope)}</span>${fixedTag}
       </span>`
    : `<span class="tx-scope-badge">
         <span class="tx-scope-icon" style="box-shadow:0 0 0 2px var(--expense) inset;">${categoryIcon(t)}</span>
         <span class="filter-link" style="color:var(--expense);" onclick="event.stopPropagation();setScopeFilter('미지정')">미지정</span>${fixedTag}
       </span>`;
  const mainLabel = t.main
    ? `<span class="filter-link" onclick="event.stopPropagation();quickFilterMain('${escapeJsAttr(t.type)}','${escapeJsAttr(t.main)}')">${escapeHtml(t.main)}</span>`
    : `<span style="color:var(--expense);">미지정</span>`;
  const catLabel = t.category
    ? `<span class="filter-link" onclick="event.stopPropagation();quickFilterCat('${escapeJsAttr(t.type)}','${escapeJsAttr(t.main)}','${escapeJsAttr(t.category)}')">${escapeHtml(t.category)}</span>`
    : `<span style="color:var(--expense);">미지정</span>`;
  const paySelect = `
      <select class="pay-quick-select" onchange="quickSetPayment('${t.id}', this.value)">
        <option value="" ${!t.user?'selected':''}>미지정</option>
        ${PAYMENT_METHODS.map(p=>`<option value="${escapeHtml(p)}" ${p===t.user?'selected':''}>${p}</option>`).join('')}
      </select>`;

  // 지금 수정 중인 행이면 살짝 강조해서 아래에 붙는 수정 폼과 연결되어 보이게 함.
  const isEditingRow = t.id === state.editingTxId;

  // PC 화면용: 열이 넉넉해서 구분/날짜/대분류/중분류/소분류/내용/금액/결제수단을 각 칸에 그대로 보여줌.
  const desktopRow = `<tr class="tx-row tx-row-desktop${isEditingRow?' tx-row-editing':''}" onclick="startEditTx('${t.id}')">
    <td data-label="구분">${scopeBadge}</td>
    <td class="mono" data-label="날짜" style="color:var(--muted)" title="${t.date}">${t.date.slice(5)}</td>
    <td data-label="대분류"><span class="badge ${TYPE_KEY[t.type]}">${t.type}</span></td>
    <td data-label="중분류" style="color:var(--muted)" title="${escapeHtml(t.main)}">${mainLabel}</td>
    <td data-label="소분류" style="font-weight:600" title="${escapeHtml(t.category)}">${catLabel}</td>
    <td data-label="내용" title="${escapeHtml(t.note)}">${escapeHtml(t.note)}</td>
    <td class="amt ${TYPE_KEY[t.type]}" data-label="금액">${Number(t.amount).toLocaleString('ko-KR')}</td>
    <td data-label="결제수단" onclick="event.stopPropagation()">${paySelect}</td>
  </tr>`;

  // 모바일용: 뱅크샐러드 스타일 리스트 행 — 카테고리 아이콘(구분 색 링) + 내용(굵게) +
  // 중분류·소분류·결제수단(작게, 회색) + 우측 금액. 날짜는 renderTxTable의 날짜별
  // 헤더 줄에서 한 번만 보여주므로 행 자체에는 넣지 않음.
  const titleText = escapeHtml(t.note) || escapeHtml(t.category) || '내용 없음';
  const mobileRow = `<tr class="tx-row tx-row-mobile${isEditingRow?' tx-row-editing':''}" onclick="startEditTx('${t.id}')">
    <td colspan="8">
      <div class="tx-card-line1">
        <span class="tx-card-icon" style="box-shadow:0 0 0 2px ${scopeDotColor} inset;" title="${escapeHtml(t.scope||'미지정')}">${categoryIcon(t)}</span>
        <span class="tx-card-body">
          <span class="tx-card-title" title="${escapeHtml(t.note)}">${titleText}${fixedTag}</span>
          <span class="tx-card-sub">${mainLabel} · ${catLabel} · <span onclick="event.stopPropagation()">${paySelect}</span></span>
        </span>
        <span class="tx-card-amt amt ${TYPE_KEY[t.type]}">${t.type==='지출'?'-':'+'}${Number(t.amount).toLocaleString('ko-KR')}원</span>
      </div>
    </td>
  </tr>`;

  return desktopRow + mobileRow;
}

function quickSetPayment(id, value){
  DB.update(id, { user: value, payment: value });
  renderTxTable(state.currentYm);
}

function editRowHtml(t){
  const scope = t.scope || (t.type === '수입' ? '보라' : SCOPES[0]);
  return `<tr class="edit-row">
    <td colspan="8">
      <div class="tx-edit-form">
        <select id="e_scope_${t.id}" class="tx-edit-scope" onchange="onEditScopeChange('${t.id}')">
          <option value="" ${!t.scope?'selected':''}>미지정</option>
          ${SCOPES.map(s=>`<option ${s===t.scope?'selected':''}>${s}</option>`).join('')}
        </select>
        <input type="date" id="e_date_${t.id}" class="tx-edit-date" value="${t.date}">
        <select id="e_type_${t.id}" class="tx-edit-type" onchange="onEditTypeChange('${t.id}')">${typesForScope(scope).map(ty=>`<option ${ty===t.type?'selected':''}>${ty}</option>`).join('')}</select>
        <select id="e_main_${t.id}" class="tx-edit-main" onchange="onEditMainChange('${t.id}')">${mainOptions(scope, t.type, t.main)}</select>
        <select id="e_category_${t.id}" class="tx-edit-cat">${catOptions(scope, t.type, t.main, t.category)}</select>
        <input type="text" id="e_note_${t.id}" class="tx-edit-note" value="${escapeHtml(t.note)}" placeholder="내용">
        <input type="text" inputmode="numeric" id="e_amount_${t.id}" class="tx-edit-amount" value="${Number(t.amount).toLocaleString('ko-KR')}" oninput="formatAmountInput(this)">
        <select id="e_pay_${t.id}" class="tx-edit-pay">
          <option value="" ${!t.user?'selected':''}>결제수단</option>
          ${PAYMENT_METHODS.map(p=>`<option value="${escapeHtml(p)}" ${p===t.user?'selected':''}>${p}</option>`).join('')}
        </select>
        <div class="edit-actions tx-edit-actions">
          <button class="ghost-btn primary" onclick="saveEditTx('${t.id}')">저장</button>
          <button class="ghost-btn danger" onclick="deleteEditTx('${t.id}')">삭제</button>
          <button class="ghost-btn" onclick="cancelEditTx()">취소</button>
        </div>
      </div>
    </td>
  </tr>`;
}

function startEditTx(id){
  state.editingTxId = id;
  renderTxTable(state.currentYm);
}
function cancelEditTx(){
  state.editingTxId = null;
  renderTxTable(state.currentYm);
}
function onEditScopeChange(id){
  const scope = document.getElementById('e_scope_'+id).value;
  const types = typesForScope(scope || SCOPES[0]);
  document.getElementById('e_type_'+id).innerHTML = types.map(ty=>`<option>${ty}</option>`).join('');
  onEditTypeChange(id);
}
function onEditTypeChange(id){
  const scope = document.getElementById('e_scope_'+id).value || SCOPES[0];
  const type = document.getElementById('e_type_'+id).value;
  document.getElementById('e_main_'+id).innerHTML = mainOptions(scope, type, null);
  onEditMainChange(id);
}
function onEditMainChange(id){
  const scope = document.getElementById('e_scope_'+id).value || SCOPES[0];
  const type = document.getElementById('e_type_'+id).value;
  const main = document.getElementById('e_main_'+id).value;
  document.getElementById('e_category_'+id).innerHTML = catOptions(scope, type, main, null);
}
function saveEditTx(id){
  const date = document.getElementById('e_date_'+id).value;
  const amount = parseAmountInput(document.getElementById('e_amount_'+id).value);
  if(!date || !amount){ alert('날짜와 금액을 입력해주세요.'); return; }
  const payment = document.getElementById('e_pay_'+id)?.value || '';
  DB.update(id, {
    date, scope: document.getElementById('e_scope_'+id).value || '',
    type: document.getElementById('e_type_'+id).value,
    main: document.getElementById('e_main_'+id).value,
    category: document.getElementById('e_category_'+id).value,
    note: document.getElementById('e_note_'+id).value,
    user: payment, payment,
    amount
  });
  state.editingTxId = null;
  const targetYm = ymOf(date);
  if(targetYm !== state.currentYm) location.hash = '#/' + targetYm;
  else renderMonth(targetYm);
}
function deleteEditTx(id){
  const t = DB.list().find(x=>x.id===id);
  const isRecurring = t && t.recurringKey;
  const msg = isRecurring
    ? '이 거래는 정기 자동이체로 생성된 항목이에요. 이번 달만 삭제할까요? (다음 달부터는 다시 생성돼요)'
    : '이 거래를 삭제할까요?';
  if(!confirm(msg)) return;
  if(isRecurring) DB.addRecurringSkip(t.recurringKey, ymOf(t.date));
  DB.remove(id);
  state.editingTxId = null;
  renderMonth(state.currentYm);
}

function onFormScopeChange(){
  const scope = document.getElementById('f_scope').value;
  document.getElementById('f_type').innerHTML = typesForScope(scope).map(t=>`<option>${t}</option>`).join('');
  onFormTypeChange();
}
function onFormTypeChange(){
  const scope = document.getElementById('f_scope').value;
  const type = document.getElementById('f_type').value;
  document.getElementById('f_main').innerHTML = mainOptions(scope, type, null);
  onFormMainChange();
}
function onFormMainChange(){
  const scope = document.getElementById('f_scope').value;
  const type = document.getElementById('f_type').value;
  const main = document.getElementById('f_main').value;
  document.getElementById('f_category').innerHTML = catOptions(scope, type, main, null);
}
/* 금액 입력칸에 입력할 때마다 자동으로 천단위 콤마를 찍어줌(1000 → 1,000).
   number 입력은 콤마를 표시할 수 없어서 text + inputmode=numeric으로 바꾸고,
   저장 시점에는 parseAmountInput으로 콤마를 다시 떼어내고 숫자로 읽음. */
function formatAmountInput(el){
  const digits = el.value.replace(/[^0-9]/g, '');
  el.value = digits ? Number(digits).toLocaleString('ko-KR') : '';
}
function parseAmountInput(value){
  return Number((value || '').replace(/[^0-9]/g, '')) || 0;
}
function submitTx(ym){
  const date = document.getElementById('f_date').value;
  const amount = parseAmountInput(document.getElementById('f_amount').value);
  if(!date || !amount){ alert('날짜와 금액을 입력해주세요.'); return; }
  const payment = document.getElementById('f_payment').value;
  DB.add({
    date, scope: document.getElementById('f_scope').value,
    type: document.getElementById('f_type').value,
    main: document.getElementById('f_main').value,
    category: document.getElementById('f_category').value,
    note: document.getElementById('f_note').value,
    user: payment, payment,
    amount
  });
  document.getElementById('f_note').value='';
  document.getElementById('f_amount').value='';
  document.getElementById('f_payment').value='';
  renderMonth(ymOf(date));
  if(ymOf(date) !== ym) location.hash = '#/' + ymOf(date);
}

/* =================================================================================
   7-1. MacroDroid URL 파라미터 자동 채우기
   ---------------------------------------------------------------------------------
   MacroDroid가 URL 파라미터로 거래 정보를 전달하면 자동으로 폼에 채워줍니다.
   예: ledger.html?date=2026-07-31&amount=5000&scope=공동&main=생활비&category=식비&note=스타벅스
   ================================================================================= */
function fillFormFromUrlParams(){
  const params = new URLSearchParams(window.location.search);

  // URL 파라미터가 하나도 없으면 아무것도 하지 않음
  if(!params.toString()) return;

  // 날짜
  if(params.has('date')){
    const dateField = document.getElementById('f_date');
    if(dateField) dateField.value = params.get('date');
  }

  // 금액
  if(params.has('amount')){
    const amountField = document.getElementById('f_amount');
    if(amountField) amountField.value = params.get('amount');
  }

  // 구분 (공동/보라/관)
  if(params.has('scope')){
    const scopeField = document.getElementById('f_scope');
    if(scopeField){
      const scopeValue = params.get('scope');
      scopeField.value = scopeValue;
      onFormScopeChange(); // 구분이 바뀌면 타입/대분류/소분류도 업데이트

      // 구분이 "관"이고 결제수단이 명시되지 않았으면 "관[농협]"을 기본값으로 설정
      if(scopeValue === '관' && !params.has('payment') && !params.has('method') && !params.has('pay')){
        const paymentField = document.getElementById('f_payment');
        if(paymentField) paymentField.value = '관[농협]';
      }
    }
  }

  // 대분류 (수입/지출)
  if(params.has('type')){
    const typeField = document.getElementById('f_type');
    if(typeField){
      typeField.value = params.get('type');
      onFormTypeChange(); // 타입이 바뀌면 대분류/소분류도 업데이트
    }
  }

  // 중분류
  if(params.has('main')){
    const mainField = document.getElementById('f_main');
    if(mainField){
      mainField.value = params.get('main');
      onFormMainChange(); // 중분류가 바뀌면 소분류도 업데이트
    }
  }

  // 소분류
  if(params.has('category')){
    const categoryField = document.getElementById('f_category');
    if(categoryField) categoryField.value = params.get('category');
  }

  // 내용 (MacroDroid에서 빈 값으로 보내고 있어서 이 부분이 문제)
  if(params.has('note')){
    const noteField = document.getElementById('f_note');
    if(noteField){
      const noteValue = params.get('note');
      // 빈 문자열이 아닐 때만 채움
      if(noteValue && noteValue.trim()) {
        noteField.value = noteValue;
      }
    }
  }

  // 결제수단 (payment, method, pay 등 여러 파라미터명 지원)
  const paymentValue = params.get('payment') || params.get('method') || params.get('pay');
  if(paymentValue){
    const paymentField = document.getElementById('f_payment');
    if(paymentField) paymentField.value = paymentValue;
  }

  // URL 파라미터 처리 후 제거 (새로고침해도 같은 값이 다시 채워지지 않도록)
  if(window.history && window.history.replaceState){
    const cleanUrl = window.location.pathname + window.location.hash;
    window.history.replaceState({}, document.title, cleanUrl);
  }
}
