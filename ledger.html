<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리집 가계부</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="stylesheet" href="common.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
/* =========================================================
   토큰 (Design tokens)
   ---------------------------------------------------------
   --bg/--ink/--sub/--line/--card/--accent 는 common.css에서 옵니다.
   여기서는 가계부 페이지 전용 확장 토큰만 추가하고,
   기존 코드 호환을 위해 --paper/--surface/--muted 는
   common.css 토큰을 그대로 가리키는 별칭으로 둡니다.
   ========================================================= */
:root{
  --font: "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --paper: var(--bg);
  --paper-line: rgba(34,34,31,0.05);
  --surface: var(--card);
  --ink-soft:#4B4F45;
  --muted: var(--sub);
  --line-strong:#D3CFBF;

  --income:#2F6F4E;      /* 수입 - 짙은 숲색 */
  --income-soft:#E4EFE7;
  --expense:#B5495B;     /* 지출 - 와인 로즈 */
  --expense-soft:#F5E6E8;
  --saving:#3C6E9E;      /* 저축 - 스틸 블루 */
  --saving-soft:#E5EDF3;
  --invest:#B9862E;      /* 투자 - 머스타드 골드 */
  --invest-soft:#F5EDDC;

  --radius-s:8px;
  --radius-m:14px;
  --radius-l:20px;

  --shadow-tab: 0 -2px 0 rgba(32,36,31,0.06) inset;
  --shadow-card: 0 1px 2px rgba(32,36,31,0.04), 0 8px 24px -16px rgba(32,36,31,0.18);
}

*{box-sizing:border-box;}
body{
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,.display{
  font-family:var(--font);
  font-weight:700;
  letter-spacing:-0.02em;
  margin:0;
}
.mono{ font-family:var(--font); font-variant-numeric:tabular-nums; }
a{color:inherit;}
button{font-family:inherit;}

/* =========================================================
   레이아웃
   ========================================================= */
#app.wrap{padding-top:0;}

.topbar{
  display:flex;align-items:baseline;justify-content:space-between;
  margin-bottom:22px;flex-wrap:wrap;gap:10px;
}
.topbar .brand{display:flex;align-items:baseline;gap:10px;}
.home-btn{
  display:inline-block;font-size:12.5px;color:var(--sub);text-decoration:none;margin-bottom:8px;
}
.home-btn:hover{color:var(--accent);}
.topbar h1{font-size:26px;}
.topbar .sub{color:var(--muted);font-size:13px;}
.topbar .actions{display:flex;gap:8px;align-items:center;}
.ghost-btn{
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);
  border-radius:100px;padding:7px 14px;font-size:12.5px;cursor:pointer;
  transition:.15s ease;
}
.ghost-btn:hover{border-color:var(--ink);color:var(--ink);}

/* ---- 탭(폴더 인덱스탭) 네비게이션 ---- */
.tabs-wrap{
  border-bottom:2px solid var(--ink);
  margin-bottom:26px;
}
.tabs{
  display:flex;gap:4px;overflow-x:auto;padding-bottom:0;
  scrollbar-width:thin;
}
.tabs::-webkit-scrollbar{height:5px;}
.tabs::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:10px;}
.tab{
  flex:0 0 auto;
  padding:9px 16px;
  font-size:13.5px;
  font-weight:600;
  color:var(--muted);
  background:transparent;
  border:none;
  border-radius:10px 10px 0 0;
  cursor:pointer;
  position:relative;
  top:2px;
  white-space:nowrap;
}
.tab.summary-tab{font-family:var(--font);font-size:14px;}
.tab:hover{color:var(--ink-soft);}
.tab.active{
  color:var(--ink);
  background:var(--surface);
  border:2px solid var(--ink);
  border-bottom:2px solid var(--surface);
}
.tab .dot{
  display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--expense);margin-right:5px;vertical-align:middle;
  opacity:0;
}
.tab.has-data .dot{opacity:1;}

/* =========================================================
   카드 / 공용 컴포넌트
   ========================================================= */
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-m);
  box-shadow:var(--shadow-card);
}
.grid{display:grid;gap:16px;}
.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:18px;}
@media (max-width:800px){.kpis{grid-template-columns:repeat(2,1fr);}}

.kpi{padding:18px 18px 16px;}
.kpi.kpi-total{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
.kpi.kpi-total .label{color:var(--accent);font-weight:700;}
.kpi .label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em;}
.kpi .value{font-family:var(--font);font-size:25px;font-weight:600;margin-top:6px;}
.kpi .delta{font-size:12px;margin-top:6px;font-weight:600;}
.kpi .delta.up{color:var(--expense);}
.kpi .delta.down{color:var(--income);}
.kpi.income .value{color:var(--income);}
.kpi.expense .value{color:var(--expense);}
.kpi.saving .value{color:var(--saving);}

.section{margin-bottom:26px;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.section-head h2{font-size:18px;}
.section-head .hint{font-size:12px;color:var(--muted);}

.two-col{grid-template-columns:1.3fr 1fr;}
@media (max-width:900px){.two-col{grid-template-columns:1fr;}}

/* ---- 뱃지 ---- */
.badge{
  display:inline-block;padding:2px 9px;border-radius:100px;font-size:11px;font-weight:700;
}
.badge.income{background:var(--income-soft);color:var(--income);}
.badge.expense{background:var(--expense-soft);color:var(--expense);}
.badge.saving{background:var(--saving-soft);color:var(--saving);}
.badge.invest{background:var(--invest-soft);color:var(--invest);}
.badge.fixed-badge{background:var(--invest-soft);color:var(--invest);font-size:10px;padding:1px 7px;vertical-align:middle;}
.fixed-tag{font-size:10px;color:var(--invest);font-weight:700;margin-left:3px;}

/* =========================================================
   달력 (지출 히트맵)
   ========================================================= */
.cal-card{padding:18px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px;}
.cal-dow{font-size:11px;color:var(--muted);text-align:center;font-weight:700;padding-bottom:4px;}
.cal-cell{
  aspect-ratio:1/0.82;border-radius:8px;border:1px solid var(--line);
  padding:6px 7px;position:relative;background:var(--paper);
  display:flex;flex-direction:column;justify-content:space-between;
}
.cal-cell.empty{border:none;background:transparent;}
.cal-cell .d{font-size:11px;color:var(--muted);font-weight:600;}
.cal-cell .amt{font-size:10.5px;font-weight:700;color:var(--expense);word-break:keep-all;}
.cal-cell.today{border:1.5px solid var(--ink);}
.cal-legend{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:11px;color:var(--muted);}
.cal-legend .sw{width:12px;height:12px;border-radius:3px;}

/* =========================================================
   카테고리 리스트업 (바 형태)
   ========================================================= */
.cat-list-card{padding:18px;}
.cat-tabs{display:flex;gap:6px;margin-bottom:14px;}
.cat-tab{
  border:1px solid var(--line-strong);background:var(--surface);border-radius:100px;
  padding:5px 12px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;
}
.cat-tab.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.cat-row{margin-bottom:10px;}
.cat-row .top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;}
.cat-row .top .name{font-weight:600;}
.cat-row .top .name .sub{color:var(--muted);font-weight:400;margin-left:4px;}
.cat-row .top .amt{font-family:var(--font);}
.bar-track{height:7px;border-radius:100px;background:var(--line);overflow:hidden;}
.bar-fill{height:100%;border-radius:100px;}

/* =========================================================
   테이블 (거래 내역)
   ========================================================= */
.table-card{padding:0;overflow:hidden;}
.table-toolbar{
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
  padding:16px 18px;border-bottom:1px solid var(--line);
}
.table-toolbar .filters{display:flex;gap:6px;flex-wrap:wrap;}
.chip{
  border:1px solid var(--line-strong);background:var(--surface);border-radius:100px;
  padding:5px 11px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;
}
.chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

.tx-form{
  display:grid;grid-template-columns: 80px 112px 60px 92px 92px 1fr 112px 136px 40px;
  gap:8px;padding:14px 18px;background:var(--paper);border-bottom:1px solid var(--line);
  align-items:center;
}
@media (max-width:900px){.tx-form{grid-template-columns:repeat(2,1fr);}}
.tx-form input, .tx-form select{
  width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:7px 8px;
  font-size:12.5px;font-family:inherit;background:var(--surface);color:var(--ink);
  min-width:0;box-sizing:border-box;
}
.tx-form .add-btn{
  background:var(--accent);color:#fff;border:none;border-radius:8px;
  height:32px;font-weight:700;cursor:pointer;font-size:18px;line-height:1;
}
.tx-form .add-btn:hover{opacity:.85;}

.payment-toggle{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:0 18px 14px;background:var(--paper);border-bottom:1px solid var(--line);
}
.payment-toggle-label{font-size:11px;color:var(--muted);font-weight:700;margin-right:2px;}
.pay-chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}

table.tx-table{width:100%;border-collapse:collapse;font-size:13px;}
table.tx-table th{
  text-align:left;font-size:11px;color:var(--muted);font-weight:700;
  padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;
}
table.tx-table td{padding:9px 10px;border-bottom:1px solid var(--paper-line);vertical-align:middle;}
table.tx-table tbody tr:hover{background:var(--paper);}
table.tx-table td.amt{font-family:var(--font);text-align:right;white-space:nowrap;}
table.tx-table td.amt.expense{color:var(--expense);}
table.tx-table td.amt.income{color:var(--income);}
table.tx-table td.amt.saving{color:var(--saving);}
table.tx-table td.amt.invest{color:var(--invest);}

/* 거래내역 표(tx-table-main) 컬럼 폭 최적화 */
table.tx-table-main{table-layout:fixed;}
table.tx-table-main th:nth-child(1),table.tx-table-main td:nth-child(1){width:92px;}   /* 구분 */
table.tx-table-main th:nth-child(2),table.tx-table-main td:nth-child(2){width:60px;}   /* 날짜 */
table.tx-table-main th:nth-child(3),table.tx-table-main td:nth-child(3){width:50px;}   /* 대분류 */
table.tx-table-main th:nth-child(4),table.tx-table-main td:nth-child(4){width:76px;}   /* 중분류 */
table.tx-table-main th:nth-child(5),table.tx-table-main td:nth-child(5){width:76px;}   /* 소분류 */
table.tx-table-main th:nth-child(6),table.tx-table-main td:nth-child(6){width:112px;}  /* 내용 (축소) */
table.tx-table-main th:nth-child(7),table.tx-table-main td:nth-child(7){width:144px;}  /* 금액 (확대) */
table.tx-table-main th:nth-child(8),table.tx-table-main td:nth-child(8){width:118px;overflow:visible;}  /* 결제수단 (버튼형) */
table.tx-table-main td{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
table.tx-table-main td.mono{font-variant-numeric:tabular-nums;}
.pay-quick-select{
  width:100%;border:1px solid var(--line-strong);border-radius:100px;padding:4px 6px;
  font-size:11px;font-family:inherit;background:var(--surface);color:var(--ink-soft);
  cursor:pointer;
}
.pay-quick-select:hover{border-color:var(--accent);color:var(--ink);}

.row-actions{display:flex;gap:4px;}
.icon-btn{
  border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;
  padding:2px 5px;border-radius:5px;
}
.icon-btn:hover{background:var(--line);color:var(--ink);}
.empty-row td{text-align:center;color:var(--muted);padding:30px;font-size:13px;}
tr.scope-divider td{
  background:var(--paper);font-weight:800;font-size:13px;
  padding:10px;border-top:2px solid var(--ink);border-bottom:1px solid var(--line-strong);
}

/* =========================================================
   리뷰 메모
   ========================================================= */
.review-card{padding:18px;}
.review-card textarea{
  width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;
  padding:12px;font-family:'Inter',sans-serif;font-size:13px;resize:vertical;
  background:var(--paper);color:var(--ink);
}
.review-stats{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap;}
.review-stats .item{font-size:12px;color:var(--ink-soft);}
.review-stats .item b{display:block;font-family:var(--font);font-size:17px;color:var(--ink);}
.save-note{font-size:11px;color:var(--muted);margin-top:8px;}

/* =========================================================
   Summary 전용
   ========================================================= */
.chart-card{padding:18px;}
.chart-card canvas{max-height:280px;}
.year-switch{display:flex;align-items:center;gap:8px;}
.year-switch button{
  border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;
  width:26px;height:26px;cursor:pointer;color:var(--ink-soft);
}
.year-switch .y{font-family:var(--font);font-weight:700;font-size:16px;min-width:44px;text-align:center;}

.month-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.month-nav .move{
  border:1px solid var(--line-strong);background:var(--surface);border-radius:100px;
  padding:6px 14px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink-soft);
}
.month-nav h1{font-size:24px;}

footer.foot{
  margin-top:40px;text-align:center;color:var(--muted);font-size:11.5px;
  border-top:1px solid var(--line);padding-top:16px;
}
.pill-note{
  display:inline-flex;align-items:center;gap:6px;background:var(--invest-soft);color:var(--invest);
  border-radius:100px;padding:4px 12px;font-size:11.5px;font-weight:700;margin-bottom:14px;
}

/* ---- 연도 선택 드롭다운 ---- */
.tabs-row{display:flex;align-items:flex-end;gap:10px;}
.year-select{position:relative;flex:0 0 auto;top:2px;}
.year-btn{
  display:flex;align-items:center;gap:5px;
  border:2px solid var(--ink);border-bottom:none;background:var(--surface);color:var(--ink);
  border-radius:10px 10px 0 0;padding:9px 14px;font-family:var(--font);font-weight:700;font-size:14px;
  cursor:pointer;
}
.year-btn .caret{font-size:10px;color:var(--muted);}
.year-menu{
  display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:30;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;
  box-shadow:var(--shadow-card);padding:6px;min-width:96px;flex-direction:column;gap:1px;
}
.year-menu.open{display:flex;}
.year-item{
  border:none;background:transparent;text-align:left;padding:7px 10px;border-radius:6px;
  font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;font-family:var(--font);
}
.year-item:hover{background:var(--paper);}
.year-item.active{background:var(--ink);color:var(--paper);}

/* ---- 거래 내역: 클릭해서 수정 ---- */
table.tx-table tbody tr.tx-row{cursor:pointer;}
table.tx-table tbody tr.tx-row:hover{background:var(--paper);}
tr.edit-row{background:var(--paper);}
tr.edit-row td{padding:12px 10px;}
.tx-edit-form{
  display:grid;grid-template-columns:88px 118px 68px 104px 104px 1fr 96px auto;gap:8px;align-items:center;
}
@media (max-width:900px){.tx-edit-form{grid-template-columns:repeat(2,1fr);}}
.tx-edit-form input, .tx-edit-form select{
  width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:7px 8px;
  font-size:12.5px;font-family:inherit;background:var(--surface);color:var(--ink);
  min-width:0;box-sizing:border-box;
}
.edit-actions{display:flex;gap:6px;}
.fixed-field{
  display:flex;align-items:center;height:100%;
  border:1px dashed var(--line-strong);border-radius:8px;padding:7px 8px;
  font-size:12px;color:var(--muted);background:var(--paper);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ghost-btn.danger{color:var(--expense);border-color:var(--expense);}
.ghost-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}

/* ---- 예산 ---- */
.budget-input{
  width:100%;margin-top:5px;border:1px solid var(--line-strong);border-radius:8px;padding:6px 8px;
  font-size:12.5px;font-family:var(--font);background:var(--paper);color:var(--ink);
}
.compare-select{
  border:1px solid var(--line-strong);border-radius:8px;padding:5px 8px;font-size:12px;
  background:var(--surface);color:var(--ink-soft);font-family:inherit;
}
.auto-review-list{margin:0 0 14px;padding-left:0;list-style:none;}
.auto-review-list li{
  font-size:12.5px;line-height:1.6;color:var(--ink-soft);padding:7px 0;border-bottom:1px dashed var(--line);
}
.auto-review-list li:last-child{border-bottom:none;}
.auto-review-list b{color:var(--ink);}
.auto-review-list li{cursor:pointer;}
.auto-review-list li:hover{background:var(--paper);border-radius:6px;padding-left:6px;}

/* ---- 클릭으로 필터링 ---- */
.filter-link{cursor:pointer;border-bottom:1px dotted var(--line-strong);}
.filter-link:hover{color:var(--ink);border-bottom-color:var(--ink);}
.chip.sub{font-size:11.5px;padding:4px 10px;}
.note-search{
  border:1px solid var(--line-strong);border-radius:100px;padding:6px 12px;font-size:12px;
  background:var(--surface);color:var(--ink);width:160px;
}

/* ---- 캘린더 셀 클릭 ---- */
.cal-cell{cursor:pointer;transition:.12s ease;}
.cal-cell:hover{border-color:var(--ink);}
.cal-cell.empty{cursor:default;}
.cal-cell.empty:hover{border-color:transparent;}

/* ---- 모달 ---- */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(32,36,31,0.45);z-index:100;
  align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.open{display:flex;}
.modal-card{
  background:var(--surface);border-radius:var(--radius-l);max-width:560px;width:100%;
  max-height:85vh;overflow-y:auto;padding:28px;position:relative;box-shadow:var(--shadow-card);
}
.modal-close{
  position:absolute;top:16px;right:16px;border:none;background:var(--paper);width:28px;height:28px;
  border-radius:50%;cursor:pointer;color:var(--ink-soft);font-size:13px;line-height:1;
}
.modal-close:hover{background:var(--line);}
.modal-card h3{font-size:19px;padding-right:30px;}
.modal-sub{color:var(--muted);font-size:12.5px;margin:4px 0 16px;}
.modal-narrative{
  font-size:13px;line-height:1.75;color:var(--ink-soft);background:var(--paper);
  border-radius:10px;padding:14px 16px;margin-bottom:18px;
}
.modal-section-label{font-size:11.5px;font-weight:700;color:var(--muted);margin:16px 0 8px;}
.modal-tx-list{list-style:none;padding:0;margin:0;}
.modal-tx-list li{
  display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12.5px;
}
.modal-tx-list li:last-child{border-bottom:none;}
.modal-tx-list .n{flex:1;color:var(--ink-soft);}
.modal-tx-list .a{font-family:var(--font);font-weight:600;white-space:nowrap;}

/* =========================================================
   모바일 최적화 (폰 화면에서 거래내역 표를 카드형 리스트로 전환)
   ========================================================= */
@media (max-width:640px){
  #app{padding:20px 14px 60px;}
  .topbar{align-items:flex-start;}
  .kpis{grid-template-columns:repeat(2,1fr);}
  .month-nav h1{font-size:19px;}

  .tx-form{grid-template-columns:1fr;padding:12px;}
  .tx-form .add-btn{width:100%;height:38px;font-size:13px;font-weight:700;}

  .tx-edit-form{grid-template-columns:1fr;}
  .edit-actions{justify-content:flex-end;}

<div class="modal-overlay open" id="authOverlay">

    </div>
    <button class="ghost-btn primary" style="width:100%;justify-content:center;display:flex;" onclick="authLogin()">로그인</button>
    <div id="authMsg" style="font-size:11.5px;color:var(--muted);margin-top:10px;text-align:center;"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script>
/* =================================================================================
   -1. 로그인 게이트 (index.html과 동일한 Supabase Auth 계정 사용)
   ---------------------------------------------------------------------------------
   실제 가계부 데이터(거래내역 등)는 지금도 localStorage에 저장됩니다.
   Supabase는 오직 "로그인해야만 이 페이지를 볼 수 있게" 막는 용도로만 씁니다.
   ================================================================================= */
let sb = null;
try{
  if(typeof supabase === 'undefined'){
    throw new Error('Supabase 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해주세요.');
  }
  if(!window.SUPABASE_URL || !window.SUPABASE_ANON_KEY || !window.COUPLE_EMAIL_DOMAIN){
    throw new Error('supabase-config.js를 찾을 수 없거나 설정이 비어있어요. index.html과 같은 폴더에 있는지 확인해주세요.');
  }
  sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY, {
    auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true }
  });
}catch(err){
  document.getElementById('authOverlay').querySelector('.modal-card').innerHTML =
    `<div class="display" style="font-size:17px;color:var(--expense);margin-bottom:8px;">연결에 문제가 생겼어요</div>
     <div style="font-size:12.5px;color:var(--muted);line-height:1.6;">${err.message}</div>`;
}

function authIdToEmail(id){
  return `${id.trim().toLowerCase()}@${window.COUPLE_EMAIL_DOMAIN}`;
}
async function authLogin(){
  if(!sb) return;
  const id = document.getElementById('authId').value.trim();
  const pw = document.getElementById('authPw').value;
  const msg = document.getElementById('authMsg');
  if(!id || !pw){ alert('아이디와 비밀번호를 입력해주세요.'); return; }
  msg.textContent = '로그인 중...';
  const { error } = await sb.auth.signInWithPassword({ email: authIdToEmail(id), password: pw });
  if(error){ msg.textContent = '로그인 실패: 아이디 또는 비밀번호를 확인해주세요.'; return; }
  msg.textContent = '';
}
function authShow(){ document.getElementById('authOverlay').classList.add('open'); }
function authHide(){ document.getElementById('authOverlay').classList.remove('open'); }

let _appBooted = false;
function bootApp(){
  if(_appBooted) return;
  _appBooted = true;
  seedIfEmpty();
  initRecurringTemplatesIfEmpty();
  migrateFamilyCategory();
  cleanupRecurringBeforeAug();
  cleanupFutureRecurring();
  applyManualAdditions();
  route();
}

async function initAuth(){
  if(!sb) return; // 설정 오류 시 로그인 화면에 에러만 보여주고 앱은 절대 열지 않음
  const { data: { session } } = await sb.auth.getSession();
  if(session){ authHide(); bootApp(); } else { authShow(); }
  sb.auth.onAuthStateChange((event, session)=>{
    if(session){ authHide(); bootApp(); } else { authShow(); }
  });
}

/* =================================================================================
   1. DB 레이어
   ---------------------------------------------------------------------------------
   지금은 localStorage 로만 저장됩니다. 나중에 Supabase 로 옮길 때는
   아래 DB 객체의 메서드 내부만 supabase-js 호출로 교체하면 되도록
   (화면 코드는 DB.* 메서드만 호출) 설계했습니다.

   예상 Supabase 테이블 스키마 (참고용):
     transactions (
       id uuid primary key default gen_random_uuid(),
       date date not null,
       type text not null,          -- 수입/지출/저축/투자
       main text not null,          -- 대분류
       category text not null,      -- 중분류
       note text,                   -- 세부내용
       amount integer not null,
       user_name text,              -- 사용자
       payment text,                -- 결제수단
       created_at timestamptz default now()
     )
     monthly_reviews (
       month text primary key,      -- 'YYYY-MM'
       memo text,
       updated_at timestamptz default now()
     )
   ================================================================================= */
const DB = {
  TX_KEY: "gagyebu_v1_transactions",
  REVIEW_KEY_PREFIX: "gagyebu_v1_review_",

  // TODO[Supabase]: `return (await supabase.from('transactions').select('*')).data`
  list(){
    const raw = localStorage.getItem(this.TX_KEY);
    return raw ? JSON.parse(raw) : [];
  },
  _save(list){
    localStorage.setItem(this.TX_KEY, JSON.stringify(list));
  },
  // TODO[Supabase]: `await supabase.from('transactions').insert(tx)`
  add(tx){
    const list = this.list();
    tx.id = tx.id || (Date.now().toString(36) + Math.random().toString(36).slice(2,7));
    list.push(tx);
    this._save(list);
    return tx;
  },
  // TODO[Supabase]: `await supabase.from('transactions').update(patch).eq('id', id)`
  update(id, patch){
    const list = this.list();
    const idx = list.findIndex(t => t.id === id);
    if(idx > -1){ list[idx] = {...list[idx], ...patch}; this._save(list); }
  },
  // TODO[Supabase]: `await supabase.from('transactions').delete().eq('id', id)`
  remove(id){
    this._save(this.list().filter(t => t.id !== id));
  },
  // TODO[Supabase]: `await supabase.from('monthly_reviews').select('memo').eq('month', ym)`
  getReview(ym){
    return localStorage.getItem(this.REVIEW_KEY_PREFIX + ym) || "";
  },
  // TODO[Supabase]: `await supabase.from('monthly_reviews').upsert({month: ym, memo})`
  saveReview(ym, memo){
    localStorage.setItem(this.REVIEW_KEY_PREFIX + ym, memo);
  },

  BUDGET_KEY_PREFIX: "gagyebu_v1_budget_",
  // TODO[Supabase]: `await supabase.from('budgets').select('category,amount').eq('year', year)` → map으로 변환
  getBudgets(year){
    const raw = localStorage.getItem(this.BUDGET_KEY_PREFIX + year);
    return raw ? JSON.parse(raw) : {};
  },
  // TODO[Supabase]: 카테고리별로 `await supabase.from('budgets').upsert({year, category, amount})`
  saveBudgets(year, map){
    localStorage.setItem(this.BUDGET_KEY_PREFIX + year, JSON.stringify(map));
  },

  RECURRING_KEY: "gagyebu_v1_recurring_templates",
  RECURRING_SKIP_KEY: "gagyebu_v1_recurring_skips",
  // TODO[Supabase]: `await supabase.from('recurring_templates').select('*')`
  getRecurringTemplates(){
    const raw = localStorage.getItem(this.RECURRING_KEY);
    return raw ? JSON.parse(raw) : null; // null = 아직 초기화 안 됨
  },
  // TODO[Supabase]: 통째로 upsert 하거나 diff 계산해서 반영
  saveRecurringTemplates(list){
    localStorage.setItem(this.RECURRING_KEY, JSON.stringify(list));
  },
  // TODO[Supabase]: `await supabase.from('recurring_skips').select('token')`
  getRecurringSkips(){
    const raw = localStorage.getItem(this.RECURRING_SKIP_KEY);
    return raw ? JSON.parse(raw) : [];
  },
  // TODO[Supabase]: `await supabase.from('recurring_skips').insert({token})`
  addRecurringSkip(key, ym){
    const skips = this.getRecurringSkips();
    const token = key + '|' + ym;
    if(!skips.includes(token)){ skips.push(token); localStorage.setItem(this.RECURRING_SKIP_KEY, JSON.stringify(skips)); }
  },

  reset(){
    localStorage.removeItem(this.TX_KEY);
    Object.keys(localStorage).filter(k=>k.startsWith(this.REVIEW_KEY_PREFIX)||k.startsWith(this.BUDGET_KEY_PREFIX)).forEach(k=>localStorage.removeItem(k));
  }
};

const wonShort = n => {
  n = Math.round(n||0);
  if(Math.abs(n) >= 10000) return (n/10000).toFixed(n%10000===0?0:1) + '만';
  return n.toLocaleString('ko-KR');
};
const pct = n => (isFinite(n) ? n.toFixed(1) : '0.0') + '%';
const ymOf = d => d.slice(0,7);
const daysInMonth = (y,m) => new Date(y, m, 0).getDate();
const mondayIndex = jsDay => (jsDay + 6) % 7; // JS: 0=일..6=토 -> 0=월..6=일

function monthTx(list, ym){ return list.filter(t => ymOf(t.date) === ym); }
function sumBy(list, type){ return list.filter(t=>t.type===type).reduce((s,t)=>s+Number(t.amount||0),0); }

function prevYm(ym){
  let [y,m] = ym.split('-').map(Number);
  m -= 1; if(m===0){ m=12; y-=1; }
  return y + '-' + String(m).padStart(2,'0');
}
function shiftYm(ym, n){
  let [y,m] = ym.split('-').map(Number);
  m += n;
  while(m<1){ m+=12; y-=1; }
  while(m>12){ m-=12; y+=1; }
  return y + '-' + String(m).padStart(2,'0');
}
function escapeAttr(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

function yearRange(){
  const dataYears = DB.list().map(t=>Number(t.date.slice(0,4)));
  const now = new Date().getFullYear();
  const candidates = dataYears.length ? dataYears : [now];
  const min = Math.min(now-1, ...candidates);
  const max = Math.max(now+3, ...candidates);
  const arr = [];
  for(let y=min;y<=max;y++) arr.push(y);
  return arr;
}

/* 정기 자동이체 템플릿을 해당 월(ym)에 아직 없으면 자동으로 채워넣습니다.
   연도·월과 무관하게 항상 동작하므로, 어느 달을 처음 열어도 자동으로 반영됩니다.
   주의: 자동으로 생성된 거래를 지우면, 그 달을 다시 열 때 같은 항목이 다시 채워질 수 있어요. */
function initRecurringTemplatesIfEmpty(){
  if(DB.getRecurringTemplates() === null){
    DB.saveRecurringTemplates(DEFAULT_RECURRING_TEMPLATES);
  }
}

/* 보라/관 개인 소유였던 '가족' 중분류를 공동으로 일원화 (기존 저장 데이터 보정용, 매번 실행해도 안전) */
function migrateFamilyCategory(){
  const validSubs = ["가족","명절","생일"];
  DB.list().forEach(t=>{
    if(t.main === '가족' && t.scope !== '공동'){
      DB.update(t.id, {
        scope: '공동',
        category: validSubs.includes(t.category) ? t.category : '가족'
      });
    }
  });
  const templates = DB.getRecurringTemplates();
  if(templates){
    let changed = false;
    templates.forEach(t=>{
      if(t.main === '가족' && (t.scope !== '공동' || !validSubs.includes(t.category))){
        t.scope = '공동';
        t.category = validSubs.includes(t.category) ? t.category : '가족';
        changed = true;
      }
    });
    if(changed) DB.saveRecurringTemplates(templates);
  }
}

/* 2026년 1~7월은 이미 실데이터에 고정 지출이 들어있으므로,

function cleanupRecurringBeforeAug(){
  const dupes = DB.list().filter(t => t.recurringKey && t.date < '2026-08-01');
  dupes.forEach(t => DB.remove(t.id));
}

/* 예전 버전(오늘 날짜 이후는 반영하지 않는 기능이 없던 시절)에 미리 채워졌을 수 있는
   '아직 오지 않은 날짜'의 정기 자동이체 거래를 정리합니다. */
function cleanupFutureRecurring(){
  const today = todayStr();
  const premature = DB.list().filter(t => t.recurringKey && t.date > today);
  premature.forEach(t => DB.remove(t.id));
}

function applyManualAdditions(){

  MANUAL_ADDITIONS.forEach(m=>{

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function ensureRecurringForMonth(ym){
  // 2026년 1~7월은 실제 원본 데이터에 이미 고정 지출이 포함돼 있어 자동 생성 시 중복됩니다.
  // 정기 자동이체 자동 반영은 2026년 8월부터 시작합니다.
  if(ym < '2026-08') return;
  const [y,m] = ym.split('-').map(Number);
  const dim = daysInMonth(y,m);
  const templates = DB.getRecurringTemplates() || [];
  const existingKeys = new Set(
    DB.list().filter(t=>t.recurringKey && t.date.startsWith(ym)).map(t=>t.recurringKey)
  );
  const skips = new Set(DB.getRecurringSkips());
  const today = todayStr();
  templates.forEach(tpl=>{
    if(existingKeys.has(tpl.key)) return;
    if(skips.has(tpl.key + '|' + ym)) return;
    if(tpl.endYm && ym >= tpl.endYm) return; // 종료월이 설정된 경우, 그 달부터는 더 이상 자동 생성하지 않음
    const day = Math.min(tpl.day, dim);
    const date = ym + '-' + String(day).padStart(2,'0');
    if(date > today) return; // 아직 오늘이 지나지 않은 날짜(미래)는 반영하지 않음
    DB.add({
      date, type: '지출', scope: tpl.scope, main: tpl.main, category: tpl.category,
      note: tpl.note, amount: tpl.amount, user: tpl.payment, payment: tpl.payment,
      recurringKey: tpl.key
    });
  });
}

/* ---- 지출 카테고리 매트릭스: 구분(공동/보라/관/미지정)별로 그룹핑 ---- */
function buildCategoryMatrixRows(list, monthYms){
  const groups = [...SCOPES, '미지정'];
  let html = '';
  groups.forEach(scopeKey=>{
    const scTx = list.filter(t => t.type==='지출' && (scopeKey==='미지정' ? !t.scope : t.scope===scopeKey));
    if(!scTx.length) return;
    const seen = new Map();
    scTx.forEach(t => seen.set(t.main+'|'+t.category, {main:t.main, cat:t.category}));
    const rows = Array.from(seen.values()).map(({main,cat})=>{
      const monthsArr = monthYms.map(ym => scTx.filter(t=>t.main===main && t.category===cat && ymOf(t.date)===ym).reduce((s,t)=>s+Number(t.amount||0),0));
      const total = monthsArr.reduce((s,v)=>s+v,0);
      return {main,cat,monthsArr,total};
    }).filter(r=>r.total>0).sort((a,b)=>b.total-a.total);
    if(!rows.length) return;

    html += `<tr class="scope-divider"><td colspan="15">${scopeKey}</td></tr>`;
    rows.forEach(r=>{
      const isFixed = scTx.some(t=>t.main===r.main && t.category===r.cat && t.recurringKey);
      const fixedBadge = isFixed ? `<span class="badge fixed-badge" title="정기 자동이체로 채워지는 항목">고정</span>` : '';
      html += `<tr>
        <td style="color:var(--muted);white-space:nowrap;">${r.main||'미분류'}</td>
        <td style="font-weight:600;white-space:nowrap;">${r.cat||'미분류'} ${fixedBadge}</td>
        ${r.monthsArr.map(v=>`<td class="amt">${v? v.toLocaleString('ko-KR'):'·'}</td>`).join('')}
        <td class="amt expense" style="font-weight:700;">${r.total.toLocaleString('ko-KR')}</td>
      </tr>`;
    });
  });
  return html;
}

  const payment = document.getElementById('rce_payment_'+key)?.value || '';

  const templates = DB.getRecurringTemplates() || [];
  const idx = templates.findIndex(t=>t.key===key);

      ...templates[idx],
      day, scope: document.getElementById('rce_scope_'+key).value,

      amount, payment, endYm

}

let _compareChart = null;
function compareOptions(ym){
  const opts = [];
  for(let i=1;i<=12;i++){
    const cand = shiftYm(ym,-i);
    const [cy,cm] = cand.split('-');
    const label = cy===ym.slice(0,4) ? Number(cm)+'월' : cy+'년 '+Number(cm)+'월';
    opts.push({value:cand, label});
  }
  return opts;
}
function renderCompareChart(ym){
  const sel = document.getElementById('compareSelect');
  sel.innerHTML = compareOptions(ym).map(o=>`<option value="${o.value}" ${o.value===state.compareYm?'selected':''}>${o.label}</option>`).join('');

  const tx = monthTx(DB.list(), ym).filter(t=>t.type==='지출');
  const pTx = monthTx(DB.list(), state.compareYm).filter(t=>t.type==='지출');
  const catSet = new Set();
  tx.forEach(t=>catSet.add(t.category));
  pTx.forEach(t=>catSet.add(t.category));
  const cats = Array.from(catSet).slice(0,10);
  const curByCat = cats.map(c => tx.filter(t=>t.category===c).reduce((s,t)=>s+Number(t.amount),0));
  const prevByCat = cats.map(c => pTx.filter(t=>t.category===c).reduce((s,t)=>s+Number(t.amount),0));

  if(typeof Chart === 'undefined'){
    const canvas = document.getElementById('chartCompare');
    if(canvas) canvas.replaceWith(chartFallbackNode());
    return;
  }
  if(_compareChart) _compareChart.destroy();
  _compareChart = new Chart(document.getElementById('chartCompare'), {
    type:'bar',
    data:{ labels:cats.length?cats:['데이터 없음'], datasets:[
      {label:compareOptions(ym).find(o=>o.value===state.compareYm)?.label || '비교월', data:cats.length?prevByCat:[0], backgroundColor:'#D9D5C6', borderRadius:4, maxBarThickness:16},

    ]},

    }
  });
}

   TODO[AI]: 아래 계산을 서버(Supabase Edge Function 등)에서
   거래내역을 Claude API로 보내 자연어 요약을 받아오는 방식으로 교체 예정.

function reanalyzeScopeReview(ym){
  try{
    const wrap = document.getElementById('scopeReviewWrap');
    if(wrap){
      wrap.style.transition = 'opacity .12s ease';
      wrap.style.opacity = '0.25';
    }
    renderScopeReviews(ym);
    if(wrap){ requestAnimationFrame(()=>{ wrap.style.opacity = '1'; }); }
  }catch(err){
    console.error('지출 리뷰 재분석 중 오류:', err);
    alert('다시 분석하는 중 오류가 발생했어요: ' + err.message);
  }
}
function renderScopeReviews(ym){
  const all = DB.list();
  const wrap = document.getElementById('scopeReviewWrap');
  wrap.innerHTML = SCOPES.map(scope=>{
    const cur = monthTx(all, ym).filter(t=>t.type==='지출' && t.scope===scope);
    const curTotal = cur.reduce((s,t)=>s+Number(t.amount),0);

    const pYm = shiftYm(ym,-1);
    const pTotal = monthTx(all, pYm).filter(t=>t.type==='지출' && t.scope===scope).reduce((s,t)=>s+Number(t.amount),0);

    const histTotals = [];
    for(let i=1;i<=6;i++){
      const hy = shiftYm(ym,-i);
      const hAmt = monthTx(all, hy).filter(t=>t.type==='지출' && t.scope===scope).reduce((s,t)=>s+Number(t.amount),0);
      if(hAmt>0) histTotals.push(hAmt);
    }
    const avg = histTotals.length ? histTotals.reduce((s,v)=>s+v,0)/histTotals.length : 0;

    let narrative;
    if(curTotal===0){
      narrative = `이번 달 ${scope} 지출 기록이 아직 없어요.`;
    } else if(!pTotal && !avg){
      narrative = `이번 달 ${scope} 지출은 ${won(curTotal)}이에요. 아직 비교할 이전 데이터가 없어요.`;
    } else {
      const base = pTotal || avg;
      const diffPct = base ? ((curTotal-base)/base*100) : 0;
      const dir = diffPct>=0 ? '늘었어요' : '줄었어요';
      narrative = `이번 달 ${scope} 지출은 ${won(curTotal)}로, ${pTotal? '전월':'최근 평균'} 대비 ${Math.abs(diffPct).toFixed(0)}% ${dir}.`;
    }

    return `
      <div class="cat-row" style="margin-bottom:16px;">
        <div class="top"><span class="name" style="font-size:14px;">${scope}</span><span class="amt">${won(curTotal)}</span></div>
        <div style="font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin-top:4px;">${narrative}</div>
      </div>
    `;
  }).join('');
}

function nextYm(ym){
  let [y,m] = ym.split('-').map(Number);
  m += 1; if(m===13){ m=1; y+=1; }
  return y + '-' + String(m).padStart(2,'0');
}

function topCategory(tx){
  const map = {};
  tx.filter(t=>t.type==='지출').forEach(t=> map[t.category] = (map[t.category]||0)+Number(t.amount));
  const arr = Object.entries(map).sort((a,b)=>b[1]-a[1]);
  return arr.length ? arr[0][0] : '-';
}

/* ---- 캘린더 ---- */
function renderCalendar(y,m,tx){
  const ym = y + '-' + String(m).padStart(2,'0');
  const byDay = {};
  tx.filter(t=>t.type==='지출').forEach(t=>{
    const d = Number(t.date.split('-')[2]);
    byDay[d] = (byDay[d]||0) + Number(t.amount);
  });
  const max = Math.max(1, ...Object.values(byDay));
  const dim = daysInMonth(y,m);
  const firstDow = mondayIndex(new Date(y, m-1, 1).getDay());

  let html = DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<firstDow;i++) html += `<div class="cal-cell empty"></div>`;
  const today = new Date();
  const isThisMonth = today.getFullYear()===y && (today.getMonth()+1)===m;
  for(let d=1; d<=dim; d++){
    const amt = byDay[d]||0;
    const intensity = amt / max;
    const bg = amt ? `rgba(181,73,91,${0.08 + intensity*0.35})` : 'var(--paper)';
    const isToday = isThisMonth && today.getDate()===d;
    html += `<div class="cal-cell ${isToday?'today':''}" style="background:${bg}" onclick="openDayModal('${ym}',${d})">
      <span class="d">${d}</span>
      <span class="amt">${amt? wonShort(amt):''}</span>
    </div>`;
  }
  document.getElementById('calWrap').innerHTML = `<div class="cal-grid">${html}</div>
    <div class="cal-legend"><span class="sw" style="background:rgba(181,73,91,0.1)"></span>적음 &nbsp;→&nbsp; <span class="sw" style="background:rgba(181,73,91,0.4)"></span>많음</div>`;
}

/* ---- 캘린더: 날짜 클릭 팝업 ---- */
function openDayModal(ym, day){
  const dateStr = ym + '-' + String(day).padStart(2,'0');
  const [yy,mm] = ym.split('-').map(Number);
  const items = DB.list().filter(t=>t.date===dateStr).sort((a,b)=> a.type<b.type?-1:1);
  const total = items.filter(t=>t.type==='지출').reduce((s,t)=>s+Number(t.amount),0);
  const listHtml = items.length ? `<ul class="modal-tx-list">${items.map(t=>`
    <li>
      <span class="badge ${TYPE_KEY[t.type]}">${t.type}</span>
      <span class="n">${t.category} · ${t.note||'(내용 없음)'}${t.user?` · ${t.user}`:''}</span>
      <span class="a amt ${TYPE_KEY[t.type]}">${Number(t.amount).toLocaleString('ko-KR')}원</span>
    </li>
  `).join('')}</ul>` : `<div style="color:var(--muted);font-size:13px;">이 날은 기록된 거래가 없어요.</div>`;

  openModal(`
    <h3 class="display">${mm}월 ${day}일</h3>
    <div class="modal-sub">지출 합계 ${won(total)} · 총 ${items.length}건</div>
    ${listHtml}
  `);
}

/* ---- 카테고리 리스트업 ---- */
function renderCatList(ym){
  const scopeOptions = ['전체', ...SCOPES];
  document.getElementById('catTabs').innerHTML = `<div class="cat-tabs">${scopeOptions.map(s=>`<button class="cat-tab ${state.catScope===s?'active':''}" onclick="setCatScope('${s}')">${s}</button>`).join('')}</div>`;

  let tx = monthTx(DB.list(), ym).filter(t=>t.type==='지출');
  if(state.catScope !== '전체') tx = tx.filter(t=>t.scope===state.catScope);

  if(state.catDrillMain !== null){
    const mainLabel = state.catDrillMain || '미분류';
    const mainTx = tx.filter(t=> (t.main||'') === state.catDrillMain);
    const total = mainTx.reduce((s,t)=>s+Number(t.amount),0);
    const map = {};
    mainTx.forEach(t=>{ const key = t.category || '미분류'; map[key] = (map[key]||0) + Number(t.amount); });
    const rows = Object.entries(map).sort((a,b)=>b[1]-a[1]);

    document.getElementById('catListWrap').innerHTML = `
      <button class="ghost-btn" style="margin-bottom:10px;" onclick="setCatDrill(null)">← ${mainLabel}</button>
      ${rows.length ? rows.map(([cat,amt])=>{
        const w = total ? (amt/total*100) : 0;
        return `<div class="cat-row">
          <div class="top"><span class="name">${cat}</span><span class="amt">${won(amt)}</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:var(--expense)"></div></div>
        </div>`;
      }).join('') : `<div style="color:var(--muted);font-size:13px;padding:20px 0;">세부 내역이 없습니다.</div>`}
    `;
    return;
  }

  const total = tx.reduce((s,t)=>s+Number(t.amount),0);
  const map = {};
  tx.forEach(t=>{ const key = t.main || '미분류'; map[key] = (map[key]||0) + Number(t.amount); });
  const rows = Object.entries(map).sort((a,b)=>b[1]-a[1]);

  document.getElementById('catListWrap').innerHTML = rows.length ? rows.map(([main,amt])=>{
    const w = total ? (amt/total*100) : 0;
    return `<div class="cat-row" style="cursor:pointer;" onclick="setCatDrill('${main==='미분류'?'':main}')">
      <div class="top"><span class="name">${main}</span><span class="amt">${won(amt)}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:var(--expense)"></div></div>
    </div>`;
  }).join('') : `<div style="color:var(--muted);font-size:13px;padding:20px 0;">이번 달 ${state.catScope} 지출 내역이 없습니다.</div>`;
}
function setCatScope(s){
  state.catScope = s; state.catDrillMain = null;
  renderCatList(state.currentYm);
}
function setCatDrill(main){
  state.catDrillMain = main;
  renderCatList(state.currentYm);
}

/* ---- 거래 내역 툴바 (구분 → 대분류 → 카테고리 드릴다운 + 내용 검색) ---- */
function renderTxToolbar(ym){
  const type = state.monthTxFilter;
  let mainRow = '';
  if(type !== '전체'){
    const mains = ['전체', ...mainsForTypeAllScopes(type)];
    mainRow = `<div class="filters">${mains.map(mn=>`<button class="chip sub ${state.mainFilter===mn?'active':''}" onclick="setMainFilter('${mn}')">${mn}</button>`).join('')}</div>`;
  }
  let catRow = '';
  if(type !== '전체' && state.mainFilter !== '전체'){
    const cats = ['전체', ...catsForMainAllScopes(type, state.mainFilter)];
    catRow = `<div class="filters">${cats.map(c=>`<button class="chip sub ${state.catFilter===c?'active':''}" onclick="setCatFilter('${c}')">${c}</button>`).join('')}</div>`;
  }
  const scopeChips = ['전체', ...SCOPES, '미지정'];
  document.getElementById('txToolbar').innerHTML = `
    <div class="filters">
      ${scopeChips.map(s=>`<button class="chip ${state.scopeFilter===s?'active':''}" onclick="setScopeFilter('${s}')">${s}</button>`).join('')}
      <input type="text" class="note-search" id="noteSearch" placeholder="내용 검색" value="${escapeAttr(state.noteFilter)}"
             oninput="state.noteFilter=this.value; renderTxTable('${ym}')" style="margin-left:auto;">
    </div>
    <div class="filters">
      ${['전체',...TYPES].map(t=>`<button class="chip ${state.monthTxFilter===t?'active':''}" onclick="setTypeFilter('${t}')">${t}</button>`).join('')}
    </div>
    ${mainRow}
    ${catRow}
  `;
}
function setScopeFilter(s){
  state.scopeFilter = s;
  renderTxToolbar(state.currentYm); renderTxTable(state.currentYm);
}
function setTypeFilter(t){
  state.monthTxFilter = t; state.mainFilter = '전체'; state.catFilter = '전체';
  renderTxToolbar(state.currentYm); renderTxTable(state.currentYm);
}
function setMainFilter(m){
  state.mainFilter = m; state.catFilter = '전체';
  renderTxToolbar(state.currentYm); renderTxTable(state.currentYm);
}
function setCatFilter(c){
  state.catFilter = c;
  renderTxToolbar(state.currentYm); renderTxTable(state.currentYm);
}
function quickFilterMain(type, main){
  state.monthTxFilter = type; state.mainFilter = main; state.catFilter = '전체';
  renderTxToolbar(state.currentYm); renderTxTable(state.currentYm);
}
function quickFilterCat(type, main, cat){
  state.monthTxFilter = type; state.mainFilter = main; state.catFilter = cat;
  renderTxToolbar(state.currentYm); renderTxTable(state.currentYm);
}
function quickFilterUnassigned(){
  state.scopeFilter = '미지정'; state.monthTxFilter = '전체'; state.mainFilter = '전체'; state.catFilter = '전체';
  renderTxToolbar(state.currentYm); renderTxTable(state.currentYm);
  document.querySelector('.table-card')?.scrollIntoView({behavior:'smooth', block:'center'});
}

/* ---- 거래 내역 테이블 (행 클릭 → 인라인 수정) ---- */
function renderTxTable(ym){
  let tx = monthTx(DB.list(), ym).sort((a,b)=> a.date<b.date?1:-1);
  if(state.scopeFilter==='미지정') tx = tx.filter(t=>!t.scope);
  else if(state.scopeFilter!=='전체') tx = tx.filter(t=>t.scope===state.scopeFilter);
  if(state.monthTxFilter!=='전체') tx = tx.filter(t=>t.type===state.monthTxFilter);
  if(state.mainFilter!=='전체') tx = tx.filter(t=>t.main===state.mainFilter);
  if(state.catFilter!=='전체') tx = tx.filter(t=>t.category===state.catFilter);
  if(state.noteFilter && state.noteFilter.trim()){
    const q = state.noteFilter.trim().toLowerCase();
    tx = tx.filter(t=> (t.note||'').toLowerCase().includes(q));
  }

  document.getElementById('txBody').innerHTML = tx.length
    ? tx.map(t => t.id===state.editingTxId ? editRowHtml(t) : displayRowHtml(t)).join('')
    : `<tr class="empty-row"><td colspan="8">해당 조건의 거래 내역이 없습니다.</td></tr>`;
}

function displayRowHtml(t){
  const fixedTag = t.recurringKey ? `<span class="fixed-tag">(고정)</span>` : '';
  const scopeBadge = t.scope
    ? `<span class="filter-link" onclick="event.stopPropagation();setScopeFilter('${t.scope}')">${t.scope}</span>${fixedTag}`
    : `<span class="filter-link" style="color:var(--expense);" onclick="event.stopPropagation();setScopeFilter('미지정')">미지정</span>${fixedTag}`;
  const mainLabel = t.main
    ? `<span class="filter-link" onclick="event.stopPropagation();quickFilterMain('${t.type}','${t.main}')">${t.main}</span>`
    : `<span style="color:var(--expense);">미지정</span>`;
  const catLabel = t.category
    ? `<span class="filter-link" onclick="event.stopPropagation();quickFilterCat('${t.type}','${t.main}','${t.category}')">${t.category}</span>`
    : `<span style="color:var(--expense);">미지정</span>`;
  return `<tr class="tx-row" onclick="startEditTx('${t.id}')">
    <td data-label="구분">${scopeBadge}</td>
    <td class="mono" data-label="날짜" style="color:var(--muted)" title="${t.date}">${t.date.slice(5)}</td>
    <td data-label="대분류"><span class="badge ${TYPE_KEY[t.type]}">${t.type}</span></td>
    <td data-label="중분류" style="color:var(--muted)" title="${escapeAttr(t.main)}">${mainLabel}</td>
    <td data-label="소분류" style="font-weight:600" title="${escapeAttr(t.category)}">${catLabel}</td>
    <td data-label="내용" title="${escapeAttr(t.note)}">${escapeAttr(t.note)}</td>
    <td class="amt ${TYPE_KEY[t.type]}" data-label="금액">${Number(t.amount).toLocaleString('ko-KR')}</td>
    <td data-label="결제수단" onclick="event.stopPropagation()">
      <select class="pay-quick-select" onchange="quickSetPayment('${t.id}', this.value)">
        <option value="" ${!t.user?'selected':''}>미지정</option>
        ${PAYMENT_METHODS.map(p=>`<option value="${escapeAttr(p)}" ${p===t.user?'selected':''}>${p}</option>`).join('')}
      </select>
    </td>
  </tr>`;
}

function quickSetPayment(id, value){
  DB.update(id, { user: value, payment: value });
  renderTxTable(state.currentYm);
}

function editRowHtml(t){
  const scope = t.scope || (t.type === '수입' ? '보라' : SCOPES[0]);
  return `<tr class="edit-row">
    <td colspan="8">
      <div class="tx-edit-form">
        <select id="e_scope_${t.id}" onchange="onEditScopeChange('${t.id}')">
          <option value="" ${!t.scope?'selected':''}>미지정</option>
          ${SCOPES.map(s=>`<option ${s===t.scope?'selected':''}>${s}</option>`).join('')}
        </select>
        <input type="date" id="e_date_${t.id}" value="${t.date}">
        <select id="e_type_${t.id}" onchange="onEditTypeChange('${t.id}')">${typesForScope(scope).map(ty=>`<option ${ty===t.type?'selected':''}>${ty}</option>`).join('')}</select>
        <select id="e_main_${t.id}" onchange="onEditMainChange('${t.id}')">${mainOptions(scope, t.type, t.main)}</select>
        <select id="e_category_${t.id}">${catOptions(scope, t.type, t.main, t.category)}</select>
        <input type="text" id="e_note_${t.id}" value="${escapeAttr(t.note)}" placeholder="내용">
        <input type="number" id="e_amount_${t.id}" value="${t.amount}">
        <div class="edit-actions">
          <button class="ghost-btn primary" onclick="saveEditTx('${t.id}')">저장</button>
          <button class="ghost-btn danger" onclick="deleteEditTx('${t.id}')">삭제</button>
          <button class="ghost-btn" onclick="cancelEditTx()">취소</button>
        </div>
      </div>
      <div class="payment-toggle" id="paymentToggleEdit_${t.id}" data-selected="${escapeAttr(t.user)}" style="border-bottom:none;padding:10px 0 0;">
        <span class="payment-toggle-label">결제수단</span>
        ${PAYMENT_METHODS.map(p=>`<button type="button" class="chip pay-chip ${p===t.user?'active':''}" data-val="${escapeAttr(p)}" onclick="selectPaymentToggle('paymentToggleEdit_${t.id}','${escapeAttr(p)}')">${p}</button>`).join('')}
      </div>
    </td>
  </tr>`;
}

function selectPaymentToggle(containerId, val){
  const c = document.getElementById(containerId);
  if(!c) return;
  c.dataset.selected = val;
  c.querySelectorAll('.pay-chip').forEach(b=> b.classList.toggle('active', b.dataset.val===val));
}

function startEditTx(id){
  state.editingTxId = id;
  renderTxTable(state.currentYm);
}
function cancelEditTx(){
  state.editingTxId = null;
  renderTxTable(state.currentYm);
}
function onEditScopeChange(id){
  const scope = document.getElementById('e_scope_'+id).value;
  const types = typesForScope(scope || SCOPES[0]);
  document.getElementById('e_type_'+id).innerHTML = types.map(ty=>`<option>${ty}</option>`).join('');
  onEditTypeChange(id);
}
function onEditTypeChange(id){
  const scope = document.getElementById('e_scope_'+id).value || SCOPES[0];
  const type = document.getElementById('e_type_'+id).value;
  document.getElementById('e_main_'+id).innerHTML = mainOptions(scope, type, null);
  onEditMainChange(id);
}
function onEditMainChange(id){
  const scope = document.getElementById('e_scope_'+id).value || SCOPES[0];
  const type = document.getElementById('e_type_'+id).value;
  const main = document.getElementById('e_main_'+id).value;
  document.getElementById('e_category_'+id).innerHTML = catOptions(scope, type, main, null);
}
function saveEditTx(id){
  const date = document.getElementById('e_date_'+id).value;
  const amount = Number(document.getElementById('e_amount_'+id).value);
  if(!date || !amount){ alert('날짜와 금액을 입력해주세요.'); return; }
  const payment = document.getElementById('paymentToggleEdit_'+id)?.dataset.selected || '';
  DB.update(id, {
    date, scope: document.getElementById('e_scope_'+id).value || '',
    type: document.getElementById('e_type_'+id).value,
    main: document.getElementById('e_main_'+id).value,
    category: document.getElementById('e_category_'+id).value,
    note: document.getElementById('e_note_'+id).value,
    user: payment, payment,
    amount
  });
  state.editingTxId = null;
  const targetYm = ymOf(date);
  if(targetYm !== state.currentYm) location.hash = '#/' + targetYm;
  else renderMonth(targetYm);
}
function deleteEditTx(id){
  const t = DB.list().find(x=>x.id===id);
  const isRecurring = t && t.recurringKey;
  const msg = isRecurring
    ? '이 거래는 정기 자동이체로 생성된 항목이에요. 이번 달만 삭제할까요? (다음 달부터는 다시 생성돼요)'
    : '이 거래를 삭제할까요?';
  if(!confirm(msg)) return;
  if(isRecurring) DB.addRecurringSkip(t.recurringKey, ymOf(t.date));
  DB.remove(id);
  state.editingTxId = null;
  renderMonth(state.currentYm);
}

function onFormScopeChange(){
  const scope = document.getElementById('f_scope').value;
  document.getElementById('f_type').innerHTML = typesForScope(scope).map(t=>`<option>${t}</option>`).join('');
  onFormTypeChange();
}
function onFormTypeChange(){
  const scope = document.getElementById('f_scope').value;
  const type = document.getElementById('f_type').value;
  document.getElementById('f_main').innerHTML = mainOptions(scope, type, null);
  onFormMainChange();
}
function onFormMainChange(){
  const scope = document.getElementById('f_scope').value;
  const type = document.getElementById('f_type').value;
  const main = document.getElementById('f_main').value;
  document.getElementById('f_category').innerHTML = catOptions(scope, type, main, null);
}
function submitTx(ym){
  const date = document.getElementById('f_date').value;
  const amount = Number(document.getElementById('f_amount').value);
  if(!date || !amount){ alert('날짜와 금액을 입력해주세요.'); return; }
  const payment = document.getElementById('f_payment').value;
  DB.add({
    date, scope: document.getElementById('f_scope').value,
    type: document.getElementById('f_type').value,
    main: document.getElementById('f_main').value,
    category: document.getElementById('f_category').value,
    note: document.getElementById('f_note').value,
    user: payment, payment,
    amount
  });
  document.getElementById('f_note').value='';
  document.getElementById('f_amount').value='';
  document.getElementById('f_payment').value='';
  renderMonth(ymOf(date));
  if(ymOf(date) !== ym) location.hash = '#/' + ymOf(date);
}
