<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리집 가계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
/* =========================================================
   토큰 (Design tokens)
   ========================================================= */
:root{
  --paper:#F7F6F1;
  --paper-line: rgba(32,36,31,0.05);
  --surface:#FFFFFF;
  --ink:#20241F;
  --ink-soft:#4B4F45;
  --muted:#8A8D80;
  --line:#E4E1D5;
  --line-strong:#D3CFBF;

  --income:#2F6F4E;      /* 수입 - 짙은 숲색 */
  --income-soft:#E4EFE7;
  --expense:#B5495B;     /* 지출 - 와인 로즈 */
  --expense-soft:#F5E6E8;
  --saving:#3C6E9E;      /* 저축 - 스틸 블루 */
  --saving-soft:#E5EDF3;
  --invest:#B9862E;      /* 투자 - 머스타드 골드 */
  --invest-soft:#F5EDDC;

  --radius-s:8px;
  --radius-m:14px;
  --radius-l:20px;

  --shadow-tab: 0 -2px 0 rgba(32,36,31,0.06) inset;
  --shadow-card: 0 1px 2px rgba(32,36,31,0.04), 0 8px 24px -16px rgba(32,36,31,0.18);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: var(--paper);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}

.home-btn{
  display:inline-block;
  font-size:12.5px;
  color:var(--muted);
  text-decoration:none;
  margin-bottom:8px;
}
.home-btn:hover{color:var(--ink);}
h1,h2,h3,.display{
  font-family:'Fraunces',serif;
  font-weight:600;
  letter-spacing:-0.01em;
  margin:0;
}
.mono{ font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; }
a{color:inherit;}
button{font-family:inherit;}

/* =========================================================
   레이아웃
   ========================================================= */
#app{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}

.topbar{
  display:flex;align-items:baseline;justify-content:space-between;
  margin-bottom:22px;flex-wrap:wrap;gap:10px;
}
.topbar .brand{display:flex;align-items:baseline;gap:10px;}
.topbar .brand .mark{
  width:34px;height:34px;border-radius:9px;background:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--paper);font-family:'Fraunces',serif;font-size:17px;font-weight:700;
  transform:translateY(4px);
}
.topbar h1{font-size:26px;}
.topbar .sub{color:var(--muted);font-size:13px;}
.topbar .actions{display:flex;gap:8px;align-items:center;}
.ghost-btn{
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);
  border-radius:100px;padding:7px 14px;font-size:12.5px;cursor:pointer;
  transition:.15s ease;
}
.ghost-btn:hover{border-color:var(--ink);color:var(--ink);}

/* ---- 탭(폴더 인덱스탭) 네비게이션 ---- */
.tabs-wrap{
  border-bottom:2px solid var(--ink);
  margin-bottom:26px;
}
.tabs{
  display:flex;gap:4px;overflow-x:auto;padding-bottom:0;
  scrollbar-width:thin;
}
.tabs::-webkit-scrollbar{height:5px;}
.tabs::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:10px;}
.tab{
  flex:0 0 auto;
  padding:9px 16px;
  font-size:13.5px;
  font-weight:600;
  color:var(--muted);
  background:transparent;
  border:none;
  border-radius:10px 10px 0 0;
  cursor:pointer;
  position:relative;
  top:2px;
  white-space:nowrap;
}
.tab.summary-tab{font-family:'Fraunces',serif;font-size:14px;}
.tab:hover{color:var(--ink-soft);}
.tab.active{
  color:var(--ink);
  background:var(--surface);
  border:2px solid var(--ink);
  border-bottom:2px solid var(--surface);
}
.tab .dot{
  display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--expense);margin-right:5px;vertical-align:middle;
  opacity:0;
}
.tab.has-data .dot{opacity:1;}

/* =========================================================
   카드 / 공용 컴포넌트
   ========================================================= */
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-m);
  box-shadow:var(--shadow-card);
}
.grid{display:grid;gap:16px;}
.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:18px;}
@media (max-width:800px){.kpis{grid-template-columns:repeat(2,1fr);}}

.kpi{padding:18px 18px 16px;}
.kpi .label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em;}
.kpi .value{font-family:'Fraunces',serif;font-size:25px;font-weight:600;margin-top:6px;}
.kpi .delta{font-size:12px;margin-top:6px;font-weight:600;}
.kpi .delta.up{color:var(--expense);}
.kpi .delta.down{color:var(--income);}
.kpi.income .value{color:var(--income);}
.kpi.expense .value{color:var(--expense);}
.kpi.saving .value{color:var(--saving);}

.section{margin-bottom:26px;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.section-head h2{font-size:18px;}
.section-head .hint{font-size:12px;color:var(--muted);}

.two-col{grid-template-columns:1.3fr 1fr;}
@media (max-width:900px){.two-col{grid-template-columns:1fr;}}

/* ---- 뱃지 ---- */
.badge{
  display:inline-block;padding:2px 9px;border-radius:100px;font-size:11px;font-weight:700;
}
.badge.income{background:var(--income-soft);color:var(--income);}
.badge.expense{background:var(--expense-soft);color:var(--expense);}
.badge.saving{background:var(--saving-soft);color:var(--saving);}
.badge.invest{background:var(--invest-soft);color:var(--invest);}

/* =========================================================
   달력 (지출 히트맵)
   ========================================================= */
.cal-card{padding:18px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px;}
.cal-dow{font-size:11px;color:var(--muted);text-align:center;font-weight:700;padding-bottom:4px;}
.cal-cell{
  aspect-ratio:1/0.82;border-radius:8px;border:1px solid var(--line);
  padding:6px 7px;position:relative;background:var(--paper);
  display:flex;flex-direction:column;justify-content:space-between;
}
.cal-cell.empty{border:none;background:transparent;}
.cal-cell .d{font-size:11px;color:var(--muted);font-weight:600;}
.cal-cell .amt{font-size:10.5px;font-weight:700;color:var(--expense);word-break:keep-all;}
.cal-cell.today{border:1.5px solid var(--ink);}
.cal-legend{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:11px;color:var(--muted);}
.cal-legend .sw{width:12px;height:12px;border-radius:3px;}

/* =========================================================
   카테고리 리스트업 (바 형태)
   ========================================================= */
.cat-list-card{padding:18px;}
.cat-tabs{display:flex;gap:6px;margin-bottom:14px;}
.cat-tab{
  border:1px solid var(--line-strong);background:var(--surface);border-radius:100px;
  padding:5px 12px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;
}
.cat-tab.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.cat-row{margin-bottom:10px;}
.cat-row .top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;}
.cat-row .top .name{font-weight:600;}
.cat-row .top .name .sub{color:var(--muted);font-weight:400;margin-left:4px;}
.cat-row .top .amt{font-family:'IBM Plex Mono',monospace;}
.bar-track{height:7px;border-radius:100px;background:var(--line);overflow:hidden;}
.bar-fill{height:100%;border-radius:100px;}

/* =========================================================
   테이블 (거래 내역)
   ========================================================= */
.table-card{padding:0;overflow:hidden;}
.table-toolbar{
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
  padding:16px 18px;border-bottom:1px solid var(--line);
}
.table-toolbar .filters{display:flex;gap:6px;flex-wrap:wrap;}
.chip{
  border:1px solid var(--line-strong);background:var(--surface);border-radius:100px;
  padding:5px 11px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;
}
.chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

.tx-form{
  display:grid;grid-template-columns: 118px 84px 96px 1fr 1.3fr 110px 84px 40px;
  gap:8px;padding:14px 18px;background:var(--paper);border-bottom:1px solid var(--line);
  align-items:center;
}
@media (max-width:900px){.tx-form{grid-template-columns:repeat(2,1fr);}}
.tx-form input, .tx-form select{
  width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:7px 8px;
  font-size:12.5px;font-family:inherit;background:var(--surface);color:var(--ink);
}
.tx-form .add-btn{
  background:var(--ink);color:var(--paper);border:none;border-radius:8px;
  height:32px;font-weight:700;cursor:pointer;font-size:16px;line-height:1;
}
.tx-form .add-btn:hover{opacity:.85;}

table.tx-table{width:100%;border-collapse:collapse;font-size:13px;}
table.tx-table th{
  text-align:left;font-size:11px;color:var(--muted);font-weight:700;
  padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;
}
table.tx-table td{padding:9px 10px;border-bottom:1px solid var(--paper-line);vertical-align:middle;}
table.tx-table tbody tr:hover{background:var(--paper);}
table.tx-table td.amt{font-family:'IBM Plex Mono',monospace;text-align:right;white-space:nowrap;}
table.tx-table td.amt.expense{color:var(--expense);}
table.tx-table td.amt.income{color:var(--income);}
table.tx-table td.amt.saving{color:var(--saving);}
table.tx-table td.amt.invest{color:var(--invest);}
.row-actions{display:flex;gap:4px;}
.icon-btn{
  border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;
  padding:2px 5px;border-radius:5px;
}
.icon-btn:hover{background:var(--line);color:var(--ink);}
.empty-row td{text-align:center;color:var(--muted);padding:30px;font-size:13px;}

/* =========================================================
   리뷰 메모
   ========================================================= */
.review-card{padding:18px;}
.review-card textarea{
  width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;
  padding:12px;font-family:'Inter',sans-serif;font-size:13px;resize:vertical;
  background:var(--paper);color:var(--ink);
}
.review-stats{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap;}
.review-stats .item{font-size:12px;color:var(--ink-soft);}
.review-stats .item b{display:block;font-family:'Fraunces',serif;font-size:17px;color:var(--ink);}
.save-note{font-size:11px;color:var(--muted);margin-top:8px;}

/* =========================================================
   Summary 전용
   ========================================================= */
.chart-card{padding:18px;}
.chart-card canvas{max-height:280px;}
.year-switch{display:flex;align-items:center;gap:8px;}
.year-switch button{
  border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;
  width:26px;height:26px;cursor:pointer;color:var(--ink-soft);
}
.year-switch .y{font-family:'Fraunces',serif;font-weight:700;font-size:16px;min-width:44px;text-align:center;}

.month-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.month-nav .move{
  border:1px solid var(--line-strong);background:var(--surface);border-radius:100px;
  padding:6px 14px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink-soft);
}
.month-nav h1{font-size:24px;}

footer.foot{
  margin-top:40px;text-align:center;color:var(--muted);font-size:11.5px;
  border-top:1px solid var(--line);padding-top:16px;
}
.pill-note{
  display:inline-flex;align-items:center;gap:6px;background:var(--invest-soft);color:var(--invest);
  border-radius:100px;padding:4px 12px;font-size:11.5px;font-weight:700;margin-bottom:14px;
}

/* ---- 연도 선택 드롭다운 ---- */
.tabs-row{display:flex;align-items:flex-end;gap:10px;}
.year-select{position:relative;flex:0 0 auto;top:2px;}
.year-btn{
  display:flex;align-items:center;gap:5px;
  border:2px solid var(--ink);border-bottom:none;background:var(--surface);color:var(--ink);
  border-radius:10px 10px 0 0;padding:9px 14px;font-family:'Fraunces',serif;font-weight:700;font-size:14px;
  cursor:pointer;
}
.year-btn .caret{font-size:10px;color:var(--muted);}
.year-menu{
  display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:30;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;
  box-shadow:var(--shadow-card);padding:6px;min-width:96px;flex-direction:column;gap:1px;
}
.year-menu.open{display:flex;}
.year-item{
  border:none;background:transparent;text-align:left;padding:7px 10px;border-radius:6px;
  font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;font-family:'IBM Plex Mono',monospace;
}
.year-item:hover{background:var(--paper);}
.year-item.active{background:var(--ink);color:var(--paper);}

/* ---- 거래 내역: 클릭해서 수정 ---- */
table.tx-table tbody tr.tx-row{cursor:pointer;}
table.tx-table tbody tr.tx-row:hover{background:var(--paper);}
tr.edit-row{background:var(--paper);}
tr.edit-row td{padding:12px 10px;}
.tx-edit-form{
  display:grid;grid-template-columns:118px 84px 96px 1fr 1fr 100px 90px auto;gap:8px;align-items:center;
}
@media (max-width:900px){.tx-edit-form{grid-template-columns:repeat(2,1fr);}}
.tx-edit-form input, .tx-edit-form select{
  width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:7px 8px;
  font-size:12.5px;font-family:inherit;background:var(--surface);color:var(--ink);
}
.edit-actions{display:flex;gap:6px;}
.ghost-btn.danger{color:var(--expense);border-color:var(--expense);}
.ghost-btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);}

/* ---- 예산 ---- */
.budget-input{
  width:100%;margin-top:5px;border:1px solid var(--line-strong);border-radius:8px;padding:6px 8px;
  font-size:12.5px;font-family:'IBM Plex Mono',monospace;background:var(--paper);color:var(--ink);
}
.compare-select{
  border:1px solid var(--line-strong);border-radius:8px;padding:5px 8px;font-size:12px;
  background:var(--surface);color:var(--ink-soft);font-family:inherit;
}
.auto-review-list{margin:0 0 14px;padding-left:0;list-style:none;}
.auto-review-list li{
  font-size:12.5px;line-height:1.6;color:var(--ink-soft);padding:7px 0;border-bottom:1px dashed var(--line);
}
.auto-review-list li:last-child{border-bottom:none;}
.auto-review-list b{color:var(--ink);}
.auto-review-list li{cursor:pointer;}
.auto-review-list li:hover{background:var(--paper);border-radius:6px;padding-left:6px;}

/* ---- 클릭으로 필터링 ---- */
.filter-link{cursor:pointer;border-bottom:1px dotted var(--line-strong);}
.filter-link:hover{color:var(--ink);border-bottom-color:var(--ink);}
.chip.sub{font-size:11.5px;padding:4px 10px;}
.note-search{
  border:1px solid var(--line-strong);border-radius:100px;padding:6px 12px;font-size:12px;
  background:var(--surface);color:var(--ink);width:160px;
}

/* ---- 캘린더 셀 클릭 ---- */
.cal-cell{cursor:pointer;transition:.12s ease;}
.cal-cell:hover{border-color:var(--ink);}
.cal-cell.empty{cursor:default;}
.cal-cell.empty:hover{border-color:transparent;}

/* ---- 모달 ---- */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(32,36,31,0.45);z-index:100;
  align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.open{display:flex;}
.modal-card{
  background:var(--surface);border-radius:var(--radius-l);max-width:560px;width:100%;
  max-height:85vh;overflow-y:auto;padding:28px;position:relative;box-shadow:var(--shadow-card);
}
.modal-close{
  position:absolute;top:16px;right:16px;border:none;background:var(--paper);width:28px;height:28px;
  border-radius:50%;cursor:pointer;color:var(--ink-soft);font-size:13px;line-height:1;
}
.modal-close:hover{background:var(--line);}
.modal-card h3{font-size:19px;padding-right:30px;}
.modal-sub{color:var(--muted);font-size:12.5px;margin:4px 0 16px;}
.modal-narrative{
  font-size:13px;line-height:1.75;color:var(--ink-soft);background:var(--paper);
  border-radius:10px;padding:14px 16px;margin-bottom:18px;
}
.modal-section-label{font-size:11.5px;font-weight:700;color:var(--muted);margin:16px 0 8px;}
.modal-tx-list{list-style:none;padding:0;margin:0;}
.modal-tx-list li{
  display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12.5px;
}
.modal-tx-list li:last-child{border-bottom:none;}
.modal-tx-list .n{flex:1;color:var(--ink-soft);}
.modal-tx-list .a{font-family:'IBM Plex Mono',monospace;font-weight:600;white-space:nowrap;}
</style>
</head>
<body>
<div id="app"></div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this) closeModal()">
  <div class="modal-card">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script>
let sb;
try{
  if(typeof supabase === 'undefined'){
    throw new Error('Supabase 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해주세요.');
  }
  if(!window.SUPABASE_URL || !window.SUPABASE_ANON_KEY){
    throw new Error('supabase-config.js에서 SUPABASE_URL / SUPABASE_ANON_KEY를 찾을 수 없어요.');
  }
  sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY, {
    auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true }
  });
}catch(err){
  document.getElementById('app').innerHTML = `
    <div style="max-width:420px;margin:80px auto;text-align:center;padding:24px;">
      <div style="font-family:'Fraunces',serif;font-weight:600;font-size:18px;color:#B5495B;margin-bottom:8px;">연결에 문제가 생겼어요</div>
      <div style="color:#8A8D80;font-size:13px;line-height:1.6;">${err.message}</div>
      <a href="./index.html" style="display:inline-block;margin-top:16px;font-size:12.5px;color:#8A8D80;">← 홈으로</a>
    </div>`;
  throw err;
}

/* =================================================================================
   0. 데이터 모델 & 카테고리 체계  (TAXONOMY)
   ---------------------------------------------------------------------------------
   기존 스프레드시트의 4단계(구분→대분류→중분류→소분류) 구조를
   3단계(구분→대분류→카테고리)로 단순화하고, 마지막 항목명은 자유 입력(내용)으로 둠.
   ================================================================================= */
const TAXONOMY = {
  "수입": {
    "고정수입": ["급여"],
    "변동수입": ["급여", "기타소득", "투자소득"]
  },
  "지출": {
    "고정지출": ["교통비", "구독", "보험", "주거비", "렌탈", "통신비", "회비"],
    "변동지출": ["건강", "경조사", "공동", "교통비", "기타", "문화", "생활비", "유류비"]
  },
  "저축": {
    "단기저축": ["비상금", "적금"],
    "장기저축": ["장기적금", "퇴직연금"]
  },
  "투자": {
    "단기투자": ["주식", "해외주식"],
    "장기투자": ["국내주식"]
  }
};
const TYPES = ["수입", "지출", "저축", "투자"];
const TYPE_KEY = { "수입":"income", "지출":"expense", "저축":"saving", "투자":"invest" };
const MONTH_NAMES = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
const DOW = ["월","화","수","목","금","토","일"];

/* =================================================================================
   1. DB 레이어 (Supabase 연동)
   ---------------------------------------------------------------------------------
   부팅 시 DB.init()으로 transactions/monthly_reviews/budgets를 한 번에 불러와
   메모리 캐시에 저장합니다. 화면 코드는 기존과 동일하게 DB.list()/getReview()/
   getBudgets()를 "동기"로 호출하고(캐시를 읽는 것뿐이라 즉시 반환됩니다),
   add/update/remove/saveReview/saveBudgets는 캐시를 먼저 바꿔 화면에 즉시
   반영한 뒤, Supabase에는 결과를 기다리지 않고 던져놓습니다(optimistic update).

   Supabase 테이블 (가이드 문서의 스키마와 동일):
     transactions(id, date, type, main, category, note, amount, user_name, payment)
     monthly_reviews(month, memo)
     budgets(year, category, amount)  -- category = '대분류|카테고리'
   ================================================================================= */
const DB = {
  _cache: [],        // transactions
  _reviewCache: {},  // { 'YYYY-MM': memo }
  _budgetCache: {},  // { year: { '대분류|카테고리': amount } }

  async init(){
    const [txRes, reviewRes, budgetRes] = await Promise.all([
      sb.from('transactions').select('*').order('date'),
      sb.from('monthly_reviews').select('*'),
      sb.from('budgets').select('*')
    ]);

    if(!txRes.error && txRes.data){
      this._cache = txRes.data.map(r => ({
        id: r.id, date: r.date, type: r.type, main: r.main,
        category: r.category, note: r.note, amount: r.amount,
        user: r.user_name, payment: r.payment
      }));
    } else if(txRes.error){ console.error('거래내역 로드 실패:', txRes.error); }

    if(!reviewRes.error && reviewRes.data){
      reviewRes.data.forEach(r => { this._reviewCache[r.month] = r.memo || ""; });
    } else if(reviewRes.error){ console.error('지출 리뷰 로드 실패:', reviewRes.error); }

    if(!budgetRes.error && budgetRes.data){
      budgetRes.data.forEach(r => {
        if(!this._budgetCache[r.year]) this._budgetCache[r.year] = {};
        this._budgetCache[r.year][r.category] = r.amount;
      });
    } else if(budgetRes.error){ console.error('예산 로드 실패:', budgetRes.error); }
  },

  list(){ return this._cache; },

  add(tx){
    const optimisticId = 'temp_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
    const localTx = { ...tx, id: optimisticId };
    this._cache.push(localTx);
    sb.from('transactions').insert({
      date: tx.date, type: tx.type, main: tx.main, category: tx.category,
      note: tx.note, amount: tx.amount, user_name: tx.user, payment: tx.payment
    }).select().single().then(({data, error})=>{
      if(error){ console.error('거래 추가 실패:', error); return; }
      const row = this._cache.find(t=>t.id===optimisticId);
      if(row) row.id = data.id;
    });
    return localTx;
  },

  update(id, patch){
    const row = this._cache.find(t=>t.id===id);
    if(row) Object.assign(row, patch);
    sb.from('transactions').update({
      date: patch.date, type: patch.type, main: patch.main, category: patch.category,
      note: patch.note, amount: patch.amount, user_name: patch.user
    }).eq('id', id).then(({error})=>{ if(error) console.error('거래 수정 실패:', error); });
  },

  remove(id){
    this._cache = this._cache.filter(t=>t.id!==id);
    sb.from('transactions').delete().eq('id', id).then(({error})=>{ if(error) console.error('거래 삭제 실패:', error); });
  },

  getReview(ym){
    return this._reviewCache[ym] || "";
  },
  saveReview(ym, memo){
    this._reviewCache[ym] = memo;
    sb.from('monthly_reviews').upsert({ month: ym, memo }).then(({error})=>{
      if(error) console.error('리뷰 저장 실패:', error);
    });
  },

  getBudgets(year){
    return this._budgetCache[year] || {};
  },
  saveBudgets(year, map){
    this._budgetCache[year] = map;
    sb.from('budgets').delete().eq('year', year).then(({error})=>{
      if(error){ console.error('예산 저장 실패(삭제 단계):', error); return; }
      const rows = Object.entries(map).map(([category, amount]) => ({ year, category, amount }));
      if(rows.length){
        sb.from('budgets').insert(rows).then(({error})=>{ if(error) console.error('예산 저장 실패:', error); });
      }
    });
  },

  reset(){
    // 화면 캐시만 비웁니다. 실제 Supabase 데이터를 지우려면 대시보드에서 직접 삭제하세요.
    this._cache = [];
  }
};

   2. 유틸
   ================================================================================= */
const won = n => (Math.round(n||0)).toLocaleString('ko-KR') + '원';
const wonShort = n => {
  n = Math.round(n||0);
  if(Math.abs(n) >= 10000) return (n/10000).toFixed(n%10000===0?0:1) + '만';
  return n.toLocaleString('ko-KR');
};
const pct = n => (isFinite(n) ? n.toFixed(1) : '0.0') + '%';
const ymOf = d => d.slice(0,7);
const daysInMonth = (y,m) => new Date(y, m, 0).getDate();
const mondayIndex = jsDay => (jsDay + 6) % 7; // JS: 0=일..6=토 -> 0=월..6=일

function monthTx(list, ym){ return list.filter(t => ymOf(t.date) === ym); }
function sumBy(list, type){ return list.filter(t=>t.type===type).reduce((s,t)=>s+Number(t.amount||0),0); }

function prevYm(ym){
  let [y,m] = ym.split('-').map(Number);
  m -= 1; if(m===0){ m=12; y-=1; }
  return y + '-' + String(m).padStart(2,'0');
}
function shiftYm(ym, n){
  let [y,m] = ym.split('-').map(Number);
  m += n;
  while(m<1){ m+=12; y-=1; }
  while(m>12){ m-=12; y+=1; }
  return y + '-' + String(m).padStart(2,'0');
}
function escapeAttr(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

function yearRange(){
  const dataYears = DB.list().map(t=>Number(t.date.slice(0,4)));
  const now = new Date().getFullYear();
  const candidates = dataYears.length ? dataYears : [now];
  const min = Math.min(now-1, ...candidates);
  const max = Math.max(now+3, ...candidates);
  const arr = [];
  for(let y=min;y<=max;y++) arr.push(y);
  return arr;
}
function toggleYearMenu(){

  else { location.hash = '#/' + y + '-' + state.view.split('-')[1]; }

function renderSummary(){
  const list = DB.list().filter(t => t.date.startsWith(String(state.year)));
  const income = sumBy(list,'수입'), expense = sumBy(list,'지출');
  const saving = sumBy(list,'저축'), invest = sumBy(list,'투자');
  const net = income - expense;
  const rate = income ? (net/income*100) : 0;

  const monthly = MONTH_NAMES.map((_,i)=>{
    const ym = state.year + '-' + String(i+1).padStart(2,'0');
    const mt = monthTx(list, ym);
    return { ym, income: sumBy(mt,'수입'), expense: sumBy(mt,'지출') };
  });

  // 지출 카테고리 12개월 표
  const expenseRows = [];
  Object.entries(TAXONOMY['지출']).forEach(([main, cats])=>{
    cats.forEach(cat=>{
      const row = { main, cat, months: [], total:0 };
      monthly.forEach(m=>{
        const amt = list.filter(t=>t.type==='지출'&&t.main===main&&t.category===cat&&ymOf(t.date)===m.ym)
                        .reduce((s,t)=>s+Number(t.amount||0),0);
        row.months.push(amt); row.total += amt;
      });
      if(row.total>0) expenseRows.push(row);
    });
  });
  expenseRows.sort((a,b)=>b.total-a.total);

  document.getElementById('view').innerHTML = `
    <div class="section-head">
      <h2 class="display" style="font-size:20px;">${state.year}년 연간 요약</h2>
    </div>

    <div class="grid kpis">
      <div class="card kpi income"><div class="label">연간 총수입</div><div class="value mono">${wonShort(income)}</div></div>
      <div class="card kpi expense"><div class="label">연간 총지출</div><div class="value mono">${wonShort(expense)}</div></div>
      <div class="card kpi saving"><div class="label">저축 + 투자</div><div class="value mono">${wonShort(saving+invest)}</div></div>
      <div class="card kpi"><div class="label">순저축률 (수입-지출)</div><div class="value mono">${pct(rate)}</div></div>
    </div>

    <div class="grid two-col section">
      <div class="card chart-card">
        <div class="section-head"><h2>월별 수입 · 지출</h2></div>
        <canvas id="chartMonthly"></canvas>
      </div>
      <div class="card chart-card">
        <div class="section-head"><h2>월별 저축율 추이</h2></div>
        <canvas id="chartRate"></canvas>
      </div>
    </div>

    <div class="section">
      <div class="section-head"><h2>지출 카테고리 · 월별 상세</h2><span class="hint">대분류 &gt; 카테고리, 단위: 원</span></div>
      <div class="card table-card" style="overflow-x:auto;">
        <table class="tx-table">
          <thead><tr>
            <th>대분류</th><th>카테고리</th>
            ${MONTH_NAMES.map(m=>`<th style="text-align:right">${m}</th>`).join('')}
            <th style="text-align:right">합계</th>
          </tr></thead>
          <tbody>
            ${expenseRows.length ? expenseRows.map(r=>`
              <tr>
                <td style="color:var(--muted);white-space:nowrap;">${r.main}</td>
                <td style="font-weight:600;white-space:nowrap;">${r.cat}</td>
                ${r.months.map(v=>`<td class="amt">${v? v.toLocaleString('ko-KR'):'·'}</td>`).join('')}
                <td class="amt expense" style="font-weight:700;">${r.total.toLocaleString('ko-KR')}</td>
              </tr>
            `).join('') : `<tr class="empty-row"><td colspan="15">아직 입력된 지출 데이터가 없습니다.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>

    ${renderBudgetSummarySections(list)}
  `;

  // 차트
  if(typeof Chart === 'undefined'){
    document.getElementById('chartMonthly').replaceWith(chartFallbackNode());
    document.getElementById('chartRate').replaceWith(chartFallbackNode());
    return;
  }
  new Chart(document.getElementById('chartMonthly'), {
    type:'bar',
    data:{
      labels: MONTH_NAMES,
      datasets:[
        {label:'수입', data:monthly.map(m=>m.income), backgroundColor:'#2F6F4E', borderRadius:4, maxBarThickness:22},
        {label:'지출', data:monthly.map(m=>m.expense), backgroundColor:'#B5495B', borderRadius:4, maxBarThickness:22},

  });

  new Chart(document.getElementById('chartRate'), {
    type:'line',
    data:{
      labels: MONTH_NAMES,
      datasets:[{

        borderColor:'#3C6E9E', backgroundColor:'rgba(60,110,158,0.12)', fill:true, tension:.35, spanGaps:true,

function renderBudgetSummarySections(list){
  const budgets = DB.getBudgets(state.year);
  const cats = flatExpenseCategories();

  const formRows = cats.map(({main,cat})=>{
    const key = main + '|' + cat;
    return `<div class="cat-row">
      <div class="top"><span class="name">${cat}<span class="sub">${main}</span></span></div>
      <input class="budget-input" type="number" data-key="${key}" placeholder="월 예산 (원)" value="${budgets[key]||''}">
    </div>`;
  }).join('');

  const activeBudgets = Object.entries(budgets).filter(([,v])=>v>0);
  const actualHtml = activeBudgets.length ? activeBudgets.map(([key,monthly])=>{
    const [main,cat] = key.split('|');
    const yearly = monthly*12;
    const actual = list.filter(t=>t.type==='지출'&&(t.main+'|'+t.category)===key).reduce((s,t)=>s+Number(t.amount),0);
    const w = Math.min(100, yearly ? actual/yearly*100 : 0);
    const over = actual>yearly;
    return `<div class="cat-row">
      <div class="top"><span class="name">${cat}<span class="sub">${main}</span></span><span class="amt">${won(actual)} / ${won(yearly)}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${over?'var(--expense)':'var(--saving)'}"></div></div>
    </div>`;
  }).join('') : `<div style="color:var(--muted);font-size:13px;padding:6px 0;">왼쪽에서 카테고리별 월 예산을 입력하고 저장하면, 연간 예산(월 예산×12) 대비 실적이 여기 표시됩니다.</div>`;

  return `
    <div class="grid two-col section">
      <div class="card cat-list-card">
        <div class="section-head"><h2>월 예산 설정</h2><span class="hint">카테고리별, ${state.year}년 전체 월에 동일 적용</span></div>
        <div id="budgetForm">${formRows}</div>
        <button class="ghost-btn primary" style="margin-top:12px;" onclick="saveBudgetsFromForm()">예산 저장</button>
      </div>
      <div class="card cat-list-card">
        <div class="section-head"><h2>예산 대비 연간 실적</h2><span class="hint">월 예산 × 12 기준</span></div>
        ${actualHtml}
      </div>
    </div>
  `;
}

function saveBudgetsFromForm(){
  const map = {};
  document.querySelectorAll('#budgetForm .budget-input').forEach(inp=>{
    const v = Number(inp.value)||0;
    if(v>0) map[inp.dataset.key] = v;

/* ---- 예산 대비 실적 (월별) ---- */
function renderBudgetProgress(ym){
  const budgets = DB.getBudgets(Number(ym.split('-')[0]));
  const keys = Object.keys(budgets).filter(k=>budgets[k]>0);
  const tx = monthTx(DB.list(), ym).filter(t=>t.type==='지출');
  const actualByCat = {};
  tx.forEach(t=>{ const k=t.main+'|'+t.category; actualByCat[k]=(actualByCat[k]||0)+Number(t.amount); });

  document.getElementById('budgetWrap').innerHTML = keys.length ? keys.map(k=>{
    const [main,cat] = k.split('|');
    const budget = budgets[k];
    const actual = actualByCat[k]||0;
    const w = Math.min(100, actual/budget*100);
    const over = actual>budget;
    return `<div class="cat-row">
      <div class="top"><span class="name">${cat}<span class="sub">${main}</span></span><span class="amt">${won(actual)} / ${won(budget)}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${over?'var(--expense)':'var(--income)'}"></div></div>
    </div>`;
  }).join('') : `<div style="color:var(--muted);font-size:13px;">아직 설정된 예산이 없어요. <a href="#/summary" style="color:var(--ink);font-weight:600;">Summary 페이지</a>에서 카테고리별 월 예산을 설정해보세요.</div>`;
}

/* ---- 전월/선택월 대비 지출 비교 차트 ---- */
let _compareChart = null;
function compareOptions(ym){
  const opts = [];
  for(let i=1;i<=12;i++){
    const cand = shiftYm(ym,-i);
    const [cy,cm] = cand.split('-');
    const label = cy===ym.slice(0,4) ? Number(cm)+'월' : cy+'년 '+Number(cm)+'월';
    opts.push({value:cand, label});
  }
  return opts;
}
function renderCompareChart(ym){
  const sel = document.getElementById('compareSelect');
  sel.innerHTML = compareOptions(ym).map(o=>`<option value="${o.value}" ${o.value===state.compareYm?'selected':''}>${o.label}</option>`).join('');

  const tx = monthTx(DB.list(), ym).filter(t=>t.type==='지출');
  const pTx = monthTx(DB.list(), state.compareYm).filter(t=>t.type==='지출');
  const catSet = new Set();
  tx.forEach(t=>catSet.add(t.category));
  pTx.forEach(t=>catSet.add(t.category));
  const cats = Array.from(catSet).slice(0,10);
  const curByCat = cats.map(c => tx.filter(t=>t.category===c).reduce((s,t)=>s+Number(t.amount),0));
  const prevByCat = cats.map(c => pTx.filter(t=>t.category===c).reduce((s,t)=>s+Number(t.amount),0));

  if(typeof Chart === 'undefined'){
    document.getElementById('chartCompare').replaceWith(chartFallbackNode());
    return;
  }
  if(_compareChart) _compareChart.destroy();
  _compareChart = new Chart(document.getElementById('chartCompare'), {
    type:'bar',
    data:{ labels:cats.length?cats:['데이터 없음'], datasets:[
      {label:compareOptions(ym).find(o=>o.value===state.compareYm)?.label || '비교월', data:cats.length?prevByCat:[0], backgroundColor:'#D9D5C6', borderRadius:4, maxBarThickness:16},
      {label:'이번 달', data:cats.length?curByCat:[0], backgroundColor:'#B5495B', borderRadius:4, maxBarThickness:16},
    ]},
    options:{
      indexAxis:'y', responsive:true,
      plugins:{legend:{position:'top', labels:{boxWidth:10,font:{size:11}}}},
      scales:{ x:{ticks:{callback:v=>wonShort(v), font:{size:10}}, grid:{color:'#EFEDE4'}}, y:{grid:{display:false}, ticks:{font:{size:11}}} }
    }
  });
}

/* ---- 지출 리뷰: 규칙 기반 자동 분석 ----
   TODO[AI]: 아래 computeAutoReview()를 서버(Supabase Edge Function 등)에서
   거래내역을 Claude API로 보내 자연어 요약을 받아오는 방식으로 교체 예정.
*/
function computeAutoReview(ym){
  const all = DB.list();
  const cur = monthTx(all, ym).filter(t=>t.type==='지출');
  const histMonths = [];
  for(let i=1;i<=6;i++){
    const hy = shiftYm(ym,-i);
    const ht = monthTx(all, hy).filter(t=>t.type==='지출');
    if(ht.length) histMonths.push(ht);
  }
  const curByCat = {};
  cur.forEach(t=> curByCat[t.category] = (curByCat[t.category]||0)+Number(t.amount));
  const histByCat = {};
  histMonths.forEach(ht=>{
    const m = {};
    ht.forEach(t=> m[t.category] = (m[t.category]||0)+Number(t.amount));
    Object.entries(m).forEach(([c,v])=>{ (histByCat[c]=histByCat[c]||[]).push(v); });
  });

  const insights = [];
  Object.entries(curByCat).forEach(([cat,curAmt])=>{
    const hist = histByCat[cat];
    if(!hist || !hist.length){
      if(curAmt>=10000) insights.push({cat, kind:'new', curAmt, mag:100});
      return;
    }
    const avg = hist.reduce((s,v)=>s+v,0)/hist.length;
    if(avg<=0) return;
    const diffPct = (curAmt-avg)/avg*100;
    if(Math.abs(diffPct)>=30 && Math.abs(curAmt-avg)>=10000){
      insights.push({cat, kind: diffPct>0?'up':'down', curAmt, avg, diffPct, mag:Math.abs(diffPct)});
    }
  });
  Object.entries(histByCat).forEach(([cat,hist])=>{
    if(!curByCat[cat]){
      const avg = hist.reduce((s,v)=>s+v,0)/hist.length;
      if(avg>=10000) insights.push({cat, kind:'gone', avg, mag:avg/1000});
    }
  });
  insights.sort((a,b)=>b.mag-a.mag);
  return insights.slice(0,6);
}
let _lastInsights = [];
let _lastInsightYm = null;
function renderAutoReview(ym){
  const insights = computeAutoReview(ym);
  _lastInsights = insights;
  _lastInsightYm = ym;
  const lines = insights.map((ins,i)=>{
    if(ins.kind==='new') return `<li onclick="openInsightDetail(${i})">· <b>${ins.cat}</b> 카테고리에 새로 ${won(ins.curAmt)} 지출이 생겼어요. (최근 6개월 이력 없음)</li>`;
    if(ins.kind==='gone') return `<li onclick="openInsightDetail(${i})">· 최근 평균 ${won(Math.round(ins.avg))}씩 쓰던 <b>${ins.cat}</b> 지출이 이번 달엔 없었어요.</li>`;
    const dir = ins.kind==='up' ? '증가' : '감소';
    return `<li onclick="openInsightDetail(${i})">· <b>${ins.cat}</b> 지출이 최근 평균(${won(Math.round(ins.avg))}) 대비 ${Math.abs(ins.diffPct).toFixed(0)}% ${dir}했어요. (이번 달 ${won(ins.curAmt)})</li>`;
  });
  document.getElementById('autoReviewWrap').innerHTML = lines.length
    ? `<ul class="auto-review-list">${lines.join('')}</ul><div class="save-note">항목을 클릭하면 상세 내용을 볼 수 있어요.</div>`
    : `<div style="color:var(--muted);font-size:13px;padding:6px 0 14px;">아직 비교할 이전 달 데이터가 충분하지 않아요.</div>`;
}

/* ---- 지출 리뷰 인사이트 상세 팝업 ---- */
function openInsightDetail(i){
  const ins = _lastInsights[i];
  if(!ins) return;
  const ym = _lastInsightYm;

  const curItems = monthTx(DB.list(), ym)
    .filter(t=>t.type==='지출' && t.category===ins.cat)
    .sort((a,b)=> a.date<b.date?-1:1);
  const curTotal = curItems.reduce((s,t)=>s+Number(t.amount),0);

  let narrative = '';
  if(ins.kind==='new'){
    narrative = `<b>${ins.cat}</b> 카테고리는 최근 6개월 동안 지출 이력이 없었는데, 이번 달 처음으로 ${won(ins.curAmt)}이 기록됐어요. 새로 생긴 구독이나 일회성 지출일 가능성이 높으니, 아래 내역을 확인해서 계속 나갈 항목인지 한 번만 나간 항목인지 살펴보면 좋아요.`;
  } else if(ins.kind==='gone'){
    narrative = `최근 몇 달간 평균 ${won(Math.round(ins.avg))} 정도 꾸준히 나가던 <b>${ins.cat}</b> 지출이 이번 달엔 한 건도 없었어요. 결제 주기가 바뀌었거나, 해지했거나, 아직 입력을 안 한 것일 수 있어요. 정말 지출이 없었던 게 맞는지 한 번 확인해보세요.`;
  } else {
    const dir = ins.kind==='up' ? '늘었어요' : '줄었어요';
    const tip = ins.kind==='up'
      ? '아래 내역 중 평소보다 유독 크게 나간 항목이 있는지 확인해보면 원인을 찾기 쉬워요.'
      : '지출이 줄어든 좋은 흐름이에요. 어떤 습관이 바뀌었는지 기억해두면 다음 달에도 도움이 될 거예요.';
    narrative = `<b>${ins.cat}</b> 카테고리는 최근 평균 ${won(Math.round(ins.avg))}에서 이번 달 ${won(ins.curAmt)}(으)로 ${Math.abs(ins.diffPct).toFixed(0)}% ${dir}. ${tip}`;
  }

  const itemsHtml = curItems.length ? `<ul class="modal-tx-list">${curItems.map(t=>`
    <li>
      <span style="color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11.5px;min-width:38px;">${t.date.slice(8)}일</span>
      <span class="n">${escapeAttr(t.note)||'(내용 없음)'}${t.user?` · ${escapeAttr(t.user)}`:''}</span>
      <span class="a amt expense">${Number(t.amount).toLocaleString('ko-KR')}원</span>
    </li>
  `).join('')}</ul>` : `<div style="color:var(--muted);font-size:13px;">이번 달 이 카테고리에 기록된 거래가 없어요.</div>`;

  let historyHtml = '';
  if(ins.kind !== 'new'){
    const rows = [];
    for(let i2=1;i2<=6;i2++){
      const hy = shiftYm(ym,-i2);
      const amt = monthTx(DB.list(), hy).filter(t=>t.type==='지출'&&t.category===ins.cat).reduce((s,t)=>s+Number(t.amount),0);
      if(amt>0) rows.push({hy, amt});
    }
    if(rows.length){
      historyHtml = `<div class="modal-section-label">최근 월별 ${ins.cat} 지출</div>
        <ul class="modal-tx-list">${rows.map(r=>{
          const [ry,rm] = r.hy.split('-');
          return `<li><span class="n">${ry===ym.slice(0,4)?'':ry+'년 '}${Number(rm)}월</span><span class="a">${won(r.amt)}</span></li>`;
        }).join('')}</ul>`;
    }
  }

  openModal(`
    <h3 class="display">${ins.cat} 상세</h3>
    <div class="modal-sub">${Number(ym.split('-')[1])}월 · ${curItems.length}건 · 합계 ${won(curTotal)}</div>
    <div class="modal-narrative">${narrative}</div>
    <div class="modal-section-label">이번 달 ${ins.cat} 거래 내역</div>
    ${itemsHtml}
    ${historyHtml}
  `);
}

function nextYm(ym){
  let [y,m] = ym.split('-').map(Number);
  m += 1; if(m===13){ m=1; y+=1; }
  return y + '-' + String(m).padStart(2,'0');
}

function topCategory(tx){
  const map = {};
  tx.filter(t=>t.type==='지출').forEach(t=> map[t.category] = (map[t.category]||0)+Number(t.amount));
  const arr = Object.entries(map).sort((a,b)=>b[1]-a[1]);
  return arr.length ? arr[0][0] : '-';
}

/* ---- 캘린더 ---- */
function renderCalendar(y,m,tx){
  const ym = y + '-' + String(m).padStart(2,'0');
  const byDay = {};
  tx.filter(t=>t.type==='지출').forEach(t=>{
    const d = Number(t.date.split('-')[2]);
    byDay[d] = (byDay[d]||0) + Number(t.amount);
  });
  const max = Math.max(1, ...Object.values(byDay));
  const dim = daysInMonth(y,m);
  const firstDow = mondayIndex(new Date(y, m-1, 1).getDay());

  let html = DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<firstDow;i++) html += `<div class="cal-cell empty"></div>`;
  const today = new Date();
  const isThisMonth = today.getFullYear()===y && (today.getMonth()+1)===m;
  for(let d=1; d<=dim; d++){
    const amt = byDay[d]||0;
    const intensity = amt / max;
    const bg = amt ? `rgba(181,73,91,${0.08 + intensity*0.35})` : 'var(--paper)';
    const isToday = isThisMonth && today.getDate()===d;
    html += `<div class="cal-cell ${isToday?'today':''}" style="background:${bg}" onclick="openDayModal('${ym}',${d})">
      <span class="d">${d}</span>
      <span class="amt">${amt? wonShort(amt):''}</span>
    </div>`;
  }
  document.getElementById('calWrap').innerHTML = `<div class="cal-grid">${html}</div>
    <div class="cal-legend"><span class="sw" style="background:rgba(181,73,91,0.1)"></span>적음 &nbsp;→&nbsp; <span class="sw" style="background:rgba(181,73,91,0.4)"></span>많음</div>`;
}

      <span class="badge ${TYPE_KEY[t.type]}">${t.type}</span>

function renderCatList(ym){
  const tx = monthTx(DB.list(), ym).filter(t=>t.type===state.catTabType);

  const idx = TYPES.indexOf(state.catTabType);
  document.querySelectorAll('#catTabs .cat-tab')[idx]?.classList.add('active');

  const total = tx.reduce((s,t)=>s+Number(t.amount),0);

  tx.forEach(t=>{
    const key = t.main + '|' + t.category;
    map[key] = (map[key]||0) + Number(t.amount);
  });
  const rows = Object.entries(map).sort((a,b)=>b[1]-a[1]);
  const colorVar = `var(--${TYPE_KEY[state.catTabType]})`;

  document.getElementById('catListWrap').innerHTML = rows.length ? rows.map(([key,amt])=>{

      <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${colorVar}"></div></div>

  }).join('') : `<div style="color:var(--muted);font-size:13px;padding:20px 0;">이번 달 ${state.catTabType} 내역이 없습니다.</div>`;
}

/* ---- 거래 내역 툴바 (구분 → 대분류 → 카테고리 드릴다운 + 내용 검색) ---- */
function renderTxToolbar(ym){
  const type = state.monthTxFilter;
  let mainRow = '';
  if(type !== '전체'){
    const mains = ['전체', ...Object.keys(TAXONOMY[type])];
    mainRow = `<div class="filters">${mains.map(mn=>`<button class="chip sub ${state.mainFilter===mn?'active':''}" onclick="setMainFilter('${mn}')">${mn}</button>`).join('')}</div>`;
  }
  let catRow = '';
  if(type !== '전체' && state.mainFilter !== '전체'){
    const cats = ['전체', ...TAXONOMY[type][state.mainFilter]];
    catRow = `<div class="filters">${cats.map(c=>`<button class="chip sub ${state.catFilter===c?'active':''}" onclick="setCatFilter('${c}')">${c}</button>`).join('')}</div>`;
  }
  document.getElementById('txToolbar').innerHTML = `
    <div class="filters">
      ${['전체',...TYPES].map(t=>`<button class="chip ${state.monthTxFilter===t?'active':''}" onclick="setTypeFilter('${t}')">${t}</button>`).join('')}
      <input type="text" class="note-search" id="noteSearch" placeholder="내용 검색" value="${escapeAttr(state.noteFilter)}"
             oninput="state.noteFilter=this.value; renderTxTable('${ym}')" style="margin-left:auto;">
    </div>
    ${mainRow}
    ${catRow}
  `;
}
function setTypeFilter(t){
  state.monthTxFilter = t; state.mainFilter = '전체'; state.catFilter = '전체';
  renderTxToolbar(state.currentYm); renderTxTable(state.currentYm);
}
function setMainFilter(m){
  state.mainFilter = m; state.catFilter = '전체';
  renderTxToolbar(state.currentYm); renderTxTable(state.currentYm);
}
function setCatFilter(c){
  state.catFilter = c;
  renderTxToolbar(state.currentYm); renderTxTable(state.currentYm);
}
function quickFilterMain(type, main){
  state.monthTxFilter = type; state.mainFilter = main; state.catFilter = '전체';
  renderTxToolbar(state.currentYm); renderTxTable(state.currentYm);
}
function quickFilterCat(type, main, cat){
  state.monthTxFilter = type; state.mainFilter = main; state.catFilter = cat;
  renderTxToolbar(state.currentYm); renderTxTable(state.currentYm);
}

/* ---- 거래 내역 테이블 (행 클릭 → 인라인 수정) ---- */
function renderTxTable(ym){
  let tx = monthTx(DB.list(), ym).sort((a,b)=> a.date<b.date?1:-1);
  if(state.monthTxFilter!=='전체') tx = tx.filter(t=>t.type===state.monthTxFilter);
  if(state.mainFilter!=='전체') tx = tx.filter(t=>t.main===state.mainFilter);
  if(state.catFilter!=='전체') tx = tx.filter(t=>t.category===state.catFilter);
  if(state.noteFilter && state.noteFilter.trim()){
    const q = state.noteFilter.trim().toLowerCase();
    tx = tx.filter(t=> (t.note||'').toLowerCase().includes(q));
  }

  document.getElementById('txBody').innerHTML = tx.length
    ? tx.map(t => t.id===state.editingTxId ? editRowHtml(t) : displayRowHtml(t)).join('')
    : `<tr class="empty-row"><td colspan="7">해당 조건의 거래 내역이 없습니다.</td></tr>`;
}

function displayRowHtml(t){
  return `<tr class="tx-row" onclick="startEditTx('${t.id}')">
    <td class="mono" style="color:var(--muted)">${t.date.slice(5)}</td>
    <td><span class="badge ${TYPE_KEY[t.type]}">${t.type}</span></td>
    <td style="color:var(--muted)"><span class="filter-link" onclick="event.stopPropagation();quickFilterMain('${t.type}','${t.main}')">${t.main}</span></td>
    <td style="font-weight:600"><span class="filter-link" onclick="event.stopPropagation();quickFilterCat('${t.type}','${t.main}','${t.category}')">${t.category}</span></td>
    <td>${escapeAttr(t.note)}</td>
    <td style="color:var(--muted)">${escapeAttr(t.user)}</td>
    <td class="amt ${TYPE_KEY[t.type]}">${Number(t.amount).toLocaleString('ko-KR')}</td>
  </tr>`;
}

function editRowHtml(t){
  return `<tr class="edit-row">
    <td colspan="7">
      <div class="tx-edit-form">
        <input type="date" id="e_date_${t.id}" value="${t.date}">
        <select id="e_type_${t.id}" onchange="onEditTypeChange('${t.id}')">${TYPES.map(ty=>`<option ${ty===t.type?'selected':''}>${ty}</option>`).join('')}</select>
        <select id="e_main_${t.id}" onchange="onEditMainChange('${t.id}')">${mainOptions(t.type,t.main)}</select>
        <select id="e_category_${t.id}">${catOptions(t.type,t.main,t.category)}</select>
        <input type="text" id="e_note_${t.id}" value="${escapeAttr(t.note)}" placeholder="내용">
        <input type="text" id="e_user_${t.id}" value="${escapeAttr(t.user)}" placeholder="사용자">
        <input type="number" id="e_amount_${t.id}" value="${t.amount}">
        <div class="edit-actions">
          <button class="ghost-btn primary" onclick="saveEditTx('${t.id}')">저장</button>
          <button class="ghost-btn danger" onclick="deleteEditTx('${t.id}')">삭제</button>
          <button class="ghost-btn" onclick="cancelEditTx()">취소</button>
        </div>
      </div>
    </td>
  </tr>`;
}

function startEditTx(id){
  state.editingTxId = id;
  renderTxTable(state.currentYm);
}
function cancelEditTx(){
  state.editingTxId = null;
  renderTxTable(state.currentYm);
}
function onEditTypeChange(id){
  const type = document.getElementById('e_type_'+id).value;
  document.getElementById('e_main_'+id).innerHTML = mainOptions(type, null);
  onEditMainChange(id);
}
function onEditMainChange(id){
  const type = document.getElementById('e_type_'+id).value;
  const main = document.getElementById('e_main_'+id).value;
  document.getElementById('e_category_'+id).innerHTML = catOptions(type, main, null);
}
function saveEditTx(id){
  const date = document.getElementById('e_date_'+id).value;
  const amount = Number(document.getElementById('e_amount_'+id).value);
  if(!date || !amount){ alert('날짜와 금액을 입력해주세요.'); return; }
  DB.update(id, {
    date, type: document.getElementById('e_type_'+id).value,
    main: document.getElementById('e_main_'+id).value,
    category: document.getElementById('e_category_'+id).value,
    note: document.getElementById('e_note_'+id).value,
    user: document.getElementById('e_user_'+id).value,
    amount
  });
  state.editingTxId = null;
  const targetYm = ymOf(date);
  if(targetYm !== state.currentYm) location.hash = '#/' + targetYm;
  else renderMonth(targetYm);
}
function deleteEditTx(id){
  if(!confirm('이 거래를 삭제할까요?')) return;
  DB.remove(id);
  state.editingTxId = null;
  renderMonth(state.currentYm);
}

function onFormTypeChange(){
  const type = document.getElementById('f_type').value;
  document.getElementById('f_main').innerHTML = mainOptions(type, null);
  onFormMainChange();
}
function onFormMainChange(){
  const type = document.getElementById('f_type').value;
  const main = document.getElementById('f_main').value;
  document.getElementById('f_category').innerHTML = catOptions(type, main, null);
}
function submitTx(ym){
  const date = document.getElementById('f_date').value;
  const amount = Number(document.getElementById('f_amount').value);
  if(!date || !amount){ alert('날짜와 금액을 입력해주세요.'); return; }
  DB.add({
    date, type: document.getElementById('f_type').value,
    main: document.getElementById('f_main').value,
    category: document.getElementById('f_category').value,
    note: document.getElementById('f_note').value,
    user: document.getElementById('f_user').value,
    amount, payment:''
  });
  document.getElementById('f_note').value='';
  document.getElementById('f_amount').value='';
  renderMonth(ymOf(date));
  if(ymOf(date) !== ym) location.hash = '#/' + ymOf(date);
}

/* =================================================================================
   8. 부팅
   ================================================================================= */
(async () => {
  document.getElementById('app').innerHTML = '<div style="padding:60px 0;text-align:center;color:var(--muted);">불러오는 중...</div>';

  // 로그인 확인: 세션이 없으면 홈(로그인 페이지)으로 돌려보냅니다.
  let session;
  try{
    const { data, error } = await sb.auth.getSession();
    if(error) throw error;
    session = data.session;
  }catch(err){
    console.error('세션 확인 실패:', err);
    document.getElementById('app').innerHTML = `<div style="padding:60px 20px;text-align:center;color:var(--muted);font-size:13px;">로그인 상태를 확인하지 못했어요. 새로고침해보세요.</div>`;
    return;
  }
  if(!session){
    window.location.href = './index.html';
    return;
  }

  try{
    await DB.init();
  }catch(err){
    console.error('데이터 로드 실패:', err);
    document.getElementById('app').innerHTML = `<div style="padding:60px 20px;text-align:center;color:var(--muted);font-size:13px;">데이터를 불러오지 못했어요. 새로고침해보세요.</div>`;
    return;
  }
  seedIfEmpty();
  route();
})();
</script>
