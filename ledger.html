<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리집 가계부</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#3a5a52">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BORAKWAN">
<link rel="stylesheet" href="common.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
/* =========================================================
   토큰 (Design tokens)
   ---------------------------------------------------------
   --bg/--ink/--sub/--line/--card/--accent 는 common.css에서 옵니다.
   여기서는 가계부 페이지 전용 확장 토큰만 추가하고,
   기존 코드 호환을 위해 --paper/--surface/--muted 는
   common.css 토큰을 그대로 가리키는 별칭으로 둡니다.
   ========================================================= */
:root{
  --font: "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --paper: var(--bg);
  --paper-line: rgba(34,34,31,0.05);
  --surface: var(--card);
  --ink-soft:#4B4F45;
  --muted: var(--sub);
  --line-strong:#D3CFBF;

  --income:#2F6F4E;      /* 수입 - 짙은 숲색 */
  --income-soft:#E4EFE7;
  --expense:#B5495B;     /* 지출 - 와인 로즈 */
  --expense-soft:#F5E6E8;
  --saving:#3C6E9E;      /* 저축 - 스틸 블루 */
  --saving-soft:#E5EDF3;
  --invest:#B9862E;      /* 투자 - 머스타드 골드 */
  --invest-soft:#F5EDDC;

  --radius-s:8px;
  --radius-m:14px;
  --radius-l:20px;

  --shadow-tab: 0 -2px 0 rgba(32,36,31,0.06) inset;
  --shadow-card: 0 1px 2px rgba(32,36,31,0.04), 0 8px 24px -16px rgba(32,36,31,0.18);
}

*{box-sizing:border-box;}
/* html/body/#app에 overflow-x:hidden을 걸면 그 안의 sticky 요소(#bkNav)의
   position:sticky가 깨져서 상단 고정이 안 됨(overflow가 visible이 아닌 조상이 있으면
   sticky가 그 조상 기준으로 갇혀버림) → #bkNav와 무관한 #view에만 적용 */
#view{overflow-x:hidden;}
body{
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,.display{
  font-family:var(--font);
  font-weight:700;
  letter-spacing:-0.02em;
  margin:0;
}
.mono{ font-family:var(--font); font-variant-numeric:tabular-nums; }
a{color:inherit;}
button{font-family:inherit;}

/* =========================================================
   레이아웃
   ========================================================= */
#app.wrap{padding-top:0;}

.topbar{
  display:flex;align-items:baseline;justify-content:space-between;
  margin-bottom:22px;flex-wrap:wrap;gap:10px;
}
.topbar .brand{display:flex;align-items:baseline;gap:10px;}
.topbar h1{font-size:26px;}
.topbar .sub{color:var(--muted);font-size:13px;}
.topbar .actions{display:flex;gap:8px;align-items:center;}
.ghost-btn{
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);
  border-radius:100px;padding:7px 14px;font-size:12.5px;cursor:pointer;
  transition:.15s ease;
}
.ghost-btn:hover{border-color:var(--ink);color:var(--ink);}

/* =========================================================
   카드 / 공용 컴포넌트
   ========================================================= */
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-m);
  box-shadow:var(--shadow-card);
  min-width:0;
}
.grid{display:grid;gap:16px;min-width:0;}
.grid > *{min-width:0;}
.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:18px;}
@media (max-width:800px){.kpis{grid-template-columns:repeat(2,1fr);}}

.kpi{padding:18px 20px 16px;}
.kpi.kpi-total{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
.kpi.kpi-total .label{color:var(--accent);font-weight:700;}
.kpi .label{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
.kpi .value{font-family:var(--font);font-size:25px;font-weight:600;margin-top:6px;white-space:nowrap;}
.kpi .delta{font-size:12px;margin-top:6px;font-weight:600;}
.kpi .delta.up{color:var(--expense);}
.kpi .delta.down{color:var(--income);}
.kpi.income .value{color:var(--income);}
.kpi.expense .value{color:var(--expense);}
.kpi.saving .value{color:var(--saving);}

/* 카드 안에 여러 항목을 "이름 · 금액" 줄로 나열할 때 씀 (전체/지출/카드 현황 등) */
.kpi-rows{margin-top:10px;display:flex;flex-direction:column;}
.kpi-row{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:7px 0; font-size:13.5px;
}
.kpi-row + .kpi-row{border-top:1px dashed var(--line);}
.kpi-row .k{display:flex;align-items:center;gap:7px;color:var(--ink-soft);font-weight:600;}
.kpi-row .k .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.kpi-row .v{font-family:var(--font);font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;}
.kpi-row-clickable{cursor:pointer;border-radius:8px;margin:0 -8px;padding-left:8px;padding-right:8px;transition:background .12s ease;}
.kpi-row-clickable:hover{background:var(--paper);}
.kpi-row-clickable:active{background:var(--line);}

@media (max-width:800px){
  .kpi .value{font-size:19px;}
}
@media (max-width:480px){
  .kpi{padding:14px 14px 12px;}
  .kpi .value{font-size:16px;}
  .kpi-row{font-size:12.5px;padding:6px 0;}
  /* 좁은 화면에서는 "이름 · 금액"을 한 줄에 나란히 두면 이름이 한 글자씩 줄바꿈되므로,
     이름을 위, 금액을 아래로 쌓아 칸 안에 온전히 들어오게 함 */
  .kpi-row{flex-direction:column;align-items:flex-start;gap:2px;}
  .kpi-row .k{white-space:nowrap;}
  /* 터치 탭 대상은 44px 이상 권장 — 좌우 패딩은 유지하되 위아래 여백을 늘려 탭하기 쉽게 함 */
  .kpi-row-clickable{padding-top:9px;padding-bottom:9px;}
}

.section{margin-bottom:26px;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.section-head h2{font-size:18px;}
.section-head .hint{font-size:12px;color:var(--muted);}

.two-col{grid-template-columns:1.3fr 1fr;}
@media (max-width:900px){.two-col{grid-template-columns:1fr;}}

/* ---- 뱃지 ---- */
.badge{
  display:inline-block;padding:2px 9px;border-radius:100px;font-size:11px;font-weight:700;
}
.badge.income{background:var(--income-soft);color:var(--income);}
.badge.expense{background:var(--expense-soft);color:var(--expense);}
.badge.saving{background:var(--saving-soft);color:var(--saving);}
.badge.invest{background:var(--invest-soft);color:var(--invest);}
.badge.fixed-badge{background:var(--invest-soft);color:var(--invest);font-size:10px;padding:1px 7px;vertical-align:middle;}
.fixed-tag{font-size:10px;color:var(--invest);font-weight:700;margin-left:3px;}

/* ---- 정기 자동이체 "예정"(아직 활성화 전) 행: 현대카드 결제 예정 배지와 같은 개념으로,
   흐리게 표시하고 눌러서 이번 달 예정 금액만 조정할 수 있게 함 ---- */
.tx-row-pending{opacity:.55;cursor:pointer;}
.tx-row-pending:hover{opacity:.85;}
.pending-badge{
  display:inline-block;font-size:9.5px;font-weight:700;color:var(--muted);
  border:1px solid var(--line-strong);border-radius:100px;padding:1px 6px;margin-left:5px;vertical-align:middle;
}

/* =========================================================
   달력 (지출 히트맵)
   ========================================================= */
.cal-card{padding:18px;min-width:0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px;min-width:0;}
.cal-dow{font-size:11px;color:var(--muted);text-align:center;font-weight:700;padding-bottom:4px;}
.cal-cell{
  aspect-ratio:1/0.82;border-radius:8px;border:1px solid var(--line);
  padding:6px 7px;position:relative;background:var(--paper);
  display:flex;flex-direction:column;justify-content:space-between;
  min-width:0;overflow:hidden;
}
.cal-cell.empty{border:none;background:transparent;}
.cal-cell .d{font-size:11px;color:var(--muted);font-weight:600;}
.cal-cell .amt{font-size:10.5px;font-weight:700;color:var(--expense);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-cell .amt.card-bill-pending{color:var(--muted);font-weight:600;opacity:.75;}
.cal-cell.today{border:1.5px solid var(--ink);}
.cal-legend{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:11px;color:var(--muted);}
.cal-legend .sw{width:12px;height:12px;border-radius:3px;}
@media (max-width:480px){
  .cal-grid{gap:3px;}
  .cal-cell{padding:4px 2px;}
  .cal-cell .d{font-size:10px;}
  .cal-cell .amt{font-size:9px;}
  .cal-dow{font-size:10px;}
}

/* =========================================================
   카테고리 리스트업 (바 형태)
   ========================================================= */
.cat-list-card{padding:18px;}
.cat-tabs{display:flex;gap:6px;margin-bottom:14px;}
.cat-tab{
  border:1px solid var(--line-strong);background:var(--surface);border-radius:100px;
  padding:5px 12px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;
}
.cat-tab.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.cat-row{margin-bottom:10px;}
.cat-row .top{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;margin-bottom:4px;}
.cat-row .top .name{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cat-row .top .name .sub{color:var(--muted);font-weight:400;margin-left:4px;}
.cat-row .top .amt{font-family:var(--font);white-space:nowrap;flex-shrink:0;}
.bar-track{height:7px;border-radius:100px;background:var(--line);overflow:hidden;}
.bar-fill{height:100%;border-radius:100px;}

/* =========================================================
   테이블 (거래 내역)
   ========================================================= */
.table-card{padding:0;overflow:hidden;}
.table-toolbar{
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
  padding:16px 18px;border-bottom:1px solid var(--line);
}
.table-toolbar .filters{display:flex;gap:6px;flex-wrap:wrap;}
.chip{
  border:1px solid var(--line-strong);background:var(--surface);border-radius:100px;
  padding:5px 11px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;
}
.chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

.tx-form{
  display:grid;grid-template-columns: 80px 112px 60px 92px 92px 1fr 112px 136px 40px;
  gap:8px;padding:14px 18px;background:var(--paper);border-bottom:1px solid var(--line);
  align-items:center;
}
/* 정기 자동이체 추가 폼: 날짜(수입/지출 없이 매월 며칠) 기준이라 컬럼 구성이 달라서 따로 둠 */
.tx-form-recur{grid-template-columns:56px 84px 1fr 1fr 1fr 90px 120px 40px;}
.tx-form input, .tx-form select{
  width:100%;height:34px;border:1px solid var(--line-strong);border-radius:8px;padding:0 8px;
  font-size:12.5px;font-family:inherit;background:var(--surface);color:var(--ink);
  min-width:0;box-sizing:border-box;overflow:hidden;
}
/* 사파리/아이패드에서 type=date 입력이 그리드 칸 너비를 무시하고 원래 크기대로
   렌더링되면서 옆 칸(결제수단 등)과 겹쳐 보이는 문제 방지용 방어 스타일.
   + 사파리에서는 select와 달리 화살표/버튼처럼 보이는 표시가 전혀 없어서
   포맷이 혼자 튀어 보이므로, select와 통일감 있게 달력 아이콘을 붙여줌 */
.tx-form input[type=date]{
  min-width:0;max-width:100%;
  -webkit-appearance:none;appearance:none;
  padding-right:26px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%236b6a63' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='4' width='18' height='18' rx='2'/><line x1='16' y1='2' x2='16' y2='6'/><line x1='8' y1='2' x2='8' y2='6'/><line x1='3' y1='10' x2='21' y2='10'/></svg>");
  background-repeat:no-repeat;
  background-position:right 8px center;
  background-size:14px 14px;
}
.tx-form input[type=date]::-webkit-datetime-edit{
  overflow:hidden;
}
.tx-form input[type=date]::-webkit-calendar-picker-indicator{
  /* width/height:100%+position:absolute를 썼더니 사파리에서 이 투명 클릭영역이
     인풋 범위를 벗어나 같은 줄 전체를 덮어버려서, 다른 필드를 눌러도 전부
     날짜 피커만 열리는 심각한 버그가 있었음 → 절대 크기를 키우지 않고 opacity만 낮춤 */
  opacity:0;
}
.tx-form .add-btn{
  background:var(--accent);color:#fff;border:none;border-radius:8px;
  height:32px;font-weight:700;cursor:pointer;font-size:18px;line-height:1;
}
.tx-form .add-btn:hover{opacity:.85;}

.payment-toggle{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:0 18px 14px;background:var(--paper);border-bottom:1px solid var(--line);
}
.payment-toggle-label{font-size:11px;color:var(--muted);font-weight:700;margin-right:2px;}
.pay-chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}

table.tx-table{width:100%;border-collapse:collapse;font-size:13px;}
table.tx-table th{
  text-align:left;font-size:11px;color:var(--muted);font-weight:700;
  padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;
}
table.tx-table td{padding:9px 10px;border-bottom:1px solid var(--paper-line);vertical-align:middle;}
table.tx-table tbody tr:hover{background:var(--paper);}
table.tx-table td.amt{font-family:var(--font);text-align:right;white-space:nowrap;}
table.tx-table td.amt.expense{color:var(--expense);}
table.tx-table td.amt.income{color:var(--income);}
table.tx-table td.amt.saving{color:var(--saving);}
table.tx-table td.amt.invest{color:var(--invest);}

/* ---- 거래 내역: 날짜별 묶음 헤더(그 날 지출 합계 표시) ---- */
table.tx-table-main tr.tx-date-header td{
  border-bottom:none;padding:14px 18px 6px;background:transparent;
  display:flex;justify-content:space-between;align-items:baseline;
  width:100%;box-sizing:border-box;
}
table.tx-table-main tr.tx-date-header:first-child td{padding-top:4px;}
table.tx-table-main tr.tx-date-header span{font-size:12.5px;color:var(--muted);font-weight:700;}
table.tx-table-main tr.tx-date-header .tx-date-total{color:var(--ink-soft);}

/* 거래내역 표(tx-table-main) 컬럼 폭 최적화 */
table.tx-table-main{table-layout:fixed;}
table.tx-table-main th:nth-child(1),table.tx-table-main td:nth-child(1){width:92px;}   /* 구분 */
table.tx-table-main th:nth-child(2),table.tx-table-main td:nth-child(2){width:60px;}   /* 날짜 */
table.tx-table-main th:nth-child(3),table.tx-table-main td:nth-child(3){width:50px;}   /* 대분류 */
table.tx-table-main th:nth-child(4),table.tx-table-main td:nth-child(4){width:76px;}   /* 중분류 */
table.tx-table-main th:nth-child(5),table.tx-table-main td:nth-child(5){width:76px;}   /* 소분류 */
table.tx-table-main th:nth-child(6),table.tx-table-main td:nth-child(6){width:112px;}  /* 내용 (축소) */
table.tx-table-main th:nth-child(7),table.tx-table-main td:nth-child(7){width:144px;}  /* 금액 (확대) */
table.tx-table-main th:nth-child(8),table.tx-table-main td:nth-child(8){width:118px;overflow:visible;}  /* 결제수단 (버튼형) */
table.tx-table-main td{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
table.tx-table-main td.mono{font-variant-numeric:tabular-nums;}
.pay-quick-select{
  width:100%;border:1px solid var(--line-strong);border-radius:100px;padding:4px 6px;
  font-size:11px;font-family:inherit;background:var(--surface);color:var(--ink-soft);
  cursor:pointer;
}
.pay-quick-select:hover{border-color:var(--accent);color:var(--ink);}

.row-actions{display:flex;gap:4px;}
.icon-btn{
  border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;
  padding:2px 5px;border-radius:5px;
}
.icon-btn:hover{background:var(--line);color:var(--ink);}
.empty-row td{text-align:center;color:var(--muted);padding:30px;font-size:13px;}
tr.scope-divider td{
  background:var(--paper);font-weight:800;font-size:13px;
  padding:10px;border-top:2px solid var(--ink);border-bottom:1px solid var(--line-strong);
}

/* =========================================================
   리뷰 메모
   ========================================================= */
.review-card{padding:18px;}
.review-card textarea{
  width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;
  padding:12px;font-family:'Inter',sans-serif;font-size:13px;resize:vertical;
  background:var(--paper);color:var(--ink);
}
.review-stats{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap;}
.review-stats .item{font-size:12px;color:var(--ink-soft);}
.review-stats .item b{display:block;font-family:var(--font);font-size:17px;color:var(--ink);}
.save-note{font-size:11px;color:var(--muted);margin-top:8px;}

/* ---- 지출 리뷰 카드(한눈에 보기 쉽게: 헤드라인 한 줄 + 칩 목록으로 분리) ---- */
.review-item{margin-bottom:18px;}
.review-item.review-overall{padding-bottom:14px;border-bottom:1px dashed var(--line);}
.review-headline{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin-top:4px;}
.review-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.review-chip{
  display:inline-flex;align-items:center;gap:3px;
  font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;
}
.review-chip.up{background:var(--expense-soft);color:var(--expense);}
.review-chip.down{background:var(--income-soft);color:var(--income);}
.review-comment{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5;}

/* =========================================================
   Summary 전용
   ========================================================= */
.chart-card{padding:18px;}
.chart-card canvas{max-height:280px;}
.year-switch{display:flex;align-items:center;gap:8px;}
.year-switch button{
  border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;
  width:26px;height:26px;cursor:pointer;color:var(--ink-soft);
}
.year-switch .y{font-family:var(--font);font-weight:700;font-size:16px;min-width:44px;text-align:center;}

.month-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.month-nav .move{
  border:1px solid var(--line-strong);background:var(--surface);border-radius:100px;
  padding:6px 14px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink-soft);
}
.month-nav h1{font-size:24px;}

}
.pill-note{

/* ---- 연도 선택 드롭다운: "우리집 가계부" 제목 옆에 인라인으로 표시 ---- */
.year-select{position:relative;flex:0 0 auto;}

}

.year-item{

/* ---- 거래 내역: 클릭해서 수정 ---- */
table.tx-table tbody tr.tx-row{cursor:pointer;}
table.tx-table tbody tr.tx-row:hover{background:var(--paper);}

table.tx-table tbody tr.tx-row-editing td{border-bottom:none;}
tr.edit-row{background:var(--paper);}
tr.edit-row td{padding:12px 10px;}
.tx-edit-form{
  display:grid;grid-template-columns:88px 118px 68px 104px 104px 1fr 96px 118px auto;gap:8px;align-items:center;
}
.tx-edit-form input, .tx-edit-form select{
  width:100%;height:34px;border:1px solid var(--line-strong);border-radius:8px;padding:0 8px;
  font-size:12.5px;font-family:inherit;background:var(--surface);color:var(--ink);
  min-width:0;box-sizing:border-box;overflow:hidden;
}
.tx-edit-form input[type=date]{
  min-width:0;max-width:100%;
  -webkit-appearance:none;appearance:none;
  padding-right:26px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%236b6a63' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='4' width='18' height='18' rx='2'/><line x1='16' y1='2' x2='16' y2='6'/><line x1='8' y1='2' x2='8' y2='6'/><line x1='3' y1='10' x2='21' y2='10'/></svg>");
  background-repeat:no-repeat;
  background-position:right 8px center;
  background-size:14px 14px;
}
.tx-edit-form input[type=date]::-webkit-datetime-edit{
  overflow:hidden;
}
.tx-edit-form input[type=date]::-webkit-calendar-picker-indicator{
  opacity:0;
}
.edit-actions{display:flex;gap:6px;}
.fixed-field{
  display:flex;align-items:center;height:100%;
  border:1px dashed var(--line-strong);border-radius:8px;padding:7px 8px;
  font-size:12px;color:var(--muted);background:var(--paper);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ghost-btn.danger{color:var(--expense);border-color:var(--expense);}
.ghost-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}

/* ---- 예산 ---- */
.budget-input{
  width:100%;margin-top:5px;border:1px solid var(--line-strong);border-radius:8px;padding:6px 8px;
  font-size:12.5px;font-family:var(--font);background:var(--paper);color:var(--ink);
}
.budget-card{padding:16px 18px;cursor:pointer;display:flex;flex-direction:column;gap:6px;justify-content:center;height:100%;}
.budget-card .budget-top{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;color:var(--ink-soft);}
.budget-card .budget-top .hint{font-size:11.5px;color:var(--muted);font-weight:600;}
.budget-card .budget-value{font-family:var(--font);font-size:19px;font-weight:700;}
.budget-card .budget-value.muted{color:var(--muted);font-size:14px;font-weight:600;}

/* ---- 상단 요약(지출/수입 큰 숫자) ---- */
.summary-strip{display:flex;gap:28px;flex-wrap:wrap;padding:16px 18px;}
.summary-strip .item{display:flex;flex-direction:column;gap:3px;}
.summary-strip .item .k{font-size:12.5px;color:var(--muted);font-weight:600;}
.summary-strip .item .v{font-family:var(--font);font-size:23px;font-weight:800;}
.summary-strip .item.expense .v{color:var(--ink);}
.summary-strip .item.income .v{color:var(--income);}

/* ---- 카테고리별 지출 도넛 ---- */
.donut-wrap{display:flex;justify-content:center;padding:6px 0 8px;}
.donut-wrap canvas{max-width:200px;max-height:200px;}
.cat-dot-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:13px;border-bottom:1px dashed var(--line);}
.cat-dot-row:last-child{border-bottom:none;}
.cat-dot-row .left{display:flex;align-items:center;gap:8px;color:var(--ink-soft);font-weight:600;min-width:0;}
.cat-dot-row .left .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.cat-dot-row .left .pct{color:var(--muted);font-weight:500;font-size:12px;flex-shrink:0;}
.cat-dot-row .amt{font-family:var(--font);font-weight:700;flex-shrink:0;}

/* ---- 고정 지출(정기 자동이체) 요약 카드 ---- */
.fixed-spend-rows{display:flex;flex-direction:column;gap:2px;margin:6px 0 12px;}
.fixed-spend-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line);}
.fixed-spend-row:last-child{border-bottom:none;}
.fixed-spend-row .k{color:var(--ink-soft);font-weight:600;}
.fixed-spend-row .v{font-family:var(--font);font-weight:700;}

/* ---- 지출 속도 차트 하단 요약 ---- */
.pace-stats{display:flex;flex-direction:column;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);}
.pace-stat-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;}
.pace-stat-row .k{color:var(--ink-soft);font-weight:600;}
.pace-stat-row .v{font-family:var(--font);font-weight:700;}
.pace-pill{margin-top:10px;font-size:12.5px;font-weight:700;padding:9px 12px;border-radius:10px;text-align:center;}
.pace-pill.less{background:var(--income-soft);color:var(--income);}
.pace-pill.more{background:var(--expense-soft);color:var(--expense);}
.compare-select{

.auto-review-list{margin:0 0 14px;padding-left:0;list-style:none;}
.auto-review-list li{

}
.auto-review-list li:last-child{border-bottom:none;}
.auto-review-list b{color:var(--ink);}
.auto-review-list li{cursor:pointer;}
.auto-review-list li:hover{background:var(--paper);border-radius:6px;padding-left:6px;}

/* ---- 클릭으로 필터링 ---- */
.filter-link{cursor:pointer;border-bottom:1px dotted var(--line-strong);}
.filter-link:hover{color:var(--ink);border-bottom-color:var(--ink);}
.chip.sub{font-size:11.5px;padding:4px 10px;}
.note-search{

}
@media (max-width:480px){

     공간이 부족하면 그 줄 오른쪽에 붙은 채로 다음 줄로 자연스럽게 넘어가게 함 */

}

/* ---- 캘린더 셀 클릭 ---- */
.cal-cell{cursor:pointer;transition:.12s ease;}
.cal-cell:hover{border-color:var(--ink);}
.cal-cell.empty{cursor:default;}
.cal-cell.empty:hover{border-color:transparent;}

/* ---- 모달 ---- */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(32,36,31,0.45);z-index:1000;
  align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.open{display:flex;}
#authOverlay{
  background:var(--bg);
  z-index:10000;
}
.modal-card{
  background:var(--surface);border-radius:var(--radius-l);max-width:560px;width:100%;
  max-height:85vh;overflow-y:auto;padding:28px;position:relative;box-shadow:var(--shadow-card);
}
.modal-close{
  position:absolute;top:16px;right:16px;border:none;background:var(--paper);width:28px;height:28px;
  border-radius:50%;cursor:pointer;color:var(--ink-soft);font-size:13px;line-height:1;
}
.modal-close:hover{background:var(--line);}
.modal-card h3{font-size:19px;padding-right:30px;}
.modal-sub{color:var(--muted);font-size:12.5px;margin:4px 0 16px;}
.modal-narrative{
  font-size:13px;line-height:1.75;color:var(--ink-soft);background:var(--paper);
  border-radius:10px;padding:14px 16px;margin-bottom:18px;
}
.modal-section-label{font-size:11.5px;font-weight:700;color:var(--muted);margin:16px 0 8px;}
.modal-tx-list{list-style:none;padding:0;margin:0;}
.modal-tx-list li{
  display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12.5px;
}
.modal-tx-list li:last-child{border-bottom:none;}
.modal-tx-list .n{flex:1;color:var(--ink-soft);}
.modal-tx-list .a{font-family:var(--font);font-weight:600;white-space:nowrap;}

/* =========================================================
   모바일/태블릿 최적화 (폰·태블릿 화면에서 거래내역 표를 카드형 리스트로 전환.
   아이패드 세로/가로 모두 포함하도록 1080px까지 적용 — review.html과 동일 기준)
   ========================================================= */
@media (max-width:1080px){
  #app{padding:20px 14px 60px;}
  .topbar{align-items:flex-start;}
  .kpis{grid-template-columns:repeat(2,1fr);}
  .month-nav h1{font-size:19px;}

  .tx-form{
    grid-template-columns:1fr 1fr 1fr;padding:12px;gap:6px 8px;
    grid-template-areas:
      "scope date pay"
      "type main cat"
      "note note amount"
      "btn btn btn";
  }
  .tx-form #f_scope{grid-area:scope;}
  .tx-form #f_date{grid-area:date;}
  .tx-form #f_payment{grid-area:pay;}
  .tx-form #f_type{grid-area:type;}
  .tx-form #f_main{grid-area:main;}
  .tx-form #f_category{grid-area:cat;}
  .tx-form #f_note{grid-area:note;}
  .tx-form #f_amount{grid-area:amount;}
  .tx-form .add-btn{grid-area:btn;width:100%;height:38px;font-size:13px;font-weight:700;}
  .tx-form select, .tx-form input{font-size:11.5px;height:32px;padding:0 6px;}

  /* 정기 자동이체 추가 폼: 1줄(일·구분·중분류·소분류 4칸) + 2줄(내용·금액·결제수단 3칸) +
     3줄(추가 버튼) — 12칸 그리드로 나눠서 각 줄이 원하는 칸 수로 딱 맞게 배치되게 함 */
  .tx-form-recur{
    grid-template-areas:none;
    grid-template-columns:repeat(12,1fr);
  }
  .tx-form-recur #rc_day, .tx-form-recur #rc_scope,
  .tx-form-recur #rc_main, .tx-form-recur #rc_category{grid-column:span 3;}
  .tx-form-recur #rc_note, .tx-form-recur #rc_amount,
  .tx-form-recur #rc_payment{grid-column:span 4;}
  .tx-form-recur .add-btn{grid-row:auto;grid-column:1/-1;width:100%;height:38px;font-size:13px;font-weight:700;}

  .tx-edit-form{
    grid-template-columns:1fr 1fr 1fr;gap:6px 8px;
    grid-template-areas:
      "scope date pay"
      "type main cat"
      "note note amount"
      "actions actions actions";
  }
  .tx-edit-form .tx-edit-scope{grid-area:scope;}
  .tx-edit-form .tx-edit-date{grid-area:date;}
  .tx-edit-form .tx-edit-pay{grid-area:pay;}
  .tx-edit-form .tx-edit-type{grid-area:type;}
  .tx-edit-form .tx-edit-main{grid-area:main;}
  .tx-edit-form .tx-edit-cat{grid-area:cat;}
  .tx-edit-form .tx-edit-note{grid-area:note;}
  .tx-edit-form .tx-edit-amount{grid-area:amount;}
  .tx-edit-form .tx-edit-actions{grid-area:actions;}
  .tx-edit-form select, .tx-edit-form input{font-size:11.5px;height:32px;padding:0 6px;}
  .edit-actions{justify-content:flex-end;}

  table.tx-table.tx-table-main thead{display:none;}
  table.tx-table.tx-table-main,
  table.tx-table.tx-table-main tbody,
  table.tx-table.tx-table-main tr,
  table.tx-table.tx-table-main td{display:block;width:100%;}

  /* 폰 화면에서는 8칸짜리 desktop 행은 숨기고, 아이콘이 있는 리스트형 mobile 행만 보여줌
     (뱅크샐러드 스타일 — 낱개 박스가 아니라 점선 구분선으로만 나뉜 리스트) */
  table.tx-table.tx-table-main tr.tx-row-desktop{display:none;}
  table.tx-table.tx-table-main tr.tx-row-mobile{
    border-bottom:1px dashed var(--line);
    padding:12px 18px;
  }
  table.tx-table.tx-table-main tr.tx-row-mobile:last-child{border-bottom:none;}
  table.tx-table.tx-table-main tr.tx-row-mobile td{padding:0;border-bottom:none;}
  .tx-card-line1{display:flex;align-items:center;gap:11px;}
  .tx-card-icon{
    width:27px;height:27px;border-radius:50%;flex-shrink:0;
    background:var(--paper);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);
  }
  .tx-card-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .tx-card-title{font-size:14.5px;font-weight:700;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tx-card-title .fixed-tag{font-weight:500;margin-left:2px;}
  .tx-card-sub{
    color:var(--muted);font-size:11.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    display:flex;align-items:center;
  }
  .tx-card-amt{font-size:14.5px;font-weight:700;flex-shrink:0;}
  .tx-card-sub .pay-quick-select{
    width:auto;max-width:96px;border:none;background:transparent;color:var(--muted);
    font-size:11.5px;padding:0;
  }

  table.tx-table.tx-table-main tr.empty-row{border:none;padding:0;}
  table.tx-table.tx-table-main tr.empty-row td{display:block;text-align:center;padding:24px 0;}
  table.tx-table.tx-table-main tr.edit-row{border:1px solid var(--line-strong);border-radius:var(--radius-s);margin-bottom:8px;}
  table.tx-table.tx-table-main tr.edit-row td{display:block;padding:10px;}
}
@media (min-width:1081px){
  table.tx-table.tx-table-main tr.tx-row-mobile{display:none;}
  /* PC 버전 테이블에도 구분 아이콘 추가 */
  .tx-scope-badge{

  }
  .tx-scope-icon{
    width:24px;height:24px;border-radius:50%;flex-shrink:0;
    background:var(--paper);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-soft);
  }
}

<script src="./nav.js?v=6"></script>
<div id="app" class="wrap"></div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this) closeModal()">
  <div class="modal-card">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<!-- 로그인 게이트: index.html과 동일한 Supabase Auth 계정을 사용합니다.
     세션이 없으면 이 화면이 앱을 완전히 가리고, 닫기 버튼도 없습니다. -->
<div class="modal-overlay open" id="authOverlay">
  <div class="modal-card" style="max-width:340px;">
    <div class="display" style="font-size:19px;margin-bottom:4px;">로그인</div>
    <p style="font-size:12.5px;color:var(--muted);margin:0 0 16px;">등록된 사용자만 접속할 수 있습니다.</p>
    <div style="margin-bottom:12px;">
      <label style="display:block;font-size:12px;color:var(--muted);margin-bottom:5px;">아이디</label>
      <input type="text" id="authId" placeholder="아이디 입력" autocomplete="username"
             style="width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:9px 10px;font-size:13.5px;font-family:inherit;box-sizing:border-box;">
    </div>
    <div style="margin-bottom:16px;">
      <label style="display:block;font-size:12px;color:var(--muted);margin-bottom:5px;">비밀번호</label>
      <input type="password" id="authPw" placeholder="비밀번호" autocomplete="current-password"
             onkeydown="if(event.key==='Enter') authLogin()"
             style="width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:9px 10px;font-size:13.5px;font-family:inherit;box-sizing:border-box;">
    </div>
    <button class="ghost-btn primary" style="width:100%;justify-content:center;display:flex;" onclick="authLogin()">로그인</button>
    <div id="authMsg" style="font-size:11.5px;color:var(--muted);margin-top:10px;text-align:center;"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script src="./common.js"></script>
<script>
/* =================================================================================
   -1. 로그인 게이트 (index.html과 동일한 Supabase Auth 계정 사용)
   ---------------------------------------------------------------------------------
   실제 가계부 데이터(거래내역, 정기 자동이체, 예산 등)도 Supabase에 저장되어
   로그인한 모든 기기·계정에서 동일하게 보입니다 (기기별 localStorage가 아닙니다).
   Supabase 로그인은 index.html과 같은 계정 체계를 그대로 재사용합니다.
   ================================================================================= */
let sb = null;
try{
  if(typeof supabase === 'undefined'){
    throw new Error('Supabase 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해주세요.');
  }
  if(!window.SUPABASE_URL || !window.SUPABASE_ANON_KEY || !window.COUPLE_EMAIL_DOMAIN){
    throw new Error('supabase-config.js를 찾을 수 없거나 설정이 비어있어요. index.html과 같은 폴더에 있는지 확인해주세요.');
  }
  sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY, {
    auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true }
  });
}catch(err){
  document.getElementById('authOverlay').querySelector('.modal-card').innerHTML =
    `<div class="display" style="font-size:17px;color:var(--expense);margin-bottom:8px;">연결에 문제가 생겼어요</div>
     <div style="font-size:12.5px;color:var(--muted);line-height:1.6;">${err.message}</div>`;
}

function authIdToEmail(id){
  return `${id.trim().toLowerCase()}@${window.COUPLE_EMAIL_DOMAIN}`;
}
async function authLogin(){
  if(!sb) return;
  const id = document.getElementById('authId').value.trim();
  const pw = document.getElementById('authPw').value;
  const msg = document.getElementById('authMsg');
  if(!id || !pw){ alert('아이디와 비밀번호를 입력해주세요.'); return; }
  msg.textContent = '로그인 중...';
  const { error } = await sb.auth.signInWithPassword({ email: authIdToEmail(id), password: pw });

let _appBooted = false;
async function bootApp(){
  if(_appBooted) return;
  _appBooted = true;
  document.getElementById('app').innerHTML = '<div style="padding:60px 0;text-align:center;color:var(--muted);">데이터를 불러오는 중...</div>';
  try{
    await migrateLocalStorageToSupabase();
    await DB.init();
  }catch(err){
    console.error('데이터 로드 실패:', err);
    document.getElementById('app').innerHTML = `<div style="padding:60px 20px;text-align:center;color:var(--muted);font-size:13px;">데이터를 불러오지 못했어요.<br>${err.message||err}<br><br>새로고침해보세요.</div>`;
    return;
  }
  seedIfEmpty();
  initRecurringTemplatesIfEmpty();
  migrateFamilyCategory();
  migrateLegacyBucketMains();
  cleanupRecurringBeforeAug();
  cleanupFutureRecurring();
  applyManualAdditions();
  route();
}

async function initAuth(){
  if(!sb) return; // 설정 오류 시 로그인 화면에 에러만 보여주고 앱은 절대 열지 않음
  const { data: { session } } = await sb.auth.getSession();
  if(session){ authHide(); bootApp(); } else { authShow(); }
  sb.auth.onAuthStateChange((event, session)=>{
    if(session){ authHide(); bootApp(); } else { authShow(); }
  });
}

/* ---- 미지정(구분 없음) 거래 일괄 자동 분류 ----
   완벽하진 않을 수 있어 1차 정리용입니다. 실행 후 사람이 직접 확인/수정하는 걸 전제로 합니다. */
function guessScope(t){
  const note = t.note || '';
  if(/보라/.test(note)) return '보라';
  if(/(^|[^가-힣])관([^가-힣]|$)/.test(note)) return '관';

  const jointOnlyMains = ['주거비', '가족'];
  if(jointOnlyMains.includes(t.main)) return '공동';

  const personalOnlyMains = ['건강', '경조사'];
  if(personalOnlyMains.includes(t.main)){
    const meta = t.payment ? PAYMENT_META[t.payment] : null;
    if(meta && meta.person) return meta.person;
    return '보라';
  }

  if(t.type === '수입'){
    const meta = t.payment ? PAYMENT_META[t.payment] : null;
    if(meta && meta.person) return meta.person;
    return '보라';
  }

  const meta = t.payment ? PAYMENT_META[t.payment] : null;
  if(meta && meta.person) return meta.person;
  return '공동';
}

function bulkAutoAssignScope(){
  const targets = DB.list().filter(t => !t.scope);
  if(!targets.length){ alert('미지정 거래가 없어요.'); return; }
  if(!confirm(`미지정 거래 ${targets.length}건을 자동 분류할까요?\n완벽하지 않을 수 있어요 — 분류 후 하나씩 확인해서 고쳐주세요.`)) return;
  targets.forEach(t => DB.update(t.id, { scope: guessScope(t) }));
  alert(`${targets.length}건을 분류했어요. 화면에서 확인해보세요.`);

}

// 식비/외식은 "카페 아니면 식당"으로 보고, 내용(note)에서 카페 관련 키워드를 찾아
// 없으면 기본으로 식당 아이콘을 씀(대부분 식당이라서). 카테고리 선택(드롭다운)은 그대로
// "식비" 하나뿐이라 매번 새로 입력해도 자동으로 적용됨.
const CAFE_KEYWORDS = ["카페","커피","스타벅스","이디야","투썸","컴포즈","빽다방","커피빈","메가커피","커피숍","카페인","cafe","coffee"];
function categoryIcon(t){
  const category = t.category || '';
  if(category === '식비' || category === '외식'){
    const note = (t.note || '').toLowerCase();
    const isCafe = CAFE_KEYWORDS.some(k => note.includes(k.toLowerCase()));
    return iconSvg(isCafe ? 'cafe' : 'restaurant');
  }
  const name = CATEGORY_ICON[category] || CATEGORY_ICON[t.main] || (t.type==='수입' ? 'cash' : 'receipt');
  return iconSvg(name);
}
function guessCategory(t){
  if(!t.main) return '';
  const note = (t.note || '').toLowerCase();
  const rules = CATEGORY_KEYWORDS[t.main];
  if(rules){
    for(const [cat, keywords] of rules){
      if(keywords.some(k => note.includes(k))) return cat;
    }
  }
  return '기타';
}

/* 학습 기반 자동 분류: 과거 거래 내역의 note 패턴을 학습해서 유사한 거래를 자동 분류 */
function learnFromHistory(target){
  const note = (target.note || '').toLowerCase().trim();
  if(!note) return null;

  // 이미 분류된 거래들에서 학습
  const learned = DB.list().filter(t =>
    t.id !== target.id && t.scope && t.main && t.category && t.note
  );

  // note에서 가장 긴 공통 부분 찾기 (최소 3글자 이상)
  let bestMatch = null;
  let bestScore = 0;

  learned.forEach(past => {
    const pastNote = (past.note || '').toLowerCase().trim();

    // 완전 일치 (공백/특수문자 제거 후)
    const cleanTarget = note.replace(/[^\wㄱ-ㅎㅏ-ㅣ가-힣]/g, '');
    const cleanPast = pastNote.replace(/[^\wㄱ-ㅎㅏ-ㅣ가-힣]/g, '');
    if(cleanTarget && cleanPast && cleanTarget === cleanPast){
      bestMatch = past;
      bestScore = 100;
      return;
    }

    // 부분 일치 (3글자 이상)
    const words = pastNote.split(/\s+/).filter(w => w.length >= 3);
    words.forEach(word => {
      if(note.includes(word)){
        const score = word.length;
        if(score > bestScore){
          bestScore = score;
          bestMatch = past;
        }
      }
    });
  });

  // 최소 3점 이상일 때만 학습 결과 반환
  if(bestScore >= 3 && bestMatch){
    return {
      scope: bestMatch.scope,
      main: bestMatch.main,
      category: bestMatch.category,
      payment: bestMatch.payment,
      matchedNote: bestMatch.note,
      score: bestScore
    };
  }

  return null;
}

  targets.forEach(t => DB.update(t.id, { category: guessCategory(t) }));

}

/* 미지정 항목 전체 자동 분류 (scope, main, category, payment 모두) */
function bulkAutoClassifyAll(){
  const targets = DB.list().filter(t => !t.scope || !t.main || !t.category);
  if(!targets.length){ alert('미지정 거래가 없어요.'); return; }

  let learnedCount = 0;
  let keywordCount = 0;

  if(!confirm(`미지정 거래 ${targets.length}건을 자동 분류할까요?\n과거 거래 패턴을 학습해서 자동으로 분류해요.`)) return;

  targets.forEach(t => {
    const learned = learnFromHistory(t);
    if(learned){
      DB.update(t.id, {
        scope: learned.scope,
        main: learned.main,
        category: learned.category,
        payment: t.payment || learned.payment  // 결제수단이 없으면 학습된 것 사용
      });
      learnedCount++;
    } else if(!t.category && t.main){
      // 학습 실패 시 키워드 기반으로 시도
      DB.update(t.id, { category: guessCategory(t) });
      keywordCount++;
    }
  });

  alert(`${learnedCount}건 학습 분류, ${keywordCount}건 키워드 분류 완료!\n화면에서 확인 후 틀린 것만 수정하세요.`);
  render();
}

/* 신용카드 결제수단 p의 ym월 사용 총액. CREDIT_CARD_BASE_OVERRIDES에 예외가 있으면
   anchor 날짜 이전 개별 거래는 무시하고 base 금액으로 갈음한 뒤, anchor 이후
   거래만 그 위에 더합니다(없으면 평소처럼 그 달 전체를 그대로 합산). */
function creditCardMonthTotal(list, payment, ym){
  const cutoffExclusive = shiftYm(ym,1) + '-01';
  const override = CREDIT_CARD_BASE_OVERRIDES[`${payment}|${ym}`];
  const rangeStart = override ? override.anchor : (ym + '-01');
  const base = override ? override.amount : 0;
  const sum = list
    .filter(t=>t.payment===payment && t.type==='지출' && t.date >= rangeStart && t.date < cutoffExclusive)
    .reduce((s,t)=>s+Number(t.amount||0), 0);
  return base + sum;
}

/* ym월에 신용카드로 쓴 지출을 실소유자(person) 기준으로 합산합니다.
   (익월 12일 청구일에 "전체" 잔액에서만 차감할 때 씀 — PAYMENT_META의 type을 보고
   판단하므로, 신용카드가 늘어도 이름을 따로 하드코딩할 필요 없음) */
function creditCardExpenseByScope(list, ym){
  const result = {};
  PAYMENT_METHODS.filter(p => PAYMENT_META[p].type === '신용카드').forEach(p=>{
    const total = creditCardMonthTotal(list, p, ym);
    if(total > 0){
      result[PAYMENT_META[p].person] = (result[PAYMENT_META[p].person]||0) + total;
    }
  });
  return result;
}

/* 신용카드 대금이 결제일(매월 12일)에 같은 사람 명의의 체크카드 계좌에서 자동으로
   빠져나가는 것처럼 "가상 이벤트"를 계산해줍니다. 실제 거래로 저장하지 않고
   그때그때 카드 사용 내역에서 다시 계산하기 때문에, 카드 내역이 바뀌면 대금도
   자동으로 같이 바뀌고, 지출 통계(월별 지출)에는 전혀 영향을 주지 않습니다 —
   1~말일 사용분은 쓴 그 달에 이미 지출로 잡혀 있으므로, 결제되는(다음 달) 달에는
   잔고에서만 빠지고 지출로는 잡히지 않아요. 결제일(12일)이 아직 안 지났으면(오늘
   날짜 기준) 활성화되지 않아 반영되지 않습니다. */
function creditCardBillEvents(payment, rangeStart, rangeEndExclusive){
  const meta = PAYMENT_META[payment];
  if(!meta || meta.type === '신용카드') return [];
  const cards = PAYMENT_METHODS.filter(p => PAYMENT_META[p].type==='신용카드' && PAYMENT_META[p].person===meta.person);
  if(!cards.length) return [];

  const all = DB.list();
  const today = todayStr();
  const events = [];
  let [by, bm] = rangeStart.slice(0,7).split('-').map(Number);
  while(true){
    const billYm = by + '-' + String(bm).padStart(2,'0');
    const billDate = billYm + '-12';
    if(billDate >= rangeEndExclusive) break;
    if(billDate >= rangeStart && billDate <= today){
      const spendYm = shiftYm(billYm, -1);
      const spendByPerson = creditCardExpenseByScope(all, spendYm);
      const amount = spendByPerson[meta.person] || 0;
      if(amount > 0){
        const cardNames = cards.map(c => c.replace(/\[.*?\]/, '')).join('/');
        events.push({ date: billDate, amount, label: `${cardNames} 대금 (${spendYm.slice(5)}월 사용분)` });
      }
    }
    bm += 1; if(bm > 12){ bm = 1; by += 1; }
  }
  return events;
}

/* "전체" 카드(수입/지출/잔액)의 숫자를 계산합니다. renderMonth와 잔액 팝업(openTotalBalanceModal)이
   똑같은 계산식을 공유해야 서로 어긋나지 않아서 여기 한 곳으로 모았습니다. */
function computeTotalSummary(ym){
  const all = DB.list();
  const tx = monthTx(all, ym);
  const income = sumBy(tx,'수입');
  const expense = sumBy(tx,'지출');
  const cashExpense = tx.reduce((s,t)=>{
    if(t.type !== '지출') return s;
    const meta = t.payment ? PAYMENT_META[t.payment] : null;
    if(meta && meta.type === '신용카드') return s;
    return s + Number(t.amount||0);
  }, 0);
  const cardBillMap = (todayStr() >= `${ym}-12`) ? creditCardExpenseByScope(all, shiftYm(ym,-1)) : {};
  const cardBill = Object.values(cardBillMap).reduce((a,b)=>a+b, 0);
  const netIncomeExpense = income - expense;
  const balance = income - cashExpense - cardBill;
  return { income, expense, cashExpense, cardBill, balance, netIncomeExpense };
}

/* 결제수단별 현황 줄을 계산합니다(DOM 조작 없이 데이터만 반환 — "카드 현황" 카드의
   서브라인으로 씀). 신용카드(현대카드)는 보고 있는 달 1일~말일 사용분만 합산해서
   보여주고(달이 바뀌면 0원부터 다시 누적), 체크카드(하나/농협)는 CARD_BALANCE_ANCHOR
   이후 거래만 반영한 실제 잔고를 돌려줍니다(수입은 +, 지출은 -). 이쪽은 계좌
   잔고 성격이라 다음 달로 넘어가도 값이 그대로 이어집니다. */
function buildCardStatusLines(ym){
  const all = DB.list();
  const cutoffExclusive = shiftYm(ym,1) + '-01'; // 보고 있는 달 말일까지만 포함(다음 달 1일 미만)
  // 이름 4글자 + 항목 2글자 + 항목 2글자로 세 줄 길이를 맞춰서 나란히 봤을 때 정돈되어 보이게 함.
  const FULL_NAME = { "현대카드[보라]":"현대카드", "하나[보라]":"하나은행", "농협[관]":"농협은행" };

  return PAYMENT_METHODS.map(p=>{
    const meta = PAYMENT_META[p];
    const name = FULL_NAME[p] || p;

    if(meta.type === '신용카드'){
      const totalSpent = creditCardMonthTotal(all, p, ym);
      return { name, value: won(totalSpent), dotColor: SCOPE_COLOR[meta.person], valueColor:'var(--expense)', payment:p, kind:'card-history' };
    }

    const netChange = all
      .filter(t=>t.payment===p && t.date >= CARD_BALANCE_ANCHOR && t.date < cutoffExclusive)
      .reduce((s,t)=>{
        if(t.type==='지출') return s - Number(t.amount||0);
        if(t.type==='수입') return s + Number(t.amount||0);
        return s;
      }, 0);
    const billTotal = creditCardBillEvents(p, CARD_BALANCE_ANCHOR, cutoffExclusive).reduce((s,e)=>s+e.amount, 0);
    const balance = (CARD_STARTING_BALANCE[p]||0) + netChange - billTotal;
    return { name, value: won(balance), dotColor: SCOPE_COLOR[meta.person], valueColor: balance>=0?'var(--income)':'var(--expense)', payment:p, kind:'card-balance' };
  });
}

   동일하게 DB.list()/getBudgets()/getRecurringTemplates() 등을 "동기"로 호출하고
   (캐시를 읽는 것뿐이라 즉시 반환됩니다), add/update/remove/saveXxx 는 캐시를 먼저
   바꿔 화면에 즉시 반영한 뒤, Supabase에는 결과를 기다리지 않고 던져놓습니다
   (optimistic update). 로그인에 쓰는 Supabase 클라이언트(sb)를 데이터에도 그대로
   재사용합니다 — 별도 설정이 필요 없습니다.
   ================================================================================= */
const DB = {
  _cache: [],          // transactions
  _reviewCache: {},     // { 'YYYY-MM': memo }
  _budgetCache: {},     // { year: { '대분류|카테고리': amount } }
  _recurringCache: null, // [{key,day,scope,main,category,note,amount,payment,endYm}] | null(미초기화)
  _skipCache: [],        // ['key|ym', ...]
  _overrideCache: {},    // { 'key|ym': amount } — 정기 자동이체 예정 금액을 그 달만 다르게 조정했을 때

  async init(){
    const [txRes, reviewRes, budgetRes, recurRes, skipRes, overrideRes] = await Promise.all([
      sb.from('transactions').select('*').order('date'),
      sb.from('monthly_reviews').select('*'),
      sb.from('budgets').select('*'),
      sb.from('recurring_templates').select('*'),
      sb.from('recurring_skips').select('*'),
      sb.from('recurring_overrides').select('*'),
    ]);

    if(!txRes.error && txRes.data){
      this._cache = txRes.data.map(r => ({
        id: r.id, date: r.date, type: r.type, scope: r.scope || '',
        main: r.main || '', category: r.category || '', note: r.note || '',
        amount: r.amount, user: r.user_name || '', payment: r.payment || '',
        recurringKey: r.recurring_key || undefined, manualKey: r.manual_key || undefined
      }));
    } else if(txRes.error){ console.error('거래내역 로드 실패:', txRes.error); throw txRes.error; }

    if(!reviewRes.error && reviewRes.data){
      reviewRes.data.forEach(r => { this._reviewCache[r.month] = r.memo || ""; });
    }

    if(!budgetRes.error && budgetRes.data){
      budgetRes.data.forEach(r => {
        if(!this._budgetCache[r.year]) this._budgetCache[r.year] = {};
        this._budgetCache[r.year][r.category] = r.amount;
      });
    }

    if(!recurRes.error && recurRes.data){
      this._recurringCache = recurRes.data.length ? recurRes.data.map(r => ({
        key: r.key, day: r.day, scope: r.scope, main: r.main, category: r.category,
        note: r.note || '', amount: r.amount, payment: r.payment || '',
        endYm: r.end_ym || undefined
      })) : []; // 빈 배열: "초기화는 됐지만 아직 항목 없음" — null(미초기화)과 구분
    } else if(recurRes.error){ console.error('정기 자동이체 로드 실패:', recurRes.error); }

    if(!skipRes.error && skipRes.data){
      this._skipCache = skipRes.data.map(r => r.token);
    }

    if(!overrideRes.error && overrideRes.data){
      overrideRes.data.forEach(r => { this._overrideCache[r.token] = r.amount; });
    } else if(overrideRes.error){ console.error('정기 자동이체 예정 금액 로드 실패:', overrideRes.error); }
  },

  list(){ return this._cache; },

  // TODO[대용량 시]: 배치 insert로 바꾸면 더 빠름 (지금은 항목 하나씩)
  add(tx){
    const optimisticId = 'temp_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
    const localTx = { ...tx, id: optimisticId };
    this._cache.push(localTx);
    sb.from('transactions').insert({
      date: tx.date, type: tx.type, scope: tx.scope || null, main: tx.main || null,
      category: tx.category || null, note: tx.note || null, amount: tx.amount,
      user_name: tx.user || null, payment: tx.payment || null,
      recurring_key: tx.recurringKey || null, manual_key: tx.manualKey || null
    }).select().single().then(({data, error})=>{
      if(error){ console.error('거래 추가 실패:', error); return; }
      const row = this._cache.find(t=>t.id===optimisticId);
      if(row) row.id = data.id;
    });
    return localTx;
  },

  update(id, patch){
    const row = this._cache.find(t => t.id === id);
    if(row) Object.assign(row, patch);
    const dbPatch = {};
    if('date' in patch) dbPatch.date = patch.date;
    if('type' in patch) dbPatch.type = patch.type;
    if('scope' in patch) dbPatch.scope = patch.scope || null;
    if('main' in patch) dbPatch.main = patch.main || null;
    if('category' in patch) dbPatch.category = patch.category || null;
    if('note' in patch) dbPatch.note = patch.note || null;
    if('amount' in patch) dbPatch.amount = patch.amount;
    if('user' in patch) dbPatch.user_name = patch.user || null;
    if('payment' in patch) dbPatch.payment = patch.payment || null;
    sb.from('transactions').update(dbPatch).eq('id', id).then(({error})=>{
      if(error) console.error('거래 수정 실패:', error);
    });
  },

  remove(id){
    this._cache = this._cache.filter(t => t.id !== id);
    sb.from('transactions').delete().eq('id', id).then(({error})=>{
      if(error) console.error('거래 삭제 실패:', error);
    });
  },

  getReview(ym){
    return this._reviewCache[ym] || "";
  },
  saveReview(ym, memo){
    this._reviewCache[ym] = memo;
    sb.from('monthly_reviews').upsert({ month: ym, memo }).then(({error})=>{
      if(error) console.error('리뷰 저장 실패:', error);
    });
  },

  getBudgets(year){
    return this._budgetCache[year] || {};
  },
  saveBudgets(year, map){
    this._budgetCache[year] = map;
    sb.from('budgets').delete().eq('year', year).then(({error})=>{
      if(error){ console.error('예산 저장 실패(삭제 단계):', error); return; }
      const rows = Object.entries(map).map(([category, amount]) => ({ year, category, amount }));
      if(rows.length) sb.from('budgets').insert(rows).then(({error})=>{ if(error) console.error('예산 저장 실패:', error); });
    });
  },

  getRecurringTemplates(){
    return this._recurringCache;
  },
  saveRecurringTemplates(list){
    this._recurringCache = list;
    sb.from('recurring_templates').delete().neq('key', '__none__').then(({error})=>{
      if(error){ console.error('정기 자동이체 저장 실패(삭제 단계):', error); return; }
      const rows = list.map(t => ({
        key: t.key, day: t.day, scope: t.scope, main: t.main, category: t.category,
        note: t.note || null, amount: t.amount, payment: t.payment || null, end_ym: t.endYm || null
      }));
      if(rows.length) sb.from('recurring_templates').insert(rows).then(({error})=>{ if(error) console.error('정기 자동이체 저장 실패:', error); });
    });
  },

  getRecurringSkips(){
    return this._skipCache;
  },
  addRecurringSkip(key, ym){
    const token = key + '|' + ym;
    if(!this._skipCache.includes(token)){
      this._skipCache.push(token);
      sb.from('recurring_skips').insert({ token }).then(({error})=>{
        if(error) console.error('정기 자동이체 건너뛰기 저장 실패:', error);
      });
    }
  },

  getRecurringOverrides(){
    return this._overrideCache;
  },
  setRecurringOverride(key, ym, amount){
    const token = key + '|' + ym;
    this._overrideCache[token] = amount;
    sb.from('recurring_overrides').upsert({ token, amount }).then(({error})=>{
      if(error) console.error('정기 자동이체 예정 금액 저장 실패:', error);
    });
  },

  reset(){
    // 화면 캐시만 비웁니다. 실제 Supabase 데이터를 지우려면 대시보드에서 직접 삭제하세요.
    this._cache = [];
  }
};

/* =================================================================================
   1-1. 로컬(localStorage) → Supabase 1회 이전
   ---------------------------------------------------------------------------------
   이 브라우저에 예전 버전(localStorage 저장 방식)에서 쌓인 데이터가 있는데
   아직 Supabase의 transactions 테이블이 비어있다면, 딱 한 번 그대로 클라우드로
   올려줍니다. 이미 Supabase에 데이터가 있으면(다른 기기에서 먼저 이전했거나,
   이미 이 브라우저에서 한 번 이전한 경우) 아무 것도 하지 않습니다.
   ================================================================================= */
async function migrateLocalStorageToSupabase(){
  const { count, error: countErr } = await sb.from('transactions').select('*', { count:'exact', head:true });
  if(countErr){ console.error('마이그레이션 확인 실패:', countErr); return; }
  if(count && count > 0) return; // 이미 클라우드에 데이터가 있으면 건너뜀

  const localTx = JSON.parse(localStorage.getItem('gagyebu_v1_transactions') || '[]');
  if(localTx.length){
    const rows = localTx.map(t => ({
      date: t.date, type: t.type, scope: t.scope || null, main: t.main || null,
      category: t.category || null, note: t.note || null, amount: t.amount,
      user_name: t.user || null, payment: t.payment || null,
      recurring_key: t.recurringKey || null, manual_key: t.manualKey || null
    }));
    for(let i=0; i<rows.length; i+=200){
      const { error } = await sb.from('transactions').insert(rows.slice(i, i+200));
      if(error){ console.error('거래내역 이전 실패:', error); }
    }
  }

  const localTemplates = JSON.parse(localStorage.getItem('gagyebu_v1_recurring_templates') || 'null');
  if(localTemplates && localTemplates.length){
    const rows = localTemplates.map(t => ({
      key: t.key, day: t.day, scope: t.scope, main: t.main, category: t.category,
      note: t.note || null, amount: t.amount, payment: t.payment || null, end_ym: t.endYm || null
    }));
    const { error } = await sb.from('recurring_templates').upsert(rows);
    if(error) console.error('정기 자동이체 이전 실패:', error);
  }

  const localSkips = JSON.parse(localStorage.getItem('gagyebu_v1_recurring_skips') || '[]');
  if(localSkips.length){
    const { error } = await sb.from('recurring_skips').upsert(localSkips.map(token => ({ token })));
    if(error) console.error('건너뛰기 목록 이전 실패:', error);
  }

  const budgetRows = [];
  Object.keys(localStorage).filter(k => k.startsWith('gagyebu_v1_budget_')).forEach(k => {
    const year = Number(k.replace('gagyebu_v1_budget_', ''));
    try{
      const map = JSON.parse(localStorage.getItem(k) || '{}');
      Object.entries(map).forEach(([category, amount]) => budgetRows.push({ year, category, amount }));
    }catch(e){}
  });
  if(budgetRows.length){
    const { error } = await sb.from('budgets').upsert(budgetRows);
    if(error) console.error('예산 이전 실패:', error);
  }

  Object.keys(localStorage).filter(k => k.startsWith('gagyebu_v1_review_')).forEach(async k => {
    const month = k.replace('gagyebu_v1_review_', '');
    const memo = localStorage.getItem(k);
    if(memo) await sb.from('monthly_reviews').upsert({ month, memo });
  });
}

const won = n => (Math.round(n||0)).toLocaleString('ko-KR') + '원';
const wonShort = n => {
  n = Math.round(n||0);
  if(Math.abs(n) >= 10000) return (n/10000).toFixed(n%10000===0?0:1) + '만';
  return n.toLocaleString('ko-KR');
};
const pct = n => (isFinite(n) ? n.toFixed(1) : '0.0') + '%';
const ymOf = d => d.slice(0,7);
const daysInMonth = (y,m) => new Date(y, m, 0).getDate();

function monthTx(list, ym){ return list.filter(t => ymOf(t.date) === ym); }
function sumBy(list, type){ return list.filter(t=>t.type===type).reduce((s,t)=>s+Number(t.amount||0),0); }

function prevYm(ym){
  let [y,m] = ym.split('-').map(Number);
  m -= 1; if(m===0){ m=12; y-=1; }
  return y + '-' + String(m).padStart(2,'0');
}
function shiftYm(ym, n){
  let [y,m] = ym.split('-').map(Number);
  m += n;
  while(m<1){ m+=12; y-=1; }
  while(m>12){ m-=12; y+=1; }
  return y + '-' + String(m).padStart(2,'0');
}

function escapeJsAttr(s){
  return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

  SCOPES.forEach(sc=>{

      if(!seen.has(key)){ seen.add(key); arr.push({main,cat}); }
    }));
  });
  return arr;

function catsForMainAllScopes(type, main){

}

  for(let y=min;y<=max;y++) arr.push(y);

  if(DB.list().length > 0) return;
  SEED_DATA.forEach(r => {
    DB.add({
      date: r.date, type: r.type, scope: r.scope || '', main: r.main || '', category: r.category || '',

    });

/* 정기 자동이체 템플릿을 해당 월(ym)에 아직 없으면 자동으로 채워넣습니다.
   연도·월과 무관하게 항상 동작하므로, 어느 달을 처음 열어도 자동으로 반영됩니다.
   주의: 자동으로 생성된 거래를 지우면, 그 달을 다시 열 때 같은 항목이 다시 채워질 수 있어요. */
function initRecurringTemplatesIfEmpty(){
  const cur = DB.getRecurringTemplates();
  if(!cur || cur.length === 0){
    DB.saveRecurringTemplates(DEFAULT_RECURRING_TEMPLATES);
  }
}

/* 보라/관 개인 소유였던 '가족' 중분류를 공동으로 일원화 (기존 저장 데이터 보정용, 매번 실행해도 안전) */
function migrateFamilyCategory(){
  const validSubs = ["가족","명절","생일"];
  DB.list().forEach(t=>{
    if(t.main === '가족' && t.scope !== '공동'){
      DB.update(t.id, {
        scope: '공동',
        category: validSubs.includes(t.category) ? t.category : '가족'
      });
    }
  });
  const templates = DB.getRecurringTemplates();
  if(templates){
    let changed = false;
    templates.forEach(t=>{
      if(t.main === '가족' && (t.scope !== '공동' || !validSubs.includes(t.category))){
        t.scope = '공동';
        t.category = validSubs.includes(t.category) ? t.category : '가족';
        changed = true;
      }
    });
    if(changed) DB.saveRecurringTemplates(templates);
  }
}

/* 예전(스코프 도입 이전) 방식으로 남아있는 거래 정리:
   그때는 main에 '고정지출/변동지출/고정수입/변동수입' 같은 버킷 이름이,
   category에 실제 중분류(주거비/교통비 등)가 들어있었습니다.
   지금 체계에선 main 자리에 실제 중분류가 와야 하므로 옮겨줍니다.
   소분류는 알 수 없어 비워두고(미지정), 나중에 직접 채우면 됩니다. */
function migrateLegacyBucketMains(){
  const oldBuckets = ['고정지출', '변동지출', '고정수입', '변동수입'];
  DB.list().forEach(t=>{
    if(oldBuckets.includes(t.main)){
      DB.update(t.id, { main: t.category || '', category: '' });
    }
  });
}

/* 2026년 1~7월은 이미 실데이터에 고정 지출이 들어있으므로,
   테스트 중 자동 생성된 정기 자동이체(recurringKey 있는 것)를 제거해 중복을 없앱니다. */
function cleanupRecurringBeforeAug(){
  const dupes = DB.list().filter(t => t.recurringKey && t.date < '2026-08-01');
  dupes.forEach(t => DB.remove(t.id));
}

/* 예전 버전(오늘 날짜 이후는 반영하지 않는 기능이 없던 시절)에 미리 채워졌을 수 있는
   '아직 오지 않은 날짜'의 정기 자동이체 거래를 정리합니다. */
function cleanupFutureRecurring(){
  const today = todayStr();
  const premature = DB.list().filter(t => t.recurringKey && t.date > today);
  premature.forEach(t => DB.remove(t.id));
}

  const existingKeys = new Set(DB.list().filter(t=>t.manualKey).map(t=>t.manualKey));
  MANUAL_ADDITIONS.forEach(m=>{
    if(existingKeys.has(m.key)) return;
    DB.add({
      date:m.date, scope:m.scope, type:m.type, main:m.main, category:m.category,
      note:m.note, amount:m.amount, user:m.user, payment:m.payment, manualKey:m.key
    });
  });
}

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function ensureRecurringForMonth(ym){
  // 2026년 1~7월은 실제 원본 데이터에 이미 고정 지출이 포함돼 있어 자동 생성 시 중복됩니다.
  // 정기 자동이체 자동 반영은 2026년 8월부터 시작합니다.
  if(ym < '2026-08') return;
  const [y,m] = ym.split('-').map(Number);
  const dim = daysInMonth(y,m);
  const templates = DB.getRecurringTemplates() || [];
  const existingKeys = new Set(
    DB.list().filter(t=>t.recurringKey && t.date.startsWith(ym)).map(t=>t.recurringKey)
  );
  const skips = new Set(DB.getRecurringSkips());
  const overrides = DB.getRecurringOverrides();
  const today = todayStr();
  templates.forEach(tpl=>{
    if(existingKeys.has(tpl.key)) return;
    if(skips.has(tpl.key + '|' + ym)) return;
    if(tpl.endYm && ym >= tpl.endYm) return; // 종료월이 설정된 경우, 그 달부터는 더 이상 자동 생성하지 않음
    const day = Math.min(tpl.day, dim);
    const date = ym + '-' + String(day).padStart(2,'0');
    if(date > today) return; // 아직 오늘이 지나지 않은 날짜(미래)는 반영하지 않음
    const token = tpl.key + '|' + ym;
    const amount = overrides[token] != null ? overrides[token] : tpl.amount;
    DB.add({
      date, type: '지출', scope: tpl.scope, main: tpl.main, category: tpl.category,
      note: tpl.note, amount, user: tpl.payment, payment: tpl.payment,
      recurringKey: tpl.key
    });
  });
}

/* 아직 활성화되지 않은(오늘이 지나지 않은) ym월의 정기 자동이체를 "예정" 항목으로
   미리 보여줄 때 씀 — 현대카드 결제 예정 배지와 같은 개념. 실제 거래로는 아직
   생성하지 않고(ensureRecurringForMonth가 그 날짜가 되면 처리), 화면에만 미리 표시. */
function computePendingRecurringForMonth(ym){
  if(ym < '2026-08') return [];
  const [y,m] = ym.split('-').map(Number);
  const dim = daysInMonth(y,m);
  const templates = DB.getRecurringTemplates() || [];
  const skips = new Set(DB.getRecurringSkips());
  const overrides = DB.getRecurringOverrides();
  const today = todayStr();
  const existingKeys = new Set(
    DB.list().filter(t=>t.recurringKey && t.date.startsWith(ym)).map(t=>t.recurringKey)
  );
  const out = [];
  templates.forEach(tpl=>{
    if(existingKeys.has(tpl.key)) return;
    if(skips.has(tpl.key + '|' + ym)) return;
    if(tpl.endYm && ym >= tpl.endYm) return;
    const day = Math.min(tpl.day, dim);
    const date = ym + '-' + String(day).padStart(2,'0');
    if(date <= today) return; // 이미 지난 날짜는 곧 실제 거래로 채워지므로 여기서는 제외
    const token = tpl.key + '|' + ym;
    const amount = overrides[token] != null ? overrides[token] : tpl.amount;
    out.push({
      pending: true, recurringKey: tpl.key, date,
      type: '지출', scope: tpl.scope, main: tpl.main, category: tpl.category,
      note: tpl.note, amount, payment: tpl.payment, user: tpl.payment,
    });
  });
  return out;
}

/* 정기 자동이체 예정 금액(달마다 조금씩 다를 수 있는 값)을 수정합니다. */
function openPendingAmountEdit(key, ym, defaultAmount){
  const overrides = DB.getRecurringOverrides();
  const token = key + '|' + ym;
  const current = overrides[token] != null ? overrides[token] : defaultAmount;
  const input = prompt('이번 달 예정 금액을 입력하세요 (달마다 조금씩 다를 수 있어 수정 가능해요)', current);
  if(input === null) return;
  const amount = Number(String(input).replace(/[^0-9]/g,''));
  if(!amount || amount <= 0){ alert('올바른 금액을 입력해주세요.'); return; }
  DB.setRecurringOverride(key, ym, amount);
  renderTxTable(ym);
  renderFixedSpendingCard(ym);
}

  yearTx.forEach(t=>{ const key = t.main || '미분류'; map[key] = (map[key]||0) + Number(t.amount); });

        type:'doughnut',
        data:{
          labels: rows.map(([main])=>main),
          datasets:[{ data: rows.map(([,amt])=>amt), backgroundColor: rows.map((_,i)=>CATEGORY_PALETTE[i%CATEGORY_PALETTE.length]), borderWidth:0 }],
        },

      });

  if(listWrap){
    listWrap.innerHTML = rows.length ? rows.map(([main,amt],i)=>{

/* ---- 지출 카테고리 매트릭스: 구분(공동/보라/관/미지정)별로 그룹핑 ---- */
function buildCategoryMatrixRows(list, monthYms){
  const groups = [...SCOPES, '미지정'];
  let html = '';
  groups.forEach(scopeKey=>{
    const scTx = list.filter(t => t.type==='지출' && (scopeKey==='미지정' ? !t.scope : t.scope===scopeKey));
    if(!scTx.length) return;
    const seen = new Map();
    scTx.forEach(t => seen.set(t.main+'|'+t.category, {main:t.main, cat:t.category}));
    const rows = Array.from(seen.values()).map(({main,cat})=>{
      const monthsArr = monthYms.map(ym => scTx.filter(t=>t.main===main && t.category===cat && ymOf(t.date)===ym).reduce((s,t)=>s+Number(t.amount||0),0));
      const total = monthsArr.reduce((s,v)=>s+v,0);
      return {main,cat,monthsArr,total};
    }).filter(r=>r.total>0).sort((a,b)=>b.total-a.total);
    if(!rows.length) return;

    html += `<tr class="scope-divider"><td colspan="15">${scopeKey}</td></tr>`;
    rows.forEach(r=>{
      const isFixed = scTx.some(t=>t.main===r.main && t.category===r.cat && t.recurringKey);
      const fixedBadge = isFixed ? `<span class="badge fixed-badge" title="정기 자동이체로 채워지는 항목">고정</span>` : '';
      html += `<tr>
        <td style="color:var(--muted);white-space:nowrap;">${r.main||'미분류'}</td>
        <td style="font-weight:600;white-space:nowrap;">${r.cat||'미분류'} ${fixedBadge}</td>
        ${r.monthsArr.map(v=>`<td class="amt">${v? v.toLocaleString('ko-KR'):'·'}</td>`).join('')}
        <td class="amt expense" style="font-weight:700;">${r.total.toLocaleString('ko-KR')}</td>
      </tr>`;
    });
  });
  return html;
}

function submitRecurring(){
  const day = Number(document.getElementById('rc_day').value);

  const payment = document.getElementById('rc_payment').value;
  const templates = DB.getRecurringTemplates() || [];
  templates.push({
    key: 'r_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    day, scope: document.getElementById('rc_scope').value,
    main: document.getElementById('rc_main').value,
    category: document.getElementById('rc_category').value,
    note: document.getElementById('rc_note').value,

  document.getElementById('rc_day').value = '';
  document.getElementById('rc_note').value = '';
  document.getElementById('rc_amount').value = '';
  document.getElementById('rc_payment').value = '';

function saveRecurEdit(key){
  const day = Number(document.getElementById('rce_day_'+key).value);

      amount, payment, endYm

function deleteRecur(key){

/* ---- 이번 달 총예산: budgets 테이블에 category='__total__'로 저장(연도별 1개 값).
   기존 카테고리별 예산 스캐폴딩(getBudgets/saveBudgets)을 그대로 재사용합니다. */
function getMonthlyBudget(year){

function setMonthlyBudget(ym){

/* ---- 고정 지출(정기 자동이체) 이번 달 요약: 실제 auto-fill 로직(ensureRecurringForMonth)과
   같은 기준(날짜·스킵)으로 계산해서, 실제 채워진 거래와 항상 일치하게 합니다. */
function computeFixedSpendingSummary(ym){
  const [y,m] = ym.split('-').map(Number);
  const dim = daysInMonth(y,m);
  const templates = DB.getRecurringTemplates() || [];
  const skips = new Set(DB.getRecurringSkips());
  const overrides = DB.getRecurringOverrides();
  const today = todayStr();
  let happened = 0, upcoming = 0, count = 0;
  templates.forEach(tpl=>{
    if(tpl.endYm && ym >= tpl.endYm) return;
    if(skips.has(tpl.key + '|' + ym)) return;
    const day = Math.min(tpl.day, dim);
    const date = ym + '-' + String(day).padStart(2,'0');
    const token = tpl.key + '|' + ym;
    const amount = overrides[token] != null ? overrides[token] : tpl.amount;
    count++;
    if(date <= today) happened += Number(amount);
    else upcoming += Number(amount);
  });
  return { happened, upcoming, total: happened + upcoming, count };
}
function renderFixedSpendingCard(ym){
  const wrap = document.getElementById('fixedSpendWrap');
  if(!wrap) return;
  const s = computeFixedSpendingSummary(ym);
  wrap.innerHTML = s.count ? `
    <div class="fixed-spend-rows">
      <div class="fixed-spend-row"><span class="k">나간 고정 지출</span><span class="v" style="color:var(--expense);">${won(s.happened)}</span></div>
      <div class="fixed-spend-row"><span class="k">예정된 고정 지출</span><span class="v" style="color:var(--muted);">${won(s.upcoming)}</span></div>
      <div class="fixed-spend-row"><span class="k" style="font-weight:800;color:var(--ink);">총 ${s.count}건</span><span class="v" style="font-weight:800;">${won(s.total)}</span></div>
    </div>
  ` : `<div style="color:var(--muted);font-size:13px;padding:14px 0;">등록된 정기 자동이체가 없어요.</div>`;
}

/* ---- 지출 속도: 이번 달 vs 지난달 "누적" 지출을 날짜별로 그려서 페이스를 비교합니다.
   지난달이 이번 달보다 짧으면(예: 2월→3월) 마지막 값에서 평평하게 이어 그립니다. */
function computeDailyCumulative(ym){
  const [y,m] = ym.split('-').map(Number);
  const dim = daysInMonth(y,m);
  const tx = monthTx(DB.list(), ym).filter(t=>t.type==='지출');
  const byDay = {};
  tx.forEach(t=>{ const d = Number(t.date.split('-')[2]); byDay[d] = (byDay[d]||0) + Number(t.amount); });
  const cum = [];
  let running = 0;
  for(let d=1; d<=dim; d++){ running += (byDay[d]||0); cum.push(running); }
  return cum;
}
function renderSpendingPaceChart(ym){
  const canvas = document.getElementById('chartPace');
  if(!canvas) return;

  const sel = document.getElementById('paceCompareSelect');
  if(sel) sel.innerHTML = compareOptions(ym).map(o=>`<option value="${o.value}" ${o.value===state.paceCompareYm?'selected':''}>${o.label}</option>`).join('');

  if(typeof Chart === 'undefined'){ canvas.replaceWith(chartFallbackNode()); return; }

  const [y,m] = ym.split('-').map(Number);
  const dim = daysInMonth(y,m);
  const curCum = computeDailyCumulative(ym);
  const cmpYm = state.paceCompareYm || shiftYm(ym,-1);
  const [cy,cm] = cmpYm.split('-').map(Number);
  const cmpDim = daysInMonth(cy,cm);
  const cmpCumFull = computeDailyCumulative(cmpYm);
  const cmpCum = [];
  for(let d=1; d<=dim; d++){
    cmpCum.push(d <= cmpDim ? cmpCumFull[d-1] : cmpCumFull[cmpDim-1]);
  }
  const cmpLabel = compareOptions(ym).find(o=>o.value===cmpYm)?.label || cmpYm;
  const budget = getMonthlyBudget(y);
  const labels = Array.from({length:dim}, (_,i)=> String(i+1));

  const datasets = [

   기본은 아래 규칙 기반 계산이고, "✨ AI 분석" 버튼을 누르면 Supabase Edge
   Function(analyze-spending)이 같은 데이터를 Gemini로 보내 자연어 요약을 받아온다.
*/

/* ym월 지출 리뷰용 데이터를 계산합니다(전체 + 공동/보라/관). 규칙 기반 렌더링과
   AI 분석(코멘트 한 줄만 Gemini가 채움) 양쪽이 이 계산 결과를 그대로 재사용해서,
   숫자·카테고리 칩은 항상 우리 코드가 만드는 똑같은 모양으로 나옵니다 —
   Gemini의 문장 구성/띄어쓰기에 좌우되지 않아요. */
function computeScopeReviewData(ym){
  const all = DB.list();
  const sumByMain = txs => txs.reduce((m,t)=>{ m[t.main] = (m[t.main]||0) + Number(t.amount); return m; }, {});

  // "같은 년도 평균" = ym과 같은 해의, ym 이전(1월~직전월)까지 지난 달들의 월평균.
  // 연초(1월)라 지난 달이 없으면 카테고리 비교는 생략한다.
  const [yy, mm] = ym.split('-').map(Number);
  const yearMonths = [];
  for(let m=1; m<mm; m++) yearMonths.push(yy + '-' + String(m).padStart(2,'0'));
  const elapsedCount = yearMonths.length;

  function buildOne(filterFn){
    const cur = filterFn(monthTx(all, ym));
    const total = cur.reduce((s,t)=>s+Number(t.amount),0);
    const pTotal = filterFn(monthTx(all, shiftYm(ym,-1))).reduce((s,t)=>s+Number(t.amount),0);
    const yearTx = yearMonths.reduce((acc,m)=> acc.concat(filterFn(monthTx(all, m))), []);
    const yearMainTotals = sumByMain(yearTx);
    const yearTotalSum = yearTx.reduce((s,t)=>s+Number(t.amount),0);
    const yearAvgTotal = elapsedCount ? yearTotalSum/elapsedCount : 0;

    let headline;
    if(total===0){
      headline = '이번 달 지출 기록이 아직 없어요.';
    } else {
      const parts = [];
      if(pTotal){
        const d = (total-pTotal)/pTotal*100;
        parts.push(`전월 대비 ${Math.abs(d).toFixed(0)}% ${d>=0?'증가':'감소'}`);
      }
      if(yearAvgTotal){
        const d2 = (total-yearAvgTotal)/yearAvgTotal*100;
        parts.push(`${yy}년 평균 대비 ${Math.abs(d2).toFixed(0)}% ${d2>=0?'높음':'낮음'}`);
      }
      headline = parts.length ? parts.join(' · ') : '아직 비교할 데이터가 없어요.';
    }

    // 중분류(main)별로 "같은 년도 평균" 대비 얼마나 많이/적게 썼는지. 1만원 미만은 노이즈로 제외.
    let increased = [], decreased = [];
    if(elapsedCount > 0){
      const curByMain = sumByMain(cur);
      const yearAvgByMain = {};
      Object.keys(yearMainTotals).forEach(k => { yearAvgByMain[k] = yearMainTotals[k] / elapsedCount; });
      const mains = new Set([...Object.keys(curByMain), ...Object.keys(yearAvgByMain)]);
      const deltas = Array.from(mains)
        .filter(m => m)
        .map(m => ({ main: m, delta: (curByMain[m]||0) - (yearAvgByMain[m]||0) }))
        .filter(d => Math.abs(d.delta) >= 10000)
        .sort((a,b) => Math.abs(b.delta) - Math.abs(a.delta));
      increased = deltas.filter(d=>d.delta>0).slice(0,3);
      decreased = deltas.filter(d=>d.delta<0).slice(0,3);
    }

    return { total, headline, increased, decreased };
  }

  const overall = buildOne(txs => txs.filter(t=>t.type==='지출'));
  const scopes = {};
  SCOPES.forEach(scope=>{ scopes[scope] = buildOne(txs => txs.filter(t=>t.type==='지출' && t.scope===scope)); });
  return { overall, scopes };
}

/* 지출 리뷰 카드 한 칸(전체 또는 공동/보라/관 하나)을 렌더링합니다. 헤드라인 한 줄
   + 카테고리 증감 칩으로 구조를 고정해서, 숫자가 몇 개든 항상 한눈에 읽히게 합니다. */
function reviewCardHtml({ label, bold, total, headline, increased, decreased, comment, ym, scope }){
  const scopeArg = scope ? `'${escapeJsAttr(scope)}'` : 'null';
  const chip = (d, dir) => `<span class="review-chip ${dir}" style="cursor:pointer;" onclick="openMainBreakdownModal('${ym}', ${scopeArg}, '${escapeJsAttr(d.main)}')" title="눌러서 소분류별 비중 보기">${dir==='up'?'▲':'▼'} ${escapeHtml(d.main)} ${won(Math.abs(d.delta))}</span>`;
  const chipsHtml = (increased.length || decreased.length)
    ? `<div class="review-chips">${increased.map(d=>chip(d,'up')).join('')}${decreased.map(d=>chip(d,'down')).join('')}</div>`
    : '';
  const commentHtml = comment ? `<div class="review-comment">${escapeHtml(comment)}</div>` : '';
  return `
    <div class="cat-row review-item ${bold?'review-overall':''}">
      <div class="top"><span class="name" style="font-size:14px;${bold?'font-weight:800;':''}">${escapeHtml(label)}</span><span class="amt">${won(total)}</span></div>
      <div class="review-headline">${escapeHtml(headline)}</div>
      ${chipsHtml}
      ${commentHtml}
    </div>
  `;
}

async function aiReanalyzeScopeReview(ym){
  const btn = document.getElementById('aiReviewBtn');
  const wrap = document.getElementById('scopeReviewWrap');
  const note = document.getElementById('scopeReviewNote');
  if(btn){ btn.disabled = true; btn.textContent = '분석 중...'; }
  if(wrap){ wrap.style.transition = 'opacity .12s ease'; wrap.style.opacity = '0.4'; }
  try{
    const { data, error } = await sb.functions.invoke('analyze-spending', { body: { ym } });
    if(error){
      // supabase-js는 Edge Function이 non-2xx를 반환하면 진짜 에러 메시지 대신
      // "non-2xx status code"라는 뭉뚱그린 문구만 줘서, 응답 본문(context)을 직접 읽어옴
      let detail = error.message;
      if(error.context && typeof error.context.json === 'function'){
        try{
          const body = await error.context.json();
          if(body?.error) detail = body.error;
        }catch(_){/* 본문이 JSON이 아니면 원래 메시지 유지 */}
      }
      throw new Error(detail);
    }
    if(data?.error) throw new Error(data.error);

    const reviewData = computeScopeReviewData(ym);
    const comments = data.comments || {};
    const overallCard = reviewCardHtml({ label:'전체', bold:true, ...reviewData.overall, comment: comments['전체'], ym, scope:null });
    const scopeCards = SCOPES.map(scope => reviewCardHtml({ label:scope, ...reviewData.scopes[scope], comment: comments[scope], ym, scope })).join('');
    wrap.innerHTML = overallCard + scopeCards;
    if(note) note.textContent = '✨ 규칙 기반 분석 + Gemini 코멘트';
  }catch(err){
    console.error('AI 지출 리뷰 중 오류:', err);
    alert('AI 분석 중 오류가 발생했어요: ' + err.message);
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = '✨ AI 분석'; }
    if(wrap){ requestAnimationFrame(()=>{ wrap.style.opacity = '1'; }); }
  }
}

function renderScopeReviews(ym){
  const wrap = document.getElementById('scopeReviewWrap');
  const data = computeScopeReviewData(ym);
  const overallCard = reviewCardHtml({ label:'전체', bold:true, ...data.overall, ym, scope:null });
  const scopeCards = SCOPES.map(scope => reviewCardHtml({ label:scope, ...data.scopes[scope], ym, scope })).join('');
  wrap.innerHTML = overallCard + scopeCards;
}

/* 지출 리뷰의 ▲/▼ 칩(중분류 증감)을 누르면 그 중분류를 소분류별로 나눠서 비중(%)을 보여줌.
   이 계산은 규칙 기반(우리 코드)이라 'AI 분석'을 눌러도 값이 바뀌지 않음 —
   Gemini는 코멘트 한 줄만 덧붙일 뿐, 숫자·비중 계산에는 관여하지 않음. */
function openMainBreakdownModal(ym, scope, main){
  let tx = monthTx(DB.list(), ym).filter(t=>t.type==='지출' && t.main===main);
  if(scope) tx = tx.filter(t=>t.scope===scope);
  const total = tx.reduce((s,t)=>s+Number(t.amount),0);
  const byCat = {};
  tx.forEach(t=>{ const c = t.category || '기타'; byCat[c] = (byCat[c]||0) + Number(t.amount); });
  const rows = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const rowsHtml = rows.length ? rows.map(([cat,amt],i)=>{
    const pct = total ? (amt/total*100) : 0;
    return `<div class="cat-dot-row">
      <span class="left"><i class="dot" style="background:${CATEGORY_PALETTE[i%CATEGORY_PALETTE.length]}"></i>${escapeHtml(cat)}<span class="pct">${pct.toFixed(0)}%</span></span>
      <span class="amt">${won(amt)}</span>
    </div>`;
  }).join('') : `<div style="color:var(--muted);font-size:13px;">이번 달 ${escapeHtml(main)} 지출 내역이 없어요.</div>`;
  openModal(`
    <h3 class="display">${escapeHtml(main)}${scope?` · ${escapeHtml(scope)}`:''}</h3>
    <div class="modal-sub">이번 달 소분류별 비중 · 합계 ${won(total)}</div>
    ${rowsHtml}
  `);
}

function nextYm(ym){
  let [y,m] = ym.split('-').map(Number);
  m += 1; if(m===13){ m=1; y+=1; }
  return y + '-' + String(m).padStart(2,'0');
}

function topCategory(tx){
  const map = {};
  tx.filter(t=>t.type==='지출').forEach(t=> map[t.category] = (map[t.category]||0)+Number(t.amount));
  const arr = Object.entries(map).sort((a,b)=>b[1]-a[1]);
  return arr.length ? arr[0][0] : '-';
}

function renderCalendar(y,m,tx){
  const ym = y + '-' + String(m).padStart(2,'0');
  const byDay = {};
  tx.filter(t=>t.type==='지출').forEach(t=>{
    const d = Number(t.date.split('-')[2]);
    byDay[d] = (byDay[d]||0) + Number(t.amount);
  });
  const max = Math.max(1, ...Object.values(byDay));
  const dim = daysInMonth(y,m);
  const firstDow = new Date(y, m-1, 1).getDay(); // JS getDay()가 이미 0=일..6=토라 그대로 씀

  // 신용카드 결제일(매월 12일)에 청구될 전월 사용 누적액 — 실제 지출/잔고에는 아직
  // 반영 전(비활성)이라, 정보용으로만 흐린 글씨로 보여줍니다. 전월 카드 내역이
  // 바뀌면 이 숫자도 바로 같이 바뀌어요(지출 색칠 강도·합계엔 영향 없음).
  const pendingBillTotal = Object.values(creditCardExpenseByScope(DB.list(), shiftYm(ym,-1))).reduce((s,v)=>s+v, 0);

  let html = DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<firstDow;i++) html += `<div class="cal-cell empty"></div>`;
  const today = new Date();
  const isThisMonth = today.getFullYear()===y && (today.getMonth()+1)===m;
  for(let d=1; d<=dim; d++){
    const amt = byDay[d]||0;
    const intensity = amt / max;
    const bg = amt ? `rgba(181,73,91,${0.08 + intensity*0.35})` : 'var(--paper)';
    const isToday = isThisMonth && today.getDate()===d;
    const billBadge = (d===12 && pendingBillTotal>0)
      ? `<span class="amt card-bill-pending" title="눌러서 결제 예정 총액 보기(지출 집계엔 포함 안 됨)" onclick="event.stopPropagation();openCardBillPreviewModal('${ym}')">현대카드</span>`
      : '';
    html += `<div class="cal-cell ${isToday?'today':''}" style="background:${bg}" onclick="openDayModal('${ym}',${d})">
      <span class="d">${d}</span>
      <span class="amt">${amt? wonShort(amt):''}</span>
      ${billBadge}
    </div>`;
  }
  document.getElementById('calWrap').innerHTML = `<div class="cal-grid">${html}</div>
    <div class="cal-legend"><span class="sw" style="background:rgba(181,73,91,0.1)"></span>적음 &nbsp;→&nbsp; <span class="sw" style="background:rgba(181,73,91,0.4)"></span>많음</div>`;
}

/* 거래내역을 대분류 → 중분류 → 소분류로 그룹화해서 보여주는 함수 */
function txGroupedListHtml(items){
  if(!items.length) return '';

  // 대분류(type) → 중분류(main) → 소분류(category)로 그룹화
  const grouped = {};
  items.forEach(t => {
    const type = t.type || '기타';
    const main = t.main || '미분류';
    const category = t.category || '기타';

    if(!grouped[type]) grouped[type] = {};
    if(!grouped[type][main]) grouped[type][main] = {};
    if(!grouped[type][main][category]) grouped[type][main][category] = [];
    grouped[type][main][category].push(t);
  });

  let html = '';
  // 수입 먼저, 지출 나중에
  const typeOrder = ['수입', '지출'];
  typeOrder.forEach(type => {
    if(!grouped[type]) return;

    const mains = Object.keys(grouped[type]);
    mains.forEach(main => {
      const mainTotal = Object.values(grouped[type][main])
        .flat()
        .reduce((s,t)=>s+Number(t.amount||0), 0);

      html += `<div class="modal-section-label">${main} (${won(mainTotal)})</div>`;

      const categories = Object.keys(grouped[type][main]);
      categories.forEach(category => {
        const txs = grouped[type][main][category];
        const catTotal = txs.reduce((s,t)=>s+Number(t.amount||0), 0);

        html += `<div style="font-size:12px;color:var(--ink-soft);font-weight:600;margin:8px 0 4px;padding-left:8px;">
          ${category} (${won(catTotal)} · ${txs.length}건)
        </div>`;
        html += `<ul class="modal-tx-list" style="margin-bottom:10px;">${txs.map(t=>`
          <li>
            <span class="badge ${TYPE_KEY[t.type]}">${t.date.slice(5)}</span>
            <span class="n">${t.note||'-'}</span>
            <span class="a amt ${TYPE_KEY[t.type]}">${Number(t.amount).toLocaleString('ko-KR')}원</span>
          </li>
        `).join('')}</ul>`;
      });
    });
  });

  return html;
}
