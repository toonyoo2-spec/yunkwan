<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BORAKWAN</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#3a5a52">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BORAKWAN">
<link rel="stylesheet" href="./common.css">
<style>
  /* index.html은 체험단 '예약완료' 색이 review.html과 다르게 쓰여왔으므로 로컬로 재정의 */
  :root{
    --conf-bg:#fbe6e3;   --conf-ink:#b3452f;
  }

  /* 상단 고정 메뉴바(제목 + 이동 카드)는 이제 nav.js가 모든 페이지 공통으로 삽입합니다.
     (이전에는 여기 header/h1/.grid/.card 로 index.html에만 따로 그려져 있었음) */

  #appContent{display:block;}

  /* ---- 캘린더 ---- */
  .cal-panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px;
  }
  .cal-header{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    margin-bottom:14px;
    position:relative;
  }
  .cal-nav-btn{
    border:1px solid var(--line);
    background:#fff;
    color:var(--sub);
    width:30px;height:30px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    line-height:1;
  }
  .cal-nav-btn:hover{border-color:var(--accent);color:var(--accent);}
  .cal-title{font-size:15.5px;font-weight:700;min-width:110px;text-align:center;}

  .cal-add-couple-btn{
    position:absolute;
    right:0;
    top:50%;
    transform:translateY(-50%);
    border:1px solid var(--accent);
    background:#fff;
    color:var(--accent);
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .cal-add-couple-btn:hover{background:var(--accent);color:#fff;}

  .cal-legend{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:16px;
    font-size:12px;
    color:var(--sub);
  }
  .cal-legend span{display:flex;align-items:center;gap:5px;}
  .cal-legend .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .dot.wait{background:var(--wait-ink);}
  .dot.confirm{background:var(--conf-ink);}
  .dot.done{background:var(--done-ink);}
  .dot.end{background:var(--end-ink);}
  .dot.owner-gwan{background:var(--owner-gwan-ink);}
  .dot.owner-bora{background:var(--owner-bora-ink);}
  .dot.owner-common{background:var(--owner-common-ink);}

  .cal-grid-wrap{
    position:relative;
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
  }
  .cal-bars-layer{
    position:absolute;
    top:0;left:0;right:0;bottom:0;
    pointer-events:none;
  }
  .cal-bar-slot{
    height:17px;
    flex-shrink:0;
  }
  .cal-bar{
    position:absolute;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    font-size:10.5px;
    font-weight:600;
    padding:2px 6px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    cursor:pointer;
    pointer-events:auto;
  }
  .cal-bar:hover{filter:brightness(0.95);}
  .cal-bar.round-left{border-top-left-radius:5px;border-bottom-left-radius:5px;}
  .cal-bar.round-right{border-top-right-radius:5px;border-bottom-right-radius:5px;}
  .cal-bar.owner-gwan{background:var(--owner-gwan-bg);color:var(--owner-gwan-ink);}
  .cal-bar.owner-bora{background:var(--owner-bora-bg);color:var(--owner-bora-ink);}
  .cal-bar.owner-common{background:var(--owner-common-bg);color:var(--owner-common-ink);}
  .cal-dow{
    text-align:center;
    font-size:11.5px;
    color:var(--sub);
    padding-bottom:6px;
    font-weight:600;
  }
  .cal-cell{
    min-height:82px;
    border:1px solid var(--line);
    border-radius:8px;
    padding:6px 6px;
    background:#fdfcfa;
    display:flex;
    flex-direction:column;
    gap:3px;
    overflow:hidden;
  }
  .cal-cell.other-month{background:transparent;border-color:transparent;}
  .cal-cell.today{border-color:var(--accent);background:#f0f0ee;}
  .cal-daynum{font-size:11.5px;color:var(--sub);}
  .cal-daynum.weekend{color:#b3452f;}
  .cal-cell.today .cal-daynum{color:var(--accent);font-weight:700;}
  .cal-daynum-row{
    display:flex;
    align-items:center;
    gap:4px;
  }
  .cal-workout-dots{
    display:flex;
    gap:2px;
  }
  .wo-dot{
    width:5px;height:5px;
    border-radius:50%;
    border:1px solid var(--line);
    background:transparent;
    flex-shrink:0;
  }
  .wo-dot.gwan{border-color:var(--owner-gwan-ink);}
  .wo-dot.gwan.done{background:var(--owner-gwan-ink);}
  .wo-dot.bora{border-color:var(--owner-bora-ink);}
  .wo-dot.bora.done{background:var(--owner-bora-ink);}
  .wo-x{
    font-size:6px;
    line-height:1;
    font-weight:800;
    color:var(--owner-gwan-ink);
    flex-shrink:0;
  }
  .cal-event{
    font-size:10.5px;
    padding:2px 5px;
    border-radius:4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    cursor:pointer;
  }
  .cal-event:hover{filter:brightness(0.95);}
  .cal-event.wait{background:var(--wait-bg);color:var(--wait-ink);}
  .cal-event.confirm{background:var(--conf-bg);color:var(--conf-ink);}
  .cal-event.done{background:var(--done-bg);color:var(--done-ink);}
  .cal-event.end{background:var(--end-bg);color:var(--end-ink);}
  .cal-event.owner-gwan{background:var(--owner-gwan-bg);color:var(--owner-gwan-ink);font-weight:600;}
  .cal-event.owner-bora{background:var(--owner-bora-bg);color:var(--owner-bora-ink);font-weight:600;}
  .cal-event.owner-common{background:var(--owner-common-bg);color:var(--owner-common-ink);font-weight:600;}
  .cal-event-time{font-weight:700;margin-right:3px;}

  /* ---- 운동 트래커 ---- */
  .workout-panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px 20px;
    margin-top:16px;
  }
  .workout-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:14px;
  }
  .workout-title{font-size:14.5px;font-weight:700;}
  .workout-summary{
    display:flex;
    gap:12px;
    font-size:12px;
    color:var(--sub);
  }
  .workout-summary b{font-weight:700;}
  .workout-summary .owner-gwan-txt{color:var(--owner-gwan-ink);}
  .workout-summary .owner-bora-txt{color:var(--owner-bora-ink);}
  .workout-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .workout-row + .workout-row{margin-top:10px;}
  .workout-label{
    flex:0 0 32px;
    font-size:12.5px;
    font-weight:700;
    text-align:center;
  }
  .workout-label.owner-gwan{color:var(--owner-gwan-ink);}
  .workout-label.owner-bora{color:var(--owner-bora-ink);}
  .workout-cells{
    display:flex;
    gap:4px;
    overflow-x:auto;
    padding-bottom:2px;
    flex:1;
  }
  .workout-cell{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:5px;
    border:1px solid var(--line);
    background:#fdfcfa;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:9px;
    color:var(--sub);
    transition:transform .08s ease;
    user-select:none;
  }
  .workout-cell:hover{transform:translateY(-1px);}
  .workout-cell.today{border-color:#e0392e;border-width:1.5px;}
  .workout-cell.done.owner-gwan{background:var(--owner-gwan-bg);color:var(--owner-gwan-ink);border-color:var(--owner-gwan-bg);font-weight:700;}
  .workout-cell.done.owner-bora{background:var(--owner-bora-bg);color:var(--owner-bora-ink);border-color:var(--owner-bora-bg);font-weight:700;}
  .workout-cell.missed{background:#fff;color:var(--owner-gwan-ink);border-color:var(--owner-gwan-ink);font-weight:700;}
  .workout-cell.weekend{background:#fdf0ee;color:#b3452f;border-color:#f3d0c8;}
  .workout-cell.today.weekend{border-color:#e0392e;}

  /* ---- 이벤트 상세 팝업 ---- */
  .cal-modal-overlay{
    position:fixed;inset:0;
    background:rgba(34,34,31,0.45);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:9998;
    padding:20px;
  }
  .cal-modal-overlay.open{display:flex;}
  #coupleLoginOverlay{
    background:var(--bg);
    z-index:10000;
  }
  .cal-modal{
    background:var(--card);
    border-radius:14px;
    max-width:360px;
    width:100%;
    padding:24px;
    position:relative;
    box-shadow:0 12px 32px rgba(0,0,0,0.15);
  }
  .cal-modal-close{
    position:absolute;
    top:14px;right:16px;
    background:none;
    border:none;
    font-size:18px;
    color:var(--sub);
    cursor:pointer;
    line-height:1;
  }
  .cal-modal-close:hover{color:var(--ink);}
  .cal-modal-title{
    font-size:17px;
    font-weight:700;
    margin:0 0 4px;
    padding-right:20px;
  }
  .cal-modal-badge{
    display:inline-block;
    font-size:11.5px;
    font-weight:600;
    padding:3px 9px;
    border-radius:20px;
    margin-bottom:14px;
  }
  .cal-modal-row{
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:8px 0;
    border-top:1px solid var(--line);
    font-size:13px;
  }
  .cal-modal-row .k{color:var(--sub);flex-shrink:0;}
  .cal-modal-row .v{text-align:right;word-break:break-all;}
  
  .cal-modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 18px;
  }
  .cal-modal-edit-btn{
    flex: 2;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 0;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .cal-modal-edit-btn:hover { opacity: 0.9; }

  .cal-modal-del-btn{
    flex: 1;
    background:none;
    border:1px solid var(--line);
    color:var(--sub);
    padding:10px 0;
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
  }
  .cal-modal-del-btn:hover{border-color:#b3452f;color:#b3452f;}

  /* ---- 부부 일정 추가/수정 폼 ---- */
  .couple-field{margin-bottom:12px;}
  .couple-field label{
    display:block;
    font-size:12px;
    color:var(--sub);
    margin-bottom:5px;
  }
  .couple-field input, .couple-field textarea{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:7px;
    font-size:13.5px;
    background:#fff;
    color:var(--ink);
    font-family:inherit;
  }
  .couple-field textarea{resize:vertical;min-height:60px;}
  .couple-field input:focus, .couple-field textarea:focus{
    outline:none;
    border-color:var(--accent);
  }
  .owner-toggle{
    display:flex;
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    margin-bottom:16px;
  }
  .owner-toggle button{
    flex:1;
    border:none;
    background:#fff;
    padding:9px 0;
    font-size:13px;
    font-weight:600;
    color:var(--sub);
    cursor:pointer;
  }
  .owner-toggle button + button{border-left:1px solid var(--line);}
  .owner-toggle button.active[data-owner="관"]{background:var(--owner-gwan-bg);color:var(--owner-gwan-ink);}
  .owner-toggle button.active[data-owner="보라"]{background:var(--owner-bora-bg);color:var(--owner-bora-ink);}
  .owner-toggle button.active[data-owner="공통"]{background:var(--owner-common-bg);color:var(--owner-common-ink);}
  .couple-save-btn{
    margin-top:4px;
    width:100%;
    background:var(--accent);
    color:#fff;
    border:none;
    padding:10px 0;
    border-radius:8px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
  }
  .couple-save-btn:hover{opacity:0.9;}
  .couple-save-btn:disabled{opacity:0.5;cursor:not-allowed;}
  .couple-status-msg{
    font-size:11.5px;
    color:var(--sub);
    margin-top:8px;
    text-align:center;
  }

  /* 📱 모바일 화면 최적화 */
  @media (max-width:640px){
    body{padding:16px 12px 60px;}

    .cal-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .cal-title { font-size: 16px; order: 1; min-width: auto; }
    .cal-nav-btn { order: 1; }
    .cal-add-couple-btn {
      order: 2;
      width: 100%;
      margin-top: 6px;
      padding: 8px 0;
      text-align: center;
      position: static;
      transform: none;
    }

    .cal-panel{padding:12px 8px;}
    .cal-cell{min-height:54px;padding:3px 2px;}
    .cal-daynum{font-size:10px;}
    .cal-event{font-size:9px;padding:2px 3px;border-radius:3px;}
    .cal-bar-slot{height:13px;}
    .cal-bar{font-size:9px;padding:1px 4px;}

    .cal-modal {
      max-width: 100%;
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
      margin-top: auto;
    }

    .workout-panel{padding:12px 10px;margin-top:12px;}
    .workout-header{flex-direction:column;align-items:flex-start;}
    .workout-label{flex:0 0 26px;font-size:11px;}
    .workout-cell{width:18px;height:18px;font-size:8px;border-radius:4px;}
  }
</style>
</head>
<body>
<script src="./nav.js?v=6"></script>
<div class="wrap" id="appContent">

  <div class="cal-panel">
    <div class="cal-header">
      <button class="cal-nav-btn" onclick="calChangeMonth(-1)">‹</button>
      <div class="cal-title" id="calTitle"></div>
      <button class="cal-nav-btn" onclick="calChangeMonth(1)">›</button>
      <button class="cal-add-couple-btn" onclick="coupleOpenAdd()">+ 일정 추가</button>
    </div>
    <div class="cal-legend">
      <span><i class="dot confirm"></i>예약완료</span>
      <span><i class="dot done"></i>체험완료</span>
      <span><i class="dot owner-gwan"></i>관</span>
      <span><i class="dot owner-bora"></i>보라</span>
      <span><i class="dot owner-common"></i>공통</span>
    </div>
    <div class="cal-grid-wrap">
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-bars-layer" id="calBarsLayer"></div>
    </div>
  </div>

  <div class="workout-panel">
    <div class="workout-header">
      <div class="workout-title">🏃 이번 달 운동</div>
      <div class="workout-summary" id="workoutSummary"></div>
    </div>
    <div class="workout-row">
      <div class="workout-label owner-gwan">관</div>
      <div class="workout-cells" id="workoutCells-관"></div>
    </div>
    <div class="workout-row">
      <div class="workout-label owner-bora">보라</div>
      <div class="workout-cells" id="workoutCells-보라"></div>
    </div>
  </div>

  <!-- 이벤트 요약 상세 팝업 (체험단 / 부부 일정 공용) -->
  <div class="cal-modal-overlay" id="calModalOverlay" onclick="if(event.target===this) calCloseDetail()">
    <div class="cal-modal">
      <button class="cal-modal-close" onclick="calCloseDetail()">✕</button>
      <div id="calModalBody"></div>
    </div>
  </div>

  <!-- 부부 일정 로그인 팝업 -->
  <div class="cal-modal-overlay open" id="coupleLoginOverlay">
    <div class="cal-modal">
      <div class="cal-modal-title" style="margin-bottom:6px;">로그인</div>
      <p style="font-size:12.5px;color:var(--sub);margin:0 0 16px;">부부 일정을 보고 수정하려면 로그인이 필요합니다.</p>
      <div class="couple-field">
        <label>아이디</label>
        <input type="text" id="coupleLoginId" placeholder="아이디 입력" autocomplete="username" autofocus>
      </div>
      <div class="couple-field">
        <label>비밀번호</label>
        <input type="password" id="coupleLoginPw" placeholder="비밀번호" autocomplete="current-password" onkeydown="if(event.key==='Enter') coupleLoginWithPassword()">
      </div>
      <button class="couple-save-btn" onclick="coupleLoginWithPassword()">로그인</button>
      <div class="couple-status-msg" id="coupleLoginMsg"></div>
    </div>
  </div>

  <!-- 부부 일정 추가/수정 입력폼 팝업 -->
  <div class="cal-modal-overlay" id="coupleAddOverlay" onclick="if(event.target===this) coupleCloseAdd()">
    <div class="cal-modal">
      <button class="cal-modal-close" onclick="coupleCloseAdd()">✕</button>
      <div class="cal-modal-title" id="coupleModalTitle" style="margin-bottom:16px;">일정 추가</div>
      <div class="owner-toggle" id="ownerToggle">
        <button type="button" data-owner="관" onclick="coupleSelectOwner('관')">관</button>
        <button type="button" data-owner="보라" onclick="coupleSelectOwner('보라')">보라</button>
        <button type="button" data-owner="공통" onclick="coupleSelectOwner('공통')">공통</button>
      </div>
      <div class="couple-field">
        <label>제목</label>
        <input type="text" id="couple-in-title" placeholder="예: 결혼기념일 저녁 예약">
      </div>
      <div class="couple-field">
        <label>시작일</label>
        <input type="date" id="couple-in-date">
      </div>
      <div class="couple-field">
        <label>종료일</label>
        <input type="date" id="couple-in-endDate">
      </div>
      <div class="couple-field">
        <label>시작 시간</label>
        <input type="time" id="couple-in-time">
      </div>
      <div class="couple-field">
        <label>종료 시간</label>
        <input type="time" id="couple-in-endTime">
      </div>
      <div class="couple-field">
        <label>메모</label>
        <textarea id="couple-in-memo" placeholder="장소, 준비물 등"></textarea>
      </div>
      <button class="couple-save-btn" id="coupleSaveBtn" onclick="coupleAddEvent()">저장</button>
      <button class="cal-modal-del-btn" id="coupleModalDelBtn" style="display:none; margin-top:8px; width:100%;" onclick="coupleDeleteEvent(coupleEditId)">삭제</button>
      <div class="couple-status-msg" id="coupleStatusMsg"></div>
    </div>
  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script src="./common.js"></script>
<script>
/* ===========================================================
   체험단 캘린더(campaigns) + 부부 일정(couple_events) 데이터 연동
   =========================================================== */
const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY, {
  auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true }
});
window.sb = sb; // 다른 스크립트(auth-gate.js 등)가 같은 클라이언트를 재사용하도록 공유

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    sb.auth.startAutoRefresh();
  } else {
    sb.auth.stopAutoRefresh();
  }
});

let calItems = [];       // 체험단 항목
let coupleItems = [];    // 부부 일정 항목
let coupleEditId = null; // 수정 중인 부부 일정 id
let coupleSelectedOwner = "관";
let coupleLoggedIn = false;
let workoutItems = [];  // 운동 체크 항목 { id, date, owner, done }
let calCursor = new Date();
calCursor.setDate(1);

const calStatusLabel = { wait:"예약대기", confirm:"예약완료", done:"체험완료", end:"체험완료" };

function calNormalizeDate(v){
  if(!v) return "";
  const d = new Date(v);
  if(isNaN(d.getTime())) return "";
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function calDateRange(start, end){
  const startStr = calNormalizeDate(start);
  if(!startStr) return [];
  const endStr = calNormalizeDate(end) || startStr;

  const startD = new Date(startStr + "T00:00:00");
  const endD = new Date(endStr + "T00:00:00");
  if(isNaN(endD.getTime()) || endD < startD) return [startStr];

  const dates = [];
  let cur = new Date(startD);
  let guard = 0;
  while(cur <= endD && guard < 60){
    dates.push(calNormalizeDate(cur));
    cur.setDate(cur.getDate() + 1);
    guard++;
  }
  return dates;
}


function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function coupleRowToItem(row){
  return {
    id: row.id,
    title: row.title || "",
    date: row.date || "",
    endDate: row.endDate || "",
    time: row.time || "",
    endTime: row.endTime || "",
    memo: row.memo || "",
    owner: row.owner || "관",
    createdAt: row.createdAt || ""
  };
}
function coupleItemToRow(item){
  return {
    id: item.id,
    title: item.title,
    date: item.date,
    endDate: item.endDate || "",
    time: item.time || "",
    endTime: item.endTime || "",
    memo: item.memo || "",
    owner: item.owner,
    createdAt: item.createdAt
  };
}

function calEventDate(it){
  if(!it.resvDate) return "";
  return calNormalizeDate(it.resvDate);
}

function calChangeMonth(delta){
  calCursor.setMonth(calCursor.getMonth() + delta);
  calRender();
}

function coupleOwnerClass(it){
  return it.owner === '보라' ? 'owner-bora' : (it.owner === '공통' ? 'owner-common' : 'owner-gwan');
}

function coupleTimeLabel(it, isGlobalStart, isGlobalEnd){
  const parts = [];
  if(isGlobalStart && it.time) parts.push(escapeHtml(it.time));
  if(isGlobalEnd && it.endTime) parts.push(escapeHtml(it.endTime));
  return parts.join('~');
}

let calCurrentSegments = [];

function calRender(){
  const y = calCursor.getFullYear();
  const m = calCursor.getMonth(); 
  document.getElementById('calTitle').textContent = `${y}년 ${m+1}월`;

  const byDate = {};
  const rowSegments = {}; 

  calItems.forEach(it => {
    const dateStr = calEventDate(it);
    if(!dateStr) return;
    if(it.status === 'wait') return; // 예약대기는 캘린더에 표시하지 않음
    const [ey, em] = dateStr.split('-').map(Number);
    if(ey === y && em === m+1){
      (byDate[dateStr] = byDate[dateStr] || []).push({ kind:'campaign', data: it });
    }
  });

  const globalStartStr = {};
  const globalEndStr = {};   

  coupleItems.forEach(it => {
    const dates = calDateRange(it.date, it.endDate);
    if(dates.length === 0) return;
    globalStartStr[it.id] = dates[0];
    globalEndStr[it.id] = dates[dates.length-1];

    if(dates.length === 1){
      const dateStr = dates[0];
      const [ey, em] = dateStr.split('-').map(Number);
      if(ey === y && em === m+1){
        (byDate[dateStr] = byDate[dateStr] || []).push({ kind:'couple', data: it, isRange:false });
      }
      return;
    }

    const inMonthDates = dates.filter(dateStr => {
      const [ey, em] = dateStr.split('-').map(Number);
      return ey === y && em === m+1;
    });
    if(inMonthDates.length === 0) return;

    let seg = null;
    inMonthDates.forEach(dateStr => {
      const rc = calDateRowCol(dateStr, y, m);
      if(!rc) return;
      if(seg && seg.row === rc.row && seg.endCol === rc.col - 1){
        seg.endCol = rc.col;
        seg.dates.push(dateStr);
      } else {
        if(seg) (rowSegments[seg.row] = rowSegments[seg.row] || []).push(seg);
        seg = { it, row: rc.row, startCol: rc.col, endCol: rc.col, dates:[dateStr] };
      }
    });
    if(seg) (rowSegments[seg.row] = rowSegments[seg.row] || []).push(seg);
  });

  Object.keys(rowSegments).forEach(rowKey => {
    const segs = rowSegments[rowKey];
    segs.forEach(seg => {
      seg.isGlobalStart = seg.dates[0] === globalStartStr[seg.it.id];
      seg.isGlobalEnd = seg.dates[seg.dates.length-1] === globalEndStr[seg.it.id];
    });
    segs.sort((a,b) => a.startCol - b.startCol || a.endCol - b.endCol);
    const laneEndCol = [];
    segs.forEach(seg => {
      let lane = laneEndCol.findIndex(endCol => endCol < seg.startCol);
      if(lane === -1){ lane = laneEndCol.length; laneEndCol.push(seg.endCol); }
      else { laneEndCol[lane] = seg.endCol; }
      seg.lane = lane;
    });
  });

  const first = new Date(y, m, 1);
  const startOffset = first.getDay(); 
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const daysInPrevMonth = new Date(y, m, 0).getDate();

  const todayStr = calNormalizeDate(new Date());

  const cells = [];
  const dowLabels = ['일','월','화','수','목','금','토'];
  dowLabels.forEach(l => cells.push(`<div class="cal-dow">${l}</div>`));

  for(let i = startOffset - 1; i >= 0; i--){
    cells.push(`<div class="cal-cell other-month"><div class="cal-daynum">${daysInPrevMonth - i}</div></div>`);
  }

  function slotsHtmlForCol(row, col){
    const segs = (rowSegments[row] || []).filter(s => col >= s.startCol && col <= s.endCol);
    if(segs.length === 0) return '';
    const maxLane = Math.max(...segs.map(s => s.lane));
    let html = '';
    for(let lane = 0; lane <= maxLane; lane++){
      const seg = segs.find(s => s.lane === lane);
      if(seg){
        const segId = `${seg.it.id}_r${row}`;
        html += `<div class="cal-bar-slot" data-seg="${segId}"></div>`;
      } else {
        html += `<div class="cal-bar-slot" data-seg="blank"></div>`;
      }
    }
    return html;
  }

  for(let d = 1; d <= daysInMonth; d++){
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = dateStr === todayStr;
    const dow = (startOffset + d - 1) % 7;
    const isWeekend = dow === 0 || dow === 6;
    const rc = calDateRowCol(dateStr, y, m);
    const dayEntries = (byDate[dateStr] || []).slice().sort((a,b) => {
      const ta = a.kind === 'campaign' ? (a.data.resvTime||"") : (a.data.time||"");
      const tb = b.kind === 'campaign' ? (b.data.resvTime||"") : (b.data.time||"");
      return ta.localeCompare(tb);
    });

    const eventsHtml = dayEntries.map(entry => {
      if(entry.kind === 'campaign'){
        const it = entry.data;
        const timeLabel = it.resvTime ? `${escapeHtml(it.resvTime)} ` : '';
        const statusLabel = `[${calStatusLabel[it.status]||it.status}]`;
        return `<div class="cal-event ${it.status}" onclick="calShowDetail('${it.id}','campaign')" title="${timeLabel}${statusLabel} ${escapeHtml(it.name)}"><span class="cal-event-time">${timeLabel}</span>${statusLabel} ${escapeHtml(it.name)}</div>`;
      } else {
        const it = entry.data;
        let timeLabel = it.time ? escapeHtml(it.time) : '';
        if(it.endTime) timeLabel = timeLabel ? `${timeLabel}~${escapeHtml(it.endTime)}` : escapeHtml(it.endTime);
        if(timeLabel) timeLabel += ' ';
        const ownerClass = coupleOwnerClass(it);
        const ownerLabel = `[${escapeHtml(it.owner||'관')}]`;
        return `<div class="cal-event ${ownerClass}" onclick="calShowDetail('${it.id}','couple')" title="${timeLabel}${ownerLabel} ${escapeHtml(it.title)}"><span class="cal-event-time">${timeLabel}</span>${ownerLabel} ${escapeHtml(it.title)}</div>`;
      }
    }).join('');

    const slotsHtml = rc ? slotsHtmlForCol(rc.row, rc.col) : '';

    let workoutDotsHtml = '';
    const gwanPlanned = workoutItems.some(w => w.date === dateStr && w.owner === '관');
    const boraPlanned = workoutItems.some(w => w.date === dateStr && w.owner === '보라');
    const isFuture = dateStr > todayStr;
    const gwanMissed = !isFuture && dateStr !== todayStr && !gwanPlanned && !isWeekend;

    workoutDotsHtml = `<div class="cal-workout-dots">
      ${gwanMissed
        ? `<span class="wo-x gwan" title="관 운동 안함">X</span>`
        : `<span class="wo-dot gwan ${gwanPlanned?'done':''}" title="관 운동${isFuture?' 예정':(gwanPlanned?' 완료':' 안함')}"></span>`}
      <span class="wo-dot bora ${boraPlanned?'done':''}" title="보라 운동${isFuture?' 예정':(boraPlanned?' 완료':' 안함')}"></span>
    </div>`;

    cells.push(`<div class="cal-cell ${isToday?'today':''}"><div class="cal-daynum-row"><div class="cal-daynum ${isWeekend?'weekend':''}">${d}</div>${workoutDotsHtml}</div>${slotsHtml}${eventsHtml}</div>`);
  }

  const totalSoFar = startOffset + daysInMonth;
  const trailing = (7 - (totalSoFar % 7)) % 7;
  for(let d = 1; d <= trailing; d++){
    cells.push(`<div class="cal-cell other-month"><div class="cal-daynum">${d}</div></div>`);
  }

  document.getElementById('calGrid').innerHTML = cells.join('');

  calCurrentSegments = [];
  Object.keys(rowSegments).forEach(rowKey => {
    rowSegments[rowKey].forEach(seg => calCurrentSegments.push(seg));
  });
  calPositionBars();
  workoutRender();
}

function calDateRowCol(dateStr, y, m){
  const [ey, em, ed] = dateStr.split('-').map(Number);
  if(ey !== y || em !== m+1) return null;
  const first = new Date(y, m, 1);
  const startOffset = first.getDay();
  const idx = startOffset + (ed - 1);
  return { row: Math.floor(idx / 7), col: idx % 7 };
}

function calPositionBars(){
  const layer = document.getElementById('calBarsLayer');
  const wrap = layer.parentElement;
  if(!layer || !wrap) return;
  const wrapRect = wrap.getBoundingClientRect();

  const html = calCurrentSegments.map(seg => {
    const segId = `${seg.it.id}_r${seg.row}`;
    const els = Array.from(document.querySelectorAll(`[data-seg="${segId}"]`));
    if(els.length === 0) return '';
    let left = Infinity, right = -Infinity, top = Infinity, bottom = -Infinity;
    els.forEach(el => {
      const r = el.getBoundingClientRect();
      left = Math.min(left, r.left);
      right = Math.max(right, r.right);
      top = Math.min(top, r.top);
      bottom = Math.max(bottom, r.bottom);
    });
    const it = seg.it;
    const ownerClass = coupleOwnerClass(it);
    const roundClass = (seg.isGlobalStart ? 'round-left ' : '') + (seg.isGlobalEnd ? 'round-right' : '');
    const label = coupleTimeLabel(it, seg.isGlobalStart, seg.isGlobalEnd);
    const ownerLabel = `[${escapeHtml(it.owner||'관')}]`;
    const text = (label ? label + ' ' : '') + ownerLabel + ' ' + escapeHtml(it.title);
    const style = `left:${left - wrapRect.left}px; top:${top - wrapRect.top}px; width:${right-left}px; height:${bottom-top}px;`;
    const titleAttr = `${it.time?escapeHtml(it.time):''}${it.endTime?('~'+escapeHtml(it.endTime)):''} ${ownerLabel} ${escapeHtml(it.title)}`;
    return `<div class="cal-bar ${ownerClass} ${roundClass}" style="${style}" onclick="calShowDetail('${it.id}','couple')" title="${titleAttr}">${text}</div>`;
  }).join('');

  layer.innerHTML = html;
}

let calResizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(calResizeTimer);
  calResizeTimer = setTimeout(calPositionBars, 150);
});

/* ---- 체험단 데이터 로드 ---- */
async function calLoad(){
  const { data, error } = await sb.from('campaigns').select('*');
  if(error){
    console.error("체험단 캘린더 데이터 로드 실패:", error);
  } else {
    calItems = data || [];
  }
  calRender();
}

/* ---- 부부 일정 데이터 로드 ---- */
async function coupleLoad(){
  if(!coupleLoggedIn) return;
  const { data, error } = await sb.from('couple_events').select('*').order('date');
  if(error){
    console.error("부부 일정 데이터 로드 실패:", error);
  } else {
    coupleItems = (data || []).map(coupleRowToItem);
  }
  calRender();
}

/* ---- 운동 트래커 데이터 로드 ---- */
async function workoutLoad(){
  if(!coupleLoggedIn) return;
  const { data, error } = await sb.from('workouts').select('*');
  if(error){
    console.error("운동 트래커 데이터 로드 실패:", error);
  } else {
    workoutItems = data || [];
  }
  calRender();
}

function workoutRender(){
  const summaryEl = document.getElementById('workoutSummary');
  const gwanCells = document.getElementById('workoutCells-관');
  const boraCells = document.getElementById('workoutCells-보라');
  if(!summaryEl || !gwanCells || !boraCells) return;
  if(!coupleLoggedIn) return;

  const y = calCursor.getFullYear();
  const m = calCursor.getMonth();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const now = new Date();
  const isCurrentMonth = (now.getFullYear() === y && now.getMonth() === m);
  const elapsedDays = isCurrentMonth ? now.getDate() : daysInMonth;
  const todayStr = calNormalizeDate(now);

  const doneSet = new Set(workoutItems.map(w => `${w.date}_${w.owner}`));
  const counts = { '관':0, '보라':0 };

  ['관','보라'].forEach(owner => {
    const ownerClass = owner === '관' ? 'owner-gwan' : 'owner-bora';
    let html = '';
    for(let d = 1; d <= daysInMonth; d++){
      const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dow = new Date(y, m, d).getDay();
      const isWeekend = dow === 0 || dow === 6;
      const isDone = doneSet.has(`${dateStr}_${owner}`);
      const isToday = dateStr === todayStr;
      const isPast = dateStr < todayStr;
      const isMissed = owner === '관' && isPast && !isDone && !isWeekend;
      if(isDone && d <= elapsedDays) counts[owner]++;
      const label = isMissed ? 'X' : d;
      const titleSuffix = isDone ? ' (운동함)' : (isMissed ? ' (운동 안함)' : (isWeekend ? ' (주말)' : ''));
      html += `<div class="workout-cell ${isDone ? 'done '+ownerClass : ''} ${isToday ? 'today' : ''} ${isMissed ? 'missed' : ''} ${(!isDone && isWeekend) ? 'weekend' : ''}" onclick="workoutToggle('${dateStr}','${owner}')" title="${dateStr} · ${escapeHtml(owner)}${titleSuffix}">${label}</div>`;
    }
    (owner === '관' ? gwanCells : boraCells).innerHTML = html;
  });

  summaryEl.innerHTML = `
    <span class="owner-gwan-txt">관 <b>${counts['관']}</b>/${elapsedDays}일</span>
    <span class="owner-bora-txt">보라 <b>${counts['보라']}</b>/${elapsedDays}일</span>
  `;

  requestAnimationFrame(() => {
    centerWorkoutToday(gwanCells);
    centerWorkoutToday(boraCells);
  });
}

// 오늘 날짜 칸이 항상 가로 스크롤 영역의 정중앙에 오도록 함(달이 시작할 땐 왼쪽 끝이
// 0 밑으로 못 내려가서 자연히 1일부터 보이고, 말일에 가까워지면 브라우저가 스크롤을
// 최대치에서 자동으로 멈춰줘서 그 이후로는 따로 처리할 필요가 없음).
function centerWorkoutToday(container){
  const todayCell = container.querySelector('.workout-cell.today');
  if(!todayCell) return;
  const target = todayCell.offsetLeft - (container.clientWidth / 2) + (todayCell.offsetWidth / 2);
  container.scrollLeft = Math.max(0, target);
}

async function workoutToggle(dateStr, owner){
  if(!coupleLoggedIn){ alert('로그인 후 이용해주세요.'); coupleShowLogin(); return; }
  const id = `${dateStr}_${owner}`;
  const existing = workoutItems.find(w => w.date === dateStr && w.owner === owner);
  if(existing){
    const { error } = await sb.from('workouts').delete().eq('id', id);
    if(error){ alert("체크 해제 실패: " + error.message); return; }
  } else {
    const { error } = await sb.from('workouts').insert({ id, date: dateStr, owner, done: true });
    if(error){ alert("체크 실패: " + error.message); return; }
  }
  await workoutLoad();
}

/* ---- Supabase 로그인 및 게이트 ---- */
function coupleShowLogin(){
  document.getElementById('coupleLoginOverlay').classList.add('open');
  const idInput = document.getElementById('coupleLoginId');
  if(idInput) setTimeout(() => idInput.focus(), 0);
}
function coupleHideLogin(){
  document.getElementById('coupleLoginOverlay').classList.remove('open');
}
function coupleIdToEmail(id){
  return `${id.trim().toLowerCase()}@${window.COUPLE_EMAIL_DOMAIN}`;
}
async function coupleLoginWithPassword(){
  const id = document.getElementById('coupleLoginId').value.trim();
  const pw = document.getElementById('coupleLoginPw').value;
  const msg = document.getElementById('coupleLoginMsg');
  if(!id || !pw){ alert('아이디와 비밀번호를 입력해주세요.'); return; }
  msg.textContent = "로그인 중...";
  const { error } = await sb.auth.signInWithPassword({
    email: coupleIdToEmail(id),
    password: pw
  });
  if(error){ msg.textContent = "로그인 실패: 아이디 또는 비밀번호를 확인해주세요."; return; }
  msg.textContent = "";
}

async function coupleInitAuth(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){
    coupleLoggedIn = true;
    coupleHideLogin();
    await calLoad();
    await coupleLoad();
    await workoutLoad();
  } else {
    coupleLoggedIn = false;
    coupleShowLogin();
  }
  sb.auth.onAuthStateChange(async (event, session) => {
    if(session){
      coupleLoggedIn = true;
      coupleHideLogin();
      await calLoad();
      await coupleLoad();
      await workoutLoad();
    } else {
      coupleLoggedIn = false;
      coupleItems = [];
      workoutItems = [];
      calRender();
    }
  });
}

// 이벤트 요약 상세 팝업
const calFieldLabels = {
  region: "지역",
  provide: "제공내역",
  address: "주소",
  contact: "예약문의",
  parking: "주차장",
  deadline: "마감일자",
  keyword: "키워드",
  platform: "플랫폼",
  resvDate: "예약일",
  resvTime: "예약시간"
};

function calShowDetail(id, kind){
  if(kind === 'couple'){
    const it = coupleItems.find(i => i.id === id);
    if(!it) return;

    const dateStr = it.endDate ? `${it.date} ~ ${it.endDate}` : it.date;
    let timeStr = it.time || "";
    if(it.endTime) timeStr = timeStr ? `${timeStr} ~ ${it.endTime}` : it.endTime;

    const ownerClass = coupleOwnerClass(it);

    document.getElementById('calModalBody').innerHTML = `
      <div class="cal-modal-title">${escapeHtml(it.title)}</div>
      <div class="cal-modal-badge" style="background:var(--${ownerClass}-bg);color:var(--${ownerClass}-ink);">
        ${escapeHtml(it.owner || '관')}
      </div>
      <div class="cal-modal-row">
        <span class="k">일자</span>
        <span class="v">${dateStr}</span>
      </div>
      ${timeStr ? `
      <div class="cal-modal-row">
        <span class="k">시간</span>
        <span class="v">${escapeHtml(timeStr)}</span>
      </div>` : ''}
      ${it.memo ? `
      <div class="cal-modal-row">
        <span class="k">메모</span>
        <span class="v">${escapeHtml(it.memo)}</span>
      </div>` : ''}
      <div class="cal-modal-actions">
        <button class="cal-modal-edit-btn" onclick="calCloseDetail(); coupleOpenEdit('${it.id}');">✏️ 수정하기</button>
        <button class="cal-modal-del-btn" onclick="calCloseDetail(); coupleDeleteEvent('${it.id}');">삭제</button>
      </div>
    `;
    document.getElementById('calModalOverlay').classList.add('open');
    return;
  }

  // 체험단 요약 팝업
  const it = calItems.find(i => i.id === id);
  if(!it) return;

  const rows = Object.keys(calFieldLabels)
    .filter(key => it[key])
    .map(key => `
      <div class="cal-modal-row">
        <span class="k">${calFieldLabels[key]}</span>
        <span class="v">${escapeHtml(it[key])}</span>
      </div>
    `).join('');

  document.getElementById('calModalBody').innerHTML = `
    <div class="cal-modal-title">${escapeHtml(it.name)}</div>
    <div class="cal-modal-badge status-badge-${it.status}" style="background:var(--${it.status}-bg);color:var(--${it.status}-ink);">
      ${calStatusLabel[it.status] || it.status}
    </div>
    ${rows}
  `;
  document.getElementById('calModalOverlay').classList.add('open');
}

function calCloseDetail(){
  document.getElementById('calModalOverlay').classList.remove('open');
}

function coupleSelectOwner(owner){
  coupleSelectedOwner = owner;
  document.querySelectorAll('#ownerToggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.owner === owner);
  });
}

function coupleOpenAdd(){
  if(!coupleLoggedIn){ alert('로그인 후 이용해주세요.'); coupleShowLogin(); return; }
  coupleEditId = null;
  document.getElementById('coupleModalTitle').textContent = "일정 추가";
  document.getElementById('couple-in-title').value = "";
  document.getElementById('couple-in-date').value = "";
  document.getElementById('couple-in-endDate').value = "";
  document.getElementById('couple-in-time').value = "";
  document.getElementById('couple-in-endTime').value = "";
  document.getElementById('couple-in-memo').value = "";
  document.getElementById('coupleStatusMsg').textContent = "";
  document.getElementById('coupleModalDelBtn').style.display = "none";
  coupleSelectOwner("관");
  document.getElementById('coupleAddOverlay').classList.add('open');
}

function coupleOpenEdit(id){
  const it = coupleItems.find(i => i.id === id);
  if(!it) return;
  coupleEditId = id;
  document.getElementById('coupleModalTitle').textContent = "일정 수정";
  document.getElementById('couple-in-title').value = it.title || "";
  document.getElementById('couple-in-date').value = it.date || "";
  document.getElementById('couple-in-endDate').value = it.endDate || "";
  document.getElementById('couple-in-time').value = it.time || "";
  document.getElementById('couple-in-endTime').value = it.endTime || "";
  document.getElementById('couple-in-memo').value = it.memo || "";
  document.getElementById('coupleStatusMsg').textContent = "";
  document.getElementById('coupleModalDelBtn').style.display = "block";
  coupleSelectOwner(it.owner === '보라' ? '보라' : (it.owner === '공통' ? '공통' : '관'));
  document.getElementById('coupleAddOverlay').classList.add('open');
}

function coupleCloseAdd(){
  document.getElementById('coupleAddOverlay').classList.remove('open');
}

/* 시작일을 고르면 종료일도 같은 날짜로 자동 세팅합니다 (이미 그보다 늦은 종료일이
   있으면 그대로 두어 여러 날짜 일정을 건드리지 않습니다). 시작 시간도 마찬가지입니다. */
document.getElementById('couple-in-date').addEventListener('change', function(){
  const start = this.value;
  const endInput = document.getElementById('couple-in-endDate');
  if(!start) return;
  if(!endInput.value || endInput.value < start){
    endInput.value = start;
  }
});
document.getElementById('couple-in-time').addEventListener('change', function(){
  const start = this.value;
  const endInput = document.getElementById('couple-in-endTime');
  if(!start) return;
  if(!endInput.value || endInput.value < start){
    endInput.value = start;
  }
});

async function coupleAddEvent(){
  const title = document.getElementById('couple-in-title').value.trim();
  const date = document.getElementById('couple-in-date').value;
  const endDate = document.getElementById('couple-in-endDate').value;
  const time = document.getElementById('couple-in-time').value;
  const endTime = document.getElementById('couple-in-endTime').value;
  const memo = document.getElementById('couple-in-memo').value.trim();
  const statusMsg = document.getElementById('coupleStatusMsg');
  const saveBtn = document.getElementById('coupleSaveBtn');

  if(!title){ alert('제목을 입력해주세요.'); return; }
  if(!date){ alert('날짜를 선택해주세요.'); return; }
  if(endDate && endDate < date){ alert('종료일은 날짜(시작일)보다 빠를 수 없어요.'); return; }
  if(time && endTime && (!endDate || endDate === date) && endTime < time){
    alert('종료 시간은 시작 시간보다 빠를 수 없어요. (날짜가 바뀌는 일정이면 종료일도 선택해주세요)');
    return;
  }

  if(!coupleLoggedIn){ alert('로그인 후 이용해주세요.'); coupleShowLogin(); return; }

  const isEdit = !!coupleEditId;
  const item = {
    id: isEdit ? coupleEditId : uid(),
    title, date, endDate, time, endTime, memo,
    owner: coupleSelectedOwner,
    createdAt: isEdit
      ? (coupleItems.find(i => i.id === coupleEditId)?.createdAt || new Date().toISOString())
      : new Date().toISOString()
  };
  const row = coupleItemToRow(item);

  saveBtn.disabled = true;
  statusMsg.textContent = "저장 중...";
  try{
    const { error } = isEdit
      ? await sb.from('couple_events').update(row).eq('id', coupleEditId)
      : await sb.from('couple_events').insert(row);
    if(error) throw error;
    await coupleLoad();
    statusMsg.textContent = "저장 완료 ✓";
    setTimeout(coupleCloseAdd, 500);
  }catch(err){
    statusMsg.textContent = "저장 실패: " + err.message;
  }
  saveBtn.disabled = false;
}

async function coupleDeleteEvent(id){
  if(!id) return;
  if(!coupleLoggedIn){ alert('로그인 후 이용해주세요.'); coupleShowLogin(); return; }
  if(!confirm('이 일정을 삭제할까요?')) return;
  const { error } = await sb.from('couple_events').delete().eq('id', id);
  if(error){
    alert("삭제 실패: " + error.message);
    return;
  }
  await coupleLoad();
  coupleCloseAdd();
}
</script>
</body>
