<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task · 포트폴리오</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#3a5a52">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BORAKWAN">
<link rel="stylesheet" href="./common.css">
<link rel="stylesheet" href="./panel-common.css">
<style>
  header{margin-bottom:20px;}
        
  /* ---- 상태 요약 카드 ---- */
  .summary{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:22px;
  }
  .sum-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    cursor:pointer;
    transition:border-color .12s ease;
  }
  .sum-card:hover{border-color:var(--accent);}
  .sum-card.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(58,90,82,0.15);}
  .sum-card .num{font-size:22px;font-weight:700;}
  .sum-card .lbl{font-size:12.5px;color:var(--sub);margin-top:2px;}
  .sum-card.idea .num{color:var(--wait-ink);}
  .sum-card.doing .num{color:var(--conf-ink);}
  .sum-card.done .num{color:var(--done-ink);}
  .sum-card.hold .num{color:var(--end-ink);}

  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px;
    margin-bottom:24px;
  }
    
  .section-title{
    font-size:13px;
    font-weight:600;
    color:var(--sub);
    margin:28px 0 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-title::before{
    content:"";
    width:6px;height:6px;border-radius:50%;
    background:var(--accent);
    display:inline-block;
  }

  .form-grid{
    display:grid;
    grid-template-columns:1fr 1.4fr;
    gap:16px;
  }
  .field{margin-bottom:12px;}
    .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  input[type=text], input[type=url], select, textarea{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:7px;
    font-size:13.5px;
    background:#fff;
    color:var(--ink);
    font-family:inherit;
  }
  textarea{resize:vertical;min-height:60px;}
  input:focus, select:focus, textarea:focus{
    outline:none;
    border-color:var(--accent);
  }

  .image-drop{
    border:1.5px dashed var(--line);
    border-radius:10px;
    padding:14px;
    text-align:center;
    cursor:pointer;
    color:var(--sub);
    font-size:12.5px;
    position:relative;
    min-height:160px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:#fafaf8;
  }
  .image-drop img{
    max-width:100%;
    max-height:220px;
    border-radius:6px;
    object-fit:cover;
  }
  .image-drop input[type=file]{
    position:absolute;
    inset:0;
    opacity:0;
    cursor:pointer;
  }
  .upload-status{
    font-size:11.5px;
    color:var(--sub);
    margin-top:6px;
  }

  .save-btn{
    margin-top:6px;
    background:var(--accent);
    color:#fff;
    border:none;
    padding:10px 22px;
    border-radius:7px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
  }
  .save-btn:hover{opacity:0.9;}
  .save-btn:disabled{opacity:0.5;cursor:not-allowed;}

  /* ---- 필터 탭 ---- */
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
  .tab{
    border:1px solid var(--line);
    background:#fff;
    padding:7px 14px;
    border-radius:20px;
    font-size:13px;
    cursor:pointer;
    color:var(--sub);
  }
  .tab.active{
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
  }
  .cat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
  .cat-tab{
    border:1px dashed var(--line);
    background:#fff;
    padding:5px 12px;
    border-radius:20px;
    font-size:12px;
    cursor:pointer;
    color:var(--sub);
  }
  .cat-tab.active{
    background:#eef0ec;
    border-style:solid;
    border-color:var(--accent);
    color:var(--accent);
    font-weight:600;
  }

  /* ---- 프로젝트 카드 ---- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
    gap:16px;
  }
  .project-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .project-card .thumb{
    width:100%;
    aspect-ratio:16/10;
    background:#eef0ec;
    overflow:hidden;
  }
  .project-card .thumb img{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .project-card .body{
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:8px;
    flex:1;
  }
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .status-select{
    font-size:11px;
    padding:4px 8px;
    border-radius:20px;
    border:1px solid transparent;
    font-weight:700;
    cursor:pointer;
  }
  .status-select.idea{background:var(--wait-bg);color:var(--wait-ink);}
  .status-select.doing{background:var(--conf-bg);color:var(--conf-ink);}
  .status-select.done{background:var(--done-bg);color:var(--done-ink);}
  .status-select.hold{background:var(--end-bg);color:var(--end-ink);}
  .cat-badge{
    font-size:11px;
    padding:3px 9px;
    border-radius:5px;
    background:#eef0ec;
    color:var(--sub);
    white-space:nowrap;
  }
  .project-card .title{font-size:15.5px;font-weight:700;}
  .project-card .period{font-size:11.5px;color:var(--sub);}
  .project-card .desc{
    font-size:12.5px;
    color:var(--sub);
    line-height:1.5;
    white-space:pre-wrap;
  }
  .impact-box{
    background:#f5f7f0;
    border-left:3px solid var(--accent);
    border-radius:6px;
    padding:8px 10px;
    font-size:12px;
    color:var(--ink);
    line-height:1.5;
    white-space:pre-wrap;
  }
  .impact-box .lbl{font-size:10.5px;font-weight:700;color:var(--accent);display:block;margin-bottom:3px;}
  .card-actions{
    display:flex;
    gap:8px;
    margin-top:auto;
    padding-top:8px;
  }
  .ext-link{
    flex:1;
    text-align:center;
    background:#eef0ec;
    color:var(--ink);
    text-decoration:none;
    font-size:12px;
    font-weight:600;
    padding:8px 10px;
    border-radius:7px;
  }
  .ext-link:hover{background:#e2e6de;}
  .del-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--sub);
    cursor:pointer;
    font-size:13px;
    padding:8px 12px;
    border-radius:7px;
  }
  .del-btn:hover{border-color:#b3452f;color:#b3452f;}

  
  
  @media (max-width:720px){
    .form-grid{grid-template-columns:1fr;}
    .field-row{grid-template-columns:1fr;}
    .summary{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>
<script src="./nav.js?v=3"></script>
<div class="wrap" id="appContent">

  <header>
    <h1>Task · 포트폴리오</h1>
    <p>이직을 준비하며 만들고 있는 프로젝트를 정리합니다. 상태와 성과를 같이 기록해두면 나중에 이력서 쓸 때 바로 꺼내 쓸 수 있어요.</p>
  </header>

  <div class="summary" id="summary"></div>

  <div class="panel">
    <h2>새 프로젝트 추가</h2>
    <div class="form-grid">
      <div>
        <div class="field">
          <label>썸네일 이미지 (선택)</label>
          <div class="image-drop" id="dropZone">
            <span id="dropLabel">클릭해서 이미지 선택</span>
            <input type="file" accept="image/*" id="in-image">
          </div>
          <div class="upload-status" id="uploadStatus"></div>
        </div>
      </div>
      <div>
        <div class="field">
          <label>프로젝트 제목</label>
          <input type="text" id="in-title" placeholder="예: 위베베 시즌3 캠페인">
        </div>
        <div class="field-row">
          <div class="field">
            <label>상태</label>
            <select id="in-status">
              <option value="idea">아이디어</option>
              <option value="doing" selected>진행중</option>
              <option value="done">완료</option>
              <option value="hold">보류</option>
            </select>
          </div>
          <div class="field">
            <label>카테고리 (선택)</label>
            <input type="text" id="in-category" placeholder="예: 마케팅, 데이터분석">
          </div>
        </div>
        <div class="field">
          <label>기간 (선택)</label>
          <input type="text" id="in-period" placeholder="예: 2025.03 ~ 2025.06">
        </div>
        <div class="field">
          <label>설명 / 내가 한 일</label>
          <textarea id="in-description" placeholder="어떤 배경에서, 무엇을, 어떻게 했는지 적어주세요"></textarea>
        </div>
        <div class="field">
          <label>성과 (선택)</label>
          <textarea id="in-impact" placeholder="예: 전환율 18% 개선, 재구매율 12%p 상승 등 — 가능하면 숫자로"></textarea>
        </div>
        <div class="field-row">
          <div class="field">
            <label>노션 링크 (선택)</label>
            <input type="url" id="in-notion" placeholder="https://notion.so/...">
          </div>
          <div class="field">
            <label>결과물 링크 (선택)</label>
            <input type="url" id="in-result" placeholder="배포 사이트, PDF 등">
          </div>
        </div>
        <button class="save-btn" id="saveBtn" onclick="addProject()">+ 추가하기</button>
      </div>
    </div>
  </div>

  <div class="tabs" id="statusTabs"></div>
  <div class="cat-tabs" id="catTabs"></div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyMsg" style="display:none;">아직 등록된 프로젝트가 없어요.</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script src="./common.js"></script>
<script>
/* ===========================================================
   Supabase 연동 설정 (tasks 테이블 + task-images 스토리지)
   =========================================================== */
const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY, {
  auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true }
});
window.sb = sb; // auth-gate.js가 같은 클라이언트를 재사용하도록 공유

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    sb.auth.startAutoRefresh();
  } else {
    sb.auth.stopAutoRefresh();
  }
});

const STATUS_META = {
  idea:  { label:"아이디어", cls:"idea" },
  doing: { label:"진행중",   cls:"doing" },
  done:  { label:"완료",     cls:"done" },
  hold:  { label:"보류",     cls:"hold" },
};
const STATUS_ORDER = ["idea","doing","done","hold"];

let projects = [];
let statusFilter = "all";
let categoryFilter = "all";
let pendingImageUrl = "";

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }


async function loadProjects(){
  const { data, error } = await sb.from('tasks').select('*');
  if (error) {
    console.error("불러오기 실패:", error);
  } else {
    projects = data || [];
  }
  render();
}

function setStatusFilter(f){ statusFilter = f; render(); }
function setCategoryFilter(f){ categoryFilter = f; render(); }

function render(){
  renderSummary();
  renderTabs();

  let list = projects.slice();
  if(statusFilter !== "all") list = list.filter(p => p.status === statusFilter);
  if(categoryFilter !== "all") list = list.filter(p => (p.category||"").trim() === categoryFilter);
  list.sort((a,b) => (b.updatedAt||"").localeCompare(a.updatedAt||""));

  const grid = document.getElementById('grid');
  const emptyMsg = document.getElementById('emptyMsg');

  if(list.length === 0){
    grid.innerHTML = "";
    emptyMsg.style.display = "block";
    return;
  }
  emptyMsg.style.display = "none";

  grid.innerHTML = list.map(p => {
    const meta = STATUS_META[p.status] || STATUS_META.idea;
    return `
    <div class="project-card">
      <div class="thumb">
        ${p.imageUrl ? `<img src="${escapeHtml(p.imageUrl)}" alt="">` : ''}
      </div>
      <div class="body">
        <div class="card-top">
          <select class="status-select ${meta.cls}" onchange="updateStatus('${p.id}', this.value)">
            ${STATUS_ORDER.map(s => `<option value="${s}" ${s===p.status?'selected':''}>${STATUS_META[s].label}</option>`).join('')}
          </select>
          ${p.category ? `<span class="cat-badge">${escapeHtml(p.category)}</span>` : ''}
        </div>
        <div class="title">${escapeHtml(p.title)}</div>
        ${p.period ? `<div class="period">${escapeHtml(p.period)}</div>` : ''}
        ${p.description ? `<div class="desc">${escapeHtml(p.description)}</div>` : ''}
        ${p.impact ? `<div class="impact-box"><span class="lbl">성과</span>${escapeHtml(p.impact)}</div>` : ''}
        <div class="card-actions">
          ${p.notionUrl ? `<a class="ext-link" href="${escapeHtml(p.notionUrl)}" target="_blank" rel="noopener">노션 →</a>` : ''}
          ${p.resultUrl ? `<a class="ext-link" href="${escapeHtml(p.resultUrl)}" target="_blank" rel="noopener">결과물 →</a>` : ''}
          <button class="del-btn" onclick="deleteProject('${p.id}')">삭제</button>
        </div>
      </div>
    </div>
  `;}).join('');
}

function renderSummary(){
  const counts = { idea:0, doing:0, done:0, hold:0 };
  projects.forEach(p => { if(counts[p.status] !== undefined) counts[p.status]++; });
  const defs = [
    { key:"idea", label:"아이디어", cls:"idea" },
    { key:"doing", label:"진행중", cls:"doing" },
    { key:"done", label:"완료", cls:"done" },
    { key:"hold", label:"보류", cls:"hold" },
  ];
  document.getElementById('summary').innerHTML = defs.map(d => `
    <div class="sum-card ${d.cls} ${statusFilter===d.key?'active':''}" onclick="setStatusFilter('${statusFilter===d.key?'all':d.key}')">
      <div class="num">${counts[d.key]}</div>
      <div class="lbl">${d.label}</div>
    </div>
  `).join('');
}

function renderTabs(){
  const statusTabs = ["all", ...STATUS_ORDER];
  document.getElementById('statusTabs').innerHTML = statusTabs.map(s => `
    <button class="tab ${statusFilter===s?'active':''}" onclick="setStatusFilter('${s}')">${s==='all'?'전체':STATUS_META[s].label}</button>
  `).join('');

  const cats = Array.from(new Set(projects.map(p => (p.category||"").trim()).filter(Boolean)));
  const catTabsEl = document.getElementById('catTabs');
  if(cats.length === 0){ catTabsEl.innerHTML = ""; return; }
  catTabsEl.innerHTML = ["all", ...cats].map(c => `
    <button class="cat-tab ${categoryFilter===c?'active':''}" onclick="setCategoryFilter('${escapeHtml(c)}')">${c==='all'?'전체 카테고리':escapeHtml(c)}</button>
  `).join('');
}

async function updateStatus(id, status){
  const { error } = await sb.from('tasks').update({ status, updatedAt: new Date().toISOString().slice(0,10) }).eq('id', id);
  if(error){ alert("상태 변경 실패: " + error.message); return; }
  const p = projects.find(x => x.id === id);
  if(p) p.status = status;
  render();
}

// 이미지 선택 → 미리보기 + Supabase Storage 업로드
function bindImageInput(){
  const input = document.getElementById('in-image');
  input.addEventListener('change', async function(e){
    const file = e.target.files[0];
    if(!file) return;

    const statusEl = document.getElementById('uploadStatus');
    const saveBtn = document.getElementById('saveBtn');

    const reader = new FileReader();
    reader.onload = async function(evt){
      const dataUrl = evt.target.result;
      document.getElementById('dropZone').innerHTML =
        `<img src="${dataUrl}" alt=""><input type="file" accept="image/*" id="in-image">`;
      bindImageInput();

      statusEl.textContent = "업로드 중...";
      saveBtn.disabled = true;

      const ext = (file.name.split('.').pop() || 'png').toLowerCase();
      const path = `${uid()}.${ext}`;

      const { error: uploadError } = await sb.storage
        .from('task-images')
        .upload(path, file, { contentType: file.type, upsert: false });

      if(uploadError){
        statusEl.textContent = "업로드 실패: " + uploadError.message;
        pendingImageUrl = "";
      } else {
        const { data: pub } = sb.storage.from('task-images').getPublicUrl(path);
        pendingImageUrl = pub.publicUrl;
        statusEl.textContent = "업로드 완료 ✓";
      }
      saveBtn.disabled = false;
    };
    reader.readAsDataURL(file);
  });
}
bindImageInput();

async function addProject(){
  const title = document.getElementById('in-title').value.trim();
  const status = document.getElementById('in-status').value;
  const category = document.getElementById('in-category').value.trim();
  const period = document.getElementById('in-period').value.trim();
  const description = document.getElementById('in-description').value.trim();
  const impact = document.getElementById('in-impact').value.trim();
  const notionUrl = document.getElementById('in-notion').value.trim();
  const resultUrl = document.getElementById('in-result').value.trim();

  if(!title){ alert('프로젝트 제목을 입력해주세요.'); return; }

  const newItem = {
    id: uid(),
    title, status, category, period, description, impact, notionUrl, resultUrl,
    imageUrl: pendingImageUrl,
    updatedAt: new Date().toISOString().slice(0,10)
  };

  const { error } = await sb.from('tasks').insert(newItem);
  if (error) {
    alert("저장 실패: " + error.message);
    return;
  }
  await loadProjects();

  document.getElementById('in-title').value = "";
  document.getElementById('in-status').value = "doing";
  document.getElementById('in-category').value = "";
  document.getElementById('in-period').value = "";
  document.getElementById('in-description').value = "";
  document.getElementById('in-impact').value = "";
  document.getElementById('in-notion').value = "";
  document.getElementById('in-result').value = "";
  document.getElementById('uploadStatus').textContent = "";
  pendingImageUrl = "";
  document.getElementById('dropZone').innerHTML =
    `<span id="dropLabel">클릭해서 이미지 선택</span><input type="file" accept="image/*" id="in-image">`;
  bindImageInput();

  render();
}

async function deleteProject(id){
  if(!confirm('이 프로젝트를 삭제할까요?')) return;
  const { error } = await sb.from('tasks').delete().eq('id', id);
  if (error) {
    alert("삭제 실패: " + error.message);
    return;
  }
  await loadProjects();
}

loadProjects();
</script>
<script src="./auth-gate.js"></script>
</body>
</html>
