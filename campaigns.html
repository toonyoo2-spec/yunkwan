<style>
  .subnav{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  .subnav a{
    text-decoration:none;
    border:1px solid var(--line);
    background:#fff;
    color:var(--sub);
    padding:8px 16px;
    border-radius:20px;
    font-size:13.5px;
    font-weight:600;
  }
  .subnav a.active{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }

  header{
    margin-bottom:16px;
  }

  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 20px;
    margin-bottom:16px;
  }

  .filter-row{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .filter-row .lbl{
    font-size:12px;
    color:var(--sub);
    font-weight:600;
  }
  .chip-group{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
  }
  .chip{
    border:1px solid var(--line);
    background:#fff;
    color:var(--sub);
    padding:6px 14px;
    border-radius:20px;
    font-size:13px;
    cursor:pointer;
    user-select:none;
  }
  .chip.on{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }
  .weekend-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    color:var(--ink);
    cursor:pointer;
    user-select:none;
  }
  .weekend-toggle input{ width:16px; height:16px; cursor:pointer; }

  .count-line{
    font-size:12.5px;
    color:var(--sub);
    margin-bottom:10px;
  }

  .table-wrap{
    width:100%;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  table{
    width:100%;
    min-width:640px;
    border-collapse:collapse;
    font-size:13.5px;
  }
  thead th{
    text-align:left;
    font-size:12px;
    color:var(--sub);
    font-weight:600;
    padding:0 10px 10px;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  tbody td{
    padding:11px 10px;
    border-bottom:1px solid var(--line);
    vertical-align:top;
  }
  tbody tr{ cursor:pointer; }
  tbody tr:hover{ background:#fafaf7; }
  tbody tr.picked{ background:var(--conf-bg); }
  tbody tr.picked:hover{ background:var(--conf-bg); }

  .pick-cell{ width:34px; text-align:center; }
  .pick-box{
    width:20px; height:20px;
    cursor:pointer;
  }

  .region-cell{ white-space:nowrap; }
  .badge.region{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    padding:3px 8px;
    border-radius:6px;
    background:#e6efe9;
    color:var(--accent);
    white-space:nowrap;
  }
  .badge.source{
    display:block;
    font-size:10.5px;
    color:var(--sub);
    margin-top:4px;
  }

  .place-cell{ font-weight:700; min-width:120px; }
  .place-cell a{ color:var(--ink); text-decoration:none; }
  .place-cell a:hover{ text-decoration:underline; }

  .content-cell{ color:var(--sub); min-width:160px; }

  .status-cell{ white-space:nowrap; }
  .badge.deadline{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    padding:3px 8px;
    border-radius:6px;
    background:var(--done-bg);
    color:var(--done-ink);
    margin-bottom:4px;
  }
  .badge.deadline.soon{background:#fbe3db;color:#b3452f;}
  .badge.deadline.near{background:var(--wait-bg);color:var(--wait-ink);}
  .badge.deadline.rolling{background:var(--conf-bg);color:var(--conf-ink);}
  .badge.nbh{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:#efe9fb;color:#5b3fa8;white-space:nowrap;}
  .badge.two{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:#fff1d6;color:#8a5a00;white-space:nowrap;}
  .curated-toggle{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:6px;}
  .curated-note{font-size:12px;color:var(--sub);}
  .weekend-tag{
    display:block;
    font-size:11.5px;
  }
  .weekend-tag.possible{ color:var(--conf-ink); }
  .weekend-tag.impossible{ color:#b3452f; }
  .weekend-tag.unknown{ color:var(--sub); }

  .empty{
    text-align:center;
    padding:60px 0;
    color:var(--sub);
    font-size:13.5px;
    line-height:1.7;
  }

  /* ---- 모바일 카드 (테이블 대신) ---- */
  .mobile-cards{ display:none; }
  .camp-card{
    display:block;
    background:#fff;
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px;
    text-decoration:none;
    color:var(--ink);
  }
  .camp-card.picked{ background:var(--conf-bg); border-color:var(--conf-ink); }
  .camp-card .card-top{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
  }
  .camp-card .card-top .pick-box{ width:22px; height:22px; flex-shrink:0; }
  .camp-card .card-title{
    display:block;
    font-size:15px;
    font-weight:700;
    color:var(--ink);
    text-decoration:none;
    margin-bottom:6px;
  }
  .camp-card .card-content{
    font-size:13px;
    color:var(--sub);
    margin-bottom:8px;
    line-height:1.5;
  }
  .camp-card .card-status{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }

  @media (max-width:820px){
    body{ padding:16px 10px 40px; }
    .panel{ padding:14px; }
    .table-wrap{ display:none; }
    .mobile-cards{ display:flex; flex-direction:column; gap:10px; }
    .chip{ padding:8px 14px; font-size:13.5px; }
    h1{ font-size:21px; }
  }

  #appContent{display:none;}
  .camp-card{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;align-items:start}.camp-thumb{width:76px;height:76px;border-radius:10px;object-fit:cover;background:var(--line);display:block}.camp-thumb.placeholder{display:grid;place-items:center;color:var(--sub);font-size:11px}.camp-body{min-width:0}
  .apply-start,.apply-job button{border:1px solid var(--accent);border-radius:8px;padding:7px 12px;background:var(--accent);color:#fff;font-size:12px;cursor:pointer}.apply-start:disabled{opacity:.5;cursor:default}.apply-job{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--accent)}.apply-job small{display:block;flex-basis:100%;color:var(--sub)}.apply-direct{font-size:12px}#applyApproval{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:24px;max-width:540px;width:calc(100% - 28px);max-height:85vh;overflow:auto}#applyApproval::backdrop{background:#0007}#applyApproval h2{font-size:19px}#applyApproval p,#applyApproval li{font-size:13px;line-height:1.6}#applyApproval li{margin-bottom:7px}.apply-consent{display:flex;gap:9px;font-size:13px;line-height:1.6}.apply-consent input{flex-shrink:0;width:18px;height:18px}.apply-help{color:var(--sub)}.apply-actions{display:flex;justify-content:flex-end;gap:10px}.apply-actions button{padding:9px 14px;border-radius:8px;border:1px solid var(--line)}#applyApprove{background:var(--accent);color:#fff}#applyApprove:disabled{opacity:.45}#applyError{color:#b3452f}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script src="./common.js"></script>
<script>
/* ===========================================================
   지역/사이트 캐노니컬 정의 + Supabase 연동 (campaign_listings 테이블)
   =========================================================== */
const REGION_AREAS = ['용산구','마포구','영등포구','서대문구','강서구','고양시','파주시'];
const SOURCES = ['디너의여왕','강남맛집','놀러와체험단','리뷰노트','레뷰'];
const WEEKEND_LABEL = { possible: '✓ 주말가능', impossible: '× 주말불가', unknown: '? 확인필요' };

const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY, {
  auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true }
});
window.sb = sb; // auth-gate.js가 같은 클라이언트를 재사용하도록 공유

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    sb.auth.startAutoRefresh();
  } else {
    sb.auth.stopAutoRefresh();
  }
});

const NEIGHBORHOODS = ['합정','홍대','덕양구','일산','영등포','여의도','가양','발산','마곡'];
const state = { items: [], nbh: 'all', weekendOnly: false };
function cleanTitle(title){
  let s=(title||'').trim(); const br=[...s.matchAll(/\[([^\]]+)\]/g)].map(m=>m[1].trim());
  if(br.length && s.endsWith(']') && !/^(서울|경기|인천|고양|마포|홍대|합정|연남|여의도|영등포|마곡|강서|일산)/.test(br.at(-1))) s=br.at(-1);
  s=s.replace(/\[[^\]]*\]/g,' ').replace(/\s*\d+\s*차\s*$/,'').replace(/\([^)]*(체험|런치|점심|저녁)[^)]*\)/g,' ').replace(/[\u{1F300}-\u{1FAFF}]/gu,'').replace(/\s+(점심|저녁|런치)$/,'').replace(/^\d+\s*만원\s*(식사권|체험권|이용권)!?\s*/,'').trim();
  return s.replace(/\s+/g,' ') || title || '(제목 없음)';
}

function daysLeft(dateStr){
  if(!dateStr) return null;
  const today = new Date();
  today.setHours(0,0,0,0);
  const d = new Date(dateStr);
  d.setHours(0,0,0,0);
  return Math.round((d - today) / 86400000);
}

function effDeadline(item){
  return item.curated && item.curated_deadline ? item.curated_deadline : (item.deadline_type === 'dated' ? item.deadline_date : null);
}

function deadlineBadge(item){
  if(effDeadline(item)){
    const dleft = daysLeft(effDeadline(item));
    let cls = '';
    let label = `D-${dleft}`;
    if(dleft < 0) label = '마감';
    else if(dleft === 0) label = '오늘마감';
    if(dleft < 0) cls = 'closed';
    else if(dleft <= 3) cls = 'soon';
    else if(dleft <= 7) cls = 'near';
    return `<span class="badge deadline ${cls}">${label}</span>`;
  }
  if(item.deadline_type === 'rolling'){
    return `<span class="badge deadline rolling">선착순</span>`;
  }
  return `<span class="badge deadline">${item.raw_deadline_text || '상시'}</span>`;
}

function placeName(it){ return it.id === '놀러와체험단_1793751426' ? '여의녘' : cleanTitle(it.title); }

async function togglePicked(id, current){
  const { error } = await sb
    .from('campaign_listings')
    .update({ picked: !current, picked_at: !current ? new Date().toISOString() : null })
    .eq('id', id);
  if(error) console.error(error);
  // realtime 구독이 다시 불러오므로 여기선 별도 갱신 안 해도 됨
}

function isLive(it){ return it.curated && (it.picked || !effDeadline(it) || daysLeft(effDeadline(it)) >= 0); }
function renderFilters(){
  const bar=document.getElementById('filterBar'); if(!bar) return;
  const live=state.items.filter(isLive);
  const base=state.weekendOnly?live.filter(it=>it.weekend_ok==='possible'):live;
  const counts={}; for(const it of base){ counts[it.neighborhood]=(counts[it.neighborhood]||0)+1; }
  const weekendCount=live.filter(it=>it.weekend_ok==='possible').length;
  const chip=(key,label,n,on)=>'<button type="button" class="chip'+(on?' on':'')+'" data-nbh="'+key+'" aria-pressed="'+on+'">'+label+' <small>'+n+'</small></button>';
  bar.innerHTML=chip('all','전체',base.length,state.nbh==='all')+NEIGHBORHOODS.filter(n=>counts[n]||state.nbh===n).map(n=>chip(n,n,counts[n]||0,state.nbh===n)).join('')+'<span class="filter-sep" aria-hidden="true"></span><button type="button" class="chip'+(state.weekendOnly?' on':'')+'" data-weekend="1" aria-pressed="'+state.weekendOnly+'">주말 가능 <small>'+weekendCount+'</small></button>';
}
document.getElementById('filterBar')?.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.weekend){ state.weekendOnly=!state.weekendOnly; }
  else if(b.dataset.nbh){ state.nbh=b.dataset.nbh; }
  renderList();
});
let listingLimit = 30;
let listingSignature = '';
function renderList(){
  renderFilters();
  const search = (document.getElementById('listingSearch')?.value || '').trim().toLocaleLowerCase();
  const signature = search+'|'+state.nbh+'|'+state.weekendOnly;
  if(signature !== listingSignature){ listingLimit=30;listingSignature=signature; }
  // 마감일이 지난 건(수집만 되고 자동으로 안 지워지는 항목)은 기본 목록에서 빼서,
  // 새로고침해도 이미 끝난 캠페인들이 위쪽(마감일 오름차순이라 지난 날짜가 먼저 옴)에
  // 계속 쌓여 보이는 문제를 막는다. 찜한(picked) 건은 지나도 계속 보여준다.
  const filtered = state.items.filter(it =>
    (!search || [placeName(it),it.title,it.reward_text,it.curated_reward,it.neighborhood,it.source,it.region_area].join(' ').toLocaleLowerCase().includes(search)) &&
    it.curated && (state.nbh === 'all' || it.neighborhood === state.nbh) && (!state.weekendOnly || it.weekend_ok === 'possible') &&
    (it.picked || !effDeadline(it) || daysLeft(effDeadline(it)) >= 0)
  );

  // 정렬: 픽된 것 먼저, 그 다음 마감일 확정 건 → 임박순, 그 다음 선착순/상시
  filtered.sort((a, b) => {
    if(a.picked !== b.picked) return a.picked ? -1 : 1;
    const da = effDeadline(a) ? new Date(effDeadline(a)) : null;
    const db = effDeadline(b) ? new Date(effDeadline(b)) : null;
    if(da && db) return da - db;
    if(da) return -1;
    if(db) return 1;
    return 0;
  });

  const visible = filtered.slice(0,listingLimit);
  const more = document.getElementById('listingMore');
  more.hidden = visible.length >= filtered.length;
  more.textContent = `30건 더 보기 · ${Math.max(0,filtered.length-visible.length)}건 남음`;
  const tbody = document.getElementById('tbody');
  const cardList = document.getElementById('cardList');
  const emptyMsg = document.getElementById('emptyMsg');

  if(filtered.length === 0){
    tbody.innerHTML = '';
    cardList.innerHTML = '';
    emptyMsg.style.display = 'block';
    emptyMsg.textContent = state.items.length === 0
      ? '아직 수집된 캠페인이 없습니다.'
      : '선택한 조건에 해당하는 캠페인이 없습니다.';
  } else {
    emptyMsg.style.display = 'none';
    tbody.innerHTML = '';

    cardList.innerHTML = visible.map(it => `
      <div class="camp-card ${it.picked ? 'picked' : ''}" data-id="${it.id}">
        ${it.thumbnail ? `<img class="camp-thumb" src="${escapeHtml(it.thumbnail)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : `<div class="camp-thumb placeholder">${escapeHtml(it.source)}</div>`}
        <div class="camp-body">
        <div class="card-top">
          <input type="checkbox" class="pick-box" aria-label="${escapeHtml(placeName(it))} 찜하기" ${it.picked ? 'checked' : ''} data-id="${it.id}" data-picked="${it.picked}">
          <span class="badge region">${it.region_area}</span>
          <span class="badge source" style="margin-top:0;">${it.source}</span>
          ${it.curated && it.neighborhood ? `<span class="badge nbh">${escapeHtml(it.neighborhood)}</span>` : ''}
          ${it.curated && it.two_person ? `<span class="badge two">2인</span>` : ''}
        </div>
        <a class="card-title" href="${it.url || '#'}" target="_blank" rel="noopener">${escapeHtml(placeName(it))}</a>
        <div class="card-content">${escapeHtml((it.curated && it.curated_reward) || it.reward_text || '-')}</div>
        <div class="card-status">
          ${deadlineBadge(it)}
          <span class="weekend-tag ${it.weekend_ok}">${WEEKEND_LABEL[it.weekend_ok] || WEEKEND_LABEL.unknown}</span>
          ${applyControls(it)}
        </div>
        </div>
      </div>
    `).join('');

    cardList.querySelectorAll('.camp-thumb').forEach(img => img.addEventListener('error', () => { const fallback=document.createElement('div'); fallback.className='camp-thumb placeholder'; fallback.textContent=img.closest('.camp-card')?.querySelector('.badge.source')?.textContent||''; img.replaceWith(fallback); }, {once:true}));
    document.querySelectorAll('.pick-box').forEach(box => {
      box.addEventListener('click', (e) => {
        e.stopPropagation();
        togglePicked(box.dataset.id, box.dataset.picked === 'true');
      });
    });
  }

  document.getElementById('countLine').textContent = `${filtered.length}건 · ${visible.length}건 표시`;
}

let listingsLoading = false;
async function loadListings(){
  if(listingsLoading) return;
  listingsLoading = true;
  try {
    const pageSize = 500;
    const listings = [];
    for(let offset = 0; ; offset += pageSize){
      const { data, error } = await sb.from('campaign_listings').select('*')
        .order('deadline_date', { ascending:true, nullsFirst:false })
        .order('id', { ascending:true })
        .range(offset, offset + pageSize - 1);
      if(error) throw error;
      listings.push(...(data || []));
      if(!data || data.length < pageSize) break;
    }
    state.items = listings;
    await loadApplyJobs();
    renderList();
  } catch(error) {
    console.error(error);
    document.getElementById('countLine').textContent = '목록을 불러오지 못했어요. 잠시 후 다시 시도해요.';
  } finally {
    listingsLoading = false;
  }
}

const APPLY_CONSENT_VERSION = 'dq-20261110';
const APPLY_LABELS = {pending:'신청 대기',processing:'신청 처리 중',submitted:'신청 완료',needs_input:'직접 확인 필요',failed:'신청 불가',cancelled:'신청 취소됨',uncertain:'신청 결과 확인 필요'};
const APPLY_TERMS = [
 '리뷰 작성 후 최소 180일 동안 전체공개를 유지합니다.',
 '가이드라인과 필수 키워드 양식을 지킵니다.',
 '디너의여왕 스폰서 배너를 삽입합니다.',
 '리뷰·사진·동영상을 디너의여왕과 광고주가 활용할 수 있습니다.',
 '초대자 확인·제품 배송을 위해 개인정보 일부를 업체에 제공합니다.',
 '초과비용은 본인 부담이며, 타 쿠폰 중복·테이크아웃은 불가합니다.',
 '체험 상품을 양도·판매할 수 없으며 위반 시 제공 비용이 청구됩니다.',
 '이전 신청 내역 기반 매장·서비스 추천 광고메일을 받습니다.'
];
const APPLY_NOTES={site_submitted:'사이트 신청 완료 확인',special_question:'별도 질문에 답변이 필요합니다',cost_required:'추가 비용 조건을 확인해 주세요',extra_consent_required:'추가 동의가 필요합니다',personal_data_disclosure:'개인정보 제공 조건 확인이 필요합니다',login_changed:'로그인·블로그 계정을 확인해 주세요',manual_input_required:'추가 입력을 직접 확인해 주세요',site_error:'모집 상태 또는 신청 화면을 확인해 주세요',outcome_uncertain:'중복 방지를 위해 자동 재시도하지 않습니다',stale_processing_timeout:'처리가 중단되어 결과 확인이 필요합니다',listing_not_eligible:'마감·기체험 제외 또는 캠페인 정보가 변경됐습니다',user_cancelled:'대기 중 취소했습니다'};
const APPLY_PLATFORMS = {
 '디너의여왕': { version:'dq-20261110', terms: APPLY_TERMS, extra:[] },
 '놀러와체험단': { version:'ct-20261110', terms:[
   '정당한 사유 없이 기한 내 리뷰를 작성하지 않으면 제공 대가를 환불해야 하며 법적 처벌 대상이 될 수 있습니다.',
   '등록한 콘텐츠를 6개월 유지해야 하며 미준수 시 제공내역 비용이 청구될 수 있습니다.',
   '등록한 콘텐츠가 홍보나 필요에 따라 사용될 수 있습니다.',
   '제공내역은 타인에게 양도·판매할 수 없습니다.',
   '개인정보 수집 및 이용에 동의합니다.'], extra:['신청자 한마디: “현직 광고감독입니다. 알찬 포스팅 남길게요”','안내 기재란: “없음”','리뷰 매체: 블로그(yunkwann)'] },
 '레뷰': { version:'rv-20261110', terms:[
   '초상권 활용에 동의합니다.',
   '캠페인 유의사항, 콘텐츠 제3자 제공, 저작물 이용에 동의합니다.',
   '개인정보 제3자 제공에 동의합니다.'], extra:['블로그 연결: 이슈메이커 Mr.Yun','카메라 휴대폰, 공동 운영 1명(본인) 기본값 사용'] }
};
let applyJobs = new Map();
let applyQueueReady = false;
let applyBusy = false;
async function loadApplyJobs(){
 try {
  const {data,error}=await sb.from('campaign_apply_jobs').select('id,listing_id,status,note,created_at').order('created_at',{ascending:false}).limit(1000);
  if(error) throw error;
  const next=new Map(); for(const j of data||[]) if(!next.has(j.listing_id)) next.set(j.listing_id,j);
  applyJobs=next;applyQueueReady=true;
 } catch(e){applyQueueReady=false;}
}
function applyControls(it){
 if(!APPLY_PLATFORMS[it.source]) return `<a class="apply-direct" href="${escapeHtml(it.url||'#')}" target="_blank" rel="noopener">사이트에서 신청</a>`;
 const j=applyJobs.get(it.id);
 if(j){const label=APPLY_LABELS[j.status]||'확인 필요';const done=j.status==='submitted'?(it.picked?`<span class="apply-done">완료 처리됨</span>`:`<button type="button" class="apply-complete" data-complete-id="${escapeHtml(it.id)}">신청 완료 체크</button>`):'';return `<div class="apply-job" role="status"><span>${label}</span>${j.note?`<small>${escapeHtml(APPLY_NOTES[j.note]||'직접 확인해 주세요')}</small>`:''}${done}${j.status==='pending'?`<button type="button" data-cancel-job="${escapeHtml(j.id)}">대기 취소</button>`:''}${['needs_input','failed','uncertain'].includes(j.status)?`<a href="${escapeHtml(it.url)}" target="_blank" rel="noopener">직접 확인</a>`:''}</div>`;}
 return `<button type="button" class="apply-start" data-apply-id="${escapeHtml(it.id)}" ${!applyQueueReady?'disabled':''}>${applyQueueReady?'자동 신청':'신청 연결 확인 중'}</button>`;
}
function openApplyApproval(id){
 const it=state.items.find(x=>x.id===id);if(!it||!APPLY_PLATFORMS[it.source]||!it.curated||applyJobs.has(id))return;const plat=APPLY_PLATFORMS[it.source];
 document.getElementById('applyApproval')?.remove();
 const d=document.createElement('dialog');d.id='applyApproval';d.setAttribute('aria-labelledby','applyHeading');
 d.innerHTML=`<form method="dialog"><h2 id="applyHeading">${escapeHtml(placeName(it))} 신청 승인</h2><p>${escapeHtml(it.curated_reward||it.reward_text||'')}</p><p>${escapeHtml(it.notice_text||'체험 조건은 상세 페이지에서 확인해 주세요.')}</p><a href="${escapeHtml(it.url)}" target="_blank" rel="noopener">캠페인 상세·방문 조건 확인</a><p><strong>이 한 건만 블로그 계정으로 신청합니다.</strong> 아래는 ${escapeHtml(it.source)}이 요구하는 신청 동의입니다.</p><ol>${plat.terms.map(t=>`<li>${escapeHtml(t)}</li>`).join('')}</ol>${plat.extra.length?`<p class="apply-help">자동으로 입력되는 내용<br>${plat.extra.map(t=>escapeHtml(t)).join('<br>')}</p>`:''}<label class="apply-consent"><input type="checkbox" id="applyConsent"> 위 동의와 해당 캠페인의 방문·리뷰 조건을 확인했고, 이 건의 실제 신청을 승인합니다.</label><p class="apply-help">컴퓨터·Aside와 로그인된 브라우저가 켜져 있어야 처리됩니다. 약 5분 간격으로 대기열을 확인하며 신청 간 최소 5분을 둡니다. 추가 문항·동의가 있으면 직접 확인으로 멈춥니다.</p><p id="applyError" role="alert"></p><div class="apply-actions"><button type="button" id="applyClose">취소</button><button type="button" id="applyApprove" disabled>이 건 신청 승인</button></div></form>`;
 document.body.append(d);
 d.querySelector('#applyClose').addEventListener('click',()=>{if(!applyBusy)d.close();});
 d.querySelector('#applyConsent').addEventListener('change',e=>{d.querySelector('#applyApprove').disabled=!e.target.checked;});
 d.addEventListener('cancel',e=>{if(applyBusy)e.preventDefault();});
 d.querySelector('#applyApprove').addEventListener('click',async()=>{
  if(applyBusy||!d.querySelector('#applyConsent').checked)return;applyBusy=true;d.querySelector('#applyApprove').disabled=true;d.querySelector('#applyClose').disabled=true;
  try {const {error}=await sb.rpc('enqueue_campaign_apply_job',{p_listing_id:id,p_approved:true,p_consent_version:plat.version});if(error)throw error;await loadApplyJobs();d.close();renderList();}
  catch(e){d.querySelector('#applyError').textContent='신청 대기 등록을 확인하지 못했어요. 대기열을 새로 확인해 주세요.';await loadApplyJobs();if(applyJobs.has(id)){d.close();renderList();}else{d.querySelector('#applyApprove').disabled=false;}}
  finally{applyBusy=false;d.querySelector('#applyClose').disabled=false;}
 });d.showModal();
}
document.getElementById('cardList').addEventListener('click',async e=>{
 const comp=e.target.closest('[data-complete-id]');if(comp){e.stopPropagation();comp.disabled=true;const {error}=await sb.from('campaign_listings').update({picked:true,picked_at:new Date().toISOString()}).eq('id',comp.dataset.completeId);if(error){window.alert('완료 체크를 저장하지 못했습니다. 다시 시도해 주세요.');comp.disabled=false;return;}await loadListings();return;}
 const start=e.target.closest('[data-apply-id]');if(start){e.stopPropagation();openApplyApproval(start.dataset.applyId);return;}
 const cancel=e.target.closest('[data-cancel-job]');if(cancel){cancel.disabled=true;const {error}=await sb.rpc('cancel_campaign_apply_job',{p_job_id:cancel.dataset.cancelJob});if(error)window.alert('이미 처리 중이거나 취소하지 못했습니다. 상태를 확인해 주세요.');await loadApplyJobs();renderList();}
});

document.getElementById('listingSearch').addEventListener('input',renderList);
let listingsLiveStarted = false;
window.addEventListener('authReady', () => {
  loadListings();
  if(listingsLiveStarted) return;
  listingsLiveStarted = true;


  sb.channel('campaign-listings-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'campaign_listings' }, () => {
      loadListings();
    })
    .subscribe();

  setInterval(loadListings, 30000);
  setInterval(async()=>{ await loadApplyJobs(); renderList(); }, 15000);
});
</script>
