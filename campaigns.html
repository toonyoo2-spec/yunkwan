<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>체험단 확인</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#3a5a52">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BORAKWAN">
<link rel="stylesheet" href="./common.css">
<link rel="stylesheet" href="./panel-common.css">
<style>
  .subnav{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  .subnav a{
    text-decoration:none;
    border:1px solid var(--line);
    background:#fff;
    color:var(--sub);
    padding:8px 16px;
    border-radius:20px;
    font-size:13.5px;
    font-weight:600;
  }
  .subnav a.active{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }

  header{
    margin-bottom:16px;
  }

  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 20px;
    margin-bottom:16px;
  }

  .filter-row{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .filter-row .lbl{
    font-size:12px;
    color:var(--sub);
    font-weight:600;
  }
  .chip-group{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
  }
  .chip{
    border:1px solid var(--line);
    background:#fff;
    color:var(--sub);
    padding:6px 14px;
    border-radius:20px;
    font-size:13px;
    cursor:pointer;
    user-select:none;
  }
  .chip.on{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }
  .weekend-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    color:var(--ink);
    cursor:pointer;
    user-select:none;
  }
  .weekend-toggle input{ width:16px; height:16px; cursor:pointer; }

  .count-line{
    font-size:12.5px;
    color:var(--sub);
    margin-bottom:10px;
  }

  .table-wrap{
    width:100%;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  table{
    width:100%;
    min-width:640px;
    border-collapse:collapse;
    font-size:13.5px;
  }
  thead th{
    text-align:left;
    font-size:12px;
    color:var(--sub);
    font-weight:600;
    padding:0 10px 10px;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  tbody td{
    padding:11px 10px;
    border-bottom:1px solid var(--line);
    vertical-align:top;
  }
  tbody tr{ cursor:pointer; }
  tbody tr:hover{ background:#fafaf7; }
  tbody tr.picked{ background:var(--conf-bg); }
  tbody tr.picked:hover{ background:var(--conf-bg); }

  .pick-cell{ width:34px; text-align:center; }
  .pick-box{
    width:20px; height:20px;
    cursor:pointer;
  }

  .region-cell{ white-space:nowrap; }
  .badge.region{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    padding:3px 8px;
    border-radius:6px;
    background:#e6efe9;
    color:var(--accent);
    white-space:nowrap;
  }
  .badge.source{
    display:block;
    font-size:10.5px;
    color:var(--sub);
    margin-top:4px;
  }

  .place-cell{ font-weight:700; min-width:120px; }
  .place-cell a{ color:var(--ink); text-decoration:none; }
  .place-cell a:hover{ text-decoration:underline; }

  .content-cell{ color:var(--sub); min-width:160px; }

  .status-cell{ white-space:nowrap; }
  .badge.deadline{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    padding:3px 8px;
    border-radius:6px;
    background:var(--done-bg);
    color:var(--done-ink);
    margin-bottom:4px;
  }
  .badge.deadline.soon{background:#fbe3db;color:#b3452f;}
  .badge.deadline.near{background:var(--wait-bg);color:var(--wait-ink);}
  .badge.deadline.rolling{background:var(--conf-bg);color:var(--conf-ink);}
  .weekend-tag{
    display:block;
    font-size:11.5px;
  }
  .weekend-tag.possible{ color:var(--conf-ink); }
  .weekend-tag.impossible{ color:#b3452f; }
  .weekend-tag.unknown{ color:var(--sub); }

  .empty{
    text-align:center;
    padding:60px 0;
    color:var(--sub);
    font-size:13.5px;
    line-height:1.7;
  }

  @media (max-width:640px){
    .panel{ padding:14px; }
  }

  #appContent{display:none;}
</style>
</head>
<body>
<script src="./nav.js?v=6"></script>
<div class="wrap" id="appContent">

  <div class="subnav">
    <a href="./review.html">체험단예정</a>
    <a href="./campaigns.html" class="active">체험단확인</a>
  </div>

  <header>
    <div>
      <h1>체험단 확인</h1>
      <p>지역 · 장소명 · 체험내용 · 주말가능여부만 간단히 봅니다. 체크하면 배우자에게도 바로 보여요.</p>
    </div>
  </header>

  <div class="panel">
    <div class="filter-row">
      <div>
        <div class="lbl">지역</div>
        <div class="chip-group" id="regionChips"></div>
      </div>
      <div>
        <div class="lbl">사이트</div>
        <div class="chip-group" id="sourceChips"></div>
      </div>
      <div>
        <label class="weekend-toggle">
          <input type="checkbox" id="weekendOnly">
          주말 가능 확인된 것만 보기
        </label>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="count-line" id="countLine"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th></th>
            <th>지역</th>
            <th>장소명</th>
            <th>체험내용</th>
            <th>마감 · 주말</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="empty" id="emptyMsg" style="display:none;"></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script>
/* ===========================================================
   지역/사이트 캐노니컬 정의 + Supabase 연동 (campaign_listings 테이블)
   =========================================================== */
const REGION_AREAS = ['용산구','마포구','영등포구','서대문구','강서구','고양시','파주시'];
const SOURCES = ['디너의여왕','강남맛집','놀러와체험단','리뷰노트','레뷰'];
const WEEKEND_LABEL = { possible: '🟢 주말가능', impossible: '🔴 주말불가', unknown: '⚪ 확인필요' };

const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY, {
  auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true }
});
window.sb = sb; // auth-gate.js가 같은 클라이언트를 재사용하도록 공유

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    sb.auth.startAutoRefresh();
  } else {
    sb.auth.stopAutoRefresh();
  }
});

const state = {
  regions: new Set(REGION_AREAS),
  sources: new Set(SOURCES),
  weekendOnly: false,
  items: []
};

function renderChips(){
  const regionEl = document.getElementById('regionChips');
  regionEl.innerHTML = REGION_AREAS.map(r =>
    `<button type="button" class="chip ${state.regions.has(r) ? 'on' : ''}" data-region="${r}">${r}</button>`
  ).join('');
  regionEl.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      const r = btn.dataset.region;
      if(state.regions.has(r)) state.regions.delete(r); else state.regions.add(r);
      renderChips();
      renderList();
    });
  });

  const sourceEl = document.getElementById('sourceChips');
  sourceEl.innerHTML = SOURCES.map(s =>
    `<button type="button" class="chip ${state.sources.has(s) ? 'on' : ''}" data-source="${s}">${s}</button>`
  ).join('');
  sourceEl.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      const s = btn.dataset.source;
      if(state.sources.has(s)) state.sources.delete(s); else state.sources.add(s);
      renderChips();
      renderList();
    });
  });
}

function daysLeft(dateStr){
  if(!dateStr) return null;
  const today = new Date();
  today.setHours(0,0,0,0);
  const d = new Date(dateStr);
  d.setHours(0,0,0,0);
  return Math.round((d - today) / 86400000);
}

function deadlineBadge(item){
  if(item.deadline_type === 'dated' && item.deadline_date){
    const dleft = daysLeft(item.deadline_date);
    let cls = '';
    let label = `D-${dleft}`;
    if(dleft < 0) label = '마감';
    else if(dleft === 0) label = '오늘마감';
    if(dleft <= 3) cls = 'soon';
    else if(dleft <= 7) cls = 'near';
    return `<span class="badge deadline ${cls}">${label}</span>`;
  }
  if(item.deadline_type === 'rolling'){
    return `<span class="badge deadline rolling">선착순</span>`;
  }
  return `<span class="badge deadline">${item.raw_deadline_text || '상시'}</span>`;
}

function placeName(it){
  return (it.title || '').replace(/^\[[^\]]+\]\s*/, '') || it.title || '(제목 없음)';
}

async function togglePicked(id, current){
  const { error } = await sb
    .from('campaign_listings')
    .update({ picked: !current, picked_at: !current ? new Date().toISOString() : null })
    .eq('id', id);
  if(error) console.error(error);
  // realtime 구독이 다시 불러오므로 여기선 별도 갱신 안 해도 됨
}

function renderList(){
  const filtered = state.items.filter(it =>
    state.regions.has(it.region_area) &&
    state.sources.has(it.source) &&
    (!state.weekendOnly || it.weekend_ok === 'possible')
  );

  // 정렬: 픽된 것 먼저, 그 다음 마감일 확정 건 → 임박순, 그 다음 선착순/상시
  filtered.sort((a, b) => {
    if(a.picked !== b.picked) return a.picked ? -1 : 1;
    const da = a.deadline_type === 'dated' && a.deadline_date ? new Date(a.deadline_date) : null;
    const db = b.deadline_type === 'dated' && b.deadline_date ? new Date(b.deadline_date) : null;
    if(da && db) return da - db;
    if(da) return -1;
    if(db) return 1;
    return 0;
  });

  const tbody = document.getElementById('tbody');
  const emptyMsg = document.getElementById('emptyMsg');

  if(filtered.length === 0){
    tbody.innerHTML = '';
    emptyMsg.style.display = 'block';
    emptyMsg.textContent = state.items.length === 0
      ? '아직 수집된 캠페인이 없습니다.'
      : '선택한 조건에 해당하는 캠페인이 없습니다.';
  } else {
    emptyMsg.style.display = 'none';
    tbody.innerHTML = filtered.map(it => `
      <tr class="${it.picked ? 'picked' : ''}" data-id="${it.id}">
        <td class="pick-cell">
          <input type="checkbox" class="pick-box" ${it.picked ? 'checked' : ''} data-id="${it.id}" data-picked="${it.picked}">
        </td>
        <td class="region-cell">
          <span class="badge region">${it.region_area}</span>
          <span class="badge source">${it.source}</span>
        </td>
        <td class="place-cell"><a href="${it.url || '#'}" target="_blank" rel="noopener">${placeName(it)}</a></td>
        <td class="content-cell">${it.reward_text || '-'}</td>
        <td class="status-cell">
          ${deadlineBadge(it)}
          <span class="weekend-tag ${it.weekend_ok}">${WEEKEND_LABEL[it.weekend_ok] || WEEKEND_LABEL.unknown}</span>
        </td>
      </tr>
    `).join('');

    tbody.querySelectorAll('.pick-box').forEach(box => {
      box.addEventListener('click', (e) => {
        e.stopPropagation();
        togglePicked(box.dataset.id, box.dataset.picked === 'true');
      });
    });
  }

  document.getElementById('countLine').textContent = `${filtered.length}건`;
}

async function loadListings(){
  const { data, error } = await sb
    .from('campaign_listings')
    .select('*')
    .order('deadline_date', { ascending: true, nullsFirst: false });
  if(error){
    console.error(error);
    return;
  }
  state.items = data || [];
  renderList();
}

window.addEventListener('authReady', () => {
  renderChips();
  loadListings();

  document.getElementById('weekendOnly').addEventListener('change', (e) => {
    state.weekendOnly = e.target.checked;
    renderList();
  });

  sb.channel('campaign-listings-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'campaign_listings' }, () => {
      loadListings();
    })
    .subscribe();

  setInterval(loadListings, 30000);
});
</script>
<script src="./auth-gate.js?v=2"></script>
</body>
</html>
