<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>여행 계획표</title>
<link rel="stylesheet" href="./common.css">
<link rel="stylesheet" href="./panel-common.css">
<style>
  header{margin-bottom:20px;}
        
  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px;
    margin-bottom:24px;
  }
    
  .section-title{
    font-size:13px;
    font-weight:600;
    color:var(--sub);
    margin:28px 0 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-title::before{
    content:"";
    width:6px;height:6px;border-radius:50%;
    background:var(--accent);
    display:inline-block;
  }

  .form-grid{
    display:grid;
    grid-template-columns:1.4fr 1fr 1fr 1fr;
    gap:10px;
    align-items:end;
  }
    input[type=text], input[type=date], textarea{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:7px;
    font-size:13.5px;
    background:#fff;
    color:var(--ink);
    font-family:inherit;
  }
  textarea{resize:vertical;min-height:60px;}
  input:focus, textarea:focus{
    outline:none;
    border-color:var(--accent);
  }
  .save-btn{
    grid-column:1/-1;
    justify-self:start;
    margin-top:4px;
    background:var(--accent);
    color:#fff;
    border:none;
    padding:10px 22px;
    border-radius:7px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
  }
  .save-btn:hover{opacity:0.9;}
  .save-btn:disabled{opacity:0.5;cursor:not-allowed;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:16px;
  }
  .trip-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:8px;
    cursor:pointer;
    transition:border-color .12s ease, transform .12s ease;
  }
  .trip-card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .trip-card.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(58,90,82,0.15);}
  .trip-card .dday{
    align-self:flex-start;
    font-size:11px;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    background:#eef0ec;
    color:var(--accent);
  }
  .trip-card .title{font-size:16px;font-weight:700;}
  .trip-card .dates{font-size:12.5px;color:var(--sub);}
  .trip-card .budget{font-size:12.5px;color:var(--sub);}
  .trip-card .memo{
    font-size:12px;
    color:var(--sub);
    line-height:1.5;
    white-space:pre-wrap;
    overflow:hidden;
    text-overflow:ellipsis;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
  }
  .trip-card .del-btn{
    align-self:flex-end;
    background:none;
    border:1px solid var(--line);
    color:var(--sub);
    cursor:pointer;
    font-size:12px;
    padding:5px 10px;
    border-radius:7px;
  }
  .trip-card .del-btn:hover{border-color:#b3452f;color:#b3452f;}

  
  /* ---- 일정 상세 ---- */
  .itinerary-panel{display:none;}
  .itinerary-panel.open{display:block;}
  .itinerary-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:16px;
  }
  .itinerary-header .info h2{
    font-size:18px;
    margin:0 0 4px;
    display:block;
  }
  .itinerary-header .info h2::before{display:none;}
  .itinerary-header .info .sub{font-size:12.5px;color:var(--sub);}
  .back-btn{
    border:1px solid var(--line);
    background:#fff;
    color:var(--sub);
    padding:7px 14px;
    border-radius:20px;
    font-size:12.5px;
    cursor:pointer;
  }
  .back-btn:hover{border-color:var(--accent);color:var(--accent);}

  .item-form-grid{
    display:grid;
    grid-template-columns:60px 90px 110px 1.4fr 90px;
    gap:10px;
    align-items:end;
    margin-bottom:10px;
  }
  .item-form-grid2{
    display:grid;
    grid-template-columns:1.2fr 1fr 1fr 1fr 90px;
    gap:10px;
    align-items:end;
    margin-bottom:18px;
  }
  .item-form-grid .add-item-btn, .item-form-grid2 .add-item-btn{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:9px 0;
    border-radius:7px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .item-form-grid .add-item-btn:hover, .item-form-grid2 .add-item-btn:hover{opacity:0.9;}
  select#item-category{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:7px;
    font-size:13.5px;
    background:#fff;
    color:var(--ink);
    font-family:inherit;
  }

  .day-group{margin-bottom:18px;}
  .day-group-title{
    font-size:13px;
    font-weight:700;
    color:var(--accent);
    margin-bottom:8px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .item-row{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:10px 0;
    border-bottom:1px dashed var(--line);
  }
  .item-row:last-child{border-bottom:none;}
  .item-row .time{
    flex:0 0 56px;
    font-size:12.5px;
    font-weight:700;
    color:var(--sub);
    padding-top:1px;
  }
  .item-row .cat-icon{
    flex:0 0 30px;
    width:30px;height:30px;
    border-radius:8px;
    background:#eef0ec;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;
  }
  .item-row .body{flex:1;min-width:0;}
  .item-row .item-title{font-size:14px;font-weight:600;}
  .item-row .item-memo{font-size:12px;color:var(--sub);margin-top:2px;white-space:pre-wrap;}
  .item-row .item-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;}
  .item-row .item-meta a{
    font-size:11.5px;
    color:var(--accent);
    text-decoration:none;
    background:#eef0ec;
    padding:3px 9px;
    border-radius:20px;
  }
  .item-row .item-meta a:hover{background:#e2e6de;}
  .item-row .cost{
    flex:0 0 auto;
    font-size:12.5px;
    color:var(--accent);
    font-weight:600;
    padding-top:1px;
  }
  .item-row .del-item-btn{
    flex:0 0 auto;
    background:none;
    border:none;
    color:#b7b5ac;
    cursor:pointer;
    font-size:15px;
    line-height:1;
  }
  .item-row .del-item-btn:hover{color:#b3452f;}

  
  @media (max-width:820px){
    .form-grid{grid-template-columns:1fr 1fr;}
    .item-form-grid{grid-template-columns:1fr 1fr;}
    .item-form-grid2{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>
<script src="./nav.js?v=3"></script>
<div class="wrap" id="appContent">

  <header>
    <h1>여행 계획표</h1>
    <p>여행을 등록하고, 날짜별 일정과 예산을 정리하세요.</p>
  </header>

  <div class="panel">
    <h2>새 여행 추가</h2>
    <div class="form-grid">
      <div class="field">
        <label>여행 제목</label>
        <input type="text" id="in-title" placeholder="예: 오사카 3박4일">
      </div>
      <div class="field">
        <label>시작일</label>
        <input type="date" id="in-startDate">
      </div>
      <div class="field">
        <label>종료일</label>
        <input type="date" id="in-endDate">
      </div>
      <div class="field">
        <label>예산</label>
        <input type="text" id="in-budget" placeholder="예: 150만원">
      </div>
      <div class="field" style="grid-column:1/-1;">
        <label>메모</label>
        <textarea id="in-memo" placeholder="숙소, 항공편, 준비물 등"></textarea>
      </div>
      <button class="save-btn" id="saveTripBtn" onclick="addTrip()">+ 여행 추가</button>
    </div>
  </div>

  <div class="section-title">등록된 여행</div>
  <div class="grid" id="tripGrid"></div>
  <div class="empty" id="emptyMsg" style="display:none;">아직 등록된 여행이 없어요.</div>

  <div class="panel itinerary-panel" id="itineraryPanel">
    <div class="itinerary-header">
      <div class="info">
        <h2 id="itTitle"></h2>
        <div class="sub" id="itSub"></div>
      </div>
      <button class="back-btn" onclick="closeItinerary()">✕ 목록으로</button>
    </div>

    <div class="item-form-grid">
      <div class="field">
        <label>Day</label>
        <input type="text" id="item-day" placeholder="1">
      </div>
      <div class="field">
        <label>시간</label>
        <input type="text" id="item-time" placeholder="14:00">
      </div>
      <div class="field">
        <label>유형</label>
        <select id="item-category">
          <option value="이동">🚗 이동</option>
          <option value="식사">🍽️ 식사</option>
          <option value="숙소">🏨 숙소</option>
          <option value="관광">📍 관광</option>
          <option value="쇼핑">🛍️ 쇼핑</option>
          <option value="기타">📝 기타</option>
        </select>
      </div>
      <div class="field">
        <label>장소/활동</label>
        <input type="text" id="item-title" placeholder="예: 도톤보리 저녁 산책">
      </div>
      <div class="field">
        <label>비용</label>
        <input type="text" id="item-cost" placeholder="선택">
      </div>
    </div>
    <div class="item-form-grid2">
      <div class="field">
        <label>주소 (선택)</label>
        <input type="text" id="item-address" placeholder="예: 오사카부 오사카시...">
      </div>
      <div class="field">
        <label>전화번호 (선택)</label>
        <input type="text" id="item-phone" placeholder="예: 06-1234-5678">
      </div>
      <div class="field">
        <label>지도 링크 (선택)</label>
        <input type="text" id="item-mapurl" placeholder="구글맵 URL">
      </div>
      <div class="field">
        <label>메모 (선택)</label>
        <input type="text" id="item-memo" placeholder="선택">
      </div>
      <button class="add-item-btn" onclick="addTripItem()">+ 추가</button>
    </div>

    <div id="itineraryBody"></div>
    <div class="empty" id="itineraryEmptyMsg" style="display:none;">아직 등록된 일정이 없어요.</div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script src="./common.js"></script>
<script>
/* ===========================================================
   Supabase 연동 (trips + trip_items 테이블)
   =========================================================== */
const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY, {
  auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true }
});
window.sb = sb; // auth-gate.js가 같은 클라이언트를 재사용하도록 공유

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    sb.auth.startAutoRefresh();
  } else {
    sb.auth.stopAutoRefresh();
  }
});

let trips = [];
let tripItems = [];
let selectedTripId = null;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }


function formatDateShort(v){
  if(!v) return "";
  const d = new Date(v + "T00:00:00");
  if(isNaN(d.getTime())) return v;
  return `${d.getMonth()+1}.${d.getDate()}`;
}

function tripDayCount(startDate, endDate){
  if(!startDate || !endDate) return "";
  const s = new Date(startDate + "T00:00:00");
  const e = new Date(endDate + "T00:00:00");
  const nights = Math.round((e - s) / 86400000);
  if(nights <= 0) return "당일";
  return `${nights}박${nights+1}일`;
}

function tripDday(startDate){
  if(!startDate) return "";
  const today = new Date();
  today.setHours(0,0,0,0);
  const s = new Date(startDate + "T00:00:00");
  const diff = Math.round((s - today) / 86400000);
  if(diff > 0) return `D-${diff}`;
  if(diff === 0) return "D-DAY";
  return `여행 중/완료`;
}

/* ---- 여행 목록 ---- */
async function loadTrips(){
  const { data, error } = await sb.from('trips').select('*').order('startDate');
  if(error){
    console.error("여행 목록 로드 실패:", error);
  } else {
    trips = data || [];
  }
  renderTrips();
}

function renderTrips(){
  const grid = document.getElementById('tripGrid');
  const emptyMsg = document.getElementById('emptyMsg');

  if(trips.length === 0){
    grid.innerHTML = "";
    emptyMsg.style.display = "block";
    return;
  }
  emptyMsg.style.display = "none";

  grid.innerHTML = trips.map(t => `
    <div class="trip-card ${t.id===selectedTripId?'selected':''}" onclick="openItinerary('${t.id}')">
      <span class="dday">${escapeHtml(tripDday(t.startDate))}</span>
      <div class="title">${escapeHtml(t.title)}</div>
      <div class="dates">${formatDateShort(t.startDate)} ~ ${formatDateShort(t.endDate)} · ${tripDayCount(t.startDate, t.endDate)}</div>
      ${t.budget ? `<div class="budget">예산 ${escapeHtml(t.budget)}</div>` : ''}
      ${t.memo ? `<div class="memo">${escapeHtml(t.memo)}</div>` : ''}
      <button class="del-btn" onclick="event.stopPropagation(); deleteTrip('${t.id}')">삭제</button>
    </div>
  `).join('');
}

async function addTrip(){
  const title = document.getElementById('in-title').value.trim();
  const startDate = document.getElementById('in-startDate').value;
  const endDate = document.getElementById('in-endDate').value;
  const budget = document.getElementById('in-budget').value.trim();
  const memo = document.getElementById('in-memo').value.trim();

  if(!title){ alert('여행 제목을 입력해주세요.'); return; }
  if(!startDate){ alert('시작일을 선택해주세요.'); return; }
  if(endDate && endDate < startDate){ alert('종료일은 시작일보다 빠를 수 없어요.'); return; }

  const saveBtn = document.getElementById('saveTripBtn');
  saveBtn.disabled = true;

  const newTrip = {
    id: uid(),
    title, startDate, endDate, budget, memo,
    createdAt: new Date().toISOString()
  };

  const { error } = await sb.from('trips').insert(newTrip);
  saveBtn.disabled = false;
  if(error){ alert("저장 실패: " + error.message); return; }

  document.getElementById('in-title').value = "";
  document.getElementById('in-startDate').value = "";
  document.getElementById('in-endDate').value = "";
  document.getElementById('in-endDate').min = "";
  document.getElementById('in-budget').value = "";
  document.getElementById('in-memo').value = "";

  await loadTrips();
}

async function deleteTrip(id){
  if(!confirm('이 여행을 삭제할까요? 등록된 일정도 함께 삭제됩니다.')) return;
  const { error } = await sb.from('trips').delete().eq('id', id);
  if(error){ alert("삭제 실패: " + error.message); return; }
  if(selectedTripId === id) closeItinerary();
  await loadTrips();
}

/* ---- 일정(itinerary) ---- */
async function openItinerary(id){
  selectedTripId = id;
  const trip = trips.find(t => t.id === id);
  if(!trip) return;

  document.getElementById('itTitle').textContent = trip.title;
  document.getElementById('itSub').textContent =
    `${formatDateShort(trip.startDate)} ~ ${formatDateShort(trip.endDate)} · ${tripDayCount(trip.startDate, trip.endDate)}`;
  document.getElementById('itineraryPanel').classList.add('open');
  document.getElementById('itineraryPanel').scrollIntoView({ behavior:'smooth', block:'start' });

  renderTrips();
  await loadTripItems();
}

function closeItinerary(){
  selectedTripId = null;
  tripItems = [];
  document.getElementById('itineraryPanel').classList.remove('open');
  renderTrips();
}

async function loadTripItems(){
  if(!selectedTripId) return;
  const { data, error } = await sb.from('trip_items').select('*').eq('tripId', selectedTripId);
  if(error){
    console.error("일정 로드 실패:", error);
  } else {
    tripItems = data || [];
  }
  renderItinerary();
}

const CATEGORY_ICON = { "이동":"🚗", "식사":"🍽️", "숙소":"🏨", "관광":"📍", "쇼핑":"🛍️", "기타":"📝" };

function renderItinerary(){
  const body = document.getElementById('itineraryBody');
  const emptyMsg = document.getElementById('itineraryEmptyMsg');

  if(tripItems.length === 0){
    body.innerHTML = "";
    emptyMsg.style.display = "block";
    return;
  }
  emptyMsg.style.display = "none";

  const byDay = {};
  tripItems.forEach(it => {
    const d = it.day || 1;
    (byDay[d] = byDay[d] || []).push(it);
  });
  Object.values(byDay).forEach(list => list.sort((a,b) => (a.time||"").localeCompare(b.time||"")));

  const days = Object.keys(byDay).map(Number).sort((a,b) => a-b);

  body.innerHTML = days.map(day => `
    <div class="day-group">
      <div class="day-group-title">Day ${day}</div>
      ${byDay[day].map(it => `
        <div class="item-row">
          <div class="time">${escapeHtml(it.time || '')}</div>
          <div class="cat-icon" title="${escapeHtml(it.category||'기타')}">${CATEGORY_ICON[it.category] || '📝'}</div>
          <div class="body">
            <div class="item-title">${escapeHtml(it.title)}</div>
            ${it.address ? `<div class="item-memo">${escapeHtml(it.address)}</div>` : ''}
            ${it.memo ? `<div class="item-memo">${escapeHtml(it.memo)}</div>` : ''}
            <div class="item-meta">
              ${it.phone ? `<a href="tel:${escapeHtml(it.phone)}">📞 ${escapeHtml(it.phone)}</a>` : ''}
              ${it.mapUrl ? `<a href="${escapeHtml(it.mapUrl)}" target="_blank" rel="noopener">🗺️ 지도 열기</a>` : (it.address ? `<a href="https://maps.google.com/?q=${encodeURIComponent(it.address)}" target="_blank" rel="noopener">🗺️ 지도 열기</a>` : '')}
            </div>
          </div>
          ${it.cost ? `<div class="cost">${escapeHtml(it.cost)}</div>` : ''}
          <button class="del-item-btn" onclick="deleteTripItem('${it.id}')">✕</button>
        </div>
      `).join('')}
    </div>
  `).join('');
}

async function addTripItem(){
  if(!selectedTripId) return;
  const day = parseInt(document.getElementById('item-day').value, 10) || 1;
  const time = document.getElementById('item-time').value.trim();
  const category = document.getElementById('item-category').value;
  const title = document.getElementById('item-title').value.trim();
  const cost = document.getElementById('item-cost').value.trim();
  const address = document.getElementById('item-address').value.trim();
  const phone = document.getElementById('item-phone').value.trim();
  const mapUrl = document.getElementById('item-mapurl').value.trim();
  const memo = document.getElementById('item-memo').value.trim();

  if(!title){ alert('장소/활동을 입력해주세요.'); return; }

  const newItem = {
    id: uid(),
    tripId: selectedTripId,
    day, time, category, title, address, phone, mapUrl, memo, cost,
    createdAt: new Date().toISOString()
  };

  const { error } = await sb.from('trip_items').insert(newItem);
  if(error){ alert("저장 실패: " + error.message); return; }

  document.getElementById('item-day').value = "";
  document.getElementById('item-time').value = "";
  document.getElementById('item-category').value = "이동";
  document.getElementById('item-title').value = "";
  document.getElementById('item-cost').value = "";
  document.getElementById('item-address').value = "";
  document.getElementById('item-phone').value = "";
  document.getElementById('item-mapurl').value = "";
  document.getElementById('item-memo').value = "";

  await loadTripItems();
}

async function deleteTripItem(id){
  if(!confirm('이 일정을 삭제할까요?')) return;
  const { error } = await sb.from('trip_items').delete().eq('id', id);
  if(error){ alert("삭제 실패: " + error.message); return; }
  await loadTripItems();
}

/* 시작일을 고르면 종료일 입력칸도 같은 날짜 근처로 미리 맞춰둡니다.
   그래야 종료일 달력을 열었을 때 시작일과 같은 달이 바로 보여서,
   멀리 있는 달까지 매번 스크롤하지 않아도 됩니다. */
document.getElementById('in-startDate').addEventListener('change', function(){
  const start = this.value;
  const endInput = document.getElementById('in-endDate');
  if(!start) return;
  endInput.min = start; // 시작일보다 빠른 날짜는 아예 선택 못 하게
  if(!endInput.value || endInput.value < start){
    endInput.value = start;
  }
});

loadTrips();
</script>
<script src="./auth-gate.js"></script>
