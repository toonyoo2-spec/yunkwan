<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중요 문서함</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#3a5a52">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BORAKWAN">
<link rel="stylesheet" href="./common.css">
<link rel="stylesheet" href="./panel-common.css">
<style>
  header{margin-bottom:20px;}
        
  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
  }
    
  .form-grid{
    display:grid;
    grid-template-columns:1.3fr 1fr 1.3fr;
    gap:10px;
  }
  .field{margin-bottom:0;}
    input[type=text], select, textarea{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:7px;
    font-size:13.5px;
    background:#fff;
    color:var(--ink);
    font-family:inherit;
  }
  textarea{resize:vertical;min-height:44px;}
  input:focus, select:focus, textarea:focus{
    outline:none;
    border-color:var(--accent);
  }

  .file-drop{
    grid-column:1/-1;
    border:1.5px dashed var(--line);
    border-radius:10px;
    padding:14px;
    text-align:center;
    cursor:pointer;
    color:var(--sub);
    font-size:12.5px;
    position:relative;
    background:#fafaf8;
  }
  .file-drop input[type=file]{
    position:absolute;
    inset:0;
    opacity:0;
    cursor:pointer;
  }
  .file-drop .picked{color:var(--ink);font-weight:600;}

  .save-btn{
    grid-column:1/-1;
    justify-self:start;
    margin-top:4px;
    background:var(--accent);
    color:#fff;
    border:none;
    padding:10px 22px;
    border-radius:7px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
  }
  .save-btn:hover{opacity:0.9;}
  .save-btn:disabled{opacity:0.5;cursor:not-allowed;}
  .status-msg{
    grid-column:1/-1;
    font-size:11.5px;
    color:var(--sub);
  }

  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .tab{
    border:1px solid var(--line);
    background:#fff;
    padding:7px 14px;
    border-radius:20px;
    font-size:13px;
    cursor:pointer;
    color:var(--sub);
  }
  .tab.active{
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
  }

  .doc-list{display:flex;flex-direction:column;gap:10px;margin-bottom:22px;}
  .owner-section-title{
    font-size:13px;
    font-weight:700;
    color:var(--accent);
    margin:24px 0 10px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .owner-section-title:first-child{margin-top:0;}
  .doc-row .owner-badge{
    font-size:11px;
    padding:2px 8px;
    border-radius:5px;
    background:#e3ede4;
    color:var(--accent);
    font-weight:600;
  }
  .doc-row{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .doc-row .icon{
    width:38px;height:38px;flex-shrink:0;
    border-radius:8px;
    background:#eef0ec;
    display:flex;align-items:center;justify-content:center;
    font-size:17px;
  }
  .doc-row .body{flex:1;min-width:0;}
  .doc-row .title{font-size:14.5px;font-weight:700;}
  .doc-row .meta{font-size:12px;color:var(--sub);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;}
  .doc-row .cat-badge{
    font-size:11px;
    padding:2px 8px;
    border-radius:5px;
    background:#eef0ec;
    color:var(--sub);
  }
  .doc-row .memo{font-size:12px;color:var(--sub);margin-top:4px;white-space:pre-wrap;}
  .doc-row .actions{display:flex;gap:8px;flex-shrink:0;}
  .dl-btn{
    background:#eef0ec;
    color:var(--ink);
    border:none;
    font-size:12.5px;
    font-weight:600;
    padding:8px 12px;
    border-radius:7px;
    cursor:pointer;
  }
  .dl-btn:hover{background:#e2e6de;}
  .del-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--sub);
    cursor:pointer;
    font-size:12.5px;
    padding:8px 12px;
    border-radius:7px;
  }
  .del-btn:hover{border-color:#b3452f;color:#b3452f;}

  
  .doc-row{cursor:pointer;}
  .doc-row .actions{position:relative;z-index:2;}

  .preview-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .preview-overlay.open{display:flex;}
  .preview-box{
    background:#fff;
    border-radius:12px;
    width:100%;
    max-width:860px;
    max-height:90vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .preview-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 18px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .preview-head .name{
    font-size:14px;
    font-weight:700;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .preview-head .close-btn{
    background:none;
    border:none;
    font-size:20px;
    line-height:1;
    cursor:pointer;
    color:var(--sub);
    padding:4px 8px;
    flex-shrink:0;
  }
  .preview-head .close-btn:hover{color:var(--ink);}
  .preview-body{
    flex:1;
    overflow:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f4f4f2;
    min-height:200px;
  }
  .preview-body img{max-width:100%;max-height:80vh;display:block;}
  .preview-body video{max-width:100%;max-height:80vh;display:block;}
  .preview-body iframe{width:100%;height:80vh;border:none;}
  .preview-msg{padding:40px;text-align:center;color:var(--sub);font-size:13.5px;}
  .preview-msg a{color:var(--accent);font-weight:600;}

  .type-toggle{
    grid-column:1/-1;
    display:flex;
    gap:8px;
    margin-bottom:2px;
  }
  .type-btn{
    flex:1;
    border:1.5px solid var(--line);
    background:#fff;
    padding:10px;
    border-radius:8px;
    font-size:13px;
    font-weight:600;
    color:var(--sub);
    cursor:pointer;
  }
  .type-btn.active{
    border-color:var(--accent);
    background:#eef4ee;
    color:var(--accent);
  }

  .cred-grid{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    margin-top:6px;
  }
  .cred-item{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
  }
  .cred-label{color:var(--sub);}
  .cred-value{
    font-weight:700;
    color:var(--ink);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    background:#f4f4f2;
    padding:2px 8px;
    border-radius:5px;
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translateX(-50%) translateY(10px);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:8px;
    font-size:13px;
    font-weight:600;
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
    z-index:2000;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  
  @media (max-width:640px){
    .form-grid{grid-template-columns:1fr;}
    .doc-row{flex-wrap:wrap;}
    .doc-row .actions{width:100%;justify-content:flex-end;}
  }
</style>
</head>
<body>
<script src="./nav.js?v=4"></script>
<div class="wrap" id="appContent">

  <header>
    <h1>중요 문서함</h1>
  </header>

  <div class="panel">
    <h2>새 문서 등록</h2>
    <div class="form-grid">
      <div class="type-toggle" id="typeToggle">
        <button type="button" class="type-btn active" data-type="file" onclick="setEntryType('file')">📁 파일 추가</button>
        <button type="button" class="type-btn" data-type="credential" onclick="setEntryType('credential')">🔑 ID 공유</button>
      </div>
      <div class="field">
        <label>제목</label>
        <input type="text" id="in-title" placeholder="예: 자동차 보험증권">
      </div>
      <div class="field">
        <label>등록자</label>
        <select id="in-owner">
          <option value="공동">공동</option>
          <option value="보라">보라</option>
          <option value="관">관</option>
        </select>
      </div>
      <div class="field" id="categoryField">
        <label>카테고리</label>
        <select id="in-category">
          <option value="보험">보험</option>
          <option value="계약서">계약서</option>
          <option value="신분증">신분증</option>
          <option value="기타">기타</option>
        </select>
      </div>
      <div class="field" id="credCategoryField" style="display:none;">
        <label>구분</label>
        <select id="in-cred-category">
          <option value="사이트">사이트</option>
          <option value="OTT">OTT</option>
          <option value="쇼핑">쇼핑</option>
          <option value="WIFI">WIFI</option>
        </select>
      </div>
      <div class="field" id="credIdField" style="display:none;">
        <label>아이디</label>
        <input type="text" id="in-cred-id" placeholder="예: hong1234">
      </div>
      <div class="field" id="credPwField" style="display:none;">
        <label>비밀번호</label>
        <input type="text" id="in-cred-pw" placeholder="예: mypassword123">
      </div>
      <div class="field" style="grid-column:1/-1;">
        <label>메모 (선택, 내용/기타 정보)</label>
        <input type="text" id="in-memo" placeholder="갱신일, 관련 연락처 등">
      </div>
      <div class="file-drop" id="dropZone">
        <span id="dropLabel">클릭해서 파일 선택 (이미지, PDF 등)</span>
        <input type="file" id="in-file" accept="image/*,application/pdf">
      </div>
      <button class="save-btn" id="saveBtn" onclick="uploadDoc()">+ 등록하기</button>
      <div class="status-msg" id="uploadStatus"></div>
    </div>
  </div>

  <div class="tabs" id="ownerTabs"></div>
  <div class="tabs" id="tabs"></div>

  <div id="docListWrap"></div>
  <div class="empty" id="emptyMsg" style="display:none;">등록된 문서가 없습니다.</div>

</div>

<div class="toast" id="toast"></div>

<div class="preview-overlay" id="previewOverlay" onclick="if(event.target===this) closePreview();">
  <div class="preview-box">
    <div class="preview-head">
      <span class="name" id="previewName"></span>
      <button class="close-btn" onclick="closePreview()">✕</button>
    </div>
    <div class="preview-body" id="previewBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script src="./common.js"></script>
<script>
/* ===========================================================
   Supabase 연동 (documents 테이블 + documents 스토리지 버킷, 비공개)
   =========================================================== */
const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY, {
  auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true }
});
window.sb = sb; // auth-gate.js가 같은 클라이언트를 재사용하도록 공유

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    sb.auth.startAutoRefresh();
  } else {
    sb.auth.stopAutoRefresh();
  }
});

const CATEGORIES = ["보험","계약서","신분증","사이트","OTT","쇼핑","WIFI","기타"];
const CRED_CATEGORIES = ["사이트","OTT","쇼핑","WIFI"];
const OWNERS = ["공동","보라","관"];
let docs = [];
let filter = "all";
let ownerFilter = "all";
let pickedFile = null;
let entryType = "file"; // 'file' | 'credential'

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }


function iconFor(fileName){
  const ext = (fileName||"").split('.').pop().toLowerCase();
  if(ext === 'pdf') return '📄';
  if(['jpg','jpeg','png','gif','webp','heic'].includes(ext)) return '🖼️';
  return '📁';
}

document.getElementById('in-file').addEventListener('change', function(e){
  pickedFile = e.target.files[0] || null;
  document.getElementById('dropLabel').innerHTML = pickedFile
    ? `<span class="picked">${escapeHtml(pickedFile.name)}</span>`
    : '클릭해서 파일 선택 (이미지, PDF 등)';
});

function setEntryType(type){
  entryType = type;
  document.querySelectorAll('#typeToggle .type-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.type === type);
  });
  const isFile = type === 'file';
  document.getElementById('categoryField').style.display = isFile ? '' : 'none';
  document.getElementById('dropZone').style.display = isFile ? '' : 'none';
  document.getElementById('credCategoryField').style.display = isFile ? 'none' : '';
  document.getElementById('credIdField').style.display = isFile ? 'none' : '';
  document.getElementById('credPwField').style.display = isFile ? 'none' : '';
  document.getElementById('uploadStatus').textContent = '';
}

/* ---- 목록 로드 ---- */
async function loadDocs(){
  const { data, error } = await sb.from('documents').select('*').order('uploadedAt', { ascending:false });
  if(error){
    console.error("문서 목록 로드 실패:", error);
  } else {
    docs = data || [];
  }
  render();
}

function setFilter(f){
  filter = f;
  render();
}
function setOwnerFilter(o){
  ownerFilter = o;
  render();
}

function docRowHtml(d){
  if(d.type === 'credential') return credentialRowHtml(d);
  return fileRowHtml(d);
}

function fileRowHtml(d){
  return `
    <div class="doc-row" onclick="previewDoc('${d.id}')">
      <div class="icon">${iconFor(d.fileName)}</div>
      <div class="body">
        <div class="title">${escapeHtml(d.title)}</div>
        <div class="meta">
          <span class="owner-badge">${escapeHtml(d.owner||'공동')}</span>
          <span class="cat-badge">${escapeHtml(d.category)}</span>
          <span>${escapeHtml(d.fileName)}</span>
          <span>${escapeHtml((d.uploadedAt||"").slice(0,10))}</span>
        </div>
        ${d.memo ? `<div class="memo">${escapeHtml(d.memo)}</div>` : ''}
      </div>
      <div class="actions">
        <button class="dl-btn" onclick="event.stopPropagation();downloadDoc('${d.id}')">다운로드</button>
        <button class="del-btn" onclick="event.stopPropagation();deleteDoc('${d.id}')">삭제</button>
      </div>
    </div>
  `;
}

function credentialRowHtml(d){
  const cidId = `cred-id-${d.id}`;
  const cpwId = `cred-pw-${d.id}`;
  return `
    <div class="doc-row" style="cursor:default;">
      <div class="icon">🔑</div>
      <div class="body">
        <div class="title">${escapeHtml(d.title)}</div>
        <div class="meta">
          <span class="owner-badge">${escapeHtml(d.owner||'공동')}</span>
          <span class="cat-badge">${escapeHtml(d.category||'기타')}</span>
          <span>${escapeHtml((d.uploadedAt||"").slice(0,10))}</span>
        </div>
        <div class="cred-grid">
          <div class="cred-item">
            <span class="cred-label">아이디</span>
            <span class="cred-value" id="${cidId}">${escapeHtml(d.accountId||'')}</span>
          </div>
          <div class="cred-item">
            <span class="cred-label">비밀번호</span>
            <span class="cred-value" id="${cpwId}">${escapeHtml(d.accountPw||'')}</span>
          </div>
        </div>
        ${d.memo ? `<div class="memo">${escapeHtml(d.memo)}</div>` : ''}
      </div>
      <div class="actions">
        <button class="dl-btn" onclick="copyText('${cidId}','아이디')">ID 복사</button>
        <button class="dl-btn" onclick="copyText('${cpwId}','비밀번호')">PW 복사</button>
        <button class="del-btn" onclick="deleteDoc('${d.id}')">삭제</button>
      </div>
    </div>
  `;
}

function render(){
  /* 등록자 탭 */
  const ownerCounts = { 공동:0, 보라:0, 관:0 };
  docs.forEach(d => { const o = d.owner || '공동'; if(ownerCounts[o] !== undefined) ownerCounts[o]++; });
  const ownerTabDefs = [
    { key:"all", label:`전체 (${docs.length})` },
    ...OWNERS.map(o => ({ key:o, label:`${o} (${ownerCounts[o]})` }))
  ];
  document.getElementById('ownerTabs').innerHTML = ownerTabDefs.map(t =>
    `<button class="tab ${ownerFilter===t.key?'active':''}" onclick="setOwnerFilter('${t.key}')">${t.label}</button>`
  ).join('');

  /* 카테고리 탭 (등록자 필터가 걸린 상태 기준으로 개수 표시) */
  const ownerScoped = ownerFilter === "all" ? docs : docs.filter(d => (d.owner||'공동') === ownerFilter);
  const counts = Object.fromEntries(CATEGORIES.map(c => [c, 0]));
  ownerScoped.forEach(d => { if(counts[d.category] !== undefined) counts[d.category]++; });
  const tabDefs = [
    { key:"all", label:`전체 (${ownerScoped.length})` },
    ...CATEGORIES.map(c => ({ key:c, label:`${c} (${counts[c]})` }))
  ];
  document.getElementById('tabs').innerHTML = tabDefs.map(t =>
    `<button class="tab ${filter===t.key?'active':''}" onclick="setFilter('${t.key}')">${t.label}</button>`
  ).join('');

  const list = filter === "all" ? ownerScoped : ownerScoped.filter(d => d.category === filter);
  const wrap = document.getElementById('docListWrap');
  const emptyMsg = document.getElementById('emptyMsg');

  if(list.length === 0){
    wrap.innerHTML = "";
    emptyMsg.style.display = "block";
    return;
  }
  emptyMsg.style.display = "none";

  if(ownerFilter !== "all"){
    // 특정 등록자만 보는 중이면 그냥 목록 하나로
    wrap.innerHTML = `<div class="doc-list">${list.map(docRowHtml).join('')}</div>`;
    return;
  }

  // 전체 보기: 등록자별로 나눠서(공동/보라/관 순) 섹션을 만듭니다.
  const sections = OWNERS.map(o => ({ owner:o, items: list.filter(d => (d.owner||'공동') === o) }))
    .filter(s => s.items.length > 0);

  wrap.innerHTML = sections.map(s => `
    <div class="owner-section-title">${s.owner} (${s.items.length})</div>
    <div class="doc-list">${s.items.map(docRowHtml).join('')}</div>
  `).join('');
}

/* ---- 업로드 ---- */
async function uploadDoc(){
  const title = document.getElementById('in-title').value.trim();
  const owner = document.getElementById('in-owner').value;
  const memo = document.getElementById('in-memo').value.trim();
  const statusEl = document.getElementById('uploadStatus');
  const saveBtn = document.getElementById('saveBtn');

  if(!title){ alert('제목을 입력해주세요.'); return; }

  if(entryType === 'credential'){
    const credCategory = document.getElementById('in-cred-category').value;
    const accountId = document.getElementById('in-cred-id').value.trim();
    const accountPw = document.getElementById('in-cred-pw').value.trim();
    if(!accountId || !accountPw){ alert('아이디와 비밀번호를 입력해주세요.'); return; }

    saveBtn.disabled = true;
    statusEl.textContent = "저장 중...";

    const newDoc = {
      id: uid(),
      title, owner, memo,
      type: 'credential',
      category: credCategory,
      accountId, accountPw,
      fileName: null,
      storagePath: null,
      uploadedAt: new Date().toISOString()
    };

    const { error: insertError } = await sb.from('documents').insert(newDoc);
    saveBtn.disabled = false;

    if(insertError){
      statusEl.textContent = "저장 실패: " + insertError.message;
      return;
    }

    statusEl.textContent = "등록 완료 ✓";
    document.getElementById('in-title').value = "";
    document.getElementById('in-memo').value = "";
    document.getElementById('in-owner').value = "공동";
    document.getElementById('in-cred-category').value = "사이트";
    document.getElementById('in-cred-id').value = "";
    document.getElementById('in-cred-pw').value = "";

    await loadDocs();
    return;
  }

  const category = document.getElementById('in-category').value;
  if(!pickedFile){ alert('파일을 선택해주세요.'); return; }

  saveBtn.disabled = true;
  statusEl.textContent = "업로드 중...";

  // Supabase Storage 키에는 한글 등 비ASCII 문자가 들어가면 "Invalid key" 에러가 나서,
  // 실제 저장 경로는 영문/숫자로만 만들고(uid+확장자), 원본 파일명은 fileName 컬럼에 따로 저장합니다.
  const extMatch = pickedFile.name.match(/\.[A-Za-z0-9]+$/);
  const ext = extMatch ? extMatch[0] : '';
  const storagePath = `${uid()}${ext}`;

  const { error: uploadError } = await sb.storage
    .from('documents')
    .upload(storagePath, pickedFile, { contentType: pickedFile.type, upsert: false });

  if(uploadError){
    statusEl.textContent = "업로드 실패: " + uploadError.message;
    saveBtn.disabled = false;
    return;
  }

  const newDoc = {
    id: uid(),
    title, owner, category, memo,
    type: 'file',
    fileName: pickedFile.name,
    storagePath,
    uploadedAt: new Date().toISOString()
  };

  const { error: insertError } = await sb.from('documents').insert(newDoc);
  saveBtn.disabled = false;

  if(insertError){
    statusEl.textContent = "저장 실패: " + insertError.message;
    // 이미 올라간 파일은 정리
    await sb.storage.from('documents').remove([storagePath]);
    return;
  }

  statusEl.textContent = "등록 완료 ✓";
  document.getElementById('in-title').value = "";
  document.getElementById('in-memo').value = "";
  document.getElementById('in-owner').value = "공동";
  document.getElementById('in-category').value = "보험";
  document.getElementById('in-file').value = "";
  document.getElementById('dropLabel').textContent = "클릭해서 파일 선택 (이미지, PDF 등)";
  pickedFile = null;

  await loadDocs();
}

/* ---- 미리보기 (비공개 버킷 → 서명 URL로 5분간 유효한 링크 발급, 팝업으로 표시) ---- */
function fileKindFor(fileName){
  const ext = (fileName||"").split('.').pop().toLowerCase();
  if(['jpg','jpeg','png','gif','webp','bmp','svg'].includes(ext)) return 'image';
  if(ext === 'pdf') return 'pdf';
  if(['mp4','mov','webm','ogg','m4v'].includes(ext)) return 'video';
  return 'other';
}

async function previewDoc(id){
  const doc = docs.find(d => d.id === id);
  if(!doc) return;

  const overlay = document.getElementById('previewOverlay');
  const body = document.getElementById('previewBody');
  const nameEl = document.getElementById('previewName');

  nameEl.textContent = doc.title || doc.fileName;
  body.innerHTML = `<div class="preview-msg">불러오는 중...</div>`;
  overlay.classList.add('open');

  const { data, error } = await sb.storage.from('documents').createSignedUrl(doc.storagePath, 300);
  if(error){
    body.innerHTML = `<div class="preview-msg">미리보기 링크 생성 실패: ${escapeHtml(error.message)}</div>`;
    return;
  }

  const url = data.signedUrl;
  const kind = fileKindFor(doc.fileName);

  if(kind === 'image'){
    body.innerHTML = `<img src="${url}" alt="${escapeHtml(doc.fileName)}">`;
  } else if(kind === 'pdf'){
    body.innerHTML = `<iframe src="${url}"></iframe>`;
  } else if(kind === 'video'){
    body.innerHTML = `<video src="${url}" controls autoplay></video>`;
  } else {
    body.innerHTML = `<div class="preview-msg">이 파일 형식은 미리보기를 지원하지 않습니다.<br><a href="${url}" target="_blank">새 탭에서 열기</a></div>`;
  }
}

function closePreview(){
  const overlay = document.getElementById('previewOverlay');
  const body = document.getElementById('previewBody');
  overlay.classList.remove('open');
  body.innerHTML = ""; // 영상 재생 중지 등을 위해 비워줌
}

document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') closePreview();
});

/* ---- ID/PW 복사 ---- */
function showToast(msg){
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 1600);
}

function copyText(elId, label){
  const el = document.getElementById(elId);
  if(!el) return;
  const text = el.textContent;

  const done = () => showToast(`${label} 복사됨`);
  const fail = () => showToast(`${label} 복사 실패`);

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(() => {
      legacyCopy(text) ? done() : fail();
    });
  } else {
    legacyCopy(text) ? done() : fail();
  }
}

function legacyCopy(text){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch(e){
    return false;
  }
}

/* ---- 다운로드 (비공개 버킷 → 서명 URL로 60초간 유효한 링크 발급) ---- */
async function downloadDoc(id){
  const doc = docs.find(d => d.id === id);
  if(!doc) return;
  const { data, error } = await sb.storage.from('documents').createSignedUrl(doc.storagePath, 60);
  if(error){ alert("다운로드 링크 생성 실패: " + error.message); return; }
  window.open(data.signedUrl, '_blank');
}

async function deleteDoc(id){
  const doc = docs.find(d => d.id === id);
  if(!doc) return;
  if(!confirm('이 문서를 삭제할까요?')) return;

  if(doc.storagePath){
    const { error: storageError } = await sb.storage.from('documents').remove([doc.storagePath]);
    if(storageError){ alert("파일 삭제 실패: " + storageError.message); return; }
  }

  const { error } = await sb.from('documents').delete().eq('id', id);
  if(error){ alert("삭제 실패: " + error.message); return; }

  await loadDocs();
}

loadDocs();
</script>
