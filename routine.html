<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>루틴 · 포트폴리오</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#3a5a52">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BORAKWAN">
<link rel="stylesheet" href="./common.css">
<link rel="stylesheet" href="./panel-common.css">
<style>
  header{margin-bottom:20px;}

  /* ---- 사람 선택 (index.html의 owner-toggle과 동일한 규칙) ---- */
  .owner-toggle{
    display:flex;
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    margin-bottom:14px;
    max-width:320px;
  }
  .owner-toggle button{
    flex:1;
    border:none;
    background:#fff;
    padding:9px 0;
    font-size:13px;
    font-weight:600;
    color:var(--sub);
    cursor:pointer;
  }
  .owner-toggle button + button{border-left:1px solid var(--line);}
  .owner-toggle button.active[data-owner="관"]{background:var(--owner-gwan-bg);color:var(--owner-gwan-ink);}
  .owner-toggle button.active[data-owner="보라"]{background:var(--owner-bora-bg);color:var(--owner-bora-ink);}

  /* ---- 날짜 이동 ---- */
  .date-nav{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .date-nav button{
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    border-radius:7px;
    padding:7px 12px;
    font-size:13px;
    cursor:pointer;
    font-family:inherit;
  }
  .date-nav button:hover{border-color:var(--accent);}
  .date-nav input[type=date]{
    border:1px solid var(--line);
    border-radius:7px;
    padding:7px 10px;
    font-size:13.5px;
    background:#fff;
    color:var(--ink);
    font-family:inherit;
  }
  .date-nav input[type=date]:focus{outline:none;border-color:var(--accent);}
  .date-nav .weekday{font-size:13px;color:var(--sub);}
  .date-nav .today-badge{
    font-size:11.5px;
    font-weight:600;
    color:var(--conf-ink);
    background:var(--conf-bg);
    border-radius:20px;
    padding:3px 10px;
  }

  /* ---- 최근 N일 요약 (항목별 실행률) ----
     history 스트립이 "하루 총량"을 보여준다면, 여기는 "어떤 항목이 잘 붙고
     어떤 항목에서 매번 걸리는지"를 항목 단위로 보여줍니다. */
  .summary-lead{
    font-size:13.5px;
    line-height:1.7;
    margin:0 0 14px;
    color:var(--ink);
  }
  .summary-lead b{ font-weight:700; }

  .rate-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:5px 0;
  }
  .rate-label{
    font-size:13px;
    width:150px;
    flex-shrink:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .rate-track{
    flex:1;
    height:7px;
    border-radius:4px;
    background:var(--bg);
    border:1px solid var(--line);
    overflow:hidden;
  }
  .rate-fill{
    display:block;
    height:100%;
    background:var(--accent);
    border-radius:4px 0 0 4px;
  }
  .rate-pct{
    font-size:12.5px;
    color:var(--sub);
    width:38px;
    flex-shrink:0;
    text-align:right;
    font-variant-numeric:tabular-nums;
  }

  /* 좌: 체크리스트 / 우: 업무 메모 (모바일에서는 1단으로 접힘)
     체크 목록은 폭이 더 필요 없으므로 왼쪽은 고정폭에 가깝게 두고,
     남는 가로 공간은 전부 메모 칸이 쓰게 합니다. */
  .routine-grid{
    display:grid;
    grid-template-columns:minmax(300px, 380px) 1fr;
    gap:16px;
    align-items:stretch;
  }
  /* 왼쪽 칸의 패널들을 세로로 쌓되, 아래 여백은 grid gap이 담당합니다. */
  .check-column{
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 18px;
  }

  /* 메모 패널은 왼쪽 칸 높이에 맞춰 늘어나고, 남는 높이는 textarea가 먹습니다.
     (예전에는 메모 칸이 짧아 오른쪽 아래가 통째로 비어 보였습니다) */
  .memo-panel{ display:flex; flex-direction:column; }
  .memo-panel .field{ flex:1; display:flex; flex-direction:column; margin-bottom:0; }
  .memo-panel textarea{ flex:1; }

  /* ---- 체크 항목 ---- */
  .check-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    margin-bottom:5px;
    cursor:pointer;
    user-select:none;
    transition:border-color .12s ease, background .12s ease;
  }
  .check-item:last-child{ margin-bottom:0; }
  .check-item:hover{ border-color:var(--accent); }
  .check-item.checked{
    background:var(--conf-bg);
    border-color:var(--conf-ink);
  }
  .check-item.checked .check-label{
    color:var(--conf-ink);
    font-weight:600;
  }
  .check-item input[type=checkbox]{
    width:17px;height:17px;
    accent-color:var(--accent);
    cursor:pointer;
    flex-shrink:0;
    margin:0;
  }
  .check-time{
    font-size:12px;
    color:var(--sub);
    width:44px;
    flex-shrink:0;
    font-variant-numeric:tabular-nums;
  }
  .check-label{ font-size:13.5px; }
  /* 폰(MacroDroid)이 자동으로 남긴 "실제로 한 시각".
     목표 시각보다 늦어도 감점이 아니라, 요즘 몇 시로 밀리는지 보는 자료입니다. */
  .check-actual{
    margin-left:auto;
    flex-shrink:0;
    font-size:11.5px;
    color:var(--sub);
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:20px;
    padding:1px 8px;
    font-variant-numeric:tabular-nums;
  }
  .check-item.checked .check-actual{ color:var(--conf-ink); border-color:var(--conf-ink); }

  /* ---- 업무 메모 / AI 요약 ---- */
  textarea{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:7px;
    font-size:13.5px;
    background:#fff;
    color:var(--ink);
    font-family:inherit;
    resize:vertical;
    min-height:150px;
  }
  textarea:focus{ outline:none; border-color:var(--accent); }

  .ai-btn{
    margin-top:10px;
    align-self:flex-start;  /* memo-panel이 flex라서 안 쓰면 버튼이 전체 폭으로 늘어남 */
    background:#fff;
    color:var(--accent);
    border:1px solid var(--accent);
    padding:9px 18px;
    border-radius:7px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .ai-btn:hover{ background:#eef0ec; }
  .ai-btn:disabled{ opacity:0.5; cursor:not-allowed; }

  .summary-box{
    display:none;
    margin-top:14px;
    padding:14px 16px;
    background:#fafaf8;
    border:1px solid var(--line);
    border-radius:9px;
    font-size:13.5px;
    line-height:1.65;
  }
  /* 줄바꿈 유지는 실제 요약 텍스트에만 겁니다.
     (박스 전체에 걸면 HTML 들여쓰기 공백까지 그대로 그려져 빈 줄이 생깁니다) */
  #summaryText{ white-space:pre-wrap; }
  .summary-box .summary-head{
    font-size:11.5px;
    font-weight:600;
    color:var(--sub);
    margin-bottom:8px;
  }

  .save-btn{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:10px 22px;
    border-radius:7px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
  }
  .save-btn:hover{ opacity:0.9; }
  .save-btn:disabled{ opacity:0.5; cursor:not-allowed; }

  .save-row{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .status-msg{
    font-size:12.5px;
    color:var(--sub);
    min-height:17px;
  }
  .status-msg.error{ color:#b3452f; }

  @media (max-width:900px){
    .rate-label{ width:110px; font-size:12.5px; }
    .routine-grid{ grid-template-columns:1fr; gap:14px; }
    .memo-panel textarea{ min-height:150px; }
    .owner-toggle{ max-width:100%; }
  }
</style>
</head>
<body>
<script src="./nav.js?v=7"></script>
<div class="wrap" id="appContent">

  <header>
    <h1>✅ 루틴</h1>
    <p>사람별 · 날짜별로 평일 루틴 체크와 업무 메모를 기록합니다 (주말 제외)</p>
  </header>

  <div class="owner-toggle" id="ownerToggle">
    <button type="button" data-owner="관">관</button>
    <button type="button" data-owner="보라">보라</button>
  </div>

  <div class="date-nav">
    <button type="button" id="prevDay" title="하루 전">‹</button>
    <input type="date" id="datePicker">
    <button type="button" id="nextDay" title="하루 뒤">›</button>
    <button type="button" id="todayBtn">오늘</button>
    <span class="weekday" id="weekdayLabel"></span>
    <span class="today-badge" id="todayBadge" hidden>오늘</span>
  </div>

  <div class="panel" id="summaryPanel"></div>

  <div id="routineBody"></div>

  <div class="save-row">
    <button class="save-btn" id="saveBtn">저장하기</button>
    <span class="status-msg" id="statusMsg"></span>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script src="./common.js"></script>
<script>
/* =========================================================
   루틴 체크 (routine_logs, (log_date, owner) 하루 1행)
   - Supabase 접속 값은 ./supabase-config.js 한 곳에서만 관리합니다.
   - 체크 항목은 DB 컬럼이 아니라 아래 ROUTINE_ITEMS에만 정의돼 있습니다.
     사람마다 항목이 달라도 DB는 그대로 두고 이 배열만 고치면 됩니다.
   - AI 요약은 ledger.html의 analyze-spending과 동일하게 Supabase Edge Function
     (summarize-routine)을 거칩니다. API 키는 Supabase 시크릿(GEMINI_API_KEY)에만
     있고 프론트엔드에는 노출되지 않습니다.
     소스: supabase/functions/summarize-routine/index.ts
   ========================================================= */

const HISTORY_DAYS = 14;     // "최근 N일 요약" 패널이 훑는 기간
const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];

// 사람별 루틴 정의. 보라는 아직 비어 있습니다.
// 항목을 추가할 때 key만 겹치지 않게 하면 DB 변경 없이 바로 반영됩니다.
const ROUTINE_ITEMS = {
  "관": [
    { section: "고정 루틴", items: [
      { key:"wake_up",        time:"05:45", label:"기상" },
      { key:"leave_home",     time:"06:00", label:"출근 (집에서 나옴)" },
      { key:"exercise_start", time:"07:20", label:"운동 시작" },
      { key:"arrive_work",    time:"08:30", label:"출근 (도착)" },
      { key:"leave_work",     time:"17:30", label:"퇴근" },
      { key:"sleep",          time:"23:00", label:"취침" },
    ]},
    { section: "20시 체크리스트", items: [
      { key:"task_edit", label:"편집" },
      { key:"task_blog", label:"블로그쓰기" },
    ]},
  ],
  "보라": [],
};

// 업무 메모 + AI 요약을 쓰는 사람. 보라는 항목이 정해지면 추가하세요.
const MEMO_OWNERS = ["관"];

const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY, {
  auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true }
});
window.sb = sb; // auth-gate.js가 같은 클라이언트를 재사용하도록 공유

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    sb.auth.startAutoRefresh();
  } else {
    sb.auth.stopAutoRefresh();
  }
});

/* ---------- 날짜 유틸 ---------- */
// toISOString()은 UTC 기준이라 새벽 시간대에 전날 날짜가 나옵니다.
// 05:45 기상 체크가 어제 행에 저장되면 안 되므로 로컬 날짜를 직접 만듭니다.
function toKey(d){
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function fromKey(key){
  const [y, m, d] = key.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function shiftDays(key, delta){
  const d = fromKey(key);
  d.setDate(d.getDate() + delta);
  return toKey(d);
}
// 이 루틴은 평일 기준입니다. 주말은 체크/저장 없이 비워둡니다.
function isWeekend(key){
  const day = fromKey(key).getDay();
  return day === 0 || day === 6;
}

const TODAY = toKey(new Date());

/* ---------- 상태 (항상 새 객체로 교체) ---------- */
let state = {
  owner: "관",
  date: TODAY,
  checks: {},        // { [itemKey]: boolean }
  check_times: {},   // { [itemKey]: "HH:MM" } — 폰에서 자동 기록된 실제 시각(읽기 전용)
  work_memo: "",
  work_summary: "",
  history: {},       // { [dateKey]: 체크 개수 }
  itemStats: {},      // { [itemKey]: { done, tracked } } — 최근 HISTORY_DAYS 기준
};

function setState(patch){
  state = { ...state, ...patch };
}

function itemsFor(owner){
  return (ROUTINE_ITEMS[owner] || []).flatMap(group => group.items);
}
function hasMemo(owner){
  return MEMO_OWNERS.includes(owner);
}

/* ---------- 렌더링 ---------- */
function renderOwnerToggle(){
  document.querySelectorAll('#ownerToggle button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.owner === state.owner);
  });
}

function renderDateNav(){
  document.getElementById('datePicker').value = state.date;
  document.getElementById('weekdayLabel').textContent =
    `(${WEEKDAYS[fromKey(state.date).getDay()]})`;
  document.getElementById('todayBadge').hidden = state.date !== TODAY;
}

function renderBody(){
  const el = document.getElementById('routineBody');
  const groups = ROUTINE_ITEMS[state.owner] || [];

  // 주말이거나 기록할 항목이 없으면 본문 대신 안내만 띄우고 저장 버튼도 숨깁니다.
  const weekend = isWeekend(state.date);
  const isEmpty = groups.length === 0 && !hasMemo(state.owner);
  document.querySelector('.save-row').style.display = (weekend || isEmpty) ? 'none' : 'flex';

  if(weekend){
    const d = fromKey(state.date);
    el.innerHTML = `<div class="panel"><div class="empty">
      ${d.getMonth()+1}월 ${d.getDate()}일은 ${WEEKDAYS[d.getDay()]}요일입니다.<br>
      이 루틴은 평일에만 기록합니다.
    </div></div>`;
    return;
  }

  if(isEmpty){
    el.innerHTML = `<div class="panel"><div class="empty">
      ${escapeHtml(state.owner)}님의 루틴이 아직 없습니다.<br>
      항목이 정해지면 routine.html의 ROUTINE_ITEMS에 추가하세요.
    </div></div>`;
    return;
  }

  const checksHtml = groups.map(group => `
    <div class="panel">
      <h2>${escapeHtml(group.section)}</h2>
      ${group.items.map(item => `
        <label class="check-item${state.checks[item.key] ? ' checked' : ''}">
          ${item.time ? `<span class="check-time">${escapeHtml(item.time)}</span>` : ''}
          <input type="checkbox" data-key="${escapeHtml(item.key)}"${state.checks[item.key] ? ' checked' : ''}>
          <span class="check-label">${escapeHtml(item.label)}</span>
          ${state.check_times[item.key]
            ? `<span class="check-actual" title="폰에서 자동으로 기록된 실제 시각">${escapeHtml(state.check_times[item.key])}</span>`
            : ''}
        </label>
      `).join('')}
    </div>
  `).join('');

  const memoHtml = hasMemo(state.owner) ? `
    <div class="panel memo-panel">
      <h2>출근해서 한 일</h2>
      <div class="field">
        <label for="workMemo">업무 메모</label>
        <textarea id="workMemo" placeholder="하루 중 생각날 때마다 자유롭게 적어두세요...">${escapeHtml(state.work_memo)}</textarea>
      </div>
      <button class="ai-btn" id="summarizeBtn">✨ AI로 요약 정리하기</button>
      <div class="summary-box" id="summaryBox" style="display:${state.work_summary ? 'block' : 'none'}">
        <div class="summary-head">AI 업무일지 요약</div>
        <div id="summaryText">${escapeHtml(state.work_summary)}</div>
      </div>
    </div>` : '';

  el.innerHTML = `<div class="routine-grid"><div class="check-column">${checksHtml}</div>${memoHtml}</div>`;

  el.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', () => {
      setState({ checks: { ...state.checks, [cb.dataset.key]: cb.checked } });
      cb.closest('.check-item').classList.toggle('checked', cb.checked);
    });
  });

  const btn = document.getElementById('summarizeBtn');
  if(btn) btn.addEventListener('click', summarize);
}

// 최근 HISTORY_DAYS를 "얼마나 지켰는지"가 아니라 "어느 항목에 마찰이 있는지"로 요약합니다.
// 합격선이나 연속 기록 같은 수치는 두지 않습니다 — 체크리스트는 계약이 아니라
// 스스로 지키려고 하는 대상이라, 여기서도 추세만 보여주고 판정은 하지 않습니다.
function renderSummary(){
  const el = document.getElementById('summaryPanel');
  const items = itemsFor(state.owner);

  // 빈 패널을 카드째로 남겨두면 내용 없는 흰 박스만 떠 있게 되므로, 통째로 숨깁니다.
  if(items.length === 0){ el.style.display = 'none'; el.innerHTML = ""; return; }
  el.style.display = '';

  const trackedDays = Object.keys(state.history).length;
  if(trackedDays === 0){
    el.innerHTML = `<h2>최근 ${HISTORY_DAYS}일 요약</h2>
      <div class="empty">아직 기록이 없습니다. 며칠 쌓이면 여기에 요약이 표시됩니다.</div>`;
    return;
  }

  const totalDone = Object.values(state.history).reduce((a, b) => a + b, 0);
  const avg = (totalDone / trackedDays).toFixed(1);

  const rates = items
    .map(item => {
      const s = state.itemStats[item.key];
      return (s && s.tracked)
        ? { label: item.label, rate: Math.round((s.done / s.tracked) * 100) }
        : null;
    })
    .filter(Boolean);

  let lead = `최근 ${HISTORY_DAYS}일 중 <b>${trackedDays}일</b>을 기록했고, `
    + `하루 평균 <b>${avg}개</b> / ${items.length}개를 실행했습니다.`;

  const sorted = [...rates].sort((a, b) => b.rate - a.rate);
  if(sorted.length > 1 && sorted[0].rate !== sorted[sorted.length - 1].rate){
    const best = sorted[0], worst = sorted[sorted.length - 1];
    lead += ` 가장 잘 붙은 건 <b>${escapeHtml(best.label)}</b>(${best.rate}%), `
      + `마찰이 가장 큰 건 <b>${escapeHtml(worst.label)}</b>(${worst.rate}%)입니다.`;
  }

  // 항목 순서는 체크리스트와 동일하게 둡니다 — 아래 목록과 바로 대조할 수 있도록.
  const barsHtml = rates.map(r => `
    <div class="rate-row">
      <span class="rate-label" title="${escapeHtml(r.label)}">${escapeHtml(r.label)}</span>
      <span class="rate-track"><span class="rate-fill" style="width:${r.rate}%"></span></span>
      <span class="rate-pct">${r.rate}%</span>
    </div>
  `).join('');

  el.innerHTML = `<h2>최근 ${HISTORY_DAYS}일 요약</h2>
    <p class="summary-lead">${lead}</p>
    ${barsHtml}`;
}

function setStatus(message, isError){
  const el = document.getElementById('statusMsg');
  el.textContent = message || "";
  el.classList.toggle('error', !!isError);
}

function renderAll(){
  renderOwnerToggle();
  renderDateNav();
  renderSummary();
  renderBody();
}

/* ---------- 불러오기 ---------- */
async function loadDay(){
  // 주말에는 저장되는 기록이 없으므로 조회도 건너뜁니다.
  if(isWeekend(state.date)){
    setState({ checks: {}, check_times: {}, work_memo: "", work_summary: "" });
    renderBody();
    return;
  }

  const { data, error } = await sb
    .from('routine_logs')
    .select('checks, check_times, work_memo, work_summary')
    .eq('log_date', state.date)
    .eq('owner', state.owner)
    .maybeSingle();

  if(error){
    console.error("루틴 불러오기 실패:", error);
    setStatus("기록을 불러오지 못했습니다: " + error.message, true);
    return;
  }

  setState({
    checks: (data && data.checks) || {},
    check_times: (data && data.check_times) || {},
    work_memo: (data && data.work_memo) || "",
    work_summary: (data && data.work_summary) || "",
  });
  renderBody();
}

async function loadHistory(){
  const items = itemsFor(state.owner);
  if(items.length === 0){ setState({ history: {}, itemStats: {} }); renderSummary(); return; }

  const from = shiftDays(TODAY, -(HISTORY_DAYS - 1));
  const { data, error } = await sb
    .from('routine_logs')
    .select('log_date, checks')
    .eq('owner', state.owner)
    .gte('log_date', from)
    .lte('log_date', TODAY);

  if(error){
    console.error("히스토리 불러오기 실패:", error);
    return; // 요약 줄은 부가 정보라 실패해도 본문은 그대로 씁니다.
  }

  const history = {};
  // 항목별로 "그 날짜에 기록이 있었나(tracked)"와 "그때 체크돼 있었나(done)"를 셉니다.
  // 기록 자체가 없는 날은 항목별 통계에서도 분모에 들어가지 않습니다 — 안 한 게 아니라
  // 아예 기록하지 않은 날이라 판단할 근거가 없기 때문입니다.
  const itemStats = {};
  items.forEach(item => { itemStats[item.key] = { done: 0, tracked: 0 }; });

  (data || []).forEach(row => {
    const checks = row.checks || {};
    history[row.log_date] = Object.values(checks).filter(Boolean).length;
    items.forEach(item => {
      itemStats[item.key].tracked += 1;
      if(checks[item.key]) itemStats[item.key].done += 1;
    });
  });

  setState({ history, itemStats });
  renderSummary();
}

async function refresh(){
  await Promise.all([loadDay(), loadHistory()]);
}

/* ---------- 이동 ---------- */
function goToDate(dateKey){
  if(!dateKey || dateKey === state.date) return;
  // 불러오기는 비동기라, 먼저 화면을 새 날짜 기준으로 비워둡니다.
  // 안 그러면 응답이 올 때까지 이전 날짜의 체크 상태가 그대로 보이고
  // (주말↔평일 전환도 늦게 반영), 그 사이에 저장하면 엉뚱한 날짜에 덮어씁니다.
  setState({ date: dateKey, checks: {}, check_times: {}, work_memo: "", work_summary: "" });
  setStatus("");
  renderDateNav();
  renderBody();
  refresh();
}

function goToOwner(owner){
  if(owner === state.owner) return;
  setState({ owner, checks: {}, check_times: {}, work_memo: "", work_summary: "", history: {}, itemStats: {} });
  setStatus("");
  renderAll();
  refresh();
}

/* ---------- AI 요약 ---------- */
async function summarize(){
  const btn = document.getElementById('summarizeBtn');
  const memo = document.getElementById('workMemo').value.trim();

  if(!memo){
    setStatus("메모를 먼저 입력해주세요", true);
    return;
  }

  btn.disabled = true;
  setStatus("AI가 정리하는 중...");

  try{
    const { data, error } = await sb.functions.invoke('summarize-routine', { body: { memo } });

    if(error){
      // supabase-js는 Edge Function이 non-2xx를 반환하면 진짜 에러 메시지 대신
      // "non-2xx status code"라는 뭉뚱그린 문구만 줘서, 응답 본문(context)을 직접 읽어옴
      let detail = error.message;
      if(error.context && typeof error.context.json === 'function'){
        try{
          const body = await error.context.json();
          if(body?.error) detail = body.error;
        }catch(_){/* 본문이 JSON이 아니면 원래 메시지 유지 */}
      }
      throw new Error(detail);
    }

    if(!data || !data.summary){
      setStatus("요약 결과가 비어 있습니다", true);
      return;
    }

    setState({ work_summary: data.summary });
    const box = document.getElementById('summaryBox');
    document.getElementById('summaryText').textContent = data.summary;
    box.style.display = 'block';
    setStatus("요약 완료 — 아직 저장 전이니 저장하기를 눌러주세요");
  }catch(err){
    console.error("AI 요약 요청 실패:", err);
    setStatus("요약 실패: " + err.message, true);
  }finally{
    btn.disabled = false;
  }
}

/* ---------- 저장 (upsert) ---------- */
async function save(){
  if(isWeekend(state.date)) return; // 주말에는 저장할 내용이 없습니다.

  const btn = document.getElementById('saveBtn');
  const memoEl = document.getElementById('workMemo');
  if(memoEl) setState({ work_memo: memoEl.value });

  btn.disabled = true;
  setStatus("저장 중...");

  // check_times는 일부러 빼둡니다. 폰이 기록한 실제 시각을, 화면을 오래 열어둔 채
  // 저장할 때 옛 값으로 덮어쓰는 사고를 막기 위해서입니다. (폰 → DB 단방향)
  const payload = {
    log_date: state.date,
    owner: state.owner,
    checks: state.checks,
    work_memo: state.work_memo,
    work_summary: state.work_summary,
  };

  const { error } = await sb
    .from('routine_logs')
    .upsert(payload, { onConflict: 'log_date,owner' });

  btn.disabled = false;

  if(error){
    console.error("루틴 저장 실패:", error);
    setStatus("저장 실패: " + error.message, true);
    return;
  }
  setStatus("저장 완료 ✓");
  loadDay();     // 폰이 그사이 남긴 실제 시각을 화면에 다시 반영합니다.
  loadHistory(); // 방금 저장한 값이 "최근 N일 요약"에도 바로 반영되도록 다시 불러옵니다.
}

/* ---------- 초기화 ---------- */
document.querySelectorAll('#ownerToggle button').forEach(btn => {
  btn.addEventListener('click', () => goToOwner(btn.dataset.owner));
});
document.getElementById('prevDay').addEventListener('click', () => goToDate(shiftDays(state.date, -1)));
document.getElementById('nextDay').addEventListener('click', () => goToDate(shiftDays(state.date, 1)));
document.getElementById('todayBtn').addEventListener('click', () => goToDate(TODAY));
document.getElementById('datePicker').addEventListener('change', (e) => goToDate(e.target.value));
document.getElementById('saveBtn').addEventListener('click', save);

renderAll();

// 인증이 완료된 후에만 데이터를 로드합니다.
window.addEventListener('authReady', refresh);
</script>
<script src="./auth-gate.js?v=2"></script>
</body>
