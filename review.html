<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>체험단 당첨 관리</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#3a5a52">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BORAKWAN">
<link rel="stylesheet" href="./common.css">
<link rel="stylesheet" href="./panel-common.css">
<style>
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:16px;
    margin-bottom:24px;
  }
  .summary{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:22px;
  }
  .sum-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
  }
  .sum-card .num{font-size:22px;font-weight:700;}
  .sum-card .lbl{font-size:12.5px;color:var(--sub);margin-top:2px;}
  .sum-card.wait .num{color:var(--wait-ink);}
  .sum-card.conf .num{color:var(--conf-ink);}
  .sum-card.done .num{color:var(--done-ink);}
  .sum-card.end .num{color:var(--end-ink);}

  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
  }
    
  .form-grid{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .form-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:end;
  }
  .form-row .field{
    flex:1 1 170px;
  }
  .form-row .field:has(select),
  .form-row .field:has(input[type=date]){
    flex:0 1 130px;
  }
    input,select{
    width:100%;
    height:38px;
    padding:0 10px;
    border:1px solid var(--line);
    border-radius:7px;
    font-size:13.5px;
    background:#fff;
    color:var(--ink);
    font-family:inherit;
    box-sizing:border-box;
    min-width:0;
    overflow:hidden;
  }
  /* 사파리/아이패드에서 type=date 입력이 칸 너비를 무시하고 렌더링되면서
     옆 필드와 겹쳐 보이는 문제 방지용 방어 스타일 */
  input[type=date]{
    min-width:0;
    max-width:100%;
    -webkit-appearance:none;
    appearance:none;
    padding-right:30px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%236b6a63' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='4' width='18' height='18' rx='2'/><line x1='16' y1='2' x2='16' y2='6'/><line x1='8' y1='2' x2='8' y2='6'/><line x1='3' y1='10' x2='21' y2='10'/></svg>");
    background-repeat:no-repeat;
    background-position:right 10px center;
    background-size:14px 14px;
  }
  input[type=date]::-webkit-datetime-edit{
    overflow:hidden;
  }
  input[type=date]::-webkit-calendar-picker-indicator{
    /* width/height:100%+position:absolute를 썼더니 사파리에서 이 투명 클릭영역이
       인풋 범위를 벗어나 옆 필드까지 덮어버리는 버그가 있었음 → opacity만 낮춤 */
    opacity:0;
  }
  input:focus,select:focus{
    outline:none;
    border-color:var(--accent);
  }
  input[readonly]{
    background:#f4f3f0;
    color:var(--sub);
  }
  .add-btn{
    margin-top:14px;
    background:var(--accent);
    color:#fff;
    border:none;
    padding:10px 22px;
    border-radius:7px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
  }
  .add-btn:hover{opacity:0.9;}

  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:12px;
  }
  .tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .tab{
    border:1px solid var(--line);
    background:#fff;
    padding:7px 14px;
    border-radius:20px;
    font-size:13px;
    cursor:pointer;
    color:var(--sub);
  }
  .tab.active{
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
  }

  /* ---- 블로그 페이지 상단 서브탭 (체험단예정 / 체험단확인) ---- */
  .subnav{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  .subnav a{
    text-decoration:none;
    border:1px solid var(--line);
    background:#fff;
    color:var(--sub);
    padding:8px 16px;
    border-radius:20px;
    font-size:13.5px;
    font-weight:600;
  }
  .subnav a.active{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }

  /* 체험완료된 항목의 플랫폼명 링크 — 기본 파란 밑줄 링크 대신 굵은 글씨로만 클릭 가능함을 표시 */
  .platform-link{
    color:inherit;
    text-decoration:none;
    font-weight:700;
  }
  .platform-link:hover{
    text-decoration:underline;
  }

  .table-scroll{
    position: relative;
  }
  .rv-cards{ display:none; }
  .table-scroll::after{
    content: "";
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 28px;
    background: linear-gradient(to right, transparent, rgba(0,0,0,0.07));
    pointer-events: none;
  }
  .table-wrap {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .table-wrap::-webkit-scrollbar{
    height: 8px;
  }
  .table-wrap::-webkit-scrollbar-track{
    background: #f0eee6;
    border-radius: 4px;
  }
  .table-wrap::-webkit-scrollbar-thumb{
    background: #c8c5ba;
    border-radius: 4px;
  }
  .table-wrap::-webkit-scrollbar-thumb:hover{
    background: #b0ac9e;
  }

  table{
    width:100%;
    min-width:1050px;
    table-layout:fixed;
    border-collapse:collapse;
    font-size:13.5px;
  }
  
  thead th{
    text-align:left;
    font-size:12px;
    color:var(--sub);
    font-weight:600;
    padding:0 10px 10px;
    border-bottom:1px solid var(--line);
    white-space: nowrap !important;
  }
  tbody td{
    padding:10px 10px;
    border-bottom:1px solid var(--line);
    vertical-align:middle;
    white-space: nowrap;
  }
  tbody tr:hover{background:#fafaf7;}

  .name-cell{font-weight:600;}

  .ellipsis-cell{
    overflow:hidden;
    text-overflow:ellipsis;
    cursor:help;
  }
  thead th,
  tbody td{
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .status-badge{
    display:inline-block;
    font-size:12px;
    padding:4px 9px;
    border-radius:6px;
    font-weight:600;
  }
  .status-wait{background:var(--wait-bg);color:var(--wait-ink);}
  .status-confirm{background:var(--conf-bg);color:var(--conf-ink);}
  .status-done{background:var(--done-bg);color:var(--done-ink);}
  .status-end{background:var(--end-bg);color:var(--end-ink);}
  .resv-text{font-size:11.5px;color:var(--sub);margin-top:3px;white-space:nowrap;}

  /* ---- 수정 모달 ---- */
  .cal-modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.45);
    z-index:9998;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .cal-modal-overlay.open{display:flex;}
  .cal-modal{
    background:#fff;
    border-radius:16px;
    padding:26px;
    max-width:560px;
    width:100%;
    max-height:90vh;
    overflow-y:auto;
    position:relative;
  }
  .cal-modal-close{
    position:absolute;
    top:16px;right:16px;
    background:none;
    border:none;
    font-size:16px;
    color:var(--sub);
    cursor:pointer;
  }
  .cal-modal-title{font-size:17px;font-weight:700;margin-bottom:16px;}
  .edit-form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-areas:
      "name name"
      "provide provide"
      "status platform"
      "weekend weekend"
      "resv resv"
      "address contact"
      "deadline parking"
      "keyword keyword";
    gap:12px;
  }
  .edit-form-grid label{
    display:block;
    font-size:12px;
    color:var(--sub);
    margin-bottom:4px;
  }
  .edit-form-grid textarea{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:7px;
    font-size:13.5px;
    font-family:inherit;
    resize:vertical;
    min-height:52px;
    box-sizing:border-box;
  }
  .edit-resv-row{display:flex;gap:8px;}
  .modal-actions{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:20px;
  }
  .modal-save-btn{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:10px 24px;
    border-radius:7px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
  }
  .modal-save-btn:hover{opacity:0.9;}
  .modal-del-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--sub);
    padding:10px 16px;
    border-radius:7px;
    font-size:13px;
    cursor:pointer;
  }
  .modal-del-btn:hover{border-color:#b3452f;color:#b3452f;}

  /* ---- 요약 팝업 ---- */
  .name-cell{cursor:pointer;}
  .name-cell:hover{text-decoration:underline;}
  .detail-title{
    font-size:18px;
    font-weight:700;
    margin-bottom:4px;
  }
  .detail-sub{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:18px;
  }
  .detail-rows{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .detail-row{
    display:flex;
    gap:14px;
    padding-bottom:12px;
    border-bottom:1px solid var(--line);
  }
  .detail-row:last-child{border-bottom:none;padding-bottom:0;}
  .detail-label{
    flex:0 0 72px;
    font-size:12px;
    color:var(--sub);
    font-weight:600;
    padding-top:1px;
  }
  .detail-value{
    flex:1;
    font-size:13.5px;
    line-height:1.5;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .detail-value a{
    color:var(--accent);
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .detail-hint{
    font-size:11px;
    color:var(--sub);
  }
  .parking-copy-btn{
    border:1px solid var(--line);
    background:var(--card);
    color:var(--sub);
    border-radius:6px;
    padding:2px 8px;
    font-size:11px;
    cursor:pointer;
    margin-left:6px;
    white-space:nowrap;
  }
  .parking-copy-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .detail-actions{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:20px;
  }


/* ============================================================
   📱 모바일/태블릿 반응형 최적화
   (아이패드 세로/가로 모두 포함하도록 1080px까지 카드형 유지)
   ============================================================ */
@media (max-width:1080px){

  /* body 패딩은 여기서 따로 건드리지 않음 — body는 페이지 전체(메뉴바 포함)가
     공유하는 요소라, 여기서 줄이면 이 페이지에서만(820px가 아닌 1080px부터)
     메뉴바까지 옆 여백이 줄어들며 커져버림. 공용 메뉴바(#bkNav)도 class="wrap"을
     쓰기 때문에 같은 이유로 .wrap도 건드리지 않고, 이 페이지 콘텐츠 영역
     (#appContent)에만 폭 조정을 적용함 */
  #appContent{ max-width:100%; width:100%; overflow-x: hidden; }

  header{ align-items:flex-start; }

  .summary{ grid-template-columns:repeat(2,1fr); gap:8px; }

  .add-btn{ width:100%; text-align:center; }

  .toolbar{ flex-direction:column; align-items:stretch; gap:10px; }
  .tabs{ justify-content:flex-start; }

  /* 표는 완전히 숨기고, 핵심 정보(이름/상태/플랫폼/날짜/제공내역)만 2줄로 보여주는
     카드 목록으로 대체. 나머지 상세 항목(주소/예약문의/주차장/키워드)은 카드를
     눌러서 여는 요약 팝업에서 확인 — 한눈에 훑어보기엔 이게 더 깔끔함. */
  .table-scroll{ display:none; }
  .rv-cards{ display:flex; flex-direction:column; gap:8px; }

  .rv-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    cursor:pointer;
  }
  .rv-card:active{ background:#fafaf7; }

  .rv-row1{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:5px;
  }
  .rv-name{
    font-weight:700;
    font-size:14.5px;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .rv-row1 .status-badge{ flex-shrink:0; }

  .rv-row2{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:12px;
    color:var(--sub);
    min-width:0;
    overflow:hidden;
    white-space:nowrap;
  }
  .rv-row2 .rv-platform{ flex-shrink:0; font-weight:600; color:var(--ink); }
  .rv-row2 .rv-date{ flex-shrink:0; }
  .rv-row2 .rv-dot{ flex-shrink:0; color:var(--line); }
  .rv-row2 .rv-provide{
    min-width:0;
    flex:1 1 auto;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  /* 수정 모달: 체험단 이름(단독) → 제공내역 → 주소/예약문의 → 마감일자/상태/플랫폼 →
     주차장/키워드 (예약일시는 상태=예약완료일 때만 그 아래에 표시) */
  .edit-form-grid{
    grid-template-columns:1fr 1fr 1fr;
    grid-template-areas:
      "name name name"
      "provide provide provide"
      "address address contact"
      "deadline status platform"
      "weekend weekend weekend"
      "resv resv resv"
      "parking keyword keyword";
  }
}
</style>
</head>
<body>
<script src="./nav.js?v=6"></script>
<div class="wrap" id="appContent">

  <div class="subnav">
    <a href="./review.html" class="active">체험단예정</a>
    <a href="./campaigns.html">체험단확인</a>
  </div>

  <header>
    <div>
      <h1>블로그 체험단 관리</h1>
    </div>
  </header>

  <div class="summary" id="summary"></div>

  <div class="panel">
    <h2>새 체험단 등록</h2>
    <div class="form-grid">
      <div class="form-row">
        <div class="field">
          <label>체험단 이름</label>
          <input id="in-name" placeholder="예: OO 맛집 체험단">
        </div>
        <div class="field">
          <label>제공내역</label>
          <input id="in-provide" placeholder="예: 식사 2인 + 원고료 5만원">
        </div>
        <div class="field">
          <label>주소</label>
          <input id="in-address" placeholder="예: 서울시 강남구 ...">
        </div>
        <div class="field">
          <label>예약문의</label>
          <input id="in-contact" placeholder="예: 010-1234-5678">
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label>주차장 (주소와 자동 동일)</label>
          <input id="in-parking" type="text" placeholder="주소 입력 시 자동으로 채워집니다" readonly>
        </div>
        <div class="field">
          <label>마감일자</label>
          <input id="in-deadline" type="date" onclick="this.showPicker && this.showPicker()">
        </div>
        <div class="field">
          <label>키워드</label>
          <input id="in-keyword" type="text" placeholder="예: 강남맛집, OO맛집">
        </div>
        <div class="field">
          <label>상태</label>
          <select id="in-status">
            <option value="wait">예약대기</option>
            <option value="confirm">예약완료</option>
            <option value="done">체험완료</option>
            <option value="end">종료</option>
          </select>
        </div>
        <div class="field">
          <label>플랫폼</label>
          <select id="in-platform">
            <option value="디너의여왕">디너의여왕</option>
            <option value="리뷰노트">리뷰노트</option>
            <option value="놀러와체험단">놀러와체험단</option>
            <option value="레뷰">레뷰</option>
            <option value="데일리뷰">데일리뷰</option>
            <option value="파블로체험단">파블로체험단</option>
            <option value="서울오빠">서울오빠</option>
            <option value="강남맛집">강남맛집</option>
            <option value="리뷰플레이스">리뷰플레이스</option>
            <option value="기타">기타</option>
          </select>
        </div>
        <div class="field">
          <label>주말 가능여부</label>
          <select id="in-weekend">
            <option value="unknown">확인필요</option>
            <option value="possible">주말가능</option>
            <option value="impossible">주말불가</option>
          </select>
        </div>
      </div>
    </div>
    <button class="add-btn" onclick="addItem()">+ 추가하기</button>
  </div>

  <div class="panel">
    <div class="toolbar">
      <div class="tabs" id="tabs"></div>
    </div>

    <div class="table-scroll">
      <div class="table-wrap">
        <table>
          <colgroup>
            <col style="width:150px;">
            <col style="width:140px;">
            <col style="width:95px;">
            <col style="width:72px;">
            <col style="width:80px;">
            <col style="width:190px;">
            <col style="width:115px;">
            <col style="width:85px;">
            <col style="width:84px;">
            <col style="width:190px;">
          </colgroup>
          <thead>
            <tr>
              <th>체험단 이름</th>
              <th>제공내역</th>
              <th>상태/예약</th>
              <th>주말</th>
              <th>플랫폼</th>
              <th>주소</th>
              <th>예약문의</th>
              <th>주차장</th>
              <th>마감일자</th>
              <th>키워드</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
    <div class="rv-cards" id="cardList"></div>
    <div class="empty" id="emptyMsg" style="display:none;">등록된 체험단이 없습니다.</div>
  </div>

</div>

<div class="cal-modal-overlay" id="editModalOverlay" onclick="if(event.target===this) closeEditModal()">
  <div class="cal-modal">
    <button class="cal-modal-close" onclick="closeEditModal()">✕</button>
    <h3 class="cal-modal-title">체험단 수정</h3>
    <div class="edit-form-grid">
      <div class="field" style="grid-area:name;">
        <label>체험단 이름</label>
        <input id="edit-name">
      </div>
      <div class="field" style="grid-area:provide;">
        <label>제공내역</label>
        <textarea id="edit-provide"></textarea>
      </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script src="./common.js"></script>
<script>
/* ===========================================================
   Supabase 연동 설정 (campaigns 테이블)
   =========================================================== */
const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY, {
  auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true }
});
window.sb = sb; // auth-gate.js가 같은 클라이언트를 재사용하도록 공유

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    sb.auth.startAutoRefresh();
  } else {
    sb.auth.stopAutoRefresh();
  }
});

let items = [];
let filter = "all";

const statusMeta = {
  wait:    { label:"예약대기",   cls:"status-wait" },
  confirm: { label:"예약완료",   cls:"status-confirm" },
  done:    { label:"체험완료",   cls:"status-done" },
  end:     { label:"종료",       cls:"status-end" }
};

const platformList = ["디너의여왕","리뷰노트","놀러와체험단","레뷰","데일리뷰","파블로체험단","서울오빠","강남맛집","리뷰플레이스","기타"];

// 실제 데이터에 쓰이고 있는 플랫폼만 홈페이지 주소를 등록해둠(URL 없는 플랫폼은 그냥 텍스트로 표시).
const PLATFORM_HOME_URLS = {
  "디너의여왕": "https://dinnerqueen.net/",
  "놀러와체험단": "https://www.cometoplay.kr/",
  "강남맛집": "https://xn--939au0g4vj8sq.net/",
  "리뷰노트": "https://www.reviewnote.co.kr/",
  "레뷰": "https://www.revu.net/",
  "리뷰플레이스": "https://www.reviewplace.co.kr/",
};

// 캠페인 상세 안내문에 적힌 "휴무일/체험 가능 요일" 문구를 보고 주말(토·일) 방문이
// 가능한지 표시. campaigns.html(자동 수집 페이지)의 classifyWeekend와 같은 기준—
// 토요일·일요일 중 하나라도 명시적으로 막혀 있으면 "불가"로 본다(둘 다 열려있어야 "가능").
const WEEKEND_LABEL = { possible: '🟢 주말가능', impossible: '🔴 주말불가', unknown: '⚪ 확인필요' };

/* 플랫폼명을 표시할 때 쓰는 공통 헬퍼. "체험완료" 상태일 때만(리뷰 URL을 다시 등록하러
   그 플랫폼에 들어가야 하는 시점) 홈페이지 링크로 활성화하고, 그 외 상태거나 등록된
   URL이 없는 플랫폼(기타 등)이면 그냥 텍스트로 보여준다. */
function platformValueHtml(it, extraAttrs){
  const url = it.status === 'done' ? PLATFORM_HOME_URLS[it.platform] : null;
  if(!url) return escapeHtml(it.platform);
  return `<a href="${url}" target="_blank" rel="noopener" class="platform-link"${extraAttrs ? ' ' + extraAttrs : ''}>${escapeHtml(it.platform)}</a>`;
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function normalizeDate(v){
  if(!v) return "";
  const d = new Date(v);
  if(isNaN(d.getTime())) return String(v);
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

async function addItem(){
  const name = document.getElementById('in-name').value.trim();
  const provide = document.getElementById('in-provide').value.trim();
  const address = document.getElementById('in-address').value.trim();
  const contact = document.getElementById('in-contact').value.trim();
  const parking = address;
  const deadline = document.getElementById('in-deadline').value || null;
  const keyword = document.getElementById('in-keyword').value.trim();
  const status = document.getElementById('in-status').value;
  const platform = document.getElementById('in-platform').value;
  const weekend_ok = document.getElementById('in-weekend').value;

  if(!name){ alert('체험단 이름을 입력해주세요.'); return; }

  const newItem = {
    id: uid(),
    name, provide, address, contact, parking, deadline, keyword, status, platform, weekend_ok,
    resvDate: "", resvTime: ""
  };

  const { error } = await sb.from('campaigns').insert(newItem);
  if (error) {
    alert("저장 실패: " + error.message);
    return;
  }
  await loadInitialData();

  document.getElementById('in-name').value = "";
  document.getElementById('in-provide').value = "";
  document.getElementById('in-address').value = "";
  document.getElementById('in-contact').value = "";
  document.getElementById('in-parking').value = "";
  document.getElementById('in-deadline').value = "";
  document.getElementById('in-keyword').value = "";
  document.getElementById('in-status').value = "wait";
  document.getElementById('in-platform').value = "디너의여왕";
  document.getElementById('in-weekend').value = "unknown";

  render();
}

/* ---- 수정 모달 ---- */
let editingId = null;
let detailModalId = null;

function openEditModal(id){
  const it = items.find(i => i.id === id);
  if(!it) return;
  editingId = id;

  document.getElementById('edit-name').value = it.name || '';
  document.getElementById('edit-provide').value = it.provide || '';
  document.getElementById('edit-status').value = it.status || 'wait';
  document.getElementById('edit-platform').value = it.platform || platformList[0];
  document.getElementById('edit-weekend').value = it.weekend_ok || 'unknown';
  document.getElementById('edit-address').value = it.address || '';
  document.getElementById('edit-contact').value = it.contact || '';
  document.getElementById('edit-parking').value = it.address || '';
  document.getElementById('edit-deadline').value = normalizeDate(it.deadline);
  document.getElementById('edit-keyword').value = it.keyword || '';
  document.getElementById('edit-resvDate').value = normalizeDate(it.resvDate);
  document.getElementById('edit-resvTime').innerHTML = '<option value="">시간</option>' + hourOptions(it.resvTime);

  onEditStatusChange();
  document.getElementById('editModalOverlay').classList.add('open');
}

function closeEditModal(){
  document.getElementById('editModalOverlay').classList.remove('open');
  editingId = null;
}

function onEditStatusChange(){
  const isConfirm = document.getElementById('edit-status').value === 'confirm';
  document.getElementById('edit-resv-wrap').style.display = isConfirm ? '' : 'none';
}

async function saveEditModal(){
  if(!editingId) return;

  const name = document.getElementById('edit-name').value.trim();
  if(!name){ alert('체험단 이름을 입력해주세요.'); return; }

  const status = document.getElementById('edit-status').value;
  const payload = {
    name,
    provide: document.getElementById('edit-provide').value.trim(),
    status,
    platform: document.getElementById('edit-platform').value,
    weekend_ok: document.getElementById('edit-weekend').value,
    address: document.getElementById('edit-address').value.trim(),
    contact: document.getElementById('edit-contact').value.trim(),
    parking: document.getElementById('edit-address').value.trim(),
    deadline: document.getElementById('edit-deadline').value || null,
    keyword: document.getElementById('edit-keyword').value.trim(),
  };
  if(status === 'confirm'){
    payload.resvDate = document.getElementById('edit-resvDate').value;
    payload.resvTime = document.getElementById('edit-resvTime').value;
  }

  const { error } = await sb.from('campaigns').update(payload).eq('id', editingId);
  if (error) {
    alert("저장 실패: " + error.message);
    return;
  }
  closeEditModal();
  await loadInitialData();
}

async function deleteItemFromModal(){
  if(!editingId) return;
  if(!confirm('이 체험단을 삭제할까요?')) return;
  const { error } = await sb.from('campaigns').delete().eq('id', editingId);
  if (error) {
    alert("삭제 실패: " + error.message);
    return;
  }
  closeEditModal();
  await loadInitialData();
}

/* ---- 요약 팝업 ---- */
function openDetailModal(id){
  const it = items.find(i => i.id === id);
  if(!it) return;

  const resvText = (it.status === "confirm" && normalizeDate(it.resvDate))
    ? `${normalizeDate(it.resvDate)}${it.resvTime ? ' ' + it.resvTime : ''}`
    : "";

  const rows = [
    ['제공내역', it.provide],
    ['주말', WEEKEND_LABEL[it.weekend_ok] || WEEKEND_LABEL.unknown],
    ['주소', it.address],
    ['예약문의', it.contact],
    ['주차장', it.parking],
    ['마감일자', normalizeDate(it.deadline)],
    ['키워드', it.keyword],
    ['플랫폼', it.platform],
  ].filter(([, v]) => v);

  document.getElementById('detailModalBody').innerHTML = `
    <div class="detail-title">${escapeHtml(it.name)}</div>
    <div class="detail-sub">
      <span class="status-badge ${statusMeta[it.status].cls}">${statusMeta[it.status].label}</span>
      ${resvText ? `<span class="resv-text">${resvText}</span>` : ''}
    </div>
    <div class="detail-rows">
      ${rows.map(([label, value]) => {
        let valueHtml = escapeHtml(value);
        if(label === '주소'){
          // 상호명만으로 검색하면(예: "루루"처럼 흔한 이름) 전혀 다른 지역의 동명
          // 업체가 잡힐 수 있어서 지역을 붙이되, 전체 주소까지 다 붙이면 네이버 지도가
          // 검색어를 못 알아들어 결과가 아예 안 나오는 문제가 있어 주소는 뺀다.
          // 표시 텍스트는 주소 그대로. 클릭 시 네이버지도 앱(nmap://)을 먼저 시도하고,
          // 앱이 없으면 자동으로 웹(map.naver.com)으로 대체된다.
          valueHtml = `<a href="#" onclick="event.preventDefault();openNaverMapApp();">${escapeHtml(value)}</a>`;
        } else if(label === '예약문의'){
          valueHtml = `<a href="tel:${value.replace(/[^0-9+]/g,'')}">${escapeHtml(value)}</a>`;
        } else if(label === '플랫폼'){
          valueHtml = platformValueHtml(it);
        } else if(label === '주차장' && it.address){
          // 모두의주차장은 공개 딥링크를 지원하지 않아(여러 형태로 실제 확인함 — keyword,
          // search 파라미터 모두 존재하지 않는 페이지로 연결됨) 자동 검색/앱 실행은 포기하고,
          // 주소를 확실하게 복사해서 앱 안에서 직접 붙여넣어 검색하도록 안내함.
          valueHtml = `${escapeHtml(value)} <button type="button" class="parking-copy-btn" onclick="copyAddressForParking(this)">주소 복사</button>`;
        }
        return `
        <div class="detail-row">
          <div class="detail-label">${label}</div>
          <div class="detail-value">${valueHtml}</div>
        </div>
      `;
      }).join('')}
    </div>
  `;
  detailModalId = id;
  document.getElementById('detailModalOverlay').classList.add('open');
}

function closeDetailModal(){
  document.getElementById('detailModalOverlay').classList.remove('open');
  detailModalId = null;
}

/* 주차장 링크는 앱 실행을 시도하고, 주소는 앱 안에서 직접 검색해야 하니
   이 버튼으로 클립보드에 복사해줌(붙여넣기 바로 가능하게). */
/* 네이버지도 앱(nmap://) 실행을 먼저 시도하고, 앱이 설치되어 있지 않아 화면 전환이
   일어나지 않으면 일정 시간 뒤 자동으로 웹(map.naver.com)으로 대체 이동한다. */
function openNaverMapApp(){
  if(!detailModalId) return;
  const it = items.find(i => i.id === detailModalId);
  if(!it) return;
  const mapQuery = [it.region, it.name].filter(Boolean).join(' ');
  const encoded = encodeURIComponent(mapQuery);
  const appUrl = `nmap://search?query=${encoded}&appname=com.borakwan.web`;
  const webUrl = `https://map.naver.com/p/search/${encoded}`;
  let appOpened = false;
  const onVisibilityChange = () => { if(document.hidden) appOpened = true; };
  document.addEventListener('visibilitychange', onVisibilityChange);
  window.location.href = appUrl;
  setTimeout(() => {
    document.removeEventListener('visibilitychange', onVisibilityChange);
    if(!appOpened) window.location.href = webUrl;
  }, 1000);
}

async function copyAddressForParking(el){
  if(!detailModalId) return;
  const it = items.find(i => i.id === detailModalId);
  if(!it || !it.address) return;
  try{
    await navigator.clipboard.writeText(it.address);
    const original = el.textContent;
    el.textContent = '복사됨 ✓';
    setTimeout(() => { el.textContent = original; }, 1500);
  }catch(err){
    alert('주소 복사에 실패했어요: ' + it.address);
  }
}

function editFromDetailModal(){
  if(!detailModalId) return;
  const id = detailModalId;
  closeDetailModal();
  openEditModal(id);
}

async function deleteFromDetailModal(){
  if(!detailModalId) return;
  if(!confirm('이 체험단을 삭제할까요?')) return;
  const { error } = await sb.from('campaigns').delete().eq('id', detailModalId);
  if (error) {
    alert("삭제 실패: " + error.message);
    return;
  }
  closeDetailModal();
  await loadInitialData();
}

function setFilter(f){
  filter = f;
  render();
}

function render(){
  const counts = { wait:0, confirm:0, done:0, end:0 };
  items.forEach(it => counts[it.status]++);
  document.getElementById('summary').innerHTML = `
    <div class="sum-card wait"><div class="num">${counts.wait}</div><div class="lbl">예약대기</div></div>
    <div class="sum-card conf"><div class="num">${counts.confirm}</div><div class="lbl">예약완료</div></div>
    <div class="sum-card done"><div class="num">${counts.done}</div><div class="lbl">체험완료</div></div>
    <div class="sum-card end"><div class="num">${counts.end}</div><div class="lbl">종료</div></div>
  `;

  const tabDefs = [
    {key:"all", label:`전체 (${items.length})`},
    {key:"wait", label:`예약대기 (${counts.wait})`},
    {key:"confirm", label:`예약완료 (${counts.confirm})`},
    {key:"done", label:`체험완료 (${counts.done})`},
    {key:"end", label:`종료 (${counts.end})`}
  ];
  document.getElementById('tabs').innerHTML = tabDefs.map(t =>
    `<button class="tab ${filter===t.key?'active':''}" onclick="setFilter('${t.key}')">${t.label}</button>`
  ).join('');

  let list = filter === "all" ? items.slice() : items.filter(it => it.status === filter);
  // 1차: 상태 순서(예약완료 → 예약대기 → 체험완료 → 종료)로 먼저 묶고,
  // 2차: 그 안에서 마감일자 오름차순으로 정렬한다. 화면에 보이는 "마감일자" 칼럼과
  // 정렬 기준이 일치해야 각 상태 구간 안에서 정렬이 맞아 보인다.
const statusOrder = { confirm: 0, wait: 1, done: 2, end: 3 };

  const getSortKey = (it) => {
    if (it.status === "confirm") {
      // 1) 예약완료: 예약날짜 + 예약시간 기준 정렬 (없을 경우 마감일자 대체)
      const d = normalizeDate(it.resvDate) || normalizeDate(it.deadline) || "9999-99-99";
      const t = it.resvTime || "00:00";
      return `${d} ${t}`;
    }
    // 2) 예약대기 / 체험완료 / 종료: 마감일자 기준 정렬
    return normalizeDate(it.deadline) || "9999-99-99";
  };

  list.sort((a, b) => {
    const orderDiff = (statusOrder[a.status] ?? 99) - (statusOrder[b.status] ?? 99);
    if (orderDiff !== 0) return orderDiff;
    return getSortKey(a).localeCompare(getSortKey(b));
  });

  const tbody = document.getElementById('tbody');
  const emptyMsg = document.getElementById('emptyMsg');

  if(list.length === 0){
    tbody.innerHTML = "";
    const cardListEl = document.getElementById('cardList');
    if(cardListEl) cardListEl.innerHTML = "";
    emptyMsg.style.display = "block";
    return;
  }
  emptyMsg.style.display = "none";

  tbody.innerHTML = list.map(it => {
    const resvText = (it.status === "confirm" && normalizeDate(it.resvDate))
      ? `${normalizeDate(it.resvDate).slice(5).replace('-', '/')}${it.resvTime ? ' ' + it.resvTime : ''}`
      : "";

    return `
      <tr>
        <td data-label="체험단 이름" class="name-cell" onclick="openDetailModal('${it.id}')" title="클릭하면 요약 보기">${escapeHtml(it.name)}</td>
        <td data-label="제공내역" class="ellipsis-cell" title="${escapeHtml(it.provide)}" onclick="openDetailModal('${it.id}')" style="cursor:pointer;">${escapeHtml(it.provide) || '-'}</td>
        <td data-label="상태/예약" onclick="openDetailModal('${it.id}')" title="클릭하면 요약 보기" style="cursor:pointer;">
          <span class="status-badge ${statusMeta[it.status].cls}">${statusMeta[it.status].label}</span>
          ${resvText ? `<div class="resv-text">${resvText}</div>` : ''}
        </td>
        <td data-label="주말" style="white-space:nowrap;font-size:12px;">${WEEKEND_LABEL[it.weekend_ok] || WEEKEND_LABEL.unknown}</td>
        <td data-label="플랫폼">${platformValueHtml(it)}</td>
        <td data-label="주소" class="ellipsis-cell" title="${escapeHtml(it.address)}">${escapeHtml(it.address) || '-'}</td>
        <td data-label="예약문의">${escapeHtml(it.contact) || '-'}</td>
        <td data-label="주차장">${escapeHtml(it.parking) || '-'}</td>
        <td data-label="마감일자">${escapeHtml(normalizeDate(it.deadline)) || '-'}</td>
        <td data-label="키워드" class="ellipsis-cell" title="${escapeHtml(it.keyword)}">${escapeHtml(it.keyword) || '-'}</td>
      </tr>
    `;
  }).join('');

  // 모바일/태블릿 전용 카드 목록: 한눈에 훑어보기 핵심 정보(이름/상태/플랫폼/날짜/제공내역)만
  // 2줄로 보여주고, 나머지 상세 항목은 카드를 눌러 요약 팝업(openDetailModal)에서 확인.
  const cardList = document.getElementById('cardList');
  if(cardList){
    cardList.innerHTML = list.map(it => {
      const resvText = (it.status === "confirm" && normalizeDate(it.resvDate))
        ? `${normalizeDate(it.resvDate).slice(5).replace('-', '/')}${it.resvTime ? ' ' + it.resvTime : ''}`
        : "";
      const deadlineStr = normalizeDate(it.deadline);
      const dateLabel = resvText ? `예약 ${resvText}` : (deadlineStr ? `마감 ${deadlineStr.slice(5)}` : '');

      return `
        <div class="rv-card" onclick="openDetailModal('${it.id}')">
          <div class="rv-row1">
            <span class="rv-name">${escapeHtml(it.name)}</span>
            <span class="status-badge ${statusMeta[it.status].cls}">${statusMeta[it.status].label}</span>
            <span style="font-size:11.5px;white-space:nowrap;flex-shrink:0;">${WEEKEND_LABEL[it.weekend_ok] || WEEKEND_LABEL.unknown}</span>
          </div>
          <div class="rv-row2">
            <span class="rv-platform">${platformValueHtml(it, 'onclick="event.stopPropagation()"')}</span>
            ${dateLabel ? `<span class="rv-dot">·</span><span class="rv-date">${dateLabel}</span>` : ''}
            ${it.provide ? `<span class="rv-dot">·</span><span class="rv-provide">${escapeHtml(it.provide)}</span>` : ''}
          </div>
        </div>
      `;
    }).join('');
  }
}

function hourOptions(selected){
  let opts = "";
  for(let h = 0; h < 24; h++){
    for(const m of [0, 30]){
      const value = String(h).padStart(2,'0') + ":" + String(m).padStart(2,'0');
      const period = h < 12 ? "오전" : "오후";
      const displayHour = h % 12 === 0 ? 12 : h % 12;
      const label = m===0 ? `${period} ${displayHour}시` : `${period} ${displayHour}시 30분`;
      opts += `<option value="${value}" ${value===selected?'selected':''}>${label}</option>`;
    }
  }
  return opts;
}

async function loadInitialData(){
  const { data, error } = await sb.from('campaigns').select('*').order('id');
  if (error) {
    console.error("데이터 로드 실패:", error);
  } else {
    items = data || [];
  }
  render();
}

// 주차장 필드는 주소와 항상 동일하게 자동 입력(모두의주차장 검색 링크용)
document.getElementById('in-address').addEventListener('input', function(){
  document.getElementById('in-parking').value = this.value;
});
document.getElementById('edit-address').addEventListener('input', function(){
  document.getElementById('edit-parking').value = this.value;
});

// 인증이 완료된 후에만 데이터를 로드하도록 이벤트 리스너 추가
window.addEventListener('authReady', function() {
  loadInitialData();

  // 다른 사람이 같은 테이블을 수정하면(다른 탭/기기 포함) 실시간으로 반영
  sb.channel('campaigns-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'campaigns' }, () => {
      loadInitialData();
    })
    .subscribe();

  // 실시간 이벤트를 놓치는 경우를 대비한 보조 폴링(30초)
  setInterval(loadInitialData, 30000);
});
</script>
<script src="./auth-gate.js?v=2"></script>
