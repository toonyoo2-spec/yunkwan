<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>스키마 업데이트</title>
</head>
<body>
<h1>데이터베이스 스키마 업데이트 중...</h1>
<div id="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script>
const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY, {
  auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true }
});

async function updateSchema(){
  const statusDiv = document.getElementById('status');

  try {
    statusDiv.innerHTML = '<p>⏳ 스키마 업데이트 중...</p>';

    // Note: Supabase JS client는 DDL(alter table) 명령을 직접 실행할 수 없습니다.
    // Supabase 대시보드 → SQL Editor에서 수동으로 실행해야 합니다.

    statusDiv.innerHTML = `
      <div style="padding:20px;background:#fef3c7;border:2px solid #f59e0b;border-radius:12px;margin:20px 0;">
        <h2 style="color:#f59e0b;">⚠️ 수동 작업 필요</h2>
        <p>다음 SQL을 Supabase 대시보드에서 실행해주세요:</p>
        <ol style="text-align:left;">
          <li><strong>Supabase 대시보드</strong> 열기: <a href="https://supabase.com/dashboard" target="_blank">https://supabase.com/dashboard</a></li>
          <li>프로젝트 선택: <strong>kblwddlquwlvumhwkirl</strong></li>
          <li><strong>SQL Editor</strong> 메뉴 클릭</li>
          <li>아래 SQL 복사 & 붙여넣기 후 <strong>Run</strong> 클릭</li>
        </ol>
        <textarea readonly style="width:100%;height:300px;font-family:monospace;font-size:12px;padding:10px;margin-top:10px;">
-- 곽현 프로젝트 누적 방식을 위한 컬럼 추가
alter table public.projects
  add column if not exists "workDates" jsonb default '[]'::jsonb,
  add column if not exists "currentAmount" numeric default 0,
  add column if not exists "settlementHistory" jsonb default '[]'::jsonb,
  add column if not exists "isAccumulative" boolean not null default false;

comment on column public.projects."workDates" is '현재 누적 중인 작업일 배열';
comment on column public.projects."currentAmount" is '현재 누적 금액';
comment on column public.projects."settlementHistory" is '정산 히스토리 (JSON 배열)';
comment on column public.projects."isAccumulative" is '누적 방식 프로젝트 여부';
        </textarea>
        <p style="margin-top:20px;"><strong>✅ SQL 실행 후 이 페이지를 닫고 work.html을 새로고침하세요!</strong></p>
      </div>
    `;

  } catch(err){
    statusDiv.innerHTML = '<p style="color:red;">오류: ' + err.message + '</p>';
  }
}

updateSchema();
</script>
</body>
</html>
