# ai-summary-worker 배포 설정
#
# 배포 순서 (처음 한 번만):
#   1) npx wrangler login                          # 브라우저에서 Cloudflare 로그인
#   2) npx wrangler secret put ANTHROPIC_API_KEY   # Claude API 키 입력 (직접 입력하세요)
#   3) npx wrangler deploy                         # 배포 → 출력되는 URL을 routine.html에 넣기
#
# 이후 코드만 고쳤을 때는 3)만 다시 실행하면 됩니다.
#
# ANTHROPIC_API_KEY는 secret이라 이 파일에 들어가지 않습니다.
# (Cloudflare에만 저장되고, 프론트엔드에는 절대 노출되지 않습니다)

name = "ai-summary-worker"
main = "ai-summary-worker.js"
compatibility_date = "2026-09-13"

[vars]
# routine.html이 올라가는 도메인. 여기에 적힌 출처에서만 요청을 허용합니다.
ALLOWED_ORIGIN = "https://yunkwan.cloud"
