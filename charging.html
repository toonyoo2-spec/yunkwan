<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전기차 충전 + 주차</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#3a5a52">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BORAKWAN">
<link rel="stylesheet" href="./common.css">
<link rel="stylesheet" href="./panel-common.css">
<style>
  header{margin-bottom:20px;}

  .notice{
    background:#fdf3d9;
    border:1px solid #eadfb0;
    color:#8a6d16;
    border-radius:10px;
    padding:12px 16px;
    font-size:12.5px;
    line-height:1.6;
    margin-bottom:22px;
  }

  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
  }

  .form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));
    gap:14px;
  }
  .field select, .field input{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:7px;
    font-size:13.5px;
    background:#fff;
    color:var(--ink);
    font-family:inherit;
    box-sizing:border-box;
  }
  .field select:focus, .field input:focus{
    outline:none;
    border-color:var(--accent);
  }
  .field .hint{
    font-size:11px;
    color:var(--sub);
    margin-top:4px;
  }

  .lot-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:14px;
  }
  .lot-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 18px;
  }
  .lot-card .name{font-size:14.5px;font-weight:700;margin-bottom:4px;}
  .lot-card .type-badge{
    display:inline-block;
    font-size:10.5px;
    font-weight:700;
    padding:2px 8px;
    border-radius:20px;
    margin-bottom:8px;
  }
  .lot-card .type-badge.public{background:#d4f4dd;color:#2d7a3e;}
  .lot-card .type-badge.private{background:#ede9fe;color:#7c3aed;}
  .lot-card .price{font-size:20px;font-weight:800;color:var(--accent);margin:6px 0 2px;}
  .lot-card .price.est::after{
    content:" (추정)";
    font-size:11px;
    font-weight:600;
    color:var(--sub);
  }
  .lot-card .breakdown{font-size:11.5px;color:var(--sub);margin-bottom:8px;}
  .lot-card .note{font-size:11.5px;color:var(--sub);margin-bottom:10px;line-height:1.5;}
  .lot-card .links{display:flex;gap:8px;flex-wrap:wrap;}
  .lot-card .links a{
    font-size:11.5px;
    font-weight:600;
    color:var(--accent);
    text-decoration:none;
    border:1px solid var(--line);
    border-radius:7px;
    padding:6px 10px;
  }
  .lot-card .links a:hover{border-color:var(--accent);}

  .section-title{
    font-size:13.5px;
    font-weight:700;
    color:var(--sub);
    margin:26px 0 12px;
  }

  .ticket-list{margin:10px 0;}
  .ticket-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:6px 0;
    border-bottom:1px solid var(--line);
    font-size:12.5px;
  }
  .ticket-row:last-child{border-bottom:none;}
  .ticket-name{flex:1;color:var(--ink);}
  .ticket-price{font-weight:700;color:var(--accent);}
  .ticket-status{
    font-size:10.5px;
    font-weight:700;
    padding:2px 7px;
    border-radius:20px;
    background:#eef0ec;
    color:var(--sub);
  }
  .ticket-status.available{background:#d4f4dd;color:#2d7a3e;}
  .ticket-status.sold_out{background:#f3e5e5;color:#a04545;}
  .ticket-status.not_yet_open{background:#fdf3d9;color:#8a6d16;}
</style>
</head>
<body>
<script src="./nav.js?v=6"></script>
<div class="wrap" id="appContent">
  <header>
    <h1>⚡ 전기차 충전 + 주차</h1>
    <p>판교역 / 화정역 주변 완속 충전 + 주차 요금 확인</p>
  </header>

  <div class="notice">
    ⚠️ 공영주차장 요금은 조례 기준 <b>계산식 추정치</b>입니다. 감면 정책은 지자체 사정에 따라 바뀔 수 있으니 큰 금액이 걸린 경우 현장/공식 안내로 한 번 더 확인하세요.
    민영·제휴 주차장은 가격이 수시로 바뀌어 이 페이지에 표시하지 않고, 실시간 확인 링크만 제공합니다.
  </div>

  <div class="panel">
    <div class="form-grid">
      <div class="field">
        <label>지하철역 / 주소 검색</label>
        <input type="text" id="fStation" list="fStationList" value="판교역" placeholder="역 이름을 입력하세요 (예: 판교역)" autocomplete="off">
        <datalist id="fStationList">
          <option value="판교역">
          <option value="화정역">
        </datalist>
        <div class="hint" id="fStationHint"></div>
      </div>
      <div class="field">
        <label>주차 시간</label>
        <select id="fDuration">
          <option value="1">1시간</option>
          <option value="2">2시간</option>
          <option value="3" selected>3시간</option>
          <option value="4">4시간</option>
          <option value="ALL_DAY">종일권 (8시간 충전 가정)</option>
        </select>
      </div>
      <div class="field">
        <label>요일</label>
        <select id="fWeekend">
          <option value="false">평일</option>
          <option value="true">주말/공휴일</option>
        </select>
      </div>
      <div class="field">
        <label>완속 충전 출력 (kW)</label>
        <input type="number" id="fKw" value="7" step="0.5" min="1">
      </div>
      <div class="field">
        <label>충전 단가 (원/kWh)</label>
        <input type="number" id="fRate" placeholder="현장/충전 앱에서 확인 후 입력">
        <div class="hint">단가는 운영사·시간대별로 계속 바뀝니다. 비워두면 충전비는 계산에서 제외됩니다.</div>
      </div>
    </div>
  </div>

  <div class="section-title">🅿️ 공영주차장 (조례 기준 추정)</div>
  <div class="lot-grid" id="publicLots"></div>

  <div class="section-title">🏢 민영 / 앱 제휴 주차장 (실시간 확인 필요)</div>
  <div class="lot-grid" id="privateLots"></div>
</div>
<script src="./common.js"></script>
<script>
(function(){
  const ALL_DAY = "ALL_DAY";

  // ===== 공영주차장 계산식 (조례 기준 추정 — 실제와 다를 수 있음) =====
  function fee30_10(base, unit, capMin, allDayFee, hours, freeHour){
    // base: 최초 30분 요금, unit: 이후 10분당 요금, capMin: 일 최대(분당 상한 아님, 원 단위)
    if(hours === ALL_DAY) return allDayFee;
    let h = parseFloat(hours);
    if(freeHour) h = Math.max(0, h - freeHour);
    if(h <= 0) return 0;
    const minutes = h * 60;
    let raw = minutes <= 30 ? base : base + Math.ceil((minutes - 30) / 10) * unit;
    return Math.min(raw, capMin);
  }

  const PUBLIC_LOTS = {
    "판교역": [
      {
        name: "판교공영주차장",
        note: "성남시 조례 추정: 1시간 무료 + 잔여시간 50% 감면, 일 최대 6,000원의 50%",
        calc: (hours, isWeekend) => {
          const raw = fee30_10(400, 200, 6000, 6000, hours, 1);
          return Math.round((hours === ALL_DAY ? 3000 : raw * 0.5));
        }
      },
      {
        name: "판교역환승주차장",
        note: "성남시 조례 추정: 전기차 50% 감면, 일 최대 9,900원의 50%",
        calc: (hours, isWeekend) => {
          const raw = fee30_10(1500, 500, 9900, 9900, hours, 0);
          return Math.round((hours === ALL_DAY ? 4950 : raw * 0.5));
        }
      }
    ],
    "화정역": [
      {
        name: "화정역 환승공영주차장",
        note: "고양시 조례 추정: 1시간 무료 + 잔여시간 50% 감면, 일 최대 8,000원의 50%",
        calc: (hours, isWeekend) => {
          const raw = fee30_10(600, 200, 8000, 8000, hours, 1);
          return Math.round((hours === ALL_DAY ? 4000 : raw * 0.5));
        }
      },
      {
        name: "덕양구청 부설주차장",
        note: "고양시 조례 추정: 주말 무료 개방 / 평일 1시간 무료 + 50% 감면",
        calc: (hours, isWeekend) => {
          if(isWeekend) return 0;
          const raw = fee30_10(600, 200, 8000, 8000, hours, 1);
          return Math.round((hours === ALL_DAY ? 4000 : raw * 0.5));
        }
      }
    ]
  };

  // ===== 민영/제휴 주차장 =====
  // moduId가 있으면 실시간 API(실제 판매중인 당일권 가격/재고)를 가져와 보여주고,
  // 없으면(정확한 상세페이지 ID를 못 찾은 곳) 기존처럼 딥링크만 제공합니다.
  const CHARGING_API = "https://ev-charging-parking-api.kwan-yun.workers.dev";

  const PRIVATE_LOTS = {
    "판교역": [
      { name: "그레이츠 판교 (투루파킹)", moduId: "232170" },
      { name: "힐스테이트 판교역", moduId: "263567" },
      { name: "판교푸르지오", moduId: "105210" },
      { name: "아브뉴프랑 판교", moduId: null },
      { name: "현대백화점 판교점", moduId: "110544" },
      { name: "카카오 판교아지트", moduId: null },
      { name: "판교테크원타워", moduId: null }
    ],
    "화정역": [
      { name: "이마트 화정점", moduId: null },
      { name: "롯데마트 화정점", moduId: null }
    ]
  };

  const TICKET_STATUS_LABEL = {
    AVAILABLE: "구매가능",
    SOLD_OUT: "품절",
    NOT_YET_OPEN: "오픈예정"
  };

  function naverMapLink(query){
    return `https://map.naver.com/p/search/${encodeURIComponent(query)}`;
  }

  async function fetchLiveModuData(ids){
    if(ids.length === 0) return {};
    try{
      const res = await fetch(`${CHARGING_API}/modu?ids=${ids.join(',')}`);
      if(!res.ok) return {};
      const data = await res.json();
      const map = {};
      (data.results || []).forEach(r => { map[r.id] = r; });
      return map;
    }catch(e){
      return {}; // 네트워크 오류 시 조용히 폴백 (딥링크만 표시)
    }
  }

  function renderTickets(tickets){
    if(!tickets || tickets.length === 0) return '';
    const available = tickets.filter(t => t.status === 'AVAILABLE').slice(0, 4);
    const shown = available.length > 0 ? available : tickets.slice(0, 3);
    return `<div class="ticket-list">` + shown.map(t => `
      <div class="ticket-row">
        <span class="ticket-name">${escapeHtml(t.name)}</span>
        <span class="ticket-price">${t.price.toLocaleString()}원</span>
        <span class="ticket-status ${t.status.toLowerCase()}">${TICKET_STATUS_LABEL[t.status] || t.status}</span>
      </div>
    `).join('') + `</div>`;
  }

  function escapeHtml(str){
    return (str||"").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  async function render(){
    const stationInput = document.getElementById('fStation').value.trim();
    const SUPPORTED_STATIONS = Object.keys(PUBLIC_LOTS);
    const station = SUPPORTED_STATIONS.find(s => s === stationInput) || null;
    const hintEl = document.getElementById('fStationHint');
    if(!station){
      hintEl.textContent = `아직 지원하지 않는 지역입니다. 현재 지원: ${SUPPORTED_STATIONS.join(', ')}`;
    } else {
      hintEl.textContent = '';
    }

    const duration = document.getElementById('fDuration').value;
    const isWeekend = document.getElementById('fWeekend').value === 'true';
    const kw = parseFloat(document.getElementById('fKw').value) || 0;
    const rateStr = document.getElementById('fRate').value;
    const rate = rateStr === '' ? null : parseFloat(rateStr);

    const chargeHours = duration === ALL_DAY ? 8 : parseFloat(duration);
    const chargedKwh = chargeHours * kw;
    const chargingCost = rate === null ? null : Math.round(chargedKwh * rate);

    // 공영주차장
    const publicEl = document.getElementById('publicLots');
    publicEl.innerHTML = (PUBLIC_LOTS[station] || []).map(lot => {
      const parkingFee = lot.calc(duration, isWeekend);
      const total = chargingCost === null ? parkingFee : parkingFee + chargingCost;
      const breakdown = chargingCost === null
        ? `주차비만 (충전단가 미입력)`
        : `충전비 ${chargingCost.toLocaleString()}원 + 주차비 ${parkingFee.toLocaleString()}원`;
      return `
        <div class="lot-card">
          <span class="type-badge public">공영</span>
          <div class="name">${lot.name}</div>
          <div class="price est">${total.toLocaleString()}원</div>
          <div class="breakdown">${breakdown}</div>
          <div class="note">${lot.note}</div>
        </div>
      `;
    }).join('') || '<div class="empty">해당 역의 공영주차장 데이터가 없습니다.</div>';

    // 민영/제휴 주차장 — 실시간 API 우선, 실패/미보유 시 딥링크 폴백
    const privateEl = document.getElementById('privateLots');
    const lots = PRIVATE_LOTS[station] || [];
    privateEl.innerHTML = lots.map(lot => `<div class="lot-card" id="lot-${lot.moduId || escapeHtml(lot.name).replace(/\s/g,'')}"><span class="type-badge private">민영/제휴</span><div class="name">${escapeHtml(lot.name)}</div><div class="note">불러오는 중...</div></div>`).join('')
      || '<div class="empty">해당 역의 제휴 주차장 데이터가 없습니다.</div>';

    const ids = lots.map(l => l.moduId).filter(Boolean);
    const liveMap = await fetchLiveModuData(ids);

    privateEl.innerHTML = lots.map(lot => {
      const live = lot.moduId ? liveMap[lot.moduId] : null;
      const cardId = `lot-${lot.moduId || escapeHtml(lot.name).replace(/\s/g,'')}`;

      if(live && !live.error){
        const tickets = renderTickets(live.tickets);
        const base = live.baseFee || {};
        return `
          <div class="lot-card" id="${cardId}">
            <span class="type-badge private">민영/제휴 · 실시간</span>
            <div class="name">${escapeHtml(live.name || lot.name)}</div>
            <div class="breakdown">현장요금 기준: 기본 ${escapeHtml(base.baseFee||'-')}, 추가 ${escapeHtml(base.extraFee||'-')}</div>
            ${tickets || '<div class="note">현재 판매중인 당일권이 없습니다.</div>'}
            <div class="note" style="margin-top:8px;">기준 시각: ${new Date(live.fetchedAt).toLocaleString('ko-KR')} · 출처: 모두의주차장</div>
            <div class="links">
              <a href="${live.sourceUrl}" target="_blank" rel="noopener">모두의주차장에서 결제</a>
              <a href="${naverMapLink(lot.name + ' 주차장')}" target="_blank" rel="noopener">네이버지도</a>
            </div>
          </div>
        `;
      }

      return `
        <div class="lot-card" id="${cardId}">
          <span class="type-badge private">민영/제휴</span>
          <div class="name">${escapeHtml(lot.name)}</div>
          <div class="note">실시간 가격을 자동으로 못 가져왔습니다. 아래 링크에서 직접 확인하세요.</div>
          <div class="links">
            <a href="https://app.modu.kr/" target="_blank" rel="noopener">모두의주차장에서 확인</a>
            <a href="${naverMapLink(lot.name + ' 주차장')}" target="_blank" rel="noopener">네이버지도로 보기</a>
          </div>
        </div>
      `;
    }).join('') || '<div class="empty">해당 역의 제휴 주차장 데이터가 없습니다.</div>';
  }

  ['fStation','fDuration','fWeekend','fKw','fRate'].forEach(id => {
    document.getElementById(id).addEventListener('input', render);
    document.getElementById(id).addEventListener('change', render);
  });

  window.addEventListener('authReady', render);
  render();
})();
</script>
<script src="./auth-gate.js?v=2"></script>
</body>
</html>
